[package]
name = "hol-guard-scanner-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "Bounded native and WebAssembly structural analysis for HOL Guard"
publish = false

[[bin]]
name = "hol-guard-scanner-engine"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
