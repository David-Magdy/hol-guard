name: Managed Controls typecheck repair

on:
  push:
    branches:
      - managed-controls/batch-13-local-parser-shared-posture

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
      - name: Skip after capture
        id: capture-state
        shell: bash
        run: |
          if test -f .typecheck-errors.txt; then
            echo "captured=true" >> "$GITHUB_OUTPUT"
          else
            echo "captured=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        if: steps.capture-state.outputs.captured != 'true'
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        if: steps.capture-state.outputs.captured != 'true'
        with:
          version: '0.9.26'
          enable-cache: false
      - run: uv sync --frozen --extra dev --python 3.12
        if: steps.capture-state.outputs.captured != 'true'
      - name: Capture type errors
        if: steps.capture-state.outputs.captured != 'true'
        shell: bash
        run: |
          uv run --no-sync basedpyright --level error > .typecheck-errors.txt 2>&1 || true
          cat .typecheck-errors.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .typecheck-errors.txt
          git commit -m "chore(ci): capture Managed Controls type errors"
          git push origin HEAD:managed-controls/batch-13-local-parser-shared-posture
