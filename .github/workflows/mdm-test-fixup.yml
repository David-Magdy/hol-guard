name: MDM test fixup

on:
  push:
    branches:
      - fix/mdm-r005-enterprise-networking

permissions:
  contents: write

jobs:
  fixup:
    if: github.repository == 'hashgraph-online/hol-guard' && github.ref == 'refs/heads/fix/mdm-r005-enterprise-networking'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/mdm-r005-enterprise-networking
          fetch-depth: 1
      - name: Update stale bridge test and remove fixup workflow
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_guard_approvals.py')
          text = path.read_text(encoding='utf-8')
          old = 'monkeypatch.setattr(guard_bridge_module.requests, "post", fake_post)'
          new = 'monkeypatch.setattr(guard_bridge_module._DAEMON_SESSION, "post", fake_post)'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale bridge monkeypatch, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git rm .github/workflows/mdm-test-fixup.yml
          mapfile -t changed < <(git status --short | sed -E 's/^...//' | sort)
          expected=(
            '.github/workflows/mdm-test-fixup.yml'
            'tests/test_guard_approvals.py'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${changed[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'unexpected changed paths:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_guard_approvals.py
          git commit -m 'test(bridge): use dedicated daemon session'
          git push origin HEAD:fix/mdm-r005-enterprise-networking
