name: Apply release 3.0 PyPI recovery patch

on:
  push:
    branches:
      - fix/release-3-0-pypi-direct

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.ref == 'refs/heads/fix/release-3-0-pypi-direct'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/release-3-0-pypi-direct
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
      - name: Apply patch
        run: python scripts/release/apply_release_3_0_pypi_fix.py
      - name: Sync test environment
        run: uv sync --frozen --extra dev --extra publish --extra cisco
      - name: Format patched contracts
        run: |
          uv run --no-sync ruff format tests/test_release_train_workflow.py scripts/release/apply_release_3_0_pypi_fix.py
      - name: Validate release contracts
        run: |
          uv run --no-sync python -m pytest -q tests/test_release_train_workflow.py --tb=short
          uv run --no-sync ruff check tests/test_release_train_workflow.py scripts/release/apply_release_3_0_pypi_fix.py
          uv run --no-sync ruff format --check tests/test_release_train_workflow.py scripts/release/apply_release_3_0_pypi_fix.py
          git diff --check
      - name: Commit validated patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/publish.yml tests/test_release_train_workflow.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(release): bypass exhausted alpha TestPyPI gate'
          git push origin HEAD:fix/release-3-0-pypi-direct
