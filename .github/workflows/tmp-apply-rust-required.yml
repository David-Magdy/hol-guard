name: Apply and validate Rust-required migration

on:
  push:
    branches:
      - fix/rust-required-no-python-runtime-fallback
    paths:
      - .github/workflows/tmp-apply-rust-required.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/rust-required-no-python-runtime-fallback
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Download and verify the prepared migration patch
        shell: bash
        env:
          PATCH_FILE_ID: 1UMt1wyRiPBiWHYipYXRo9-OM8BlmVMt2
          EXPECTED_PATCH_SHA256: a8de82456a4f445ae2ab3ffb1cf0d572d2703478eb0d99bb0158057a911c2c51
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/rust-required.patch"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://drive.usercontent.google.com/download?id=${PATCH_FILE_ID}&export=download&confirm=t" \
            --output "$patch"
          test "$(sha256sum "$patch" | awk '{print $1}')" = "$EXPECTED_PATCH_SHA256"
          test "$(wc -c < "$patch")" -gt 500000
          printf '%s\n' "$patch" > "$RUNNER_TEMP/patch-path"

      - name: Reset to current release and apply migration
        shell: bash
        run: |
          set -euo pipefail
          patch=$(cat "$RUNNER_TEMP/patch-path")
          git fetch origin release/3.0
          release_sha=$(git rev-parse origin/release/3.0)
          printf '%s\n' "$release_sha" > "$RUNNER_TEMP/release-sha"
          git reset --hard "$release_sha"

          set +e
          git apply --reject --whitespace=nowarn "$patch"
          apply_status=$?
          set -e

          mapfile -t rejects < <(find . -name '*.rej' -print | sort)
          if (( apply_status != 0 )); then
            if (( ${#rejects[@]} != 1 )) || [[ "${rejects[0]}" != "./.github/workflows/publish.yml.rej" ]]; then
              printf 'Unexpected patch rejects:\n' >&2
              printf '%s\n' "${rejects[@]}" >&2
              exit 1
            fi
            grep -Fq 'hol-guard-publish-${{ github.event.pull_request.merged' "${rejects[0]}"
            grep -Fq 'hol-guard-publish-${{ github.event_name }}-${{ github.sha }}' .github/workflows/publish.yml
            rm "${rejects[0]}"
          elif (( ${#rejects[@]} != 0 )); then
            printf 'Patch reported success but left rejects\n' >&2
            exit 1
          fi

      - name: Apply final review corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          command_tests = Path("ci/native_runtime/test_command_model_resident.py")
          text = command_tests.read_text(encoding="utf-8")
          for name in (
              "test_command_model_reuses_version_matched_resident_runtime",
              "test_complex_command_remains_non_authoritative",
              "test_legacy_native_disable_does_not_turn_off_command_model",
          ):
              anchor = f"def {name}("
              if text.count(anchor) != 1:
                  raise RuntimeError(f"unexpected test anchor count for {name}")
              marker = f'@pytest.mark.skipif(not _NATIVE_BINARY, reason="compiled native runtime is required")\n{anchor}'
              if marker not in text:
                  text = text.replace(anchor, marker, 1)
          command_tests.write_text(text, encoding="utf-8")

          command_model = Path("src/codex_plugin_scanner/guard/native_command_model.py")
          text = command_model.read_text(encoding="utf-8")
          duplicate = "            executable_index += 1\n            executable_index += 1\n"
          if text.count(duplicate) != 1:
              raise RuntimeError("native command-model duplicate increment anchor changed")
          command_model.write_text(text.replace(duplicate, "            executable_index += 1\n", 1), encoding="utf-8")

          for path in (
              Path("src/codex_plugin_scanner/guard/native_runtime_resilience.py"),
              Path("tests/test_native_runtime_resilience.py"),
          ):
              text = path.read_text(encoding="utf-8")
              if "native_oneshot_fallback" not in text:
                  raise RuntimeError(f"recovery reason anchor missing from {path}")
              path.write_text(text.replace("native_oneshot_fallback", "native_oneshot_recovery"), encoding="utf-8")
          PY

          rm -f .github/workflows/tmp-rust-required-latest-source.yml
          rm -rf .github/rust-required-patch .github/rust-required-gzip-b64
          find . -name '*.rej' -delete

      - name: Prepare locked toolchains
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --extra publish --python 3.12
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0

      - name: Format changed implementation files
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all
          mapfile -t python_files < <(git diff --name-only --diff-filter=AM -- '*.py' | sort)
          if (( ${#python_files[@]} )); then
            uv run --no-sync ruff format "${python_files[@]}"
          fi

      - name: Build exact native runtime
        shell: bash
        run: |
          set -euo pipefail
          version=$(uv run --no-sync python - <<'PY'
          from importlib.metadata import version
          print(version("hol-guard"))
          PY
          )
          export HOL_GUARD_PACKAGE_VERSION="$version"
          export HOL_GUARD_BUILD_SHA="$(cat "$RUNNER_TEMP/release-sha")"
          cargo build --manifest-path rust/Cargo.toml --locked --release -p hol-guard-runtime
          rust/target/release/hol-guard-runtime self-test --json
          printf '%s\n' "$version" > "$RUNNER_TEMP/package-version"

      - name: Validate Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all --check
          cargo clippy --manifest-path rust/Cargo.toml --locked --workspace --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --locked --workspace --all-targets

      - name: Validate changed Python and contracts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t python_files < <(git diff --name-only --diff-filter=AM -- '*.py' | sort)
          if (( ${#python_files[@]} )); then
            uv run --no-sync ruff check "${python_files[@]}"
            uv run --no-sync ruff format --check "${python_files[@]}"
          fi
          mapfile -t typed_files < <(git diff --name-only --diff-filter=AM -- 'src/**/*.py' 'ci/**/*.py' 'scripts/**/*.py' | sort)
          if (( ${#typed_files[@]} )); then
            uv run --no-sync basedpyright "${typed_files[@]}"
          fi
          uv run --no-sync python -m json.tool tests/fixtures/hook_payloads/native-post-tool-corpus.v1.json >/dev/null
          git diff --check

      - name: Run Rust-required focused suites
        shell: bash
        env:
          HOL_GUARD_NATIVE_DEVELOPMENT: "1"
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
        run: |
          set -euo pipefail
          uv run --no-sync pytest -q \
            tests/test_guard_native_runtime.py \
            tests/test_native_runtime_resilience.py \
            tests/test_rust_hardening_contracts.py \
            ci/native_runtime/test_guard_native_runtime_binary.py \
            ci/native_runtime/test_guard_native_runtime_resident.py \
            ci/native_runtime/test_guard_native_runtime_corpus.py \
            ci/native_runtime/test_guard_native_runtime_differential.py \
            ci/native_runtime/test_guard_native_runtime_mutation_differential.py \
            ci/native_runtime/test_command_model_resident.py \
            ci/native_runtime/test_native_runtime_recovery.py \
            --tb=short

      - name: Run hook, package, release, and registry regression suites
        shell: bash
        env:
          HOL_GUARD_NATIVE_DEVELOPMENT: "1"
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
        run: |
          set -euo pipefail
          uv run --no-sync pytest -q \
            tests/test_guard_hook_worker.py \
            tests/test_guard_hook_process_deadline_contract.py \
            tests/test_guard_daemon_hook_review.py \
            tests/test_native_wheel_ci_workflow.py \
            tests/test_native_runtime_release.py \
            tests/test_publish_workflow.py \
            tests/test_package_split.py \
            tests/test_installed_canary_proof.py \
            tests/test_release_distribution_contract.py \
            --tb=short

      - name: Run full repository Python test suite
        shell: bash
        env:
          HOL_GUARD_NATIVE_DEVELOPMENT: "1"
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
        run: |
          set -euo pipefail
          uv run --no-sync pytest -q --tb=short

      - name: Prove duplicate Python evaluator is gone
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            src/codex_plugin_scanner/guard/runtime/hook_review_engine.py \
            src/codex_plugin_scanner/guard/runtime/hook_content_scanner.py \
            src/codex_plugin_scanner/guard/runtime/hook_decision_cache.py \
            src/codex_plugin_scanner/guard/runtime/hook_output_text.py \
            src/codex_plugin_scanner/guard/runtime/hook_source_read.py
          do
            test ! -e "$path"
          done
          test -e ci/native_runtime/probe_native_required.py
          test ! -e ci/native_runtime/probe_native_default_auto.py
          ! git grep -n 'hook_review_engine\|HookReviewEngine\|ContentScanner\|HookDecisionCache' -- src tests ci scripts
          ! git grep -n 'python fallback\|pure-Python fallback' -- README.md CHANGELOG.md docs/guard src/codex_plugin_scanner/guard
          ! git grep -n 'HOL_GUARD_NATIVE=off' -- README.md CHANGELOG.md docs/guard src/codex_plugin_scanner/guard

      - name: Commit exact validated implementation and replace staging history
        shell: bash
        run: |
          set -euo pipefail
          remote_sha=$(git ls-remote --exit-code origin refs/heads/fix/rust-required-no-python-runtime-fallback | awk '{print $1}')
          test "$remote_sha" = "$GITHUB_SHA"
          rm -f .github/workflows/tmp-apply-rust-required.yml
          rm -rf .github/rust-required-patch .github/rust-required-gzip-b64
          git add -A
          git diff --cached --check
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git commit --signoff -m "feat(guard): require Rust runtime without Python fallback"
          git push --force-with-lease=refs/heads/fix/rust-required-no-python-runtime-fallback:"$GITHUB_SHA" \
            origin HEAD:refs/heads/fix/rust-required-no-python-runtime-fallback
