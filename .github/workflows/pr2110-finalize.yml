name: Finalize PR 2110

on:
  push:
    branches:
      - tmp/pr2110-finalize-20260807

permissions:
  contents: write

jobs:
  validate-and-update-pr:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Merge exact latest main and reject unexpected conflicts
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PR=9e45a12c5dddd9b6ac0efd117ececa1a6ce4b823
          EXPECTED_MAIN=ef62e2ad56ccd6c62ab45eed0d6fa7e46707d4f0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main fix/protection-repair-dashboard-regressions
          test "$(git rev-parse origin/fix/protection-repair-dashboard-regressions)" = "$EXPECTED_PR"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          if ! git merge --no-ff --no-commit origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = "ci/test-suite-ratchet-baseline.json" || {
              echo "Unexpected merge conflicts:" >&2
              printf '%s\n' "$conflicts" >&2
              exit 1
            }
            git checkout --theirs ci/test-suite-ratchet-baseline.json
            git add ci/test-suite-ratchet-baseline.json
          fi
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet uv
          uv sync --frozen --extra dev --python 3.12

      - name: Run policy-integrity and downstream regression wall
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync pytest -q \
            tests/test_guard_policy_integrity.py \
            tests/test_guard_policy_integrity_local_vault.py \
            tests/test_guard_approval_reuse.py \
            tests/test_guard_github_workflow_authorization.py \
            tests/test_guard_manifest_install_firewall.py \
            tests/test_guard_mcp_package_proxy_phase14.py \
            tests/test_guard_workflow_capabilities.py \
            tests/test_guard_workflow_capability_authority_tamper.py \
            tests/test_guard_workflow_capability_hardening.py \
            --tb=short

      - name: Validate changed Python
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync ruff check \
            src/codex_plugin_scanner/guard/store.py \
            src/codex_plugin_scanner/guard/store_policy_integrity_backend.py \
            src/codex_plugin_scanner/guard/local_trust_contract.py \
            tests/test_guard_policy_integrity_local_vault.py
          uv run --no-sync ruff format --check \
            src/codex_plugin_scanner/guard/store.py \
            src/codex_plugin_scanner/guard/store_policy_integrity_backend.py \
            src/codex_plugin_scanner/guard/local_trust_contract.py \
            tests/test_guard_policy_integrity_local_vault.py
          uv run --no-sync basedpyright --level error

      - name: Validate dashboard source and generated bundles
        shell: bash
        run: |
          set -euo pipefail
          cd dashboard
          bun install --frozen-lockfile
          bun run test
          bun run build
          cd ..
          git diff --check

      - name: Reconcile test-suite ratchet with merged tree
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/ci/test_inventory.py --output /tmp/test-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path('/tmp/test-inventory.json').read_text(encoding='utf-8'))
          path = Path('ci/test-suite-ratchet-baseline.json')
          baseline = json.loads(path.read_text(encoding='utf-8'))
          baseline['maximum_collected_cases'] = max(
              int(baseline['maximum_collected_cases']),
              int(inventory['inventory']['collected_cases']),
          )
          baseline['maximum_test_source_lines'] = max(
              int(baseline['maximum_test_source_lines']),
              int(inventory['test_source_lines']),
          )
          path.write_text(json.dumps(baseline, indent=2) + '\n', encoding='utf-8')
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory /tmp/test-inventory.json
          git add ci/test-suite-ratchet-baseline.json
          git diff --check

      - name: Commit merge and validated fixes to PR branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git status --short
          git add -A
          git diff --cached --check
          git commit -m "merge: refresh PR 2110 against main"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            push origin HEAD:fix/protection-repair-dashboard-regressions
          echo "Validated PR head: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
