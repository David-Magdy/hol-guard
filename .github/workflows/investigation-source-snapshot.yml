name: Investigation source snapshot

on:
  push:
    branches:
      - fix/extension-control-authority-stability
  pull_request:
    branches:
      - release/3.0

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Create source archive
        run: tar --exclude=.git -czf /tmp/hol-guard-source.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: hol-guard-source
          path: /tmp/hol-guard-source.tar.gz
          if-no-files-found: error
          retention-days: 1
