name: Apply verified authority stability fix

on:
  push:
    branches:
      - fix/extension-control-authority-stability

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: fix/extension-control-authority-stability
      - name: Apply locally verified patch
        run: |
          set -euo pipefail
          git apply --check .github/authority-fix.patch
          git apply .github/authority-fix.patch
          rm .github/authority-fix.patch
          rm .github/workflows/investigation-source-snapshot.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(guard): stabilize extension authority secret storage"
          git push origin HEAD:fix/extension-control-authority-stability
