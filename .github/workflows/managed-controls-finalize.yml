name: Bootstrap managed controls remediation

on:
  pull_request:
    branches:
      - release/3.0
    paths:
      - '.github/workflows/managed-controls-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.head_ref == 'managed-controls/batch-02-actions-limits-clean'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: managed-controls/batch-02-actions-limits-clean
          fetch-depth: 0

      - name: Restore and repair final remediation workflow
        run: |
          git show 966e076e4cb38ae873c6d47d31d60351dc0be87b:.github/workflows/managed-controls-finalize.yml > /tmp/managed-controls-finalize.yml
          python - <<'PY'
          from pathlib import Path

          source = Path('/tmp/managed-controls-finalize.yml').read_text(encoding='utf-8')
          old = "              ''''Wire-compatible, bounded extension-control catalog projection.'\n"
          new = "              '''# Wire-compatible, bounded extension-control catalog projection.\n"
          if old not in source:
              raise SystemExit('expected malformed catalog marker was not found')
          Path('.github/workflows/managed-controls-finalize.yml').write_text(
              source.replace(old, new, 1),
              encoding='utf-8',
          )
          PY

      - name: Commit repaired workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/managed-controls-workflow-hotfix.yml
          git add .github/workflows/managed-controls-finalize.yml
          git diff --cached --check
          git commit -m "ci: repair Managed Controls remediation workflow"
          git push origin HEAD:managed-controls/batch-02-actions-limits-clean
