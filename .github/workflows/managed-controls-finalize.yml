name: Finalize managed controls batch 02

on:
  pull_request:
    branches:
      - release/3.0
    paths:
      - '.github/workflows/managed-controls-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'managed-controls/batch-02-actions-limits-clean'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: managed-controls/batch-02-actions-limits-clean
          fetch-depth: 0

      - name: Apply final review remediation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text(encoding="utf-8")
              if new in source:
                  return
              if old not in source:
                  raise SystemExit(f"expected source block not found in {path}")
              target.write_text(source.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/codex_plugin_scanner/guard/daemon/extension_control_api.py",
              '''        serialized = json.dumps(
              payload,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=True,
          ).encode()
          if len(serialized) > MAX_CATALOG_PAYLOAD_BYTES:
          '''.replace("\n          ", "\n"),
              '''        wire_body = json.dumps(payload).encode("utf-8")
          if len(wire_body) > MAX_CATALOG_PAYLOAD_BYTES:
          '''.replace("\n          ", "\n"),
          )

          replace_once(
              "src/codex_plugin_scanner/guard/daemon/server.py",
              '''        if parsed.path == "/v1/extension-controls/catalog":
              self._write_json(
                  self._daemon_server().extension_control_api.catalog(),
                  extra_headers={"Cache-Control": "no-store"},
              )
              return
          '''.replace("\n          ", "\n"),
              '''        if parsed.path == "/v1/extension-controls/catalog":
              try:
                  catalog = self._daemon_server().extension_control_api.catalog()
              except ExtensionControlApiError as error:
                  self._write_json(error.to_payload(), status=error.status)
                  return
              self._write_json(catalog, extra_headers={"Cache-Control": "no-store"})
              return
          '''.replace("\n          ", "\n"),
          )

          limits_test = Path("tests/test_managed_controls_limits.py")
          source = limits_test.read_text(encoding="utf-8")
          old = '''def _catalog_extension(index: int) -> CommandSafetyExtension:
              return CommandSafetyExtension(
                  extension_id=f"command.limit{index}",
                  version="1.0.0",
                  name=f"Limit {index}",
                  description="Bounded catalog fixture.",
                  action_classes=(),
                  risk_classes=("supply_chain",),
                  safer_alternatives=("Review the requested capability.",),
                  delegated_protection="package-firewall",
                  ecosystem_ids=(f"limit{index}",),
                  executables=(f"limit{index}",),
                  reference_urls=("https://example.com/managed-controls-limit-fixture",),
              )
          '''.replace("\n              ", "\n")
          new = '''def _catalog_extension(index: int) -> CommandSafetyExtension:
              extension = CommandSafetyExtension(
                  extension_id=f"command.limit{index}",
                  version="1.0.0",
                  name=f"Limit {index}",
                  description="Bounded catalog fixture.",
                  action_classes=(),
                  risk_classes=("supply_chain",),
                  safer_alternatives=("Review the requested capability.",),
                  delegated_protection="package-firewall",
                  ecosystem_ids=(f"limit{index}",),
                  executables=(f"limit{index}",),
                  reference_urls=("https://example.com/managed-controls-limit-fixture",),
              )
              return replace(
                  extension,
                  permissions=(
                      replace(
                          extension.permissions[0],
                          example_command=f"limit{index} scan",
                      ),
                  ),
              )
          '''.replace("\n              ", "\n")
          if new not in source:
              if old not in source:
                  raise SystemExit("expected catalog fixture block not found")
              limits_test.write_text(source.replace(old, new, 1), encoding="utf-8")

          Path("tests/test_guard_extension_control_catalog_wire.py").write_text(
              '''from __future__ import annotations

          import json
          import urllib.error
          import urllib.request
          from pathlib import Path

          import pytest

          from codex_plugin_scanner.guard.daemon import GuardDaemonServer
          from codex_plugin_scanner.guard.daemon import extension_control_api as api_module
          from codex_plugin_scanner.guard.daemon.extension_control_api import (
              ExtensionControlApiError,
              ExtensionControlApiService,
          )
          from codex_plugin_scanner.guard.daemon.manager import load_guard_daemon_auth_token
          from codex_plugin_scanner.guard.runtime.command_extensions import (
              BUILT_IN_COMMAND_EXTENSION_REGISTRY,
          )
          from codex_plugin_scanner.guard.runtime.extension_control_authority import (
              AuthorityHealth,
              ExtensionControlAuthorityView,
          )
          from codex_plugin_scanner.guard.runtime.extension_control_runtime import (
              ExtensionControlRuntime,
          )
          from codex_plugin_scanner.guard.store import GuardStore


          def _service(tmp_path: Path) -> ExtensionControlApiService:
              view = ExtensionControlAuthorityView(
                  AuthorityHealth.PROTECTED,
                  1,
                  BUILT_IN_COMMAND_EXTENSION_REGISTRY.catalog_digest,
                  (),
              )
              return ExtensionControlApiService(
                  store=GuardStore(tmp_path / "guard-home"),
                  registry=BUILT_IN_COMMAND_EXTENSION_REGISTRY,
                  runtime=ExtensionControlRuntime(view),
              )


          def test_catalog_payload_limit_uses_exact_daemon_wire_encoding(
              tmp_path: Path,
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              service = _service(tmp_path)
              payload = service.catalog()
              compact_size = len(
                  json.dumps(
                      payload,
                      sort_keys=True,
                      separators=(",", ":"),
                      ensure_ascii=True,
                  ).encode("utf-8")
              )
              wire_size = len(json.dumps(payload).encode("utf-8"))
              assert wire_size > compact_size
              monkeypatch.setattr(api_module, "MAX_CATALOG_PAYLOAD_BYTES", compact_size)
              with pytest.raises(ExtensionControlApiError) as raised:
                  service.catalog()
              assert raised.value.status == 413
              assert raised.value.code == "catalog_payload_limit_exceeded"


          def test_catalog_http_route_maps_bounded_service_error_to_413(
              tmp_path: Path,
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              store = GuardStore(tmp_path / "guard-home")
              daemon = GuardDaemonServer(store, host="127.0.0.1", port=0)
              daemon.start()
              try:
                  auth_token = load_guard_daemon_auth_token(store.guard_home)
                  assert auth_token is not None

                  def reject_catalog() -> dict[str, object]:
                      raise ExtensionControlApiError(
                          413,
                          "catalog_payload_limit_exceeded",
                      )

                  monkeypatch.setattr(
                      daemon._server.extension_control_api,
                      "catalog",
                      reject_catalog,
                  )
                  request = urllib.request.Request(
                      f"http://127.0.0.1:{daemon.port}/v1/extension-controls/catalog",
                      method="GET",
                      headers={"X-Guard-Token": auth_token},
                  )
                  with pytest.raises(urllib.error.HTTPError) as raised:
                      urllib.request.urlopen(request, timeout=2)
                  assert raised.value.code == 413
                  assert json.loads(raised.value.read()) == {
                      "error": "catalog_payload_limit_exceeded",
                  }
              finally:
                  daemon.stop()
          '''.replace("\n          ", "\n").lstrip(),
              encoding="utf-8",
          )

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev --python 3.12
          cd dashboard
          bun install --frozen-lockfile

      - name: Format and lint changed sources
        run: |
          uv run --no-sync ruff format \
            src/codex_plugin_scanner/guard/daemon/extension_control_api.py \
            src/codex_plugin_scanner/guard/daemon/server.py \
            tests/test_managed_controls_limits.py \
            tests/test_guard_extension_control_catalog_wire.py
          uv run --no-sync ruff check --fix \
            src/codex_plugin_scanner/guard/daemon/extension_control_api.py \
            src/codex_plugin_scanner/guard/daemon/server.py \
            tests/test_managed_controls_limits.py \
            tests/test_guard_extension_control_catalog_wire.py
          uv run --no-sync ruff format \
            src/codex_plugin_scanner/guard/daemon/extension_control_api.py \
            src/codex_plugin_scanner/guard/daemon/server.py \
            tests/test_managed_controls_limits.py \
            tests/test_guard_extension_control_catalog_wire.py

      - name: Run focused Python verification
        run: |
          uv run --no-sync pytest \
            tests/test_managed_controls_limits.py \
            tests/test_guard_extension_control_api.py \
            tests/test_guard_extension_control_catalog_detail.py \
            tests/test_guard_extension_control_catalog_wire.py \
            --tb=short
          uv run --no-sync python tests/guard_command_decision_diff.py --check

      - name: Run dashboard verification
        run: |
          cd dashboard
          bun run test
          bun run build

      - name: Refresh reviewed test-suite ratchet
        run: |
          uv run --no-sync python scripts/ci/test_inventory.py --output test-inventory.json
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path("test-inventory.json").read_text(encoding="utf-8"))
          baseline_path = Path("ci/test-suite-ratchet-baseline.json")
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          baseline["maximum_collected_cases"] = max(
              baseline["maximum_collected_cases"],
              inventory["inventory"]["collected_cases"],
          )
          baseline["maximum_test_source_lines"] = max(
              baseline["maximum_test_source_lines"],
              inventory["test_source_lines"],
          )
          baseline_path.write_text(
              json.dumps(baseline, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory test-inventory.json

      - name: Run structural quality audit
        run: |
          uv run --no-sync python scripts/ci/code_quality_audit.py \
            --root . \
            --baseline ci/code-quality-baseline.json \
            --json-output code-quality-audit.json
          git diff --check

      - name: Commit code remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/codex_plugin_scanner/guard/daemon/extension_control_api.py \
            src/codex_plugin_scanner/guard/daemon/server.py \
            tests/test_managed_controls_limits.py \
            tests/test_guard_extension_control_catalog_wire.py \
            ci/test-suite-ratchet-baseline.json \
            src/codex_plugin_scanner/guard/daemon/static
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No code changes remain"
            exit 0
          fi
          git commit -m "fix: finish Managed Controls limits remediation"
          git push origin HEAD:managed-controls/batch-02-actions-limits-clean
