name: Dispatch final Managed Controls batch 02 remediation

on:
  pull_request:
    branches:
      - release/3.0
    paths:
      - .github/workflows/managed-controls-finalize.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'managed-controls/batch-02-actions-limits-clean'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch the guarded remediation workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --location --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hashgraph-online/hol-guard/actions/workflows/managed-controls-batch02-final-fix.yml/dispatches \
            --data '{"ref":"managed-controls/batch-02-actions-limits-clean"}'
