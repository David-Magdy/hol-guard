name: Protection Center Batch 3 release sync
on:
  push:
    branches: [feat/protection-center-03-module-detail]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with: {persist-credentials: true, fetch-depth: 0}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: {bun-version: "1.3.14"}
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin release/3.0
          set +e; git merge --no-ff --no-commit origin/release/3.0; status=$?; set -e
          if [[ $status -ne 0 ]]; then
            for path in $(git diff --name-only --diff-filter=U); do
              case "$path" in
                dashboard/package.json|dashboard/src/protection-center/protection-center-workspace.tsx|dashboard/e2e/installed-extension-control-center.spec.ts|src/codex_plugin_scanner/guard/daemon/static/*) git checkout --theirs -- "$path"; git add "$path" ;;
                *) echo "Unexpected conflict: $path" >&2; exit 1 ;;
              esac
            done
          fi
          git add .; git commit -m "chore(protection-center): sync module detail with landing" || true
          python <<'PY'
          from pathlib import Path
          import json
          p=Path('dashboard/src/protection-center/protection-center-workspace.tsx'); t=p.read_text()
          t=t.replace('import { ExtensionControlCenterDetail } from "../extension-control-center-detail";\n','')
          m='import { ProtectionLandingExperience } from "./protection-landing-experience";\n'
          if 'import { ProtectionModuleDetail }' not in t: t=t.replace(m,m+'import { ProtectionModuleDetail } from "./protection-module-detail";\n',1)
          start='  if (routeState.route.kind === "detail" && selectedExtension) {'
          i=t.find(start); j=t.find('\n  }\n\n  return',i)
          if i<0 or j<0: raise SystemExit('detail route marker changed')
          block='''  if (routeState.route.kind === "detail" && selectedExtension) {\n    return <><ProtectionModuleDetail extension={selectedExtension} effective={state.effective} catalogDigest={state.catalog.catalog_digest} onBack={closeExtension} onChange={() => requestChange({ extension: selectedExtension, enabled: !isExtensionEnabled(state.effective, selectedExtension) })} />{pending ? <ReviewModal change={pending} busy={busy} error={mutationError} approvalGate={resolvedApprovalGate} onCancel={() => { if (!busy) setPending(null); }} onConfirm={confirm} /> : null}{recoveryModal}</>;\n  }'''
          t=t[:i]+block+t[j+4:]; p.write_text('\n'.join(x.rstrip() for x in t.splitlines())+'\n')
          q=Path('dashboard/package.json'); d=json.loads(q.read_text()); cmd='tsx src/protection-center/protection-module-detail.test.tsx'; parts=[x.strip() for x in d['scripts']['test'].split('&&')];
          if cmd not in parts: parts.insert(2,cmd)
          d['scripts']['test']=' && '.join(parts); q.write_text(json.dumps(d,indent=2)+'\n')
          PY
          cd dashboard; bun install --frozen-lockfile --ignore-scripts; bun run test; bun run build; cd ..
          rm .github/workflows/protection-center-batch3-release-sync.yml
          git add dashboard/package.json dashboard/src/protection-center/protection-center-workspace.tsx src/codex_plugin_scanner/guard/daemon/static .github/workflows/protection-center-batch3-release-sync.yml
          git diff --cached --check; git commit -m "feat(protection-center): integrate plain-language module detail"; git push origin HEAD:feat/protection-center-03-module-detail
