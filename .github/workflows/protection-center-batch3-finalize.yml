name: Protection Center Batch 3 finalize
on:
  push:
    branches: [feat/protection-center-03-module-detail-final]
permissions:
  contents: write
concurrency:
  group: protection-center-batch3-finalize
  cancel-in-progress: true
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Integrate and verify module detail
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/protection-center-03-module-detail
          for path in dashboard/src/protection-center/protection-module-detail.tsx dashboard/src/protection-center/protection-module-detail.test.tsx dashboard/src/protection-center/use-protection-module-activity.ts; do
            git show "origin/feat/protection-center-03-module-detail:${path}" > "${path}"
          done
          python <<'PY'
          from pathlib import Path
          import json
          p = Path("dashboard/src/protection-center/protection-center-workspace.tsx")
          text = p.read_text(encoding="utf-8")
          text = text.replace('import { ExtensionControlCenterDetail } from "../extension-control-center-detail";\n', '')
          marker = 'import { ProtectionLandingExperience } from "./protection-landing-experience";\n'
          module_import = 'import { ProtectionModuleDetail } from "./protection-module-detail";\n'
          if module_import not in text:
              if marker not in text:
                  raise SystemExit("landing import marker changed")
              text = text.replace(marker, marker + module_import, 1)
          start = '  if (routeState.route.kind === "detail" && selectedExtension) {'
          end = '\n\n  if (routeState.route.kind === "detail" || routeState.route.kind === "invalid") {'
          i = text.find(start)
          j = text.find(end, i)
          if i < 0 or j < 0:
              raise SystemExit("detail route block changed")
          block = '  if (routeState.route.kind === "detail" && selectedExtension) {\n    return <><ProtectionModuleDetail extension={selectedExtension} effective={state.effective} catalogDigest={state.catalog.catalog_digest} onBack={closeExtension} onChange={() => requestChange({ extension: selectedExtension, enabled: !isExtensionEnabled(state.effective, selectedExtension) })} />{pending ? <ReviewModal change={pending} busy={busy} error={mutationError} approvalGate={resolvedApprovalGate} onCancel={() => { if (!busy) setPending(null); }} onConfirm={confirm} /> : null}{recoveryModal}</>;\n  }'
          text = text[:i] + block + text[j:]
          p.write_text("\n".join(line.rstrip() for line in text.splitlines()) + "\n", encoding="utf-8")
          q = Path("dashboard/package.json")
          data = json.loads(q.read_text(encoding="utf-8"))
          cmd = "tsx src/protection-center/protection-module-detail.test.tsx"
          parts = [part.strip() for part in data["scripts"]["test"].split("&&")]
          if cmd not in parts:
              parts.insert(2 if len(parts) >= 2 else len(parts), cmd)
          data["scripts"]["test"] = " && ".join(parts)
          q.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
          cd dashboard
          bun install --frozen-lockfile --ignore-scripts
          bun run test
          bun run build
          cd ..
          rm .github/workflows/protection-center-batch3-finalize.yml
          git add dashboard/package.json dashboard/src/protection-center src/codex_plugin_scanner/guard/daemon/static .github/workflows/protection-center-batch3-finalize.yml
          git diff --cached --check
          git commit -m "feat(protection-center): add plain-language module detail"
          git push origin HEAD:feat/protection-center-03-module-detail-final