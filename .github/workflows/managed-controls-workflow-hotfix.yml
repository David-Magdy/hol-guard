name: Managed controls workflow hotfix

on:
  push:
    branches:
      - managed-controls/batch-02-actions-limits-clean
    paths:
      - '.github/workflows/managed-controls-workflow-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: managed-controls/batch-02-actions-limits-clean
          fetch-depth: 0

      - name: Repair generated module source
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/managed-controls-finalize.yml')
          value = path.read_text(encoding='utf-8')
          old = "              ''''Wire-compatible, bounded extension-control catalog projection.'\n"
          new = "              '''# Wire-compatible, bounded extension-control catalog projection.\n"
          if old not in value:
              raise SystemExit('expected malformed catalog source marker was not found')
          path.write_text(value.replace(old, new, 1), encoding='utf-8')

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/managed-controls-workflow-hotfix.yml
          git add .github/workflows/managed-controls-finalize.yml
          git diff --cached --check
          git commit -m "ci: repair Managed Controls remediation source"
          git push origin HEAD:managed-controls/batch-02-actions-limits-clean
