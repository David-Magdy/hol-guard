name: Apply native release merge safety guard

on:
  push:
    branches: [feat/rust-runtime-native-publish]
    paths:
      - ".github/workflows/native-release-merge-safety-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: feat/rust-runtime-native-publish
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Add explicit no-publish merge marker contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path(".github/workflows/publish.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          old = (
              "      (github.event_name != 'workflow_dispatch' || github.run_attempt == 1) &&\n"
              "      (github.event_name != 'push' || github.run_attempt == 1) &&\n"
              "      (github.event.action != 'labeled' || github.event.label.name == 'publish-testpypi-canary')\n"
          )
          new = (
              "      (github.event_name != 'workflow_dispatch' || github.run_attempt == 1) &&\n"
              "      (github.event_name != 'push' || github.run_attempt == 1) &&\n"
              "      (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip release publish]')) &&\n"
              "      (github.event.action != 'labeled' || github.event.label.name == 'publish-testpypi-canary')\n"
          )
          if workflow.count(old) != 1:
              raise RuntimeError("Expected exactly one release build condition")
          workflow_path.write_text(workflow.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_release_train_workflow.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_release_push_can_be_explicitly_suppressed_by_merge_marker() -> None:"
          if marker in tests:
              raise RuntimeError("Merge safety contract already exists")
          tests += (
              "\n\n"
              "def test_release_push_can_be_explicitly_suppressed_by_merge_marker() -> None:\n"
              "    workflow = _workflow(PUBLISH_WORKFLOW)\n"
              "    condition = workflow[\"jobs\"][\"build\"][\"if\"]\n"
              "\n"
              "    assert \"github.event_name != 'push'\" in condition\n"
              "    assert \"github.event.head_commit.message\" in condition\n"
              "    assert \"[skip release publish]\" in condition\n"
          )
          test_path.write_text(tests, encoding="utf-8")
          PY
          uv run --no-sync python -m ruff format tests/test_release_train_workflow.py
          uv run --no-sync python -m ruff check tests/test_release_train_workflow.py
          uv run --no-sync pytest -q tests/test_release_train_workflow.py
      - name: Refresh exact test-suite ratchet
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/ci/test_inventory.py --output "$RUNNER_TEMP/test-inventory.json"
          uv run --no-sync python - "$RUNNER_TEMP/test-inventory.json" <<'PY'
          import json
          import pathlib
          import sys

          inventory = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          payload = {
              "maximum_collected_cases": inventory["inventory"]["collected_cases"],
              "maximum_test_source_lines": inventory["test_source_lines"],
              "schema_version": 1,
          }
          pathlib.Path("ci/test-suite-ratchet-baseline.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Commit exact safety change and remove helper
        run: |
          set -euo pipefail
          git rm .github/workflows/native-release-merge-safety-fix.yml
          git add .github/workflows/publish.yml tests/test_release_train_workflow.py ci/test-suite-ratchet-baseline.json
          git diff --cached --check
          branch=feat/rust-runtime-native-publish
          remote_sha=$(git ls-remote --exit-code origin "refs/heads/${branch}" | awk '{print $1}')
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "Publication branch moved while applying the merge safety guard" >&2
            exit 1
          fi
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git commit --signoff -m "fix(release): allow explicit no-publish merge commits"
          git push origin "HEAD:refs/heads/${branch}"

# Retriggered after preserving the concurrent branch advance.
