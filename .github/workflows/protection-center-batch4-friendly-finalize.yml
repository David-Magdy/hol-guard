name: Protection Center Batch 4 finalize
on:
  push:
    branches: [feat/protection-center-04-friendly-settings]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply friendly settings UX and verify
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/protection-center-04-friendly-settings-final
          git show origin/feat/protection-center-04-friendly-settings-final:scripts/ci/protection_center_batch4_friendly_transform.py > /tmp/friendly.py
          git show origin/feat/protection-center-04-friendly-settings-final:dashboard/src/extension-policy-panel.copy.test.tsx > dashboard/src/extension-policy-panel.copy.test.tsx
          python /tmp/friendly.py
          python - <<'PY'
          from pathlib import Path
          p = Path('dashboard/src/approval-center-primitives.tsx')
          t = p.read_text(encoding='utf-8')
          old = '{ href: "/extensions", label: "Protections", view: "extensions", icon: HiMiniPuzzlePiece },'
          new = '{ href: "/extensions", label: "Modules", view: "extensions", icon: HiMiniPuzzlePiece },'
          if old not in t:
              raise SystemExit('sidebar Protections label marker missing')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')

          p = Path('dashboard/src/extensions-workspace.test.ts')
          t = p.read_text(encoding='utf-8')
          t = t.replace('Policy applied\\. Editing stays locked', 'Settings applied\\. Editing stays locked')
          t = t.replace('Permission controls', 'Protection settings')
          p.write_text(t, encoding='utf-8')

          p = Path('dashboard/e2e/installed-extension-control-center.spec.ts')
          t = p.read_text(encoding='utf-8')
          pairs = [
              ('heading", { name: "Permission controls"', 'heading", { name: "Protection settings"'),
              ('getByText("Block", { exact: true })', 'getByText("Block matching actions", { exact: true })'),
              ('getByText("Inherit", { exact: true })', 'getByText("Use recommended", { exact: true })'),
              ('getByText("Allow", { exact: true })', 'getByText("Allow when Guard would otherwise permit", { exact: true })'),
              ('getByText("Semantic review", { exact: true })', 'getByText("Protection review", { exact: true })'),
              ('getByText("Blast radius before apply", { exact: true })', 'getByText("What will change", { exact: true })'),
              ('getByRole("button", { name: /Apply 1 reviewed change/ })', 'getByRole("button", { name: "Continue to approval" })'),
          ]
          for old, new in pairs:
              t = t.replace(old, new)
          p.write_text(t, encoding='utf-8')

          p = Path('dashboard/package.json')
          import json
          d = json.loads(p.read_text())
          cmd = 'tsx src/extension-policy-panel.copy.test.tsx'
          parts = [x.strip() for x in d['scripts']['test'].split('&&')]
          if cmd not in parts:
              parts.insert(3, cmd)
          d['scripts']['test'] = ' && '.join(parts)
          p.write_text(json.dumps(d, indent=2) + '\n')
          PY
          cd dashboard
          bun install --frozen-lockfile --ignore-scripts
          bun run test
          bun run build
          cd ..
          rm .github/workflows/protection-center-batch4-friendly-finalize.yml
          git add dashboard src/codex_plugin_scanner/guard/daemon/static .github/workflows/protection-center-batch4-friendly-finalize.yml
          git diff --cached --check
          git commit -m "feat(protection-center): simplify module protection settings"
          git push origin HEAD:feat/protection-center-04-friendly-settings