name: Secrets platform protected merge shepherd

on:
  push:
    branches:
      - fix/secrets-e2e-platform-hardening-v2

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: secrets-platform-protected-merge-shepherd
  cancel-in-progress: true

jobs:
  validate-merge-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      HARDENING_BRANCH: fix/secrets-e2e-platform-hardening-v2
      TARGET_BRANCH: release/3.0
    steps:
      - name: Checkout latest hardening branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/secrets-e2e-platform-hardening-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false

      - name: Install locked development environment
        run: uv sync --frozen --extra dev --python 3.12

      - name: Remove every temporary workflow and superseded smoke
        shell: bash
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/secrets-platform-hardening-bootstrap.yml \
            .github/workflows/secrets-platform-hardening-finalizer.yml \
            .github/workflows/secrets-platform-merge-shepherd.yml \
            scripts/ci/run_guard_secrets_platform_smoke.py

      - name: Format, lint, and advance exact test ratchet
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/codex_plugin_scanner/guard/secrets/setup_diagnostics.py
            src/codex_plugin_scanner/guard/secrets/git_subprocess.py
            src/codex_plugin_scanner/guard/secrets/cli.py
            src/codex_plugin_scanner/guard/secrets/precommit.py
            src/codex_plugin_scanner/guard/secrets/secret_repository_scanner.py
            src/codex_plugin_scanner/guard/secrets/secret_staged_scanner.py
            scripts/ci/run_guard_secrets_platform_smoke_v2.py
            tests/test_guard_secret_platform_hardening.py
            tests/test_guard_secret_git_subprocess_hardening.py
          )
          uv run --no-sync python -m ruff format "${files[@]}"
          uv run --no-sync python -m ruff check --fix "${files[@]}"
          uv run --no-sync python -m ruff format "${files[@]}"
          uv run --no-sync python -m ruff check "${files[@]}"
          uv run --no-sync python scripts/ci/generate_test_inventory.py --output /tmp/test-inventory.json
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path
          inventory = json.loads(Path('/tmp/test-inventory.json').read_text(encoding='utf-8'))
          path = Path('ci/test-suite-ratchet-baseline.json')
          baseline = json.loads(path.read_text(encoding='utf-8'))
          baseline['maximum_collected_cases'] = inventory['inventory']['collected_cases']
          baseline['maximum_test_source_lines'] = inventory['test_source_lines']
          path.write_text(json.dumps(baseline, indent=2) + '\n', encoding='utf-8')
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory /tmp/test-inventory.json

      - name: Type-check and execute complete Secrets test inventory
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync basedpyright --level error \
            src/codex_plugin_scanner/guard/secrets/setup_diagnostics.py \
            src/codex_plugin_scanner/guard/secrets/git_subprocess.py \
            src/codex_plugin_scanner/guard/secrets/cli.py \
            src/codex_plugin_scanner/guard/secrets/precommit.py \
            src/codex_plugin_scanner/guard/secrets/secret_repository_scanner.py \
            src/codex_plugin_scanner/guard/secrets/secret_staged_scanner.py \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            tests/test_guard_secret_platform_hardening.py \
            tests/test_guard_secret_git_subprocess_hardening.py
          mapfile -d '' tests < <(find tests -maxdepth 1 -type f \( -name '*secret*.py' -o -name '*secrets*.py' \) -print0 | sort -z)
          test "${#tests[@]}" -gt 0
          uv run --no-sync pytest -q "${tests[@]}" --tb=short

      - name: Enforce privacy and subprocess invariants
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          import re
          patterns = (
              re.compile(rb'gh[pousr]_[A-Za-z0-9_]{20,255}'),
              re.compile(rb'sk-(?:(?:proj|svcacct)-)?[A-Za-z0-9_-]{20,255}'),
              re.compile(rb'AKIA[0-9A-Z]{16}'),
          )
          for root_name in ('src', 'tests', 'scripts', 'docs'):
              for path in Path(root_name).rglob('*'):
                  if path.is_file() and not path.is_symlink():
                      data = path.read_bytes()
                      if any(pattern.search(data) for pattern in patterns):
                          raise SystemExit(f'complete provider-shaped credential committed: {path}')
          source = Path('src/codex_plugin_scanner/guard/secrets/git_subprocess.py').read_text(encoding='utf-8')
          for required in (
              'shell=False',
              'stdin=subprocess.DEVNULL',
              'GIT_CONFIG_GLOBAL',
              'GIT_CONFIG_NOSYSTEM',
              'core.fsmonitor=false',
              'credential.helper=',
          ):
              if required not in source:
                  raise SystemExit(f'missing hardened Git invariant: {required}')
          for forbidden in (
              '.github/workflows/secrets-platform-hardening-bootstrap.yml',
              '.github/workflows/secrets-platform-hardening-finalizer.yml',
              '.github/workflows/secrets-platform-merge-shepherd.yml',
              'scripts/ci/run_guard_secrets_platform_smoke.py',
          ):
              if Path(forbidden).exists():
                  raise SystemExit(f'temporary file remains: {forbidden}')
          PY

      - name: Build and execute exact installed-wheel Git lifecycle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          uv build --wheel --out-dir dist
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv run --no-sync python scripts/ci/run_guard_secrets_platform_smoke_v2.py --wheel "$wheel"
          git diff --check

      - name: Commit validated permanent tree and wait for protected-check trigger
        id: permanent
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(secrets): prepare exact protected hardening head'
          git push origin HEAD:"$HARDENING_BRANCH"
          echo "shepherd_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['HARDENING_BRANCH']
          prior = os.environ['SHEPHERD_SHA']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'User-Agent': 'hol-guard-secrets-merge-shepherd',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          deadline = time.time() + 3600
          while time.time() < deadline:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/git/ref/heads/{branch.replace("/", "%2F")}',
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  current = json.load(response)['object']['sha']
              if current != prior:
                  with open('/tmp/protected-head-sha', 'w', encoding='utf-8') as handle:
                      handle.write(current)
                  raise SystemExit(0)
              time.sleep(20)
          raise SystemExit('timed out waiting for the connector-authored protected-check trigger')
          PY
        env:
          SHEPHERD_SHA: ${{ steps.permanent.outputs.shepherd_sha }}

      - name: Wait for every exact-head check and merge without bypass
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          owner, name = repository.split('/', 1)
          branch = os.environ['HARDENING_BRANCH']
          base = os.environ['TARGET_BRANCH']
          sha = open('/tmp/protected-head-sha', encoding='utf-8').read().strip()
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'User-Agent': 'hol-guard-secrets-merge-shepherd',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def request_json(url, *, method='GET', payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(url, method=method, data=data, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None

          pulls = request_json(
              f'https://api.github.com/repos/{repository}/pulls?state=open&head={urllib.parse.quote(owner + ":" + branch)}&per_page=10'
          )
          if len(pulls) != 1:
              raise SystemExit(f'expected exactly one open hardening PR, found {len(pulls)}')
          pull = pulls[0]
          if pull['base']['ref'] != base or pull['head']['sha'] != sha or pull.get('draft'):
              raise SystemExit('pull request base, head, or draft state is not mergeable')
          number = int(pull['number'])
          node_id = pull['node_id']
          rerun_attempted = set()
          deadline = time.time() + 7200
          required_platforms = {'ubuntu-24.04', 'macos-14', 'windows-2022'}

          while time.time() < deadline:
              runs = request_json(
                  f'https://api.github.com/repos/{repository}/actions/runs?head_sha={sha}&per_page=100'
              ).get('workflow_runs', [])
              checks = request_json(
                  f'https://api.github.com/repos/{repository}/commits/{sha}/check-runs?per_page=100'
              ).get('check_runs', [])
              platform_names = {check['name'].split(' / ', 1)[0] for check in checks if ' / Python ' in check['name']}
              active = [run for run in runs if run['status'] != 'completed']
              failed = [
                  run for run in runs
                  if run['status'] == 'completed'
                  and run.get('conclusion') not in {'success', 'neutral', 'skipped'}
              ]
              if failed:
                  for run in failed:
                      run_id = int(run['id'])
                      if run_id in rerun_attempted:
                          raise SystemExit(f"workflow remained failed after rerun: {run['name']}")
                      rerun_attempted.add(run_id)
                      endpoint = 'rerun-failed-jobs' if run.get('conclusion') == 'failure' else 'rerun'
                      try:
                          request_json(
                              f'https://api.github.com/repos/{repository}/actions/runs/{run_id}/{endpoint}',
                              method='POST',
                          )
                      except urllib.error.HTTPError as error:
                          if error.code not in {409, 422}:
                              raise
                  time.sleep(30)
                  continue
              incomplete_checks = [check for check in checks if check['status'] != 'completed']
              failed_checks = [
                  check for check in checks
                  if check['status'] == 'completed'
                  and check.get('conclusion') not in {'success', 'neutral', 'skipped'}
              ]
              if failed_checks:
                  raise SystemExit('one or more exact-head checks failed')
              if runs and not active and not incomplete_checks and required_platforms <= platform_names:
                  break
              time.sleep(30)
          else:
              raise SystemExit('timed out waiting for exact-head checks')

          graphql_headers = dict(headers)
          graphql_headers['Content-Type'] = 'application/json'
          query = '''
          query($owner:String!, $name:String!, $number:Int!) {
            repository(owner:$owner, name:$name) {
              pullRequest(number:$number) {
                reviewDecision
                reviewThreads(first:100) { nodes { isResolved } }
              }
            }
          }
          '''
          gql_request = urllib.request.Request(
              'https://api.github.com/graphql',
              method='POST',
              headers=graphql_headers,
              data=json.dumps({'query': query, 'variables': {'owner': owner, 'name': name, 'number': number}}).encode(),
          )
          with urllib.request.urlopen(gql_request, timeout=30) as response:
              review = json.load(response)['data']['repository']['pullRequest']
          if review.get('reviewDecision') == 'CHANGES_REQUESTED':
              raise SystemExit('changes are requested')
          if any(not thread['isResolved'] for thread in review['reviewThreads']['nodes']):
              raise SystemExit('unresolved review thread remains')

          merge_payload = {
              'commit_title': f'fix(secrets): harden end-to-end setup across platforms (#{number})',
              'commit_message': 'Validate Local Secrets scanning, Git subprocess isolation, pre-commit lifecycle, exact-wheel OS compatibility, fail-honest coverage, setup diagnostics, privacy, and security boundaries.',
              'sha': sha,
              'merge_method': 'squash',
          }
          merge_deadline = time.time() + 1800
          while time.time() < merge_deadline:
              try:
                  merged = request_json(
                      f'https://api.github.com/repos/{repository}/pulls/{number}/merge',
                      method='PUT',
                      payload=merge_payload,
                  )
              except urllib.error.HTTPError as error:
                  if error.code in {405, 409}:
                      time.sleep(30)
                      continue
                  raise
              if merged.get('merged'):
                  with open('/tmp/merge-sha', 'w', encoding='utf-8') as handle:
                      handle.write(merged['sha'])
                  break
              time.sleep(30)
          else:
              raise SystemExit('protected merge did not complete')
          PY

      - name: Verify post-merge target checks
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          sha = open('/tmp/merge-sha', encoding='utf-8').read().strip()
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'User-Agent': 'hol-guard-secrets-post-merge-verifier',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          deadline = time.time() + 7200
          while time.time() < deadline:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/actions/runs?head_sha={sha}&per_page=100',
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  runs = json.load(response).get('workflow_runs', [])
              if not runs:
                  time.sleep(20)
                  continue
              if any(run['status'] != 'completed' for run in runs):
                  time.sleep(30)
                  continue
              failed = [
                  run['name'] for run in runs
                  if run.get('conclusion') not in {'success', 'neutral', 'skipped'}
              ]
              if failed:
                  raise SystemExit('post-merge workflow failure: ' + ', '.join(failed))
              names = {run['name'] for run in runs}
              if 'Secrets platform end-to-end' not in names:
                  time.sleep(20)
                  continue
              raise SystemExit(0)
          raise SystemExit('timed out waiting for post-merge target checks')
          PY
