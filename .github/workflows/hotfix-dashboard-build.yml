name: Hotfix dashboard asset build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-dashboard-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/guard-local-protection-hotfixes
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Build committed dashboard assets
        working-directory: dashboard
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Commit generated assets
        run: |
          if git diff --quiet -- src/codex_plugin_scanner/guard/daemon/static; then
            exit 0
          fi
          git config user.name "kantorcodes"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git add src/codex_plugin_scanner/guard/daemon/static
          git commit -m "build(dashboard): refresh committed assets"
          git push origin HEAD:fix/guard-local-protection-hotfixes
