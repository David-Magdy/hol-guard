name: PR 2172 static rebuild

on:
  push:
    branches:
      - chore/pr2172-static-rebuild
    paths:
      - dashboard/**
      - .github/workflows/pr2172-static-rebuild.yml

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: cd dashboard && bun install --frozen-lockfile
      - run: cd dashboard && bun run build
      - name: Commit regenerated dashboard asset
        shell: bash
        run: |
          git add src/codex_plugin_scanner/guard/daemon/static
          git diff --cached --exit-code && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(dashboard): rebuild extension control center assets"
          git push origin HEAD:chore/pr2172-static-rebuild
