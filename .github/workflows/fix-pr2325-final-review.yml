name: Fix PR 2325 final review findings

on:
  push:
    branches:
      - automation/fix-pr2325-final-review

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/secrets-v2-evidence-contracts-clean
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Apply fail-closed privacy and coverage fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          contracts = Path("src/codex_plugin_scanner/guard/secrets/contracts_v2.py")
          text = contracts.read_text(encoding="utf-8")

          old = 'r"(?:^|_)(?:raw_?secret|candidate(?:_value)?|credential(?:_value)?|"'
          new = 'r"(?:^|_)(?:raw(?:_value)?|raw_?secret|candidate(?:_value)?|credential(?:_value)?|"'
          if old not in text:
              raise SystemExit("prohibited-key anchor not found")
          text = text.replace(old, new, 1)

          old = "        if self.truncation_codes and not self.partial:\n            raise SecretContractError(\"truncation requires partial=true\")"
          new = "        if self.skipped_codes and not self.partial:\n            raise SecretContractError(\"skipped work requires partial=true\")\n        if self.truncation_codes and not self.partial:\n            raise SecretContractError(\"truncation requires partial=true\")"
          if old not in text:
              raise SystemExit("coverage post-init anchor not found")
          text = text.replace(old, new, 1)

          old = "            and self.error_code is None\n            and not self.truncation_codes"
          new = "            and self.error_code is None\n            and not self.skipped_codes\n            and not self.truncation_codes"
          if old not in text:
              raise SystemExit("clean-eligible anchor not found")
          contracts.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("tests/test_guard_secret_contracts_v2.py")
          text = tests.read_text(encoding="utf-8")

          anchor = "def test_direct_coverage_rejects_truncation_without_partial() -> None:\n"
          addition = "\n".join(
              [
                  "def test_direct_coverage_rejects_skipped_work_without_partial() -> None:",
                  "    with pytest.raises(SecretContractError, match=\"skipped work requires partial=true\"):",
                  "        _direct_coverage(skipped_codes=(\"binary_skipped\",))",
                  "",
                  "",
                  "def test_mapping_coverage_rejects_skipped_work_without_partial() -> None:",
                  "    with pytest.raises(SecretContractError, match=\"skipped work requires partial=true\"):",
                  "        _coverage(skipped_codes=[\"binary_skipped\"])",
                  "",
                  "",
                  "def test_skipped_partial_coverage_cannot_claim_clean() -> None:",
                  "    coverage = _coverage(partial=True, skipped_codes=[\"binary_skipped\"])",
                  "    assert coverage.clean_eligible is False",
                  "    with pytest.raises(SecretContractError, match=\"cannot produce a clean\"):",
                  "        coverage.assert_outcome(PreventionOutcome.CLEAN)",
                  "",
                  "",
              ]
          )
          if anchor not in text:
              raise SystemExit("coverage-test anchor not found")
          text = text.replace(anchor, addition + anchor, 1)

          anchor = "def test_nested_raw_value_like_field_is_rejected() -> None:\n"
          addition = "\n".join(
              [
                  "@pytest.mark.parametrize(\"key\", [\"raw_value\", \"rawValue\", \"raw-value\"])",
                  "def test_raw_value_key_spellings_are_rejected(key: str) -> None:",
                  "    with pytest.raises(SecretContractError, match=\"prohibited\"):",
                  "        reject_prohibited_fields({key: \"arbitrary plaintext\"})",
                  "",
                  "",
                  "@pytest.mark.parametrize(\"key\", [\"raw_value\", \"rawValue\", \"raw-value\"])",
                  "def test_nested_raw_value_key_spellings_are_rejected(key: str) -> None:",
                  "    with pytest.raises(SecretContractError, match=\"prohibited\"):",
                  "        reject_prohibited_fields({\"safe\": {key: \"arbitrary plaintext\"}})",
                  "",
                  "",
              ]
          )
          if anchor not in text:
              raise SystemExit("privacy-test anchor not found")
          tests.write_text(text.replace(anchor, addition + anchor, 1), encoding="utf-8")
          PY
      - name: Install locked development dependencies
        shell: bash
        env:
          UV_HTTP_TIMEOUT: "120"
          UV_HTTP_RETRIES: "5"
        run: |
          set -euo pipefail
          if ! uv sync --frozen --extra dev --python 3.12; then
            sleep 10
            uv sync --frozen --extra dev --python 3.12
          fi
      - name: Format, lint, and test focused contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync ruff format \
            src/codex_plugin_scanner/guard/secrets/contracts_v2.py \
            tests/test_guard_secret_contracts_v2.py
          uv run --no-sync ruff check \
            src/codex_plugin_scanner/guard/secrets/contracts_v2.py \
            tests/test_guard_secret_contracts_v2.py
          uv run --no-sync pytest \
            tests/test_guard_secret_contracts_v2.py \
            tests/test_guard_secret_release_claim_gate.py \
            tests/test_release_toolchain_sbom.py \
            --tb=short
      - name: Reconcile exact test inventory
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/ci/test_inventory.py --output /tmp/test-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path("/tmp/test-inventory.json").read_text(encoding="utf-8"))
          baseline = {
              "maximum_collected_cases": inventory["inventory"]["collected_cases"],
              "maximum_test_source_lines": inventory["test_source_lines"],
              "schema_version": 1,
          }
          Path("ci/test-suite-ratchet-baseline.json").write_text(
              json.dumps(baseline, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(baseline, sort_keys=True))
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory /tmp/test-inventory.json
          git diff --check
      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ci/test-suite-ratchet-baseline.json \
            src/codex_plugin_scanner/guard/secrets/contracts_v2.py \
            tests/test_guard_secret_contracts_v2.py
          git commit -m "fix(secrets): close privacy and false-clean gaps"
          git push origin HEAD:feat/secrets-v2-evidence-contracts-clean
