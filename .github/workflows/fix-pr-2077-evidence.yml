name: Fix PR 2077 source-bound evidence

on:
  push:
    branches:
      - chore/rebuild-pr-2077-clean
    paths:
      - .github/workflows/fix-pr-2077-evidence.yml

permissions:
  contents: write

concurrency:
  group: fix-pr-2077-evidence
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: desktop/3.0-contracts
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Install frozen dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Regenerate deterministic evidence
        run: |
          set -euo pipefail
          uv run --no-sync python tests/guard_command_decision_diff.py --write
          uv run --no-sync python tests/guard_command_decision_diff.py --check

      - name: Validate final contract tree
        run: |
          set -euo pipefail
          uv run --no-sync python -m ruff format --check \
            src/codex_plugin_scanner/guard/shims.py \
            src/codex_plugin_scanner/guard/cli/commands_dispatch_desktop.py \
            src/codex_plugin_scanner/guard/cli/commands_parser_desktop.py \
            src/codex_plugin_scanner/guard/cli/commands_parser.py \
            src/codex_plugin_scanner/guard/store_approvals.py \
            src/codex_plugin_scanner/guard/store_approval_facade.py \
            src/codex_plugin_scanner/guard/store_receipts.py \
            tests/test_guard_desktop_contract.py
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/shims.py \
            src/codex_plugin_scanner/guard/cli/commands_dispatch_desktop.py \
            src/codex_plugin_scanner/guard/cli/commands_parser_desktop.py \
            src/codex_plugin_scanner/guard/cli/commands_parser.py \
            src/codex_plugin_scanner/guard/store_approvals.py \
            src/codex_plugin_scanner/guard/store_approval_facade.py \
            src/codex_plugin_scanner/guard/store_receipts.py \
            tests/test_guard_desktop_contract.py
          uv run --no-sync pytest tests/test_guard_desktop_contract.py --tb=short
          uv run --no-sync pytest \
            tests/test_guard_package_shims.py::test_package_manager_shim_waits_out_transient_store_writer_lock \
            --tb=short
          uv run --no-sync python scripts/ci/test_inventory.py --output test-inventory.json
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory test-inventory.json
          rm test-inventory.json
          export HOL_GUARD_HOME="$RUNNER_TEMP/guard-home"
          mkdir -p "$HOL_GUARD_HOME"
          uv run --no-sync hol-guard desktop bootstrap --json > "$RUNNER_TEMP/desktop-bootstrap.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads((Path(os.environ["RUNNER_TEMP"]) / "desktop-bootstrap.json").read_text())
          assert payload["schema"] == "guard-desktop-bootstrap.v1"
          PY

      - name: Publish validated evidence tree
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: 997d2320b187d411b7140934f45ddf9b080efd1d
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/guard-command-corpus/decision-diff-report.json
          git diff --cached --check
          git commit -m "test(guard): refresh source-bound decision evidence"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/chore/pr-2077-evidence-fix
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
