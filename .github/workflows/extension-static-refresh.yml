name: Extension static refresh

on:
  push:
    branches:
      - feat/extension-control-center-01-details

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/extension-control-center-01-details
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: cd dashboard && bun install --frozen-lockfile
      - run: cd dashboard && bun run test
      - run: cd dashboard && bun run build
      - name: Commit checked-in production assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/codex_plugin_scanner/guard/daemon/static
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build(dashboard): refresh extension control center bundle"
          git push origin HEAD:feat/extension-control-center-01-details
