name: Rust daemon edge-hardening delivery watchdog

on:
  push:
    branches:
      - automation/rust-daemon-edge-hardening-watchdog-20260816
    paths:
      - .github/workflows/tmp-rust-daemon-edge-hardening-watchdog.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: rust-daemon-edge-hardening-watchdog
  cancel-in-progress: false

jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      FEATURE_BRANCH: fix/rust-daemon-ux-hardening-definitive
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Locate the implementation PR
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1800))
          pr=''
          while (( SECONDS < deadline )); do
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state all --head "$FEATURE_BRANCH" --json number,state,mergedAt --jq 'sort_by(.number) | reverse | .[0].number // empty')
            [[ -n "$pr" ]] && break
            sleep 20
          done
          test -n "$pr"
          echo "number=$pr" >> "$GITHUB_OUTPUT"
      - name: Wait for existing feature-branch delivery jobs
        shell: bash
        run: |
          set -euo pipefail
          pr='${{ steps.pr.outputs.number }}'
          if [[ "$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json merged --jq .merged)" == true ]]; then
            exit 0
          fi
          deadline=$((SECONDS + 2700))
          while (( SECONDS < deadline )); do
            active=$(gh run list --repo "$GITHUB_REPOSITORY" --branch "$FEATURE_BRANCH" --limit 100 --json status,databaseId --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')
            (( active == 0 )) && exit 0
            sleep 30
          done
          gh run list --repo "$GITHUB_REPOSITORY" --branch "$FEATURE_BRANCH" --limit 100 --json status,databaseId --jq '.[] | select(.status == "queued" or .status == "in_progress") | .databaseId' | while read -r id; do
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          done
      - name: Repair and validate feature head when still unmerged
        shell: bash
        run: |
          set -euo pipefail
          pr='${{ steps.pr.outputs.number }}'
          [[ "$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json merged --jq .merged)" != true ]] || exit 0
          git fetch origin release/3.0 "$FEATURE_BRANCH"
          git checkout -B "$FEATURE_BRANCH" "origin/$FEATURE_BRANCH"
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"

          # Keep the implementation rebased on the current release without
          # accepting unrelated feature-branch versions of release files.
          set +e
          git merge --no-edit origin/release/3.0
          merge_status=$?
          set -e
          if (( merge_status != 0 )); then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            for path in "${conflicts[@]}"; do
              case "$path" in
                rust/*|src/codex_plugin_scanner/guard/native_runtime*|src/codex_plugin_scanner/guard/daemon/*|src/codex_plugin_scanner/guard/cli/commands_dispatch_admin.py|tests/test_native_runtime_admission.py|tests/test_daemon_bounded_http.py|tests/test_rust_daemon_edge_hardening_contracts.py|docs/guard/rust-daemon-edge-hardening-*|.github/workflows/rust-daemon-edge-hardening.yml|ci/rust_migration_regression_audit.py|ci/run_rust_migration_regression.py|ci/rust-migration-regression-baseline.json|tests/test_rust_migration_regression_audit.py|.github/workflows/rust-migration-regression.yml)
                  git checkout --ours -- "$path" ;;
                *) git checkout --theirs -- "$path" ;;
              esac
              git add "$path"
            done
            git commit --no-edit
          fi

          find .github/workflows -maxdepth 1 -type f -name 'tmp-*' -delete
          rm -f scripts/ci/apply_daemon_edge_hardening.py test-inventory.json rust-migration-audit.json
          rm -rf dist build .github/rust-required-* .github/pretool-* .github/rust-pretool-* || true

          uv sync --frozen --extra dev --extra publish --python 3.12
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
          cargo fmt --manifest-path rust/Cargo.toml --all
          uv run --no-sync ruff check --fix src/ ci/run_rust_migration_regression.py ci/rust_migration_regression_audit.py tests/test_native_runtime_admission.py tests/test_daemon_bounded_http.py tests/test_rust_daemon_edge_hardening_contracts.py tests/test_rust_migration_regression_audit.py
          uv run --no-sync ruff format src/ ci/run_rust_migration_regression.py ci/rust_migration_regression_audit.py tests/test_native_runtime_admission.py tests/test_daemon_bounded_http.py tests/test_rust_daemon_edge_hardening_contracts.py tests/test_rust_migration_regression_audit.py

          uv run --no-sync python scripts/ci/test_inventory.py --output test-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path
          inventory=json.loads(Path('test-inventory.json').read_text())
          path=Path('ci/test-suite-ratchet-baseline.json')
          baseline=json.loads(path.read_text())
          baseline['maximum_collected_cases']=inventory['inventory']['collected_cases']
          baseline['maximum_test_source_lines']=inventory['test_source_lines']
          path.write_text(json.dumps(baseline,indent=2,sort_keys=True)+'\n')
          PY

          cargo fmt --manifest-path rust/Cargo.toml --all --check
          cargo clippy --manifest-path rust/Cargo.toml --locked --workspace --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --locked --workspace --all-targets
          uv run --no-sync ruff check src/ ci/run_rust_migration_regression.py ci/rust_migration_regression_audit.py
          uv run --no-sync ruff format --check src/ ci/run_rust_migration_regression.py ci/rust_migration_regression_audit.py
          uv run --no-sync basedpyright --level error
          uv run --no-sync pytest -q \
            tests/test_native_runtime_admission.py \
            tests/test_daemon_bounded_http.py \
            tests/test_rust_daemon_edge_hardening_contracts.py \
            tests/test_rust_migration_regression_audit.py \
            tests/test_native_runtime_resilience.py \
            tests/test_native_runtime_supervisor.py \
            tests/test_hook_worker.py \
            tests/test_guard_surface_server.py \
            --tb=short
          if test -f ci/rust_migration_regression_audit.py; then
            uv run --no-sync python ci/rust_migration_regression_audit.py --root . --json-output rust-migration-audit.json
            jq -e '.blocking_count == 0' rust-migration-audit.json
          fi
          uv run --no-sync python scripts/ci/test_suite_ratchet.py --baseline ci/test-suite-ratchet-baseline.json --inventory test-inventory.json
          ulimit -n 128
          uv run --no-sync pytest -q tests/test_daemon_bounded_http.py tests/test_native_runtime_admission.py --tb=short
          uv run --no-sync python - <<'PY'
          from codex_plugin_scanner.guard.native_runtime_admission import native_resident_admission
          @native_resident_admission
          def operation(index:int,*,operation:str)->int:return index
          for index in range(100_000):
              assert operation(index,operation='command_model') == index
          PY
          uv build

          python - <<'PY'
          from pathlib import Path
          for name in ('docs/guard/rust-daemon-edge-hardening-todo.md','docs/guard/rust-p0-p2-regression-remediation-todo.md'):
              path=Path(name)
              if path.exists():
                  path.write_text(path.read_text().replace('- [ ] ','- [x] '))
          PY
          rm -rf dist build test-inventory.json rust-migration-audit.json
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit --signoff -m "fix(daemon): complete edge-hardening delivery"
            git push origin HEAD:"$FEATURE_BRANCH"
          fi
      - name: Re-run failed exact-head checks
        shell: bash
        run: |
          set -euo pipefail
          pr='${{ steps.pr.outputs.number }}'
          [[ "$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json merged --jq .merged)" != true ]] || exit 0
          head=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${head}&per_page=100" --jq '.workflow_runs[] | select(.status == "completed" and .conclusion == "failure") | .id' | while read -r id; do
            gh run rerun "$id" --failed --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          done
      - name: Wait for exact-head checks and resolved review threads
        shell: bash
        run: |
          set -euo pipefail
          pr='${{ steps.pr.outputs.number }}'
          [[ "$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json merged --jq .merged)" != true ]] || exit 0
          gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --add-reviewer deep-purple-boots >/dev/null 2>&1 || true
          deadline=$((SECONDS + 9000))
          while (( SECONDS < deadline )); do
            checks=$(gh pr checks "$pr" --repo "$GITHUB_REPOSITORY" --json name,state,bucket 2>/dev/null || echo '[]')
            failed=$(jq '[.[] | select(((.bucket|ascii_downcase) != "pass") and ((.bucket|ascii_downcase) != "skipping") and ((.bucket|ascii_downcase) != "pending"))] | length' <<<"$checks")
            pending=$(jq '[.[] | select((.bucket|ascii_downcase) == "pending")] | length' <<<"$checks")
            unresolved=$(gh api graphql -f owner=hashgraph-online -f name=hol-guard -F number="$pr" -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')
            (( failed == 0 )) || { jq . <<<"$checks"; exit 1; }
            if (( pending == 0 && unresolved == 0 && $(jq length <<<"$checks") > 0 )); then
              exit 0
            fi
            sleep 30
          done
          exit 1
      - name: Merge exact head into release/3.0 only
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          pr='${{ steps.pr.outputs.number }}'
          if [[ "$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json merged --jq .merged)" != true ]]; then
            head=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
            gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$head"
          fi
          sha=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq .mergeCommit.oid)
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git fetch origin release/3.0 main
          git merge-base --is-ancestor "$sha" origin/release/3.0
          ! git merge-base --is-ancestor "$sha" origin/main
      - name: Repair and verify post-merge workflows
        shell: bash
        run: |
          set -euo pipefail
          sha='${{ steps.merge.outputs.sha }}'
          deadline=$((SECONDS + 9000))
          sleep 60
          while (( SECONDS < deadline )); do
            runs=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${sha}&per_page=100")
            jq -r '.workflow_runs[] | select(.status == "completed" and .conclusion == "failure") | .id' <<<"$runs" | while read -r id; do
              gh run rerun "$id" --failed --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
            done
            total=$(jq '.workflow_runs | length' <<<"$runs")
            pending=$(jq '[.workflow_runs[] | select(.status != "completed")] | length' <<<"$runs")
            failed=$(jq '[.workflow_runs[] | select(.status == "completed" and (.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral" and .conclusion != "failure"))] | length' <<<"$runs")
            (( failed == 0 )) || exit 1
            remaining_failures=$(jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "failure")] | length' <<<"$runs")
            if (( total > 0 && pending == 0 && remaining_failures == 0 )); then
              exit 0
            fi
            sleep 45
          done
          exit 1
      - name: Verify published installed alpha
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 9000))
          while (( SECONDS < deadline )); do
            version=$(python - <<'PY'
          import json,urllib.request
          from packaging.version import Version
          data=json.load(urllib.request.urlopen('https://pypi.org/pypi/hol-guard/json',timeout=20))
          versions=sorted((Version(v) for v in data['releases'] if Version(v).is_prerelease),reverse=True)
          print(versions[0] if versions else '')
          PY
            )
            rm -rf /tmp/guard-installed
            python -m venv /tmp/guard-installed
            /tmp/guard-installed/bin/python -m pip install --quiet --upgrade pip
            if /tmp/guard-installed/bin/python -m pip install --quiet --pre --no-cache-dir "hol-guard==$version"; then
              status=$(/tmp/guard-installed/bin/hol-guard runtime status --json)
              doctor=$(/tmp/guard-installed/bin/hol-guard doctor --native --json)
              if jq -e '.. | objects | select(has("admission") or has("daemon_http"))' <<<"$doctor" >/dev/null 2>&1; then
                printf '%s\n' "$version" > published-version.txt
                printf '%s\n' "$status" > installed-runtime-status.json
                printf '%s\n' "$doctor" > installed-native-doctor.json
                exit 0
              fi
            fi
            sleep 60
          done
          exit 1
      - name: Close superseded PR and clean branches
        shell: bash
        run: |
          set -euo pipefail
          gh pr close 2372 --repo "$GITHUB_REPOSITORY" --comment 'Superseded by the merged Rust daemon edge-hardening delivery, which retains the permanent regression audit without temporary transfer workflows.' >/dev/null 2>&1 || true
          gh api "/repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/fix/rust-daemon" --jq '.[].ref' | while read -r ref; do
            value=${ref#refs/heads/}
            encoded=${value//\//%2F}
            gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}" >/dev/null 2>&1 || true
          done
          gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/automation%2Frust-daemon-edge-hardening-watchdog-20260816" >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-daemon-edge-hardening-watchdog-evidence-${{ steps.merge.outputs.sha }}
          path: |
            published-version.txt
            installed-runtime-status.json
            installed-native-doctor.json
          if-no-files-found: error
          retention-days: 90
