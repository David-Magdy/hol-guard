name: Fix PR 2325 empty reference coverage

on:
  push:
    branches: [automation/fix-pr2325-final-review]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/secrets-v2-evidence-contracts-clean
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Patch empty-reference coverage invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          contracts = Path("src/codex_plugin_scanner/guard/secrets/contracts_v2.py")
          text = contracts.read_text(encoding="utf-8")
          old = "        if set(self.completed_refs) - set(self.requested_refs):\n            raise SecretContractError(\"completed_refs must be a subset of requested_refs\")"
          new = "        if not self.requested_refs and not self.partial:\n            raise SecretContractError(\"empty requested_refs requires partial=true\")\n        if set(self.completed_refs) - set(self.requested_refs):\n            raise SecretContractError(\"completed_refs must be a subset of requested_refs\")\n        if not self.partial and set(self.completed_refs) != set(self.requested_refs):\n            raise SecretContractError(\"complete coverage must complete every requested ref\")"
          if old not in text:
              raise SystemExit("reference invariant anchor not found")
          text = text.replace(old, new, 1)
          old = "        return (\n            not self.partial"
          new = "        return (\n            bool(self.requested_refs)\n            and not self.partial"
          if old not in text:
              raise SystemExit("clean eligibility anchor not found")
          contracts.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("tests/test_guard_secret_contracts_v2.py")
          text = tests.read_text(encoding="utf-8")
          anchor = "def test_direct_coverage_rejects_truncation_without_partial() -> None:\n"
          addition = "\n".join(
              [
                  "def test_direct_coverage_rejects_empty_refs_without_partial() -> None:",
                  "    with pytest.raises(SecretContractError, match=\"empty requested_refs requires partial=true\"):",
                  "        _direct_coverage(requested_refs=(), completed_refs=())",
                  "",
                  "",
                  "def test_mapping_coverage_rejects_empty_refs_without_partial() -> None:",
                  "    with pytest.raises(SecretContractError, match=\"empty requested_refs requires partial=true\"):",
                  "        _coverage(requested_refs=[], completed_refs=[])",
                  "",
                  "",
                  "def test_empty_ref_partial_coverage_cannot_claim_clean() -> None:",
                  "    coverage = _direct_coverage(requested_refs=(), completed_refs=(), partial=True)",
                  "    assert coverage.clean_eligible is False",
                  "    with pytest.raises(SecretContractError, match=\"cannot produce a clean\"):",
                  "        coverage.assert_outcome(PreventionOutcome.CLEAN)",
                  "",
                  "",
                  "def test_direct_complete_coverage_requires_every_requested_ref() -> None:",
                  "    with pytest.raises(SecretContractError, match=\"complete every requested ref\"):",
                  "        _direct_coverage(requested_refs=(\"main\", \"tag\"), completed_refs=(\"main\",))",
                  "",
                  "",
                  "def test_mapping_complete_coverage_requires_every_requested_ref() -> None:",
                  "    with pytest.raises(SecretContractError, match=\"complete every requested ref\"):",
                  "        _coverage(requested_refs=[\"main\", \"tag\"], completed_refs=[\"main\"])",
                  "",
                  "",
              ]
          )
          if anchor not in text:
              raise SystemExit("test anchor not found")
          tests.write_text(text.replace(anchor, addition + anchor, 1), encoding="utf-8")
          PY
      - name: Install dependencies
        shell: bash
        env:
          UV_HTTP_TIMEOUT: "120"
          UV_HTTP_RETRIES: "5"
        run: |
          set -euo pipefail
          if ! uv sync --frozen --extra dev --python 3.12; then
            sleep 10
            uv sync --frozen --extra dev --python 3.12
          fi
      - name: Validate and measure
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync ruff format src/codex_plugin_scanner/guard/secrets/contracts_v2.py tests/test_guard_secret_contracts_v2.py
          uv run --no-sync ruff check src/codex_plugin_scanner/guard/secrets/contracts_v2.py tests/test_guard_secret_contracts_v2.py
          uv run --no-sync pytest tests/test_guard_secret_contracts_v2.py tests/test_guard_secret_release_claim_gate.py tests/test_release_toolchain_sbom.py --tb=short
          uv run --no-sync python scripts/ci/test_inventory.py --output /tmp/test-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path("/tmp/test-inventory.json").read_text(encoding="utf-8"))
          baseline = {
              "maximum_collected_cases": value["inventory"]["collected_cases"],
              "maximum_test_source_lines": value["test_source_lines"],
              "schema_version": 1,
          }
          Path("ci/test-suite-ratchet-baseline.json").write_text(json.dumps(baseline, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(baseline, sort_keys=True))
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py --baseline ci/test-suite-ratchet-baseline.json --inventory /tmp/test-inventory.json
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/test-suite-ratchet-baseline.json src/codex_plugin_scanner/guard/secrets/contracts_v2.py tests/test_guard_secret_contracts_v2.py
          git commit -m "fix(secrets): reject empty complete reference coverage"
          git push origin HEAD:feat/secrets-v2-evidence-contracts-clean
