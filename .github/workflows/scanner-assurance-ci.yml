name: Scanner assurance

on:
  pull_request:
    branches: [release/3.0]
    paths:
      - "src/codex_plugin_scanner/**"
      - "rust/scanner-kernel/**"
      - "tests/assurance_corpus.py"
      - "tests/test_assurance_scanner.py"
      - "tests/test_evidence_envelope.py"
      - "tests/test_runtime_assurance.py"
      - "tests/test_rust_scanner_kernel_contract.py"
      - "scripts/ci/scanner_assurance_benchmark.py"
      - "fuzz/assurance_archive_fuzzer.py"
      - "docs/ai-plugin-scanner/assurance-layers.md"
      - ".github/workflows/scanner-assurance-ci.yml"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [release/3.0]
    paths:
      - "src/codex_plugin_scanner/**"
      - "rust/scanner-kernel/**"
      - "tests/assurance_corpus.py"
      - "tests/test_assurance_scanner.py"
      - "tests/test_evidence_envelope.py"
      - "tests/test_runtime_assurance.py"
      - "tests/test_rust_scanner_kernel_contract.py"
      - "scripts/ci/scanner_assurance_benchmark.py"
      - "fuzz/assurance_archive_fuzzer.py"
      - "docs/ai-plugin-scanner/assurance-layers.md"
      - ".github/workflows/scanner-assurance-ci.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanner-assurance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  assurance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          save-cache: false
      - name: Install locked Python environment
        run: uv sync --frozen --extra dev --python 3.12
      - name: Validate Rust formatting
        run: cargo fmt --manifest-path rust/scanner-kernel/Cargo.toml --check
      - name: Lint Rust kernel
        run: cargo clippy --locked --manifest-path rust/scanner-kernel/Cargo.toml --all-targets -- -D warnings
      - name: Test Rust kernel
        run: cargo test --locked --manifest-path rust/scanner-kernel/Cargo.toml
      - name: Build optimized Rust kernel
        run: cargo build --locked --release --manifest-path rust/scanner-kernel/Cargo.toml
      - name: Compile Python assurance modules
        run: >-
          uv run --no-sync python -m compileall -q
          src/codex_plugin_scanner/assurance.py
          src/codex_plugin_scanner/assurance_cli.py
          src/codex_plugin_scanner/evidence_envelope.py
          src/codex_plugin_scanner/runtime_assurance.py
          src/codex_plugin_scanner/rust_kernel.py
      - name: Run layered assurance tests
        env:
          HOL_GUARD_SCANNER_KERNEL: ${{ github.workspace }}/rust/scanner-kernel/target/release/hol-guard-scanner-kernel
        run: >-
          uv run --no-sync pytest
          tests/test_assurance_scanner.py
          tests/test_evidence_envelope.py
          tests/test_runtime_assurance.py
          tests/test_rust_scanner_kernel_contract.py
          --tb=short
      - name: Enforce scanner precision and recall floor
        env:
          HOL_GUARD_SCANNER_KERNEL: ${{ github.workspace }}/rust/scanner-kernel/target/release/hol-guard-scanner-kernel
        run: >-
          PYTHONPATH=.
          uv run --no-sync python scripts/ci/scanner_assurance_benchmark.py
          --output scanner-assurance-benchmark.json
      - name: Produce scanner self-inspection evidence
        env:
          HOL_GUARD_SCANNER_KERNEL: ${{ github.workspace }}/rust/scanner-kernel/target/release/hol-guard-scanner-kernel
        shell: bash
        run: |
          set +e
          uv run --no-sync python -m codex_plugin_scanner.assurance_cli scan . \
            --output scanner-assurance-self-evidence.json
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 1
          uv run --no-sync python -m json.tool scanner-assurance-self-evidence.json >/dev/null
      - name: Upload assurance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scanner-assurance-evidence
          path: |
            scanner-assurance-benchmark.json
            scanner-assurance-self-evidence.json
          if-no-files-found: error
          retention-days: 30
