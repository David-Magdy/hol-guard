name: Protection Center Batch 6 installed E2E locator fix
on:
  push:
    branches: [feat/protection-center-06-cloud-boundary-hardening]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Tighten Cloud continuity landmark assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('dashboard/e2e/installed-extension-control-center.spec.ts')
          text = path.read_text(encoding='utf-8')
          old = 'page.getByLabel("Cloud continuity")'
          new = 'page.getByRole("complementary", { name: "Cloud continuity" })'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 Cloud continuity locators, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          grep -F 'getByRole("complementary", { name: "Cloud continuity" })' dashboard/e2e/installed-extension-control-center.spec.ts
      - name: Commit verified locator fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/protection-center-batch6-e2e-locator-fix.yml
          git add dashboard/e2e/installed-extension-control-center.spec.ts .github/workflows/protection-center-batch6-e2e-locator-fix.yml
          git diff --cached --check
          git commit -m "test(protection-center): target Cloud continuity landmark"
          git push origin HEAD:feat/protection-center-06-cloud-boundary-hardening
