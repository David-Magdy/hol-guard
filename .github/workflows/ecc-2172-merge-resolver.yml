name: ECC 2172 merge resolver

on:
  push:
    branches:
      - chore/ecc-2172-resolve-2185

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FEATURE_BRANCH: feat/extension-control-center-01-details
      FEATURE_SHA: 1a4da57b3fb992ffaa6b986825f8d97b0362c1b3
      BASE_SHA: 8f41892b03db1b343fd751fcd0623101b25098e5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/extension-control-center-01-details
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Merge latest release base and resolve source overlaps
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FEATURE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BASE_SHA"
          set +e
          git merge --no-commit --no-ff "$BASE_SHA"
          merge_rc=$?
          set -e
          if [ "$merge_rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test -n "$conflicts"
            printf '%s\n' "$conflicts"
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                dashboard/src/extensions-workspace.tsx|dashboard/src/extensions-workspace.test.ts|src/codex_plugin_scanner/guard/daemon/static/*) ;;
                *) echo "Unexpected merge conflict: $path" >&2; exit 1 ;;
              esac
            done <<< "$conflicts"
            git checkout --ours -- dashboard/src/extensions-workspace.tsx dashboard/src/extensions-workspace.test.ts
            git checkout --ours -- src/codex_plugin_scanner/guard/daemon/static
            git add dashboard/src/extensions-workspace.tsx dashboard/src/extensions-workspace.test.ts src/codex_plugin_scanner/guard/daemon/static
          fi
          python - <<'PY'
          from pathlib import Path

          path = Path("dashboard/src/extensions-workspace.tsx")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one source anchor, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              'import { ApprovalProofModal } from "./approval-proof-modal";\nimport { ExtensionControlCenterDetail } from "./extension-control-center-detail";',
              'import { ApprovalProofModal } from "./approval-proof-modal";\nimport {\n  ApprovalProofFieldInputs,\n  buildApprovalProofCredentials,\n  isApprovalProofSubmitDisabled,\n} from "./approval-proof-inline";\nimport { ExtensionControlCenterDetail } from "./extension-control-center-detail";\nimport type { GuardApprovalGatePublicConfig } from "./guard-types";',
          )

          start = text.index("function ReviewModal(")
          end = text.index("\n\nexport function ExtensionsWorkspace()", start)
          review_modal = '''export function ReviewModal(props: {
            change: PendingChange;
            busy: boolean;
            error: string | null;
            approvalGate: GuardApprovalGatePublicConfig | null;
            onCancel: () => void;
            onConfirm: (credentials: { approval_password?: string; approval_totp_code?: string }) => void;
          }) {
            const [password, setPassword] = useState("");
            const [totp, setTotp] = useState("");
            const dialogRef = useModalDialog<HTMLFormElement>(props.onCancel, !props.busy);
            const handlePasswordChange = useCallback((event: React.ChangeEvent<HTMLInputElement>) => {
              setPassword(event.target.value);
            }, []);
            const handleTotpChange = useCallback((event: React.ChangeEvent<HTMLInputElement>) => {
              setTotp(event.target.value);
            }, []);
            const title = "globalLockdown" in props.change
              ? `${props.change.globalLockdown ? "Enable" : "Disable"} global lockdown`
              : `${props.change.enabled ? "Allow" : "Block"} ${props.change.extension.name} capability`;
            const current = "globalLockdown" in props.change
              ? props.change.globalLockdown ? "Open" : "Lockdown"
              : props.change.enabled ? "Blocked" : "Allowed";
            const requested = "globalLockdown" in props.change
              ? props.change.globalLockdown ? "Lockdown" : "Open"
              : props.change.enabled ? "Allowed" : "Blocked";
            const handleSubmit = useCallback((event: React.FormEvent) => {
              event.preventDefault();
              props.onConfirm(buildApprovalProofCredentials(props.approvalGate, {
                approvalPassword: password,
                approvalTotpCode: totp,
              }));
            }, [password, props, totp]);
            const submitDisabled = isApprovalProofSubmitDisabled(
              props.approvalGate,
              { approvalPassword: password, approvalTotpCode: totp },
              props.busy,
            );
            return <div className="fixed inset-0 z-50 grid place-items-center bg-slate-950/45 p-4 backdrop-blur-sm"><form ref={dialogRef} tabIndex={-1} role="dialog" aria-modal="true" aria-labelledby="extension-review-title" onSubmit={handleSubmit} className="w-full max-w-lg rounded-3xl bg-white p-6 shadow-2xl focus:outline-none"><div className="flex items-start justify-between gap-4"><div><p className="text-xs font-bold uppercase tracking-[0.18em] text-brand-blue">Review capability control</p><h2 id="extension-review-title" className="mt-2 text-xl font-semibold text-slate-950">{title}</h2></div><button type="button" disabled={props.busy} onClick={props.onCancel} aria-label="Close review" className="grid size-11 place-items-center rounded-full text-slate-500 hover:bg-slate-100 disabled:opacity-50"><HiMiniXMark className="size-5" /></button></div><div className="mt-5 grid grid-cols-[1fr_auto_1fr] items-center gap-3 rounded-2xl bg-slate-50 p-4 text-sm"><span className="text-slate-500">Current</span><span aria-hidden="true">→</span><strong className="text-slate-950">Requested</strong><span>{current}</span><span /><span>{requested}</span></div><p className="mt-4 text-sm text-slate-600">Blocking a capability makes Guard block matching actions. It does not turn detector coverage off.</p><div className="mt-5"><ApprovalProofFieldInputs approvalGate={props.approvalGate} approvalPassword={password} approvalTotpCode={totp} onApprovalPasswordChange={handlePasswordChange} onApprovalTotpCodeChange={handleTotpChange} /></div>{props.error ? <p role="alert" className="mt-4 rounded-xl border border-brand-attention/20 bg-brand-attention/[0.06] px-3 py-2 text-sm text-brand-attention">{props.error}</p> : null}<div className="mt-6 flex justify-end gap-3"><button type="button" disabled={props.busy} onClick={props.onCancel} className="min-h-11 rounded-xl px-4 text-sm font-semibold text-slate-600 hover:bg-slate-100 disabled:opacity-50">Cancel</button><button type="submit" disabled={submitDisabled} className="min-h-11 rounded-xl bg-brand-blue px-5 text-sm font-semibold text-white hover:bg-brand-dark disabled:opacity-60">{props.busy ? "Verifying…" : `Confirm ${requested.toLowerCase()}`}</button></div></form></div>;
          }'''
          text = text[:start] + review_modal + text[end:]

          start = text.index("  const requestBroadControl = useCallback(")
          end = text.index("\n\n  const confirm = useCallback", start)
          request_block = '''  const requestChange = useCallback((change: PendingChange) => {
            setMutationError(null);
            void resolveApprovalGate({ failClosed: true })
              .then(() => setPending(change))
              .catch(() => setMutationError("Guard could not load approval settings. Check the local connection and try again."));
          }, [resolveApprovalGate]);

          const requestBroadControl = useCallback((extension: ExtensionCatalogItem) => {
            if (state.kind !== "ready") return;
            requestChange({ extension, enabled: !isExtensionEnabled(state.effective, extension) });
          }, [requestChange, state]);'''
          text = text[:start] + request_block + text[end:]

          start = text.index("  const confirm = useCallback")
          end = text.index("\n\n  const recover = useCallback", start)
          confirm_block = '''  const confirm = useCallback(async (credentials: { approval_password?: string; approval_totp_code?: string }) => {
            if (state.kind !== "ready" || !pending) return;
            setBusy(true);
            setMutationError(null);
            try {
              const payload = buildExtensionMutation(state, pending);
              Object.assign(payload, credentials);
              payload.session_nonce = randomToken();
              const preview = await previewExtensionMutation(payload);
              if (typeof preview.proof_id !== "string") throw new Error("Guard did not issue a mutation proof");
              payload.proof_id = preview.proof_id;
              await applyExtensionMutation(payload);
              setPending(null);
              await load();
            } catch (error) {
              const recovery = error instanceof ExtensionControlApiError ? error.recoveryAction : undefined;
              setMutationError(`${error instanceof Error ? error.message : "Change failed"}${recovery ? ` · ${recovery}` : ""}`);
            } finally {
              setBusy(false);
            }
          }, [load, pending, state]);'''
          text = text[:start] + confirm_block + text[end:]

          marker = "if (!credentials && requiresExtensionRecoveryApproval(error)) {"
          marker_pos = text.index(marker)
          line_start = text.rfind("\n", 0, marker_pos) + 1
          indent = text[line_start:marker_pos]
          else_marker = f"{indent}}} else {{"
          else_pos = text.index(else_marker, marker_pos)
          old_recovery = text[line_start:else_pos + len(else_marker)]
          new_recovery = f'''{indent}if (!credentials && requiresExtensionRecoveryApproval(error)) {{
          {indent}  try {{
          {indent}    await resolveApprovalGate({{ failClosed: true }});
          {indent}    setRecoveryApprovalOpen(true);
          {indent}  }} catch {{
          {indent}    setRecoveryError("Guard could not load approval settings. Check the local connection and try again.");
          {indent}    setRecoveryStatus(null);
          {indent}  }}
          {indent}}} else {{'''
          text = text.replace(old_recovery, new_recovery, 1)

          replace_once(
              '  const acknowledgingDegraded = state.effective.health === "degraded-unacknowledged";',
              '  const mutationAlert = mutationError && pending === null ? <p role="alert" className="mt-4 rounded-xl border border-brand-attention/20 bg-brand-attention/[0.06] px-4 py-3 text-sm font-medium text-brand-attention">{mutationError}</p> : null;\n  const acknowledgingDegraded = state.effective.health === "degraded-unacknowledged";',
          )
          replace_once(
              '<div className="mx-auto w-full max-w-7xl px-4 pt-6 sm:px-6 lg:px-8">{recoveryBanner}</div><ExtensionControlCenterDetail',
              '<div className="mx-auto w-full max-w-7xl px-4 pt-6 sm:px-6 lg:px-8">{recoveryBanner}{mutationAlert}</div><ExtensionControlCenterDetail',
          )
          replace_once(
              '<div className="mt-6">{recoveryBanner}</div>\n    {state.effective.global_lockdown',
              '<div className="mt-6">{recoveryBanner}</div>\n    {mutationAlert}\n    {state.effective.global_lockdown',
          )
          replace_once(
              'onClick={() => setPending({ globalLockdown: !state.effective.global_lockdown })}',
              'onClick={() => requestChange({ globalLockdown: !state.effective.global_lockdown })}',
          )
          replace_once(
              'onChange={(change) => { setMutationError(null); setPending(change); }}',
              'onChange={requestChange}',
          )
          old_modal = '<ReviewModal change={pending} busy={busy} error={mutationError} onCancel={() => { if (!busy) setPending(null); }} onConfirm={confirm} />'
          if text.count(old_modal) != 2:
              raise SystemExit(f"expected two review modal call sites, found {text.count(old_modal)}")
          text = text.replace(
              old_modal,
              '<ReviewModal change={pending} busy={busy} error={mutationError} approvalGate={resolvedApprovalGate} onCancel={() => { if (!busy) setPending(null); }} onConfirm={confirm} />',
          )
          path.write_text(text, encoding="utf-8")

          test_path = Path("dashboard/src/extensions-workspace.test.ts")
          test = test_path.read_text(encoding="utf-8")

          def replace_test_once(old: str, new: str) -> None:
              nonlocal_test = test.count(old)
              if nonlocal_test != 1:
                  raise SystemExit(f"expected one test anchor, found {nonlocal_test}: {old[:100]!r}")
              return

          old = '  extensionRecoveryAction,\n  requiresExtensionRecoveryApproval,'
          if test.count(old) != 1:
              raise SystemExit("ReviewModal import anchor missing")
          test = test.replace(old, '  extensionRecoveryAction,\n  ReviewModal,\n  requiresExtensionRecoveryApproval,', 1)
          old = 'import { isExtensionEnabled } from "./extensions-filters";\n'
          if test.count(old) != 1:
              raise SystemExit("approval gate test import anchor missing")
          test = test.replace(old, old + 'import { fetchResolvedApprovalGate } from "./use-resolved-approval-gate";\n', 1)
          old = 'assert.doesNotMatch(totpRecoveryMarkup, /Approval password/);\n'
          if test.count(old) != 1:
              raise SystemExit("recovery markup assertion anchor missing")
          test = test.replace(
              old,
              old + 'assert.match(totpRecoveryMarkup, /That authenticator code was not accepted/);\nassert.match(totpRecoveryMarkup, /role="alert"/);\n\nconst resolvedTotpGate = await fetchResolvedApprovalGate(async () => ({\n  settings: { approval_gate: {\n    enabled: true, configured: true, cooldown_seconds: 0, cooldown_active: false,\n    cooldown_expires_at: null, locked_until: null, fail_closed: true,\n    strict_all_decisions: false, totp_enabled: true,\n  } },\n}));\nassert.equal(resolvedTotpGate?.totp_enabled, true);\nawait assert.rejects(fetchResolvedApprovalGate(async () => { throw new Error("settings unavailable"); }, { failClosed: true }), /settings unavailable/);\n',
              1,
          )
          anchor = 'assert.equal(extensionDetailHref("command.git"), "/extensions/command.git");'
          review_tests = '''const totpChangeMarkup = renderToStaticMarkup(createElement(ReviewModal, {
            change: { extension, enabled: true }, busy: false, error: null,
            approvalGate: { enabled: true, configured: true, cooldown_seconds: 0, cooldown_active: false, cooldown_expires_at: null, locked_until: null, fail_closed: true, strict_all_decisions: false, totp_enabled: true },
            onCancel: () => undefined, onConfirm: () => undefined,
          }));
          assert.match(totpChangeMarkup, /Authenticator code/);
          assert.doesNotMatch(totpChangeMarkup, /Approval password/);
          const passwordChangeMarkup = renderToStaticMarkup(createElement(ReviewModal, {
            change: { extension, enabled: true }, busy: false, error: null,
            approvalGate: { enabled: true, configured: true, cooldown_seconds: 0, cooldown_active: false, cooldown_expires_at: null, locked_until: null, fail_closed: true, strict_all_decisions: false, totp_enabled: false },
            onCancel: () => undefined, onConfirm: () => undefined,
          }));
          assert.match(passwordChangeMarkup, /Approval password/);
          assert.doesNotMatch(passwordChangeMarkup, /Authenticator code/);

          '''
          if test.count(anchor) != 1:
              raise SystemExit("test insertion anchor missing")
          test = test.replace(anchor, review_tests + anchor, 1)
          test_path.write_text(test, encoding="utf-8")
          PY
          git add dashboard/src/extensions-workspace.tsx dashboard/src/extensions-workspace.test.ts dashboard/src/use-resolved-approval-gate.ts
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Validate merged dashboard source and rebuild bundle
        run: |
          cd dashboard
          bun install --frozen-lockfile
          bun x tsx src/extensions-workspace.test.ts
          bun x tsx src/extension-controls-normalize.test.ts
          bun x tsx src/extension-control-center-model.test.ts
          bun x tsx src/app-routing.test.ts
          bun run build
      - name: Commit and fast-forward feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m "merge: reconcile release/3.0 into extension control center batch 1"
          parents="$(git show -s --format=%P HEAD)"
          test "$parents" = "$FEATURE_SHA $BASE_SHA"
          remote_head="$(git ls-remote origin "refs/heads/$FEATURE_BRANCH" | cut -f1)"
          test "$remote_head" = "$FEATURE_SHA"
          git push origin "HEAD:$FEATURE_BRANCH"
