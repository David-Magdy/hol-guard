name: Secrets complete hardening final v2 bootstrap

on:
  push:
    branches:
      - fix/secrets-complete-hardening-final-v2
    paths:
      - '.github/workflows/secrets-complete-hardening-final-v2-bootstrap.yml'
      - 'scripts/ci/integrate_guard_secrets_final_v2.py'

permissions:
  contents: write

concurrency:
  group: secrets-complete-hardening-final-v2-bootstrap
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/secrets-complete-hardening-final-v2
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false
      - name: Reconcile integration script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/ci/integrate_guard_secrets_final_v2.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '    if destination.stat().st_size == 0:\n        raise SystemExit(f"empty reviewed patch: {destination.name}")\n':
                  '    if destination.stat().st_size == 0:\n        return\n',
              'heredoc_body(git_safe_workflow, "guard/secrets/git_safe.py")':
                  'heredoc_body(git_safe_workflow, "git_safe.py")',
              '        "fix/secrets-coverage-edge-cases-v2",\n    )':
                  '        "fix/secrets-coverage-edge-cases-v2",\n        "fix/secrets-coverage-evidence-v2",\n    )',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'integration fragment not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Materialize reviewed implementation
        id: materialize
        shell: bash
        run: |
          set +e
          python scripts/ci/integrate_guard_secrets_final_v2.py > /tmp/secrets-materialize.log 2>&1
          status=$?
          cat /tmp/secrets-materialize.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist materialization diagnostics
        if: steps.materialize.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/guard/evidence
          {
            echo '# Secrets hardening bootstrap failure'
            echo
            echo '```text'
            tail -n 2000 /tmp/secrets-materialize.log
            echo '```'
          } > docs/guard/evidence/secrets-hardening-bootstrap-failure.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/guard/evidence/secrets-hardening-bootstrap-failure.md
          git commit -m 'chore(secrets): capture bootstrap failure'
          git push origin HEAD:fix/secrets-complete-hardening-final-v2
          exit 1
      - name: Install locked development environment
        run: uv sync --frozen --extra dev --python 3.12
      - name: Format lint type-check and test all Secrets surfaces
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' source_paths < <(find src/codex_plugin_scanner/guard/secrets -type f -name '*.py' -print0 | sort -z)
          mapfile -d '' test_paths < <(find tests -maxdepth 1 -type f \( -name '*secret*.py' -o -name '*secrets*.py' \) -print0 | sort -z)
          extra_paths=(
            scripts/ci/guard_secrets_release_claim_gate.py
            scripts/ci/run_guard_secrets_platform_smoke_v2.py
            scripts/ci/run_guard_secrets_pipx_smoke.py
          )
          test "${#source_paths[@]}" -gt 0
          test "${#test_paths[@]}" -gt 0
          uv run --no-sync python -m ruff format "${source_paths[@]}" "${extra_paths[@]}" "${test_paths[@]}"
          uv run --no-sync python -m ruff check --fix "${source_paths[@]}" "${extra_paths[@]}" "${test_paths[@]}"
          uv run --no-sync python -m ruff format "${source_paths[@]}" "${extra_paths[@]}" "${test_paths[@]}"
          uv run --no-sync python -m ruff check "${source_paths[@]}" "${extra_paths[@]}" "${test_paths[@]}"
          uv run --no-sync basedpyright --level error "${source_paths[@]}" "${extra_paths[@]}" "${test_paths[@]}"
          PYTHONPATH=src uv run --no-sync pytest -q "${test_paths[@]}" --tb=short
      - name: Advance and enforce test-suite ratchet
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/ci/generate_test_inventory.py --output /tmp/secret-inventory.json
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path
          inventory = json.loads(Path('/tmp/secret-inventory.json').read_text(encoding='utf-8'))
          path = Path('ci/test-suite-ratchet-baseline.json')
          baseline = json.loads(path.read_text(encoding='utf-8'))
          baseline['maximum_collected_cases'] = inventory['inventory']['collected_cases']
          baseline['maximum_test_source_lines'] = inventory['test_source_lines']
          path.write_text(json.dumps(baseline, indent=2) + '\n', encoding='utf-8')
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py --baseline ci/test-suite-ratchet-baseline.json --inventory /tmp/secret-inventory.json
      - name: Build exact wheel and run isolated lifecycles
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          uv build --wheel --out-dir dist
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv run --no-sync python scripts/ci/run_guard_secrets_platform_smoke_v2.py --wheel "$wheel"
          uv run --no-sync python scripts/ci/run_guard_secrets_pipx_smoke.py --wheel "$wheel"
          git diff --check
      - name: Commit permanent implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f docs/guard/evidence/secrets-hardening-bootstrap-failure.md
          git add -A
          git reset .github/workflows/secrets-complete-hardening-final-v2-bootstrap.yml scripts/ci/integrate_guard_secrets_final_v2.py
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix(secrets): complete platform Git and hook hardening'
          git push origin HEAD:fix/secrets-complete-hardening-final-v2
