name: Guard Secrets format bootstrap

on:
  push:
    branches:
      - fix/secrets-ignore-indirect-code-references

permissions:
  contents: write

concurrency:
  group: guard-secrets-format-bootstrap
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/secrets-ignore-indirect-code-references
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'

      - name: Format and verify the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/guard/secrets/secret_detection.py \
            tests/test_guard_secret_assignment_precision.py
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/secrets/secret_detection.py \
            tests/test_guard_secret_assignment_precision.py
          uv run --no-sync python -m ruff format --check \
            src/codex_plugin_scanner/guard/secrets/secret_detection.py \
            tests/test_guard_secret_assignment_precision.py
          uv run --no-sync pytest -q \
            tests/test_guard_secret_assignment_precision.py \
            tests/test_guard_secret_detection.py \
            --tb=short
          git diff --check

      - name: Commit formatted source and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/guard-secrets-format-bootstrap.yml
          git add \
            src/codex_plugin_scanner/guard/secrets/secret_detection.py \
            tests/test_guard_secret_assignment_precision.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style(secrets): apply repository formatter'
          git push origin HEAD:fix/secrets-ignore-indirect-code-references
