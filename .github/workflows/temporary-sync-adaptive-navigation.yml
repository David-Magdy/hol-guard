name: Temporary sync adaptive navigation branch

on:
  push:
    branches:
      - fix/adaptive-shell-navigation

permissions:
  contents: write

jobs:
  sync-and-clean:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/adaptive-shell-navigation
          fetch-depth: 50
          fetch-tags: false

      - name: Merge current release branch and remove validation artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin release/3.0:refs/remotes/origin/release/3.0 --depth=50
          git merge --no-edit origin/release/3.0
          git rm .github/workflows/temporary-sync-adaptive-navigation.yml
          git rm --ignore-unmatch dashboard/e2e/proofs/playwright-output/.last-run.json
          git commit -m "chore(dashboard): clean adaptive navigation validation artifacts"
          git push origin HEAD:fix/adaptive-shell-navigation
