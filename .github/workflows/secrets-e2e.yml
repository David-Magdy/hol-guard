name: Guard Secrets end-to-end

on:
  pull_request:
    branches:
      - release/3.0
    paths:
      - 'src/codex_plugin_scanner/guard/secrets/**'
      - 'scripts/ci/guard_secrets_installed_e2e.py'
      - 'tests/test_guard_secret_*.py'
      - '.github/workflows/secrets-e2e.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  push:
    branches:
      - release/3.0
    paths:
      - 'src/codex_plugin_scanner/guard/secrets/**'
      - 'scripts/ci/guard_secrets_installed_e2e.py'
      - 'tests/test_guard_secret_*.py'
      - '.github/workflows/secrets-e2e.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-secrets-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-wheel:
    name: installed wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2022
        python:
          - '3.12'
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false

      - name: Install test dependencies
        shell: bash
        run: uv sync --frozen --extra dev --python '${{ matrix.python }}'

      - name: Run permanent Secrets regressions
        shell: bash
        run: >-
          uv run --no-sync pytest -q
          tests/test_guard_secret_doctor.py
          tests/test_guard_secret_detection.py
          tests/test_guard_secret_assignment_precision.py
          tests/test_guard_secret_fixture_precision.py
          --tb=short

      - name: Build the exact wheel
        shell: bash
        run: uv build --wheel --out-dir dist

      - name: Install into a fresh isolated environment
        shell: bash
        run: |
          python -m venv .secrets-e2e
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          root = Path.cwd()
          python = root / '.secrets-e2e' / ('Scripts/python.exe' if sys.platform == 'win32' else 'bin/python')
          wheels = sorted((root / 'dist').glob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit(f'expected one wheel, found {len(wheels)}')
          subprocess.check_call([str(python), '-m', 'pip', 'install', '--no-deps', str(wheels[0])])
          subprocess.check_call([str(python), 'scripts/ci/guard_secrets_installed_e2e.py'])
          PY

      - name: Verify the checkout contains no assembled provider fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          token = ''.join((
              'gh', 'p_', 'Ab3d', 'Ef5h', 'Ij7l', 'Mn9p',
              'Qr2t', 'Uv4x', 'Yz6B', 'cd8F', 'gh1J', 'kl3N',
          )).encode()
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.secrets-e2e' in path.parts:
                  continue
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              if token in data:
                  raise SystemExit(f'assembled synthetic credential persisted in {path}')
          PY
