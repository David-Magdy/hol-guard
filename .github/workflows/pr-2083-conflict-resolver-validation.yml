name: PR 2083 current-head integration validation

on:
  push:
    branches:
      - chore/pr-2083-conflict-resolver-executor

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VALIDATED_BASE: 9b8a56644053dd9985ec0dc1c1f3b54e25564ad6
      RELEASE_HEAD: 7143b6f9de63f77d3f0a4adf943709a096f2637c
      MAIN_HEAD: a626ec004957ab3c827f18e98edcfff4ab6beed3
      EXPECTED_UPDATER_BLOB: 78595a1f58198f655a682e54ac2b7f7b9b89f33f
      EXPECTED_STORE_BLOB: 1d31847427e53f47db3d6b344bef07b756fc9e66
    steps:
      - name: Check out resolver branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Integrate exact current heads
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach "$VALIDATED_BASE"
          git merge --no-ff --no-edit "$RELEASE_HEAD"
          git merge --no-ff --no-edit "$MAIN_HEAD"
          git merge-base --is-ancestor "$VALIDATED_BASE" HEAD
          git merge-base --is-ancestor "$RELEASE_HEAD" HEAD
          git merge-base --is-ancestor "$MAIN_HEAD" HEAD
          test "$(git hash-object src/codex_plugin_scanner/guard/cli/update_commands.py)" = "$EXPECTED_UPDATER_BLOB"
          test "$(git hash-object src/codex_plugin_scanner/guard/store.py)" = "$EXPECTED_STORE_BLOB"
          test -z "$(git status --porcelain)"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Install frozen Python dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Validate Python conflict surfaces
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m py_compile \
            src/codex_plugin_scanner/guard/cli/update_commands.py \
            src/codex_plugin_scanner/guard/store.py \
            src/codex_plugin_scanner/guard/runtime/direct_typescript_diagnostics.py
          uv run --no-sync python -m ruff format --check \
            src/codex_plugin_scanner/guard/cli/update_commands.py \
            src/codex_plugin_scanner/guard/store.py \
            src/codex_plugin_scanner/guard/runtime/direct_typescript_diagnostics.py \
            tests/test_guard_direct_typescript_diagnostic_filter.py
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/cli/update_commands.py \
            src/codex_plugin_scanner/guard/store.py \
            src/codex_plugin_scanner/guard/runtime/direct_typescript_diagnostics.py \
            tests/test_guard_direct_typescript_diagnostic_filter.py
          git diff --check

      - name: Run focused Python regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync pytest -q \
            tests/test_guard_phase03_local_install.py::test_update_blocks_protected_authority_downgrade_before_installer_execution \
            tests/test_update_pi_family_repair.py \
            tests/test_guard_cli.py::TestGuardCli::test_guard_update_runs_pip_upgrade_in_current_environment \
            tests/test_guard_cli.py::TestGuardCli::test_guard_update_uses_pipx_when_running_from_pipx \
            tests/test_guard_cli.py::TestGuardCli::test_guard_update_marks_already_current_pipx_runs_as_current \
            tests/test_guard_project_identity.py \
            tests/test_guard_project_identity_ipv6.py \
            tests/test_guard_project_identity_precedence.py \
            tests/test_guard_project_identity_symlink.py \
            tests/test_guard_direct_typescript_diagnostic_filter.py \
            --tb=short
          uv run --no-sync pytest -q tests/test_guard_phase03_remainder.py -k success_status --tb=short
          uv run --no-sync pytest -q tests/test_guard_update_pipx_recovery.py --tb=short

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.14

      - name: Validate dashboard
        working-directory: dashboard
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run test
          bun run build

      - name: Push validated integration branch
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git push --force-with-lease origin HEAD:refs/heads/chore/pr-2083-current-final-validation
