name: PR 2083 conflict resolver validation

on:
  push:
    branches:
      - chore/pr-2083-conflict-resolver-executor

permissions:
  contents: write

jobs:
  resolve-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out resolver branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Capture exact patch and switch to pinned integration
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .github/pr-2083-updater.patch
          test "$(sha256sum .github/pr-2083-updater.patch | awk '{print $1}')" = "1a7684b409b08c528b4b0c24ca9bbc1e98e5b207b5240b137ae89aa1daae0d76"
          cp .github/pr-2083-updater.patch /tmp/pr2083.patch
          git checkout --detach caf3842feb562acfe420e5005f12d3d4f7b2ac13
          test "$(git rev-parse HEAD)" = "caf3842feb562acfe420e5005f12d3d4f7b2ac13"
          test "$(git hash-object src/codex_plugin_scanner/guard/cli/update_commands.py)" = "bea35e41c7b3109f12e2c88c86eaac5802a34b81"
          test "$(git hash-object src/codex_plugin_scanner/guard/store.py)" = "1d31847427e53f47db3d6b344bef07b756fc9e66"
          git apply --check /tmp/pr2083.patch
          git apply /tmp/pr2083.patch
          test "$(git diff --name-only)" = "src/codex_plugin_scanner/guard/cli/update_commands.py"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Install frozen dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Validate resolved contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m py_compile \
            src/codex_plugin_scanner/guard/cli/update_commands.py \
            src/codex_plugin_scanner/guard/store.py
          uv run --no-sync python -m ruff format --check \
            src/codex_plugin_scanner/guard/cli/update_commands.py \
            src/codex_plugin_scanner/guard/store.py
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/cli/update_commands.py \
            src/codex_plugin_scanner/guard/store.py
          git diff --check

      - name: Run focused updater and store regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync pytest -q \
            tests/test_guard_phase03_local_install.py::test_update_blocks_protected_authority_downgrade_before_installer_execution \
            tests/test_update_pi_family_repair.py \
            tests/test_guard_cli.py::TestGuardCli::test_guard_update_runs_pip_upgrade_in_current_environment \
            tests/test_guard_cli.py::TestGuardCli::test_guard_update_uses_pipx_when_running_from_pipx \
            tests/test_guard_cli.py::TestGuardCli::test_guard_update_marks_already_current_pipx_runs_as_current \
            tests/test_guard_project_identity.py \
            tests/test_guard_project_identity_ipv6.py \
            tests/test_guard_project_identity_precedence.py \
            tests/test_guard_project_identity_symlink.py \
            --tb=short
          uv run --no-sync pytest -q tests/test_guard_phase03_remainder.py -k success_status --tb=short
          uv run --no-sync pytest -q tests/test_guard_update_pipx_recovery.py --tb=short

      - name: Create clean validation commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "src/codex_plugin_scanner/guard/cli/update_commands.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/codex_plugin_scanner/guard/cli/update_commands.py
          git commit -m "fix(release): preserve current updater contracts"
          git push origin HEAD:refs/heads/chore/pr-2083-final-validation
