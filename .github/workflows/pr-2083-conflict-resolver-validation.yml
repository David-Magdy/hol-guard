name: PR 2083 conflict resolver validation

on:
  push:
    branches:
      - chore/pr-2083-conflict-resolver-executor

permissions:
  contents: write

jobs:
  resolve-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out pinned integration commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: caf3842feb562acfe420e5005f12d3d4f7b2ac13
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Apply exact conflict-resolution patch
        shell: bash
        env:
          PATCH_B64: 