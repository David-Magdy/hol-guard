name: PR 2083 dashboard diagnosis

on:
  push:
    branches:
      - chore/pr-2083-conflict-resolver-executor

permissions:
  contents: read

jobs:
  diagnose-dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VALIDATED_BASE: 9b8a56644053dd9985ec0dc1c1f3b54e25564ad6
      RELEASE_HEAD: 7143b6f9de63f77d3f0a4adf943709a096f2637c
      MAIN_HEAD: a626ec004957ab3c827f18e98edcfff4ab6beed3
      MERGED_CASES: "14037"
      MERGED_TEST_LINES: "310514"
    steps:
      - name: Check out full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Recreate exact resolved tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach "$VALIDATED_BASE"
          git merge --no-ff --no-edit "$RELEASE_HEAD"
          set +e
          git merge --no-ff --no-edit "$MAIN_HEAD"
          RC=$?
          set -e
          test "$RC" -ne 0
          test "$(git diff --name-only --diff-filter=U)" = "ci/test-suite-ratchet-baseline.json"
          git checkout --ours ci/test-suite-ratchet-baseline.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path("ci/test-suite-ratchet-baseline.json")
          d = json.loads(p.read_text())
          d["maximum_collected_cases"] = int(os.environ["MERGED_CASES"])
          d["maximum_test_source_lines"] = int(os.environ["MERGED_TEST_LINES"])
          p.write_text(json.dumps(d, indent=2) + "\n")
          PY
          git add ci/test-suite-ratchet-baseline.json
          git commit --no-edit

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.14

      - name: Diagnose dashboard
        working-directory: dashboard
        shell: bash
        run: |
          set +e
          bun install --frozen-lockfile >"$RUNNER_TEMP/bun-install.log" 2>&1
          echo "install_rc=$?" > "$RUNNER_TEMP/dashboard-report.txt"
          bun run test >"$RUNNER_TEMP/bun-test.log" 2>&1
          echo "test_rc=$?" >> "$RUNNER_TEMP/dashboard-report.txt"
          bun run build >"$RUNNER_TEMP/bun-build.log" 2>&1
          echo "build_rc=$?" >> "$RUNNER_TEMP/dashboard-report.txt"
          cat "$RUNNER_TEMP/dashboard-report.txt"
          exit 0

      - name: Upload dashboard logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr2083-dashboard-diagnosis
          path: |
            ${{ runner.temp }}/dashboard-report.txt
            ${{ runner.temp }}/bun-install.log
            ${{ runner.temp }}/bun-test.log
            ${{ runner.temp }}/bun-build.log
          if-no-files-found: error
          retention-days: 1
