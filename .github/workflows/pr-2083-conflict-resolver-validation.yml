name: PR 2083 evidence and ratchet diagnosis

on:
  push:
    branches:
      - chore/pr-2083-conflict-resolver-executor

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VALIDATED_BASE: 9b8a56644053dd9985ec0dc1c1f3b54e25564ad6
      RELEASE_HEAD: 7143b6f9de63f77d3f0a4adf943709a096f2637c
      MAIN_HEAD: a626ec004957ab3c827f18e98edcfff4ab6beed3
    steps:
      - name: Check out full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Recreate exact resolved tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach "$VALIDATED_BASE"
          git merge --no-ff --no-edit "$RELEASE_HEAD"
          set +e
          git merge --no-ff --no-edit "$MAIN_HEAD"
          RC=$?
          set -e
          test "$RC" -ne 0
          test "$(git diff --name-only --diff-filter=U)" = "ci/test-suite-ratchet-baseline.json"
          git checkout --ours ci/test-suite-ratchet-baseline.json
          git add ci/test-suite-ratchet-baseline.json
          git commit --no-edit

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Install frozen dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Diagnose evidence and ratchet
        shell: bash
        run: |
          set +e
          REPORT="$RUNNER_TEMP/pr2083-gate-report.txt"
          : > "$REPORT"
          PYTHONPATH=src:. uv run --no-sync python -m tests.guard_command_decision_diff --check >"$RUNNER_TEMP/decision-diff.log" 2>&1
          echo "decision_diff_rc=$?" >> "$REPORT"
          uv run --no-sync python scripts/ci/test_inventory.py --output "$RUNNER_TEMP/test-inventory.json" >"$RUNNER_TEMP/inventory.log" 2>&1
          echo "inventory_rc=$?" >> "$REPORT"
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory "$RUNNER_TEMP/test-inventory.json" >"$RUNNER_TEMP/ratchet.log" 2>&1
          echo "ratchet_rc=$?" >> "$REPORT"
          cp ci/test-suite-ratchet-baseline.json "$RUNNER_TEMP/current-baseline.json"
          cat "$REPORT"
          exit 0

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr2083-gate-diagnosis
          path: |
            ${{ runner.temp }}/pr2083-gate-report.txt
            ${{ runner.temp }}/test-inventory.json
            ${{ runner.temp }}/current-baseline.json
            ${{ runner.temp }}/decision-diff.log
            ${{ runner.temp }}/inventory.log
            ${{ runner.temp }}/ratchet.log
          if-no-files-found: error
          retention-days: 1
