name: Protection Center Modules label final
on:
  push:
    branches: [feat/protection-center-04-friendly-settings]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Finish Modules label and rebuild
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          p = Path('dashboard/src/protection-center/protection-module-detail.tsx')
          t = p.read_text(encoding='utf-8')
          old = '<HiMiniArrowLeft className="size-4" aria-hidden="true" />Protections</button>'
          new = '<HiMiniArrowLeft className="size-4" aria-hidden="true" />Modules</button>'
          if old not in t:
              raise SystemExit('module back-label marker missing')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY
          cd dashboard
          bun install --frozen-lockfile --ignore-scripts
          bun run test
          bun run build
          cd ..
          rm .github/workflows/protection-center-batch4-modules-label-final.yml
          git add dashboard/src/protection-center/protection-module-detail.tsx src/codex_plugin_scanner/guard/daemon/static .github/workflows/protection-center-batch4-modules-label-final.yml
          git diff --cached --check
          git commit -m "fix(protection-center): use Modules consistently"
          git push origin HEAD:feat/protection-center-04-friendly-settings