name: ECC route patch

on:
  push:
    branches:
      - feat/extension-control-center-01-details

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/extension-control-center-01-details
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Patch direct extension route and regression contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          server = Path('src/codex_plugin_scanner/guard/daemon/server.py')
          text = server.read_text(encoding='utf-8')
          old = '''        if path.startswith("/apps/"):\n            return True\n        return path.startswith("/approvals/") and not path.endswith("/decision")\n'''
          new = '''        if path.startswith("/apps/"):\n            return True\n        if path.startswith("/extensions/"):\n            return True\n        return path.startswith("/approvals/") and not path.endswith("/decision")\n'''
          if old not in text:
              raise SystemExit('dashboard route anchor not found')
          server.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_guard_product_model_contracts.py')
          text = test.read_text(encoding='utf-8')
          old = '''    for route in routes:\n        assert _GuardDaemonHandler._is_dashboard_route(route)\n'''
          new = '''    for route in routes:\n        assert _GuardDaemonHandler._is_dashboard_route(route)\n    assert _GuardDaemonHandler._is_dashboard_route("/extensions/command.git")\n'''
          if old not in text:
              raise SystemExit('route contract anchor not found')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')

          baseline = Path('ci/test-suite-ratchet-baseline.json')
          import json
          payload = json.loads(baseline.read_text(encoding='utf-8'))
          payload['maximum_test_source_lines'] += 1
          baseline.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Validate focused route contract
        run: |
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync pytest tests/test_guard_product_model_contracts.py tests/test_guard_extension_control_catalog_detail.py --tb=short
          uv run --no-sync python scripts/ci/test_inventory.py --output /tmp/test-inventory.json
          uv run --no-sync python scripts/ci/test_suite_ratchet.py --baseline ci/test-suite-ratchet-baseline.json --inventory /tmp/test-inventory.json
      - name: Commit route fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/codex_plugin_scanner/guard/daemon/server.py tests/test_guard_product_model_contracts.py ci/test-suite-ratchet-baseline.json
          git commit -m "fix(guard): serve canonical extension detail routes"
          git push origin HEAD:feat/extension-control-center-01-details
