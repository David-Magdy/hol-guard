name: Protection Center Batch 4 policy UX sync
on:
  push:
    branches: [feat/protection-center-04-policy-editor]
permissions:
  contents: write
concurrency:
  group: protection-center-batch4-policy-ux
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Apply reviewed Protection Center policy presentation
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          panel = Path("dashboard/src/extension-policy-panel.tsx")
          text = panel.read_text(encoding="utf-8")
          text = text.replace(
              '''  const choices: Array<{ value: PermissionDraftState; label: string; disabled?: boolean }> = [\n    { value: "inherit", label: "Inherit" },\n    { value: "allow", label: "Allow", disabled: managed === "disabled" },\n    { value: "block", label: "Block" },\n  ];''',
              '''  const choices: Array<{ value: PermissionDraftState; label: string; disabled?: boolean }> = [\n    { value: "inherit", label: "Use recommended" },\n    { value: "block", label: "Block matching actions" },\n    { value: "allow", label: "Allow when Guard would otherwise permit", disabled: managed === "disabled" },\n  ];''',
              1,
          )
          text = text.replace('aria-label={`${props.permission.label} local policy`}', 'aria-label={`${props.permission.label} protection setting`}', 1)
          old_row = '''<Pill tone={RISK_TONE[props.permission.risk_tier]}>{props.permission.risk_tier} baseline risk</Pill><Pill>{permissionStateLabel(props.effective, props.extension, props.permission)}</Pill>{!props.permission.configurable ? <Pill>Fixed</Pill> : null}{managed ? <Pill tone="border-indigo-200 bg-indigo-50 text-indigo-800">Managed {managed === "disabled" ? "block" : "allow"}</Pill> : null}</div><p className="mt-2 text-sm leading-6 text-slate-600">{props.permission.description}</p><div className="mt-3 flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-500"><span>Baseline floor: <strong className="text-slate-700">{treatmentLabel(props.permission.baseline_floor)}</strong></span><span>{props.permission.rule_ids.length} governed rule{props.permission.rule_ids.length === 1 ? "" : "s"}</span><span>Provenance: {provenance.join(" · ")}</span></div><code className="mt-2 block break-all text-[11px] text-slate-400">{props.permission.permission_id}</code>'''
          new_row = '''<Pill tone={RISK_TONE[props.permission.risk_tier]}>{props.permission.risk_tier} risk</Pill><Pill>{permissionStateLabel(props.effective, props.extension, props.permission)}</Pill>{!props.permission.configurable ? <Pill>Required safety</Pill> : null}{managed ? <Pill tone="border-indigo-200 bg-indigo-50 text-indigo-800">Organization managed</Pill> : null}</div><p className="mt-2 text-sm leading-6 text-slate-600">{props.permission.description}</p><details className="mt-3 rounded-xl bg-slate-50 p-3 text-xs text-slate-600"><summary className="cursor-pointer font-semibold text-slate-700">Technical setting details</summary><div className="mt-2 flex flex-wrap gap-x-4 gap-y-1"><span>Minimum protection: <strong className="text-slate-700">{treatmentLabel(props.permission.baseline_floor)}</strong></span><span>{props.permission.rule_ids.length} governed rule{props.permission.rule_ids.length === 1 ? "" : "s"}</span><span>Managed by: {provenance.join(" · ")}</span></div><code className="mt-2 block break-all text-[11px] text-slate-500">{props.permission.permission_id}</code></details>'''
          if old_row not in text:
              raise SystemExit("permission row technical block changed unexpectedly")
          text = text.replace(old_row, new_row, 1)
          text = text.replace('<strong>Why fixed:</strong>', '<strong>Why this cannot be changed:</strong>', 1)
          text = text.replace('Managed policy blocks this permission. Local policy may inherit or add a block, but it cannot weaken the managed block.', 'Your organization blocks this capability. You can keep the organization setting or add a local block, but this device cannot weaken it.', 1)
          text = text.replace('Server semantic preview', 'Protection review', 1)
          text = text.replace('Blast radius before apply', 'What will change', 1)
          text = text.replace('Newly blocked permissions', 'Newly blocked settings', 1)
          text = text.replace('Newly allowed permissions', 'Newly allowed settings', 1)
          text = text.replace('Effective changes', 'Settings changing', 1)
          text = text.replace('Affected rule IDs', 'Developer details', 1)
          text = text.replace('<p className="mt-4 break-all text-[11px] text-slate-400">Canonical diff: {props.preview.canonical_diff_digest}</p>', '<details className="mt-4"><summary className="cursor-pointer text-xs font-semibold text-slate-500">Developer change identity</summary><code className="mt-2 block break-all text-[11px] text-slate-500">{props.preview.canonical_diff_digest}</code></details>', 1)
          text = text.replace('Semantic review', 'Protection review', 1)
          text = text.replace('Review {count} permission change{count === 1 ? "" : "s"}', 'Review {count} protection setting change{count === 1 ? "" : "s"}', 1)
          text = text.replace('Apply {count} reviewed change{count === 1 ? "" : "s"}', 'Continue to approval', 1)
          marker = '''  const configurableCount = policyExtension.permissions.filter((permission) => permission.configurable).length;\n  const managedCount = policyExtension.permissions.filter((permission) => managedPermissionState(baseEffective, permission.permission_id) !== null).length;'''
          profile = '''  const applyProfile = useCallback((profile: "recommended" | "strict" | "balanced") => {\n    let next = cloneLayers(baseEffective);\n    for (const permission of policyExtension.permissions) {\n      if (!permission.configurable) continue;\n      const state: PermissionDraftState = profile === "recommended"\n        ? "inherit"\n        : profile === "strict"\n          ? "block"\n          : (permission.risk_tier === "critical" || permission.risk_tier === "high") ? "block" : "inherit";\n      next = setLocalPermissionDraftState(next, baseEffective.catalog_digest, permission.permission_id, state);\n    }\n    setDraftLayers(next);\n    setIdentity(newExtensionPolicyDraftIdentity());\n    setPreview(null); setReviewOpen(false); setError(null); setStale(false); setPendingRebase(null);\n  }, [baseEffective, policyExtension]);\n\n  const configurableCount = policyExtension.permissions.filter((permission) => permission.configurable).length;\n  const managedCount = policyExtension.permissions.filter((permission) => managedPermissionState(baseEffective, permission.permission_id) !== null).length;'''
          if marker not in text:
              raise SystemExit("policy counts marker changed unexpectedly")
          text = text.replace(marker, profile, 1)
          old_header = '''<p className="text-xs font-bold uppercase tracking-[0.18em] text-brand-blue">Local policy draft</p><h2 id="extension-policy-heading" className="mt-1 text-lg font-semibold text-slate-950">Permission controls</h2><p className="mt-2 max-w-3xl text-sm leading-6 text-slate-600">Choose Inherit, Allow, or Block for independently configurable capabilities. A blocked capability makes Guard block matching actions; it does not turn detection off. Detector severity and baseline floors never change.</p>'''
          new_header = '''<p className="text-xs font-bold uppercase tracking-[0.18em] text-brand-blue">This device</p><h2 id="extension-policy-heading" className="mt-1 text-lg font-semibold text-slate-950">Protection settings</h2><p className="mt-2 max-w-3xl text-sm leading-6 text-slate-600">Keep Guard's recommended behavior, make selected capabilities stricter, or allow a capability only where Guard's built-in minimum safety still permits it. Detection and minimum protection never turn off.</p>'''
          if old_header not in text:
              raise SystemExit("policy header changed unexpectedly")
          text = text.replace(old_header, new_header, 1)
          profiles_marker = '''</div></div>{baseEffective.global_lockdown ?'''
          profiles_ui = '''</div></div><div className="mt-5"><div className="text-xs font-semibold uppercase tracking-wide text-slate-500">Quick profiles</div><div className="mt-2 flex flex-wrap gap-2"><button type="button" disabled={baseEffective.health !== "protected"} onClick={() => applyProfile("recommended")} className="min-h-10 rounded-xl border border-slate-300 bg-white px-3 text-xs font-semibold text-slate-700 disabled:opacity-40">Recommended</button><button type="button" disabled={baseEffective.health !== "protected"} onClick={() => applyProfile("balanced")} className="min-h-10 rounded-xl border border-slate-300 bg-white px-3 text-xs font-semibold text-slate-700 disabled:opacity-40">Balanced</button><button type="button" disabled={baseEffective.health !== "protected"} onClick={() => applyProfile("strict")} className="min-h-10 rounded-xl border border-slate-300 bg-white px-3 text-xs font-semibold text-slate-700 disabled:opacity-40">Strict local</button></div><p className="mt-2 text-xs leading-5 text-slate-500">Profiles only prepare a local draft. You still review exactly what changes and authenticate before anything is applied.</p></div>{baseEffective.global_lockdown ?'''
          if profiles_marker not in text:
              raise SystemExit("profiles insertion marker changed unexpectedly")
          text = text.replace(profiles_marker, profiles_ui, 1)
          text = text.replace('Global lockdown remains dominant.', 'Emergency Lockdown remains dominant.', 1)
          text = text.replace('Permission editing is disabled until extension-control authority is protected.', 'Settings cannot be changed until Guard verifies local settings integrity.', 1)
          text = text.replace('permission{managedCount === 1 ? " is" : "s are"} governed by signed organization policy. Local policy cannot weaken a managed block. Managed exception requests must be made through the organization policy workflow.', 'setting{managedCount === 1 ? " is" : "s are"} managed by your organization. This device can add stricter blocks but cannot weaken an organization block.', 1)
          text = text.replace('staged permission change', 'unsaved setting change', 1)
          text = text.replace('staged permission changes', 'unsaved setting changes', 1)
          text = text.replace('Discard draft', 'Reset changes', 1)
          text = text.replace('Rebase draft onto current policy', 'Update draft with latest protection', 1)
          text = text.replace('Keep my remaining draft changes', 'Keep my compatible changes', 1)
          text = text.replace('Use current policy', 'Use current protection', 1)
          text = text.replace('Review is required before apply. Guard calculates effective blast radius server-side from the canonical registry, dependencies, managed policy, and global lockdown.', 'Review is required before approval. Guard calculates the real outcome from current protections, dependencies, organization settings, and Emergency Lockdown before anything can change.', 1)
          text = text.replace('Apply ${confirmationCount} extension permission change', 'Apply ${confirmationCount} protection setting change', 1)
          text = text.replace('Authenticate this exact reviewed draft. Guard issues a one-use proof bound to the canonical mutation digest.', 'Authenticate the exact settings you just reviewed. Guard uses a one-time local proof and rejects the apply if the reviewed settings changed.', 1)
          panel.write_text("\n".join(line.rstrip() for line in text.splitlines()) + "\n", encoding="utf-8")

          detail = Path("dashboard/src/protection-center/protection-module-detail.tsx")
          text = detail.read_text(encoding="utf-8")
          text = text.replace('import { useMemo } from "react";', 'import { useMemo, useState } from "react";', 1)
          import_marker = 'import { commandReasonLabel } from "../command-activity/command-activity-presenters";\n'
          if 'ExtensionPolicyPanel' not in text:
              text = text.replace(import_marker, import_marker + 'import { ExtensionPolicyPanel } from "../extension-policy-panel";\n', 1)
          text = text.replace('const canChange = props.effective.health === "protected" && !props.extension.required && source !== "organization";', 'const canChange = props.effective.health === "protected" && configurable.length > 0;', 1)
          text = text.replace('>Change protection</button>', '>Change settings</button>', 1)
          text = text.replace('  onChange?: () => void;\n}) {\n  const [density, setDensity] = useProtectionDensity();', '  onRefresh: () => Promise<void> | void;\n}) {\n  const [density, setDensity] = useProtectionDensity();\n  const [editing, setEditing] = useState(false);\n  const [policyDirty, setPolicyDirty] = useState(false);', 1)
          text = text.replace('  const state = extensionEffectiveState(props.effective, props.extension);\n  return <main', '  const state = extensionEffectiveState(props.effective, props.extension);\n  const handleBack = () => {\n    if (policyDirty && !window.confirm("Discard your unreviewed protection setting changes?")) return;\n    props.onBack();\n  };\n  return <main', 1)
          text = text.replace('onClick={props.onBack}', 'onClick={handleBack}', 1)
          text = text.replace('<SimpleSettingsSummary extension={props.extension} effective={props.effective} onChange={props.onChange} />', '<SimpleSettingsSummary extension={props.extension} effective={props.effective} onChange={() => setEditing(true)} />', 1)
          insertion = '''</div><div className="mt-5"><WhyThisHappened'''
          editor = '''</div>{editing ? <div className="mt-5"><ExtensionPolicyPanel extension={props.extension} effective={props.effective} catalogDigest={props.catalogDigest} onRefresh={props.onRefresh} onDirtyChange={setPolicyDirty} /></div> : null}<div className="mt-5"><WhyThisHappened'''
          if insertion not in text:
              raise SystemExit("module detail editor insertion marker changed unexpectedly")
          text = text.replace(insertion, editor, 1)
          detail.write_text("\n".join(line.rstrip() for line in text.splitlines()) + "\n", encoding="utf-8")

          workspace = Path("dashboard/src/protection-center/protection-center-workspace.tsx")
          text = workspace.read_text(encoding="utf-8")
          text = text.replace('''      onBack={closeExtension}\n      onChange={() => requestChange({ extension: selectedExtension, enabled: !isExtensionEnabled(state.effective, selectedExtension) })}\n    />''', '''      onBack={closeExtension}\n      onRefresh={load}\n    />''', 1)
          workspace.write_text("\n".join(line.rstrip() for line in text.splitlines()) + "\n", encoding="utf-8")

          test = Path("dashboard/src/protection-center/protection-module-detail.test.tsx")
          text = test.read_text(encoding="utf-8")
          text = text.replace('onChange: () => undefined,', 'onRefresh: () => undefined,')
          text = text.replace('onBack: () => undefined,\n}', 'onBack: () => undefined,\n  onRefresh: () => undefined,\n}')
          text = text.replace('/Change protection/', '/Change settings/')
          text = text.replace('/>Change protection</', '/>Change settings</')
          # Managed modules can still add stricter local blocks when capabilities are configurable.
          text = text.replace('assert.doesNotMatch(managed, />Change settings</);', 'assert.match(managed, /Change settings/);')
          test.write_text(text, encoding="utf-8")

          copy_test = Path("dashboard/src/extension-policy-panel.copy.test.tsx")
          copy_test.write_text('''import assert from "node:assert/strict";\nimport { createElement } from "react";\nimport { renderToStaticMarkup } from "react-dom/server";\n\nimport { ExtensionPolicyPanel } from "./extension-policy-panel";\nimport { PROTECTION_AUTHORITY_FIXTURES, protectionModuleFixture } from "./protection-center/fixtures/protection-fixtures";\n\nconst extension = protectionModuleFixture({ extension_id: "command.git", name: "Git" });\nconst markup = renderToStaticMarkup(createElement(ExtensionPolicyPanel, {\n  extension,\n  effective: PROTECTION_AUTHORITY_FIXTURES.protected,\n  catalogDigest: "a".repeat(64),\n  onRefresh: () => undefined,\n}));\nassert.match(markup, /Protection settings/);\nassert.match(markup, /Use recommended/);\nassert.match(markup, /Block matching actions/);\nassert.match(markup, /Allow when Guard would otherwise permit/);\nassert.match(markup, /Recommended/);\nassert.match(markup, /Balanced/);\nassert.match(markup, /Strict local/);\nassert.doesNotMatch(markup, /Blast radius before apply|Server semantic preview|Permission controls|Local policy draft/);\nconsole.log("extension-policy-panel.copy.test.tsx: all assertions passed");\n''', encoding="utf-8")

          package = Path("dashboard/package.json")
          data = json.loads(package.read_text(encoding="utf-8"))
          command = "tsx src/extension-policy-panel.copy.test.tsx"
          parts = [part.strip() for part in data["scripts"]["test"].split("&&")]
          if command not in parts:
              parts.insert(4 if len(parts) >= 4 else len(parts), command)
          data["scripts"]["test"] = " && ".join(parts)
          package.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Verify policy editor and build dashboard
        shell: bash
        run: |
          set -euo pipefail
          cd dashboard
          bun install --frozen-lockfile --ignore-scripts
          bun run test
          bun run build
      - name: Commit deterministic output and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm .github/workflows/protection-center-policy-ux-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/package.json dashboard/src/extension-policy-panel.tsx dashboard/src/extension-policy-panel.copy.test.tsx dashboard/src/protection-center/protection-module-detail.tsx dashboard/src/protection-center/protection-module-detail.test.tsx dashboard/src/protection-center/protection-center-workspace.tsx src/codex_plugin_scanner/guard/daemon/static .github/workflows/protection-center-policy-ux-sync.yml
          git diff --cached --check
          git commit -m "feat(protection-center): simplify secure policy editing"
          git push origin HEAD:feat/protection-center-04-policy-editor
