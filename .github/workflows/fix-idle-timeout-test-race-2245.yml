name: Fix idle-timeout lifecycle test race

on:
  push:
    branches: [feat/rust-runtime-native-publish]
    paths:
      - ".github/workflows/fix-idle-timeout-test-race-2245.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: feat/rust-runtime-native-publish
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Isolate idle shutdown from independent worker backfill
        env:
          OLD_METHOD_B64: ""
          NEW_METHOD_B64: ""
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("tests/test_guard_surface_server.py")
          text = path.read_text(encoding="utf-8")
          old = base64.b64decode(os.environ["OLD_METHOD_B64"]).decode("utf-8")
          new = base64.b64decode(os.environ["NEW_METHOD_B64"]).decode("utf-8")
          if text.count(old) != 1:
              raise RuntimeError("Expected exactly one idle-timeout lifecycle test")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          uv run --no-sync python -m ruff format tests/test_guard_surface_server.py
          uv run --no-sync python -m ruff check tests/test_guard_surface_server.py
      - name: Stress the isolated idle-shutdown contract
        run: |
          set -euo pipefail
          for attempt in $(seq 1 16); do
            echo "idle shutdown attempt ${attempt}"
            uv run --no-sync pytest -q \
              tests/test_guard_surface_server.py::TestGuardSurfaceServer::test_guard_daemon_background_start_auto_stops_after_idle_timeout
          done
      - name: Stress the active-stream liveness contract
        run: |
          set -euo pipefail
          for attempt in $(seq 1 8); do
            echo "active stream attempt ${attempt}"
            uv run --no-sync pytest -q \
              tests/test_guard_surface_server.py::TestGuardSurfaceServer::test_guard_daemon_keeps_stream_clients_alive_past_idle_timeout
          done
      - name: Verify blocked AIBOM containment remains fail-closed
        run: |
          set -euo pipefail
          uv run --no-sync pytest -q \
            tests/test_guard_supply_chain_daemon.py::test_daemon_retains_blocked_aibom_refresh_thread_during_shutdown
      - name: Verify test-suite ratchet remains within the accepted ceiling
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/ci/test_inventory.py --output "$RUNNER_TEMP/inventory.json"
          uv run --no-sync python - "$RUNNER_TEMP/inventory.json" <<'PY'
          import json
          import pathlib
          import sys

          observed = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          baseline = json.loads(pathlib.Path("ci/test-suite-ratchet-baseline.json").read_text(encoding="utf-8"))
          collected = observed["inventory"]["collected_cases"]
          lines = observed["test_source_lines"]
          if collected > baseline["maximum_collected_cases"]:
              raise SystemExit(f"collected-case ceiling exceeded: {collected} > {baseline['maximum_collected_cases']}")
          if lines > baseline["maximum_test_source_lines"]:
              raise SystemExit(f"test-line ceiling exceeded: {lines} > {baseline['maximum_test_source_lines']}")
          print(f"ratchet ok: collected={collected} lines={lines}")
          PY
      - name: Commit verified test isolation and remove helper
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-idle-timeout-test-race-2245.yml
          git add tests/test_guard_surface_server.py
          git diff --cached --check
          branch=feat/rust-runtime-native-publish
          remote_sha=$(git ls-remote --exit-code origin "refs/heads/${branch}" | awk '{print $1}')
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "Release candidate moved while applying the lifecycle test fix" >&2
            exit 1
          fi
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git commit --signoff -m "test(guard): isolate idle shutdown from worker backfill"
          git push origin "HEAD:refs/heads/${branch}"
