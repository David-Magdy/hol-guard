name: Finalize native publication release candidate

on:
  push:
    branches: [feat/rust-runtime-native-publish]
    paths:
      - ".github/workflows/fix-idle-timeout-test-race-2245.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: feat/rust-runtime-native-publish
      - name: Merge the current release train without hiding conflicts
        id: merge_base
        shell: bash
        run: |
          set -euo pipefail
          branch=feat/rust-runtime-native-publish
          remote_feature=$(git ls-remote --exit-code origin "refs/heads/${branch}" | awk '{print $1}')
          if [[ "$remote_feature" != "$GITHUB_SHA" ]]; then
            echo "Feature branch moved before release-train synchronization" >&2
            exit 1
          fi
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git fetch --no-tags origin release/3.0
          release_sha=$(git rev-parse 'origin/release/3.0^{commit}')
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          set +e
          git merge --no-commit --no-ff origin/release/3.0
          merge_status=$?
          set -e
          if [[ "$merge_status" -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'merge conflicts: %s\n' "${conflicts[*]:-none}"
            if [[ "${#conflicts[@]}" -eq 0 ]]; then
              echo "git merge failed without content conflicts" >&2
              git status --short >&2
              exit 1
            fi
            if [[ "${#conflicts[@]}" -ne 1 || "${conflicts[0]}" != "ci/test-suite-ratchet-baseline.json" ]]; then
              echo "Release train introduced an unexpected conflict" >&2
              exit 1
            fi
            git checkout --ours ci/test-suite-ratchet-baseline.json
            git add ci/test-suite-ratchet-baseline.json
          fi
          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "Unresolved merge conflicts remain" >&2
            exit 1
          fi
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Isolate idle shutdown from independent worker backfill
        env:
          OLD_METHOD_B64: ""
          NEW_METHOD_B64: ""
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("tests/test_guard_surface_server.py")
          text = path.read_text(encoding="utf-8")
          old = base64.b64decode(os.environ["OLD_METHOD_B64"]).decode("utf-8")
          new = base64.b64decode(os.environ["NEW_METHOD_B64"]).decode("utf-8")
          if text.count(old) != 1:
              raise RuntimeError("Expected exactly one idle-timeout lifecycle test")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          uv run --no-sync python -m ruff format tests/test_guard_surface_server.py
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/adapters/codex_daemon_hook_transport.py \
            src/codex_plugin_scanner/guard/daemon/server.py \
            tests/codex_daemon_hook_bridge_fixtures.py \
            tests/test_codex_daemon_hook_bridge.py \
            tests/test_guard_surface_server.py
      - name: Verify focused lifecycle and authentication regressions
        run: |
          set -euo pipefail
          for attempt in $(seq 1 4); do
            uv run --no-sync pytest -q \
              tests/test_guard_surface_server.py::TestGuardSurfaceServer::test_guard_daemon_background_start_auto_stops_after_idle_timeout
          done
          uv run --no-sync pytest -q \
            tests/test_guard_surface_server.py::TestGuardSurfaceServer::test_guard_daemon_keeps_stream_clients_alive_past_idle_timeout \
            tests/test_codex_daemon_hook_bridge.py::test_authenticated_generation_rollover_is_rediscovered_once \
            tests/test_codex_daemon_hook_bridge.py::test_authenticated_trust_refresh_preserves_daemon_generation \
            tests/test_codex_daemon_hook_bridge.py::test_repeated_generation_rollover_stays_bounded \
            tests/test_guard_supply_chain_daemon.py::test_daemon_retains_blocked_aibom_refresh_thread_during_shutdown
      - name: Verify native release and publication contracts
        run: |
          set -euo pipefail
          uv run --no-sync pytest -q \
            ci/native_runtime/test_native_runtime_release.py \
            tests/test_release_train_workflow.py
      - name: Recalculate the exact combined test-suite ratchet
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/ci/test_inventory.py --output "$RUNNER_TEMP/test-inventory.json"
          uv run --no-sync python - "$RUNNER_TEMP/test-inventory.json" <<'PY'
          import json
          import pathlib
          import sys

          inventory = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          payload = {
              "maximum_collected_cases": inventory["inventory"]["collected_cases"],
              "maximum_test_source_lines": inventory["test_source_lines"],
              "schema_version": 1,
          }
          pathlib.Path("ci/test-suite-ratchet-baseline.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --inventory "$RUNNER_TEMP/test-inventory.json" \
            --baseline ci/test-suite-ratchet-baseline.json
      - name: Commit the synchronized release candidate and remove helper
        env:
          MERGED_RELEASE_SHA: ${{ steps.merge_base.outputs.release_sha }}
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-idle-timeout-test-race-2245.yml
          git add \
            ci/test-suite-ratchet-baseline.json \
            tests/test_guard_surface_server.py
          git diff --cached --check
          branch=feat/rust-runtime-native-publish
          remote_feature=$(git ls-remote --exit-code origin "refs/heads/${branch}" | awk '{print $1}')
          remote_release=$(git ls-remote --exit-code origin refs/heads/release/3.0 | awk '{print $1}')
          if [[ "$remote_feature" != "$GITHUB_SHA" ]]; then
            echo "Feature branch moved during release-candidate validation" >&2
            exit 1
          fi
          if [[ "$remote_release" != "$MERGED_RELEASE_SHA" ]]; then
            echo "release/3.0 moved during release-candidate validation" >&2
            exit 1
          fi
          test -f .git/MERGE_HEAD
          git commit --signoff -m "merge: synchronize native publication candidate"
          git push origin "HEAD:refs/heads/${branch}"
