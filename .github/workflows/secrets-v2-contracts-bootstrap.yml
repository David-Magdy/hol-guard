name: Guard Secrets V2 contracts bootstrap

on:
  push:
    branches:
      - feat/secrets-v2-contracts-v3

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: guard-secrets-v2-contracts-bootstrap
  cancel-in-progress: false

jobs:
  apply-validate-and-open:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the clean release branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/secrets-v2-contracts-v3
          fetch-depth: 0
          persist-credentials: true

      - name: Import only the reviewed contract artifacts
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin feat/secrets-v2-contracts
          git checkout FETCH_HEAD -- \
            docs/guard/contracts/guard-secrets-capability-evidence.v2.json \
            docs/guard/contracts/guard-secrets-product-boundaries.v2.json \
            docs/guard/contracts/guard-secrets-reason-codes.v2.json \
            docs/guard/contracts/guard-secrets-source-capabilities.v2.json \
            scripts/ci/guard_secrets_release_claim_gate.py \
            src/codex_plugin_scanner/guard/secrets/contracts_v2.py \
            tests/test_guard_secret_contracts_v2.py \
            tests/test_guard_secret_release_claim_gate.py

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false

      - name: Validate contracts and claim gate
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync python -m ruff format \
            scripts/ci/guard_secrets_release_claim_gate.py \
            src/codex_plugin_scanner/guard/secrets/contracts_v2.py \
            tests/test_guard_secret_contracts_v2.py \
            tests/test_guard_secret_release_claim_gate.py
          uv run --no-sync python -m ruff check \
            scripts/ci/guard_secrets_release_claim_gate.py \
            src/codex_plugin_scanner/guard/secrets/contracts_v2.py \
            tests/test_guard_secret_contracts_v2.py \
            tests/test_guard_secret_release_claim_gate.py
          PYTHONPATH=src uv run --no-sync pytest -q \
            tests/test_guard_secret_contracts_v2.py \
            tests/test_guard_secret_release_claim_gate.py \
            --tb=short
          uv run --no-sync basedpyright --level error \
            scripts/ci/guard_secrets_release_claim_gate.py \
            src/codex_plugin_scanner/guard/secrets/contracts_v2.py \
            tests/test_guard_secret_contracts_v2.py \
            tests/test_guard_secret_release_claim_gate.py

      - name: Advance the reviewed test ratchet exactly
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/ci/generate_test_inventory.py \
            --output /tmp/guard-secrets-v2-contract-inventory.json
          python - <<'PY'
          from pathlib import Path
          import json

          inventory = json.loads(Path('/tmp/guard-secrets-v2-contract-inventory.json').read_text())
          path = Path('ci/test-suite-ratchet-baseline.json')
          baseline = json.loads(path.read_text())
          baseline['maximum_collected_cases'] = int(inventory['inventory']['collected_cases'])
          baseline['maximum_test_source_lines'] = int(inventory['test_source_lines'])
          path.write_text(json.dumps(baseline, indent=2) + '\n')
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory /tmp/guard-secrets-v2-contract-inventory.json
          git diff --check

      - name: Commit the clean contract slice without the bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/secrets-v2-contracts-bootstrap.yml
          git add \
            ci/test-suite-ratchet-baseline.json \
            docs/guard/contracts \
            scripts/ci/guard_secrets_release_claim_gate.py \
            src/codex_plugin_scanner/guard/secrets/contracts_v2.py \
            tests/test_guard_secret_contracts_v2.py \
            tests/test_guard_secret_release_claim_gate.py
          git commit -m 'feat(secrets): add V2 contracts and release-claim gate'
          git push origin HEAD:feat/secrets-v2-contracts-v3

      - name: Replace the stale pull request and request auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh pr view 2295 --json state --jq '.state' 2>/dev/null | grep -q '^OPEN$'; then
            gh pr close 2295 --comment 'Superseded by a clean branch based on the current release/3.0 head. The replacement imports only the reviewed V2 contracts, evidence manifests, claim gate, and focused tests; it intentionally excludes stale detector and fixture changes already resolved elsewhere.'
          fi
          pr_number="$(gh pr list \
            --head feat/secrets-v2-contracts-v3 \
            --base release/3.0 \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            gh pr create \
              --head feat/secrets-v2-contracts-v3 \
              --base release/3.0 \
              --title 'feat(secrets): add V2 contracts and release-claim gate' \
              --body-file - <<'EOF'
          ## Summary

          Recreates the HOL Guard Secrets V2 contract foundation on the current `release/3.0` head.

          - adds versioned scan, prevention, suppression, custom-rule, metric, capability, and release-evidence contracts
          - makes false-clean states structurally invalid
          - rejects raw-value-shaped fields recursively at external contract boundaries
          - adds machine-readable capability, source, reason-code, and product-boundary manifests
          - adds an exact-release claim gate that refuses public parity claims without complete benchmark, privacy, security, and capability evidence

          ## Clean replacement

          This PR supersedes #2295. It imports only the reviewed contract artifacts and focused tests. It does not reapply the stale detector or fixture diffs from the old branch.

          ## Release boundary

          Base is intentionally `release/3.0`. Do not retarget or merge this PR into `main`.
          EOF
            pr_number="$(gh pr list --head feat/secrets-v2-contracts-v3 --base release/3.0 --state open --json number --jq '.[0].number')"
          fi
          gh pr merge "$pr_number" --auto --squash --delete-branch
