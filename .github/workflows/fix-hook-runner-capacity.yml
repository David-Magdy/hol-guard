name: Fix hook runner capacity coordination

on:
  push:
    branches:
      - fix/cleanup-post-release-ci
    paths:
      - ".github/workflows/fix-hook-runner-capacity.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/cleanup-post-release-ci
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Repair deadline-bound worker acquisition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runner_path = Path("src/codex_plugin_scanner/guard/daemon/hook_process_runner.py")
          runner = runner_path.read_text(encoding="utf-8")
          old = '''            try:\n                slot = (\n                    self._slots.get(\n                        timeout=min(\n                            _HOOK_PROCESS_RETRY_READY_SECONDS,\n                            max(0.0, review_deadline - time.monotonic()),\n                        )\n                    )\n                    if deadline is not None\n                    else self._slots.get_nowait()\n                )\n            except queue.Empty:\n                return HookProcessReview(None, "daemon_hook_process_not_ready")\n'''
          new = '''            try:\n                slot = (\n                    self._slots.get(timeout=max(0.0, review_deadline - time.monotonic()))\n                    if deadline is not None\n                    else self._slots.get_nowait()\n                )\n            except queue.Empty:\n                reason_code = (\n                    "daemon_hook_process_deadline_exhausted"\n                    if deadline is not None and time.monotonic() >= review_deadline\n                    else "daemon_hook_process_not_ready"\n                )\n                return HookProcessReview(None, reason_code)\n'''
          if runner.count(old) != 1:
              raise SystemExit("hook worker acquisition block changed unexpectedly")
          runner_path.write_text(runner.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_guard_hook_process_runner.py")
          tests = test_path.read_text(encoding="utf-8")
          anchor = '''def test_scheduler_and_runner_complete_48_routine_reviews_without_capacity_denial(\n    tmp_path: Path,\n) -> None:\n'''
          regression = '''def test_deadline_bound_review_waits_for_reserved_worker_slot(\n    tmp_path: Path,\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    runner = HookProcessRunner(guard_home=tmp_path, process_limit=1, timeout_seconds=1)\n    runner._started = True  # pyright: ignore[reportPrivateUsage]\n    process = MagicMock()\n    process.pid = 4242\n    process.is_alive.return_value = True\n    connection = MagicMock()\n    connection.poll.return_value = True\n    connection.recv.return_value = ("result", {"payload": {"decision": "allow"}, "reason_code": None})\n    slot = HookWorkerSlot(process=process, connection=connection)\n    monkeypatch.setattr(hook_runner_module, "_HOOK_PROCESS_RETRY_READY_SECONDS", 0.01)\n\n    def release_reserved_slot() -> None:\n        time.sleep(0.05)\n        runner._slots.put_nowait(slot)  # pyright: ignore[reportPrivateUsage]\n\n    release_thread = threading.Thread(target=release_reserved_slot)\n    release_thread.start()\n    result = runner.review(\n        payload={\n            "hook_event_name": "PreToolUse",\n            "tool_call_id": "reserved-slot",\n            "tool_name": "Bash",\n            "tool_input": {"command": "git status --short"},\n        },\n        harness="pi",\n        home_dir=tmp_path,\n        guard_home=tmp_path,\n        workspace=tmp_path,\n        hook_env={},\n        deadline=time.monotonic() + 0.4,\n    )\n    release_thread.join(timeout=0.5)\n\n    assert not release_thread.is_alive()\n    assert result.payload == {"decision": "allow"}\n    assert result.reason_code is None\n    assert runner._slots.qsize() == 1  # pyright: ignore[reportPrivateUsage]\n\n\n'''
          if tests.count(anchor) != 1:
              raise SystemExit("scheduler stress test anchor changed unexpectedly")
          test_path.write_text(tests.replace(anchor, regression + anchor, 1), encoding="utf-8")
          PY

      - name: Install development environment
        run: uv sync --frozen --extra dev --python 3.12

      - name: Format and lint touched files
        shell: bash
        run: |
          uv run --no-sync python -m ruff check --fix \
            src/codex_plugin_scanner/guard/daemon/hook_process_runner.py \
            tests/test_guard_hook_process_runner.py
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/guard/daemon/hook_process_runner.py \
            tests/test_guard_hook_process_runner.py

      - name: Run focused capacity and deadline regressions
        shell: bash
        run: |
          uv run --no-sync pytest \
            tests/test_guard_hook_process_runner.py \
            tests/test_guard_hook_process_deadline_contract.py \
            --tb=short
          for attempt in 1 2 3; do
            uv run --no-sync pytest \
              tests/test_guard_hook_process_runner.py::test_scheduler_and_runner_complete_48_routine_reviews_without_capacity_denial \
              --tb=short
          done
          uv run --no-sync pytest \
            tests/test_guard_surface_server.py::TestGuardSurfaceServer::test_guard_daemon_pi_hook_endpoint_returns_blocked_runtime_review_payload \
            --tb=short

      - name: Verify deterministic evidence still reproduces
        shell: bash
        run: |
          if ! uv run --no-sync pytest \
            tests/test_guard_command_decision_diff.py::test_report_is_exactly_reproducible_and_source_bound \
            --tb=short; then
            uv run --no-sync python tests/guard_command_decision_diff.py --write
            uv run --no-sync pytest \
              tests/test_guard_command_decision_diff.py::test_report_is_exactly_reproducible_and_source_bound \
              --tb=short
          fi

      - name: Ratchet intentional test addition
        shell: bash
        run: |
          uv run --no-sync python scripts/ci/test_inventory.py --output test-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path("test-inventory.json").read_text(encoding="utf-8"))
          baseline_path = Path("ci/test-suite-ratchet-baseline.json")
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          baseline["maximum_collected_cases"] = max(
              int(baseline["maximum_collected_cases"]), int(inventory["inventory"]["collected_cases"])
          )
          baseline["maximum_test_source_lines"] = max(
              int(baseline["maximum_test_source_lines"]), int(inventory["test_source_lines"])
          )
          baseline_path.write_text(json.dumps(baseline, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory test-inventory.json
          rm test-inventory.json

      - name: Verify final quality
        shell: bash
        run: |
          uv run --no-sync python -m ruff check src/
          uv run --no-sync python -m ruff format --check src/
          uv run --no-sync basedpyright --level error

      - name: Commit validated follow-up fix
        shell: bash
        run: |
          rm .github/workflows/fix-hook-runner-capacity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "fix(ci): honor reserved hook worker capacity"
          git push origin HEAD:fix/cleanup-post-release-ci
