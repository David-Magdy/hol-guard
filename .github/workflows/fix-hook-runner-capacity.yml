name: Diagnose hook runner not-ready source

on:
  push:
    branches:
      - fix/cleanup-post-release-ci
    paths:
      - ".github/workflows/fix-hook-runner-capacity.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/cleanup-post-release-ci
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Label not-ready sources for this probe only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runner_path = Path("src/codex_plugin_scanner/guard/daemon/hook_process_runner.py")
          runner = runner_path.read_text(encoding="utf-8")
          old = '''            except queue.Empty:\n                return HookProcessReview(None, "daemon_hook_process_not_ready")\n            try:\n                slot.connection.send(("review", request))\n'''
          new = '''            except queue.Empty:\n                return HookProcessReview(None, "daemon_hook_process_queue_empty_probe")\n            try:\n                slot.connection.send(("review", request))\n'''
          if runner.count(old) != 1:
              raise SystemExit("initial worker acquisition block changed unexpectedly")
          runner_path.write_text(runner.replace(old, new, 1), encoding="utf-8")

          entrypoint_path = Path("src/codex_plugin_scanner/guard/daemon/hook_process_entrypoint.py")
          entrypoint = entrypoint_path.read_text(encoding="utf-8")
          old = '''            reason_code = (\n                "daemon_hook_process_not_ready" if sqlite_error_is_busy_locked(error) else "daemon_hook_process_failed"\n            )\n'''
          new = '''            reason_code = (\n                "daemon_hook_process_sqlite_busy_probe" if sqlite_error_is_busy_locked(error) else "daemon_hook_process_failed"\n            )\n'''
          if entrypoint.count(old) != 1:
              raise SystemExit("evaluator contention block changed unexpectedly")
          entrypoint_path.write_text(entrypoint.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Install development environment
        run: uv sync --frozen --extra dev --python 3.12
      - name: Reproduce burst and expose source
        shell: bash
        run: |
          set +e
          failed=0
          for attempt in 1 2 3; do
            echo "===== burst attempt ${attempt} ====="
            uv run --no-sync pytest \
              tests/test_guard_hook_process_runner.py::test_scheduler_and_runner_complete_48_routine_reviews_without_capacity_denial \
              -vv --tb=short
            rc=$?
            if [ "$rc" -ne 0 ]; then
              failed=1
              break
            fi
          done
          exit "$failed"
