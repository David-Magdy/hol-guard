name: Fix transient hook evaluator contention

on:
  push:
    branches:
      - fix/cleanup-post-release-ci
    paths:
      - ".github/workflows/fix-hook-runner-capacity.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/cleanup-post-release-ci
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Retry transient evaluator contention for idempotent hooks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runner_path = Path("src/codex_plugin_scanner/guard/daemon/hook_process_runner.py")
          runner = runner_path.read_text(encoding="utf-8")

          old_signature = '''        hook_env: Mapping[str, str],\n        deadline: float | None = None,\n    ) -> HookProcessReview:\n'''
          new_signature = '''        hook_env: Mapping[str, str],\n        deadline: float | None = None,\n        _retry_transient_not_ready: bool = True,\n    ) -> HookProcessReview:\n'''
          if runner.count(old_signature) != 1:
              raise SystemExit("review signature changed unexpectedly")
          runner = runner.replace(old_signature, new_signature, 1)

          old_response = '''        if response is None:\n            return HookProcessReview(\n                None,\n                reason_code if isinstance(reason_code, str) else "daemon_hook_process_failed",\n            )\n'''
          new_response = '''        if response is None:\n            if (\n                _retry_transient_not_ready\n                and reason_code == "daemon_hook_process_not_ready"\n                and _runtime_hook_review_is_idempotent(payload)\n                and time.monotonic() < review_deadline\n            ):\n                return self.review(\n                    payload=payload,\n                    harness=harness,\n                    home_dir=home_dir,\n                    guard_home=guard_home,\n                    workspace=workspace,\n                    hook_env=hook_env,\n                    deadline=review_deadline,\n                    _retry_transient_not_ready=False,\n                )\n            return HookProcessReview(\n                None,\n                reason_code if isinstance(reason_code, str) else "daemon_hook_process_failed",\n            )\n'''
          if runner.count(old_response) != 1:
              raise SystemExit("review response block changed unexpectedly")
          runner_path.write_text(runner.replace(old_response, new_response, 1), encoding="utf-8")

          test_path = Path("tests/test_guard_hook_process_runner.py")
          tests = test_path.read_text(encoding="utf-8")
          anchor = '''def test_scheduler_and_runner_complete_48_routine_reviews_without_capacity_denial(\n    tmp_path: Path,\n) -> None:\n'''
          regressions = '''def _transient_not_ready_test_runner(tmp_path: Path, responses: list[object]) -> tuple[HookProcessRunner, MagicMock]:\n    runner = HookProcessRunner(guard_home=tmp_path, process_limit=1, timeout_seconds=1)\n    runner._started = True  # pyright: ignore[reportPrivateUsage]\n    process = MagicMock()\n    process.pid = 4242\n    process.is_alive.return_value = True\n    connection = MagicMock()\n    connection.poll.return_value = True\n    connection.recv.side_effect = responses\n    slot = HookWorkerSlot(process=process, connection=connection)\n    runner._slots.put_nowait(slot)  # pyright: ignore[reportPrivateUsage]\n    runner._ready_slot_ids.add(process.pid)  # pyright: ignore[reportPrivateUsage]\n    return runner, connection\n\n\ndef test_idempotent_review_retries_transient_evaluator_not_ready(tmp_path: Path) -> None:\n    runner, connection = _transient_not_ready_test_runner(\n        tmp_path,\n        [\n            ("result", {"payload": None, "reason_code": "daemon_hook_process_not_ready"}),\n            ("result", {"payload": {"decision": "allow"}, "reason_code": None}),\n        ],\n    )\n\n    result = runner.review(\n        payload={\n            "hook_event_name": "PreToolUse",\n            "tool_call_id": "stable-call",\n            "tool_name": "Bash",\n            "tool_input": {"command": "git status --short"},\n        },\n        harness="pi",\n        home_dir=tmp_path,\n        guard_home=tmp_path,\n        workspace=tmp_path,\n        hook_env={},\n        deadline=time.monotonic() + 1,\n    )\n\n    assert result == HookProcessReview({"decision": "allow"}, None)\n    assert connection.send.call_count == 2\n    assert runner._slots.qsize() == 1  # pyright: ignore[reportPrivateUsage]\n\n\ndef test_non_idempotent_review_does_not_retry_transient_evaluator_not_ready(tmp_path: Path) -> None:\n    runner, connection = _transient_not_ready_test_runner(\n        tmp_path,\n        [("result", {"payload": None, "reason_code": "daemon_hook_process_not_ready"})],\n    )\n\n    result = runner.review(\n        payload={"hook_event_name": "SessionStart"},\n        harness="pi",\n        home_dir=tmp_path,\n        guard_home=tmp_path,\n        workspace=tmp_path,\n        hook_env={},\n        deadline=time.monotonic() + 1,\n    )\n\n    assert result == HookProcessReview(None, "daemon_hook_process_not_ready")\n    assert connection.send.call_count == 1\n\n\ndef test_idempotent_review_retries_transient_not_ready_only_once(tmp_path: Path) -> None:\n    runner, connection = _transient_not_ready_test_runner(\n        tmp_path,\n        [\n            ("result", {"payload": None, "reason_code": "daemon_hook_process_not_ready"}),\n            ("result", {"payload": None, "reason_code": "daemon_hook_process_not_ready"}),\n        ],\n    )\n\n    result = runner.review(\n        payload={\n            "hook_event_name": "PreToolUse",\n            "tool_call_id": "stable-call",\n            "tool_name": "Bash",\n            "tool_input": {"command": "git status --short"},\n        },\n        harness="pi",\n        home_dir=tmp_path,\n        guard_home=tmp_path,\n        workspace=tmp_path,\n        hook_env={},\n        deadline=time.monotonic() + 1,\n    )\n\n    assert result == HookProcessReview(None, "daemon_hook_process_not_ready")\n    assert connection.send.call_count == 2\n\n\n'''
          if tests.count(anchor) != 1:
              raise SystemExit("scheduler stress anchor changed unexpectedly")
          test_path.write_text(tests.replace(anchor, regressions + anchor, 1), encoding="utf-8")
          PY

      - name: Install development environment
        run: uv sync --frozen --extra dev --python 3.12

      - name: Format and lint touched files
        shell: bash
        run: |
          uv run --no-sync python -m ruff check --fix \
            src/codex_plugin_scanner/guard/daemon/hook_process_runner.py \
            tests/test_guard_hook_process_runner.py
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/guard/daemon/hook_process_runner.py \
            tests/test_guard_hook_process_runner.py

      - name: Run runner, deadline, and storage regressions
        shell: bash
        run: |
          uv run --no-sync pytest \
            tests/test_guard_hook_process_runner.py \
            tests/test_guard_hook_process_deadline_contract.py \
            tests/test_guard_daemon_storage_liveness.py \
            --tb=short
          uv run --no-sync pytest \
            tests/test_guard_surface_server.py::TestGuardSurfaceServer::test_guard_daemon_pi_hook_endpoint_returns_blocked_runtime_review_payload \
            --tb=short

      - name: Hammer scheduled burst regression
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "===== stabilized burst attempt ${attempt} ====="
            uv run --no-sync pytest \
              tests/test_guard_hook_process_runner.py::test_scheduler_and_runner_complete_48_routine_reviews_without_capacity_denial \
              --tb=short
          done

      - name: Verify deterministic evidence
        shell: bash
        run: |
          if ! uv run --no-sync pytest \
            tests/test_guard_command_decision_diff.py::test_report_is_exactly_reproducible_and_source_bound \
            --tb=short; then
            uv run --no-sync python tests/guard_command_decision_diff.py --write
            uv run --no-sync pytest \
              tests/test_guard_command_decision_diff.py::test_report_is_exactly_reproducible_and_source_bound \
              --tb=short
          fi

      - name: Ratchet intentional regression coverage
        shell: bash
        run: |
          uv run --no-sync python scripts/ci/test_inventory.py --output test-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path("test-inventory.json").read_text(encoding="utf-8"))
          baseline_path = Path("ci/test-suite-ratchet-baseline.json")
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          baseline["maximum_collected_cases"] = max(
              int(baseline["maximum_collected_cases"]), int(inventory["inventory"]["collected_cases"])
          )
          baseline["maximum_test_source_lines"] = max(
              int(baseline["maximum_test_source_lines"]), int(inventory["test_source_lines"])
          )
          baseline_path.write_text(json.dumps(baseline, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory test-inventory.json
          rm test-inventory.json

      - name: Verify final repository quality
        shell: bash
        run: |
          uv run --no-sync python -m ruff check src/
          uv run --no-sync python -m ruff format --check src/
          uv run --no-sync basedpyright --level error

      - name: Commit validated follow-up fix
        shell: bash
        run: |
          rm .github/workflows/fix-hook-runner-capacity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "fix(ci): retry transient hook evaluator contention"
          git push origin HEAD:fix/cleanup-post-release-ci
