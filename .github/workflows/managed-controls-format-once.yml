name: Managed Controls format once

on:
  push:
    branches:
      - managed-controls/batch-13-local-parser-shared-posture

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: managed-controls/batch-13-local-parser-shared-posture
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - run: >-
          uv run --no-sync python -m ruff format
          src/codex_plugin_scanner/guard/managed_controls_policy_fields.py
          src/codex_plugin_scanner/guard/managed_controls_policy_fields_core.py
      - name: Commit formatter output and remove helper workflow
        run: |
          git rm .github/workflows/managed-controls-format-once.yml
          if git diff --quiet --cached && git diff --quiet; then
            echo 'No formatter changes produced.'
            exit 0
          fi
          git add src/codex_plugin_scanner/guard/managed_controls_policy_fields.py src/codex_plugin_scanner/guard/managed_controls_policy_fields_core.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(guard): format Managed Controls parser'
          git push origin HEAD:managed-controls/batch-13-local-parser-shared-posture
