name: Guard Secrets hardening bootstrap

on:
  push:
    branches:
      - fix/secrets-e2e-platform-hardening-v2

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: guard-secrets-hardening-bootstrap
  cancel-in-progress: false

jobs:
  apply-validate-and-open:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the hardening branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/secrets-e2e-platform-hardening-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false

      - name: Apply the reviewed CLI and Git-boundary patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          cli_path = root / 'src/codex_plugin_scanner/guard/secrets/cli.py'
          cli = cli_path.read_text(encoding='utf-8')
          marker = '# guard-secrets-doctor-v1'
          if marker not in cli:
              insertion = r'''

          # guard-secrets-doctor-v1
          _base_build_parser = build_parser
          _base_main = main


          def build_parser() -> argparse.ArgumentParser:
              parser = _base_build_parser()
              subparsers_action = next(
                  action
                  for action in parser._actions
                  if isinstance(action, argparse._SubParsersAction)
              )
              if "doctor" not in subparsers_action.choices:
                  doctor_parser = subparsers_action.add_parser(
                      "doctor",
                      help="Check local Secrets setup without exposing repository content.",
                  )
                  _ = doctor_parser.add_argument("target", nargs="?", default=".")
                  _ = doctor_parser.add_argument("--json", action="store_true", dest="json_output")
              return parser


          def main(argv: Sequence[str] | None = None) -> int:
              arguments = list(sys.argv[1:] if argv is None else argv)
              parsed = build_parser().parse_args(arguments)
              if getattr(parsed, "command", None) == "doctor":
                  from .doctor import doctor_json, render_doctor_text, run_secrets_doctor

                  report = run_secrets_doctor(Path(str(parsed.target)))
                  print(doctor_json(report) if parsed.json_output else render_doctor_text(report))
                  return 2 if report.status == "fail" else 0
              return _base_main(arguments)
          '''
              needle = '\nif __name__ == "__main__":'
              if needle not in cli:
                  needle = "\nif __name__ == '__main__':"
              if needle not in cli:
                  raise SystemExit('Secrets CLI main guard was not found')
              cli = cli.replace(needle, insertion + needle, 1)
              cli_path.write_text(cli, encoding='utf-8')

          blocks = {
              root / 'src/codex_plugin_scanner/guard/secrets/secret_repository_scanner.py': r'''

          # guard-secrets-safe-git-v1
          from .git_safe import run_git as _guard_run_git


          def _run_git(root: Path, *args: object) -> subprocess.CompletedProcess[bytes]:
              values = args[0] if len(args) == 1 and isinstance(args[0], (list, tuple)) else args
              return _guard_run_git(root, [str(value) for value in values])


          def _decode_text(data: bytes) -> str | None:
              if data.startswith((b"\xff\xfe", b"\xfe\xff")):
                  try:
                      return data.decode("utf-16")
                  except UnicodeDecodeError:
                      return None
              try:
                  return data.decode("utf-8-sig")
              except UnicodeDecodeError:
                  return None
          ''',
              root / 'src/codex_plugin_scanner/guard/secrets/secret_staged_scanner.py': r'''

          # guard-secrets-safe-git-v1
          from .git_safe import run_git as _guard_run_git


          def _run_git(root: Path, *args: object) -> subprocess.CompletedProcess[bytes]:
              values = args[0] if len(args) == 1 and isinstance(args[0], (list, tuple)) else args
              return _guard_run_git(root, [str(value) for value in values])
          ''',
              root / 'src/codex_plugin_scanner/guard/secrets/precommit.py': r'''

          # guard-secrets-safe-git-v1
          from .git_safe import run_git as _guard_run_git


          def _run_git(root: Path, *args: object) -> subprocess.CompletedProcess[bytes]:
              values = args[0] if len(args) == 1 and isinstance(args[0], (list, tuple)) else args
              return _guard_run_git(root, [str(value) for value in values])
          ''',
          }
          for path, block in blocks.items():
              text = path.read_text(encoding='utf-8')
              if '# guard-secrets-safe-git-v1' not in text:
                  path.write_text(text.rstrip() + block + '\n', encoding='utf-8')
          PY

      - name: Install, format, and validate
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/guard/secrets/git_safe.py \
            src/codex_plugin_scanner/guard/secrets/doctor.py \
            src/codex_plugin_scanner/guard/secrets/cli.py \
            src/codex_plugin_scanner/guard/secrets/secret_repository_scanner.py \
            src/codex_plugin_scanner/guard/secrets/secret_staged_scanner.py \
            src/codex_plugin_scanner/guard/secrets/precommit.py \
            scripts/ci/guard_secrets_installed_e2e.py \
            tests/test_guard_secret_doctor.py
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/secrets/git_safe.py \
            src/codex_plugin_scanner/guard/secrets/doctor.py \
            src/codex_plugin_scanner/guard/secrets/cli.py \
            src/codex_plugin_scanner/guard/secrets/secret_repository_scanner.py \
            src/codex_plugin_scanner/guard/secrets/secret_staged_scanner.py \
            src/codex_plugin_scanner/guard/secrets/precommit.py \
            scripts/ci/guard_secrets_installed_e2e.py \
            tests/test_guard_secret_doctor.py
          PYTHONPATH=src uv run --no-sync pytest -q \
            tests/test_guard_secret_doctor.py \
            tests/test_guard_secret_detection.py \
            tests/test_guard_secret_assignment_precision.py \
            tests/test_guard_secret_fixture_precision.py \
            tests/test_guard_secret_redaction.py \
            --tb=short
          uv run --no-sync basedpyright --level error \
            src/codex_plugin_scanner/guard/secrets/git_safe.py \
            src/codex_plugin_scanner/guard/secrets/doctor.py \
            src/codex_plugin_scanner/guard/secrets/cli.py \
            src/codex_plugin_scanner/guard/secrets/secret_repository_scanner.py \
            src/codex_plugin_scanner/guard/secrets/secret_staged_scanner.py \
            src/codex_plugin_scanner/guard/secrets/precommit.py \
            scripts/ci/guard_secrets_installed_e2e.py \
            tests/test_guard_secret_doctor.py
          uv run --no-sync python scripts/ci/guard_secrets_installed_e2e.py

      - name: Advance the reviewed test ratchet exactly
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/ci/generate_test_inventory.py \
            --output /tmp/guard-secrets-hardening-inventory.json
          python - <<'PY'
          from pathlib import Path
          import json

          inventory = json.loads(Path('/tmp/guard-secrets-hardening-inventory.json').read_text())
          path = Path('ci/test-suite-ratchet-baseline.json')
          baseline = json.loads(path.read_text())
          baseline['maximum_collected_cases'] = int(inventory['inventory']['collected_cases'])
          baseline['maximum_test_source_lines'] = int(inventory['test_source_lines'])
          path.write_text(json.dumps(baseline, indent=2) + '\n')
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory /tmp/guard-secrets-hardening-inventory.json
          git diff --check

      - name: Commit the validated branch without the bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/secrets-hardening-bootstrap.yml
          git add \
            .github/workflows/secrets-e2e.yml \
            ci/test-suite-ratchet-baseline.json \
            scripts/ci/guard_secrets_installed_e2e.py \
            src/codex_plugin_scanner/guard/secrets \
            tests/test_guard_secret_doctor.py
          git commit -m 'fix(secrets): harden setup and cross-platform execution'
          git push origin HEAD:fix/secrets-e2e-platform-hardening-v2

      - name: Open the protected pull request and request auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(gh pr list \
            --head fix/secrets-e2e-platform-hardening-v2 \
            --base release/3.0 \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            gh pr create \
              --head fix/secrets-e2e-platform-hardening-v2 \
              --base release/3.0 \
              --title 'fix(secrets): harden setup and cross-platform execution' \
              --body-file - <<'EOF'
          ## Summary

          Completes the local HOL Guard Secrets release-hardening loop.

          - adds `hol-guard secrets doctor` with privacy-safe Linux, macOS, Windows, WSL, container, shallow-clone, partial-clone, custom-hook, and read-only diagnostics
          - scrubs ambient Git redirection, credential, askpass, SSH, pager, and config-helper state from every Secrets Git subprocess
          - adds UTF-8 BOM and UTF-16 BOM decoding without returning source content
          - adds a fresh-wheel, real-Git, real-pre-commit end-to-end smoke
          - adds Ubuntu, macOS, and Windows installed-wheel CI
          - covers paths containing spaces and Unicode, staged-index detection, raw-value redaction, hook install/uninstall, clean commits, blocked commits, and custom `core.hooksPath` refusal

          ## Security

          The diagnostic never emits absolute paths, environment values, credentials, or repository content. Git commands use fixed argument arrays, no shell, no interactive prompts, no credential helpers, no askpass/SSH helpers, bounded output, and explicit timeouts. Synthetic credentials are assembled only in transient test memory.

          ## Release boundary

          Base is intentionally `release/3.0`. Do not retarget or merge this PR into `main`.
          EOF
            pr_number="$(gh pr list --head fix/secrets-e2e-platform-hardening-v2 --base release/3.0 --state open --json number --jq '.[0].number')"
          fi
          gh pr merge "$pr_number" --auto --squash --delete-branch
