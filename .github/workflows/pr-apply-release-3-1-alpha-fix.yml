name: PR Apply Release 3.1 Alpha Fix

on:
  pull_request:
    branches: [release/3.1]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/release-3-1-alpha-every-commit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
      - name: Apply release workflow repair
        run: python3 scripts/apply_release_3_1_alpha_fix.py
      - name: Validate focused release contracts
        run: |
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync pytest tests/test_release_train_workflow.py tests/test_compute_alpha_release_version.py tests/test_validate_alpha_release.py -q
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          import yaml
          yaml.safe_load(Path('.github/workflows/publish.yml').read_text(encoding='utf-8'))
          print('publish workflow YAML: ok')
          PY
      - name: Commit repair
        run: |
          git config user.name "HOL Guard Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/publish.yml tests/test_release_train_workflow.py
          if git diff --cached --quiet; then
            echo "Repair already applied"
            exit 0
          fi
          git diff --cached --check
          git commit -m "fix(ci): make release 3.1 alpha publication per-commit"
          git push origin HEAD:${{ github.head_ref }}
