name: Protection Center Batch 6 dashboard session auth fix
on:
  push:
    branches: [feat/protection-center-06-cloud-boundary-hardening]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Authorize new Protection Center routes for signed dashboard sessions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          server_path = Path('src/codex_plugin_scanner/guard/daemon/server.py')
          server = server_path.read_text(encoding='utf-8')
          old = '''            "/v1/extension-controls/catalog",\n            "/v1/extension-controls/effective",\n            "/v1/extension-controls/preview",\n            "/v1/extension-controls/apply",\n            "/v1/extension-controls/refresh",\n            "/v1/extension-controls/recover-authority",\n'''
          new = '''            "/v1/extension-controls/catalog",\n            "/v1/extension-controls/effective",\n            "/v1/extension-controls/history",\n            "/v1/extension-controls/preview",\n            "/v1/extension-controls/test",\n            "/v1/extension-controls/apply",\n            "/v1/extension-controls/refresh",\n            "/v1/extension-controls/recover-authority",\n            "/v1/extension-controls/acknowledge-degraded",\n'''
          if server.count(old) != 1:
              raise SystemExit(f'expected one extension-control dashboard-session allowlist block, found {server.count(old)}')
          server_path.write_text(server.replace(old, new), encoding='utf-8')

          test_path = Path('tests/test_guard_extension_control_test_lab.py')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace(
              'import json\nfrom pathlib import Path\n',
              'import json\nimport urllib.error\nimport urllib.request\nfrom pathlib import Path\n',
              1,
          )
          test = test.replace(
              'from codex_plugin_scanner.guard.daemon.extension_control_api import ExtensionControlApiError\n',
              'from codex_plugin_scanner.guard.daemon import GuardDaemonServer\nfrom codex_plugin_scanner.guard.daemon import server as daemon_server_module\nfrom codex_plugin_scanner.guard.daemon.extension_control_api import ExtensionControlApiError\n',
              1,
          )
          test = test.replace(
              'from codex_plugin_scanner.guard.runtime.extension_control_runtime import ExtensionControlRuntime\n',
              'from codex_plugin_scanner.guard.local_dashboard_session import build_local_dashboard_session_token\nfrom codex_plugin_scanner.guard.runtime.extension_control_runtime import ExtensionControlRuntime\nfrom codex_plugin_scanner.guard.store import GuardStore\n',
              1,
          )
          marker = 'def test_test_lab_does_not_require_store_or_mutation_proof() -> None:\n'
          if marker not in test:
              raise SystemExit('Test Lab insertion marker missing')
          if 'test_dashboard_session_authorizes_new_extension_control_routes' not in test:
              addition = r'''

def _extension_control_request(
    daemon: GuardDaemonServer,
    path: str,
    *,
    session_token: str | None = None,
    root_token: str | None = None,
    origin: str | None = None,
    payload: dict[str, object] | None = None,
) -> urllib.request.Request:
    headers: dict[str, str] = {}
    if session_token is not None:
        headers["X-Guard-Dashboard-Session"] = session_token
    if root_token is not None:
        headers["X-Guard-Token"] = root_token
    if origin is not None:
        headers["Origin"] = origin
    data = None
    method = "GET"
    if payload is not None:
        data = json.dumps(payload).encode("utf-8")
        headers["Content-Type"] = "application/json"
        method = "POST"
    return urllib.request.Request(
        f"http://127.0.0.1:{daemon.port}{path}",
        data=data,
        headers=headers,
        method=method,
    )


def test_dashboard_session_authorizes_new_extension_control_routes(tmp_path: Path) -> None:
    store = GuardStore(tmp_path / "guard-home")
    daemon = GuardDaemonServer(store, host="127.0.0.1", port=0)
    daemon.start()
    session_token = build_local_dashboard_session_token(
        auth_token=daemon._server.auth_token,
        surface="dashboard",
    )
    command = "git reset --hard HEAD~1"
    try:
        with urllib.request.urlopen(
            _extension_control_request(
                daemon,
                "/v1/extension-controls/test",
                session_token=session_token,
                origin=f"http://127.0.0.1:{daemon.port}",
                payload={"extension_id": "command.git", "command": command},
            ),
            timeout=5,
        ) as response:
            test_payload = json.loads(response.read().decode("utf-8"))
        with urllib.request.urlopen(
            _extension_control_request(
                daemon,
                "/v1/extension-controls/history",
                session_token=session_token,
                origin=f"http://127.0.0.1:{daemon.port}",
            ),
            timeout=5,
        ) as response:
            history_payload = json.loads(response.read().decode("utf-8"))
        with urllib.request.urlopen(
            _extension_control_request(
                daemon,
                "/v1/extension-controls/test",
                root_token=daemon._server.auth_token,
                payload={"extension_id": "command.git", "command": command},
            ),
            timeout=5,
        ) as response:
            root_payload = json.loads(response.read().decode("utf-8"))
    finally:
        daemon.stop()

    assert test_payload["schema_version"] == "guard.daemon.extension-control-test.v1"
    assert "command" not in test_payload
    assert command not in json.dumps(test_payload, sort_keys=True)
    assert isinstance(history_payload, list)
    assert root_payload["schema_version"] == "guard.daemon.extension-control-test.v1"
    assert daemon_server_module._GuardDaemonHandler._is_hosted_dashboard_api_path(
        "/v1/extension-controls/acknowledge-degraded",
        ["v1", "extension-controls", "acknowledge-degraded"],
    )
    assert not daemon_server_module._GuardDaemonHandler._is_hosted_dashboard_api_path(
        "/v1/extension-controls/not-real",
        ["v1", "extension-controls", "not-real"],
    )


def test_dashboard_session_rejects_forged_expired_and_foreign_origin_test_lab_requests(
    tmp_path: Path,
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    store = GuardStore(tmp_path / "guard-home")
    daemon = GuardDaemonServer(store, host="127.0.0.1", port=0)
    daemon.start()
    command_payload = {"extension_id": "command.git", "command": "git status"}
    valid = build_local_dashboard_session_token(
        auth_token=daemon._server.auth_token,
        surface="dashboard",
    )
    forged = f"{valid[:-1]}{'A' if valid[-1] != 'A' else 'B'}"
    expired = build_local_dashboard_session_token(
        auth_token=daemon._server.auth_token,
        surface="dashboard",
        expires_in_seconds=1,
    )
    try:
        for candidate in (forged,):
            with pytest.raises(urllib.error.HTTPError) as error:
                urllib.request.urlopen(
                    _extension_control_request(
                        daemon,
                        "/v1/extension-controls/test",
                        session_token=candidate,
                        origin=f"http://127.0.0.1:{daemon.port}",
                        payload=command_payload,
                    ),
                    timeout=5,
                )
            assert error.value.code == 401

        original_time = daemon_server_module.time.time()
        monkeypatch.setattr(daemon_server_module.time, "time", lambda: original_time + 5)
        with pytest.raises(urllib.error.HTTPError) as expired_error:
            urllib.request.urlopen(
                _extension_control_request(
                    daemon,
                    "/v1/extension-controls/test",
                    session_token=expired,
                    origin=f"http://127.0.0.1:{daemon.port}",
                    payload=command_payload,
                ),
                timeout=5,
            )
        assert expired_error.value.code == 401
        monkeypatch.undo()

        with pytest.raises(urllib.error.HTTPError) as origin_error:
            urllib.request.urlopen(
                _extension_control_request(
                    daemon,
                    "/v1/extension-controls/test",
                    session_token=valid,
                    origin="https://example.invalid",
                    payload=command_payload,
                ),
                timeout=5,
            )
        assert origin_error.value.code == 403
    finally:
        daemon.stop()
'''
              test = test.replace(marker, addition + '\n\n' + marker, 1)
          test_path.write_text(test, encoding='utf-8')
          PY
          git diff --check
      - name: Verify lint typing and dashboard-session behavior
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync python -m ruff format src/codex_plugin_scanner/guard/daemon/server.py tests/test_guard_extension_control_test_lab.py
          uv run --no-sync python -m ruff check src/codex_plugin_scanner/guard/daemon/server.py tests/test_guard_extension_control_test_lab.py
          uv run --no-sync python -m ruff format --check src/codex_plugin_scanner/guard/daemon/server.py tests/test_guard_extension_control_test_lab.py
          uv run --no-sync basedpyright --level error
          uv run --no-sync pytest -q tests/test_guard_extension_control_test_lab.py tests/test_guard_extension_control_api.py
          git diff --check
      - name: Commit verified auth fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/protection-center-batch6-dashboard-session-auth-fix.yml
          git add src/codex_plugin_scanner/guard/daemon/server.py \
            tests/test_guard_extension_control_test_lab.py \
            .github/workflows/protection-center-batch6-dashboard-session-auth-fix.yml
          git diff --cached --check
          git commit -m "fix(protection-center): authorize signed dashboard sessions"
          git push origin HEAD:feat/protection-center-06-cloud-boundary-hardening
