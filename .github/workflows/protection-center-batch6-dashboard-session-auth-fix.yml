name: Protection Center Batch 6 dashboard session auth fix
on:
  push:
    branches: [feat/protection-center-06-cloud-boundary-hardening]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Authorize new Protection Center routes for signed dashboard sessions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/codex_plugin_scanner/guard/daemon/server.py')
          text = path.read_text(encoding='utf-8')
          old_lines = [
              '            "/v1/extension-controls/catalog",',
              '            "/v1/extension-controls/effective",',
              '            "/v1/extension-controls/preview",',
              '            "/v1/extension-controls/apply",',
              '            "/v1/extension-controls/refresh",',
              '            "/v1/extension-controls/recover-authority",',
          ]
          new_lines = [
              '            "/v1/extension-controls/catalog",',
              '            "/v1/extension-controls/effective",',
              '            "/v1/extension-controls/history",',
              '            "/v1/extension-controls/preview",',
              '            "/v1/extension-controls/test",',
              '            "/v1/extension-controls/apply",',
              '            "/v1/extension-controls/refresh",',
              '            "/v1/extension-controls/recover-authority",',
              '            "/v1/extension-controls/acknowledge-degraded",',
          ]
          old = '\n'.join(old_lines) + '\n'
          new = '\n'.join(new_lines) + '\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one extension-control dashboard-session block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
      - name: Install verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
      - name: Verify Ruff
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m ruff format tests/test_guard_extension_control_dashboard_session_auth.py
          uv run --no-sync python -m ruff check src/codex_plugin_scanner/guard/daemon/server.py tests/test_guard_extension_control_dashboard_session_auth.py
          uv run --no-sync python -m ruff format --check src/codex_plugin_scanner/guard/daemon/server.py tests/test_guard_extension_control_dashboard_session_auth.py
          git diff --check
      - name: Verify basedpyright
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync basedpyright --level error
      - name: Verify dashboard-session auth regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync pytest -q tests/test_guard_extension_control_dashboard_session_auth.py
      - name: Verify Test Lab regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync pytest -q tests/test_guard_extension_control_test_lab.py
      - name: Verify extension-control API regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync pytest -q tests/test_guard_extension_control_api.py
          git diff --check
      - name: Commit verified auth fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/protection-center-batch6-dashboard-session-auth-fix.yml
          git add src/codex_plugin_scanner/guard/daemon/server.py \
            tests/test_guard_extension_control_dashboard_session_auth.py \
            .github/workflows/protection-center-batch6-dashboard-session-auth-fix.yml
          git diff --cached --check
          git commit -m "fix(protection-center): authorize signed dashboard sessions"
          git push origin HEAD:feat/protection-center-06-cloud-boundary-hardening
