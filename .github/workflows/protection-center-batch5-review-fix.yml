name: Protection Center Batch 5 review fix
on:
  push:
    branches: [feat/protection-center-05-test-activity]
permissions:
  contents: write
jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Apply stale-result guard and regression contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          source_path = Path("dashboard/src/protection-center/protection-test-lab.tsx")
          source = source_path.read_text()
          replacements = [
              (
                  'type="button" onClick={() => { setCommand(example); setResult(null); setError(null); }} className="min-h-10 rounded-xl border border-slate-200 bg-slate-50 px-3 text-xs font-semibold text-slate-700 hover:bg-slate-100"',
                  'type="button" disabled={busy} onClick={() => { setCommand(example); setResult(null); setError(null); }} className="min-h-10 rounded-xl border border-slate-200 bg-slate-50 px-3 text-xs font-semibold text-slate-700 hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50"',
              ),
              (
                  '<textarea value={command} onChange=',
                  '<textarea value={command} disabled={busy} onChange=',
              ),
              (
                  '{command ? <button type="button" onClick={() => { setCommand(""); setResult(null); setError(null); }} className="min-h-11 rounded-xl border border-slate-300 bg-white px-4 text-sm font-semibold text-slate-700">Clear</button>',
                  '{command ? <button type="button" disabled={busy} onClick={() => { setCommand(""); setResult(null); setError(null); }} className="min-h-11 rounded-xl border border-slate-300 bg-white px-4 text-sm font-semibold text-slate-700 disabled:cursor-not-allowed disabled:opacity-50">Clear</button>',
              ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"expected exactly one source match for: {old[:64]}")
              source = source.replace(old, new)
          source_path.write_text(source)

          test_path = Path("dashboard/src/protection-center/protection-test-lab.test.tsx")
          test = test_path.read_text()
          old_import = 'import assert from "node:assert/strict";\nimport { createElement } from "react";'
          new_import = 'import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nimport { createElement } from "react";'
          if test.count(old_import) != 1:
              raise SystemExit("unexpected Test Lab test imports")
          test = test.replace(old_import, new_import)
          anchor = 'assert.match(markup, /4096/);'
          regression = 'assert.ok((readFileSync(new URL("./protection-test-lab.tsx", import.meta.url), "utf8").match(/disabled=\\{busy\\}/g) ?? []).length >= 3);'
          if test.count(anchor) != 1:
              raise SystemExit("unexpected Test Lab assertion anchor")
          test = test.replace(anchor, anchor + "\n" + regression)
          test_path.write_text(test)

          baseline = {
              "maximum_collected_cases": 14204,
              "maximum_test_source_lines": 313070,
              "schema_version": 1,
          }
          Path("ci/test-suite-ratchet-baseline.json").write_text(json.dumps(baseline, indent=2) + "\n")
          PY
          git diff --check
      - name: Verify dashboard contracts and rebuild packaged assets
        shell: bash
        run: |
          set -euo pipefail
          cd dashboard
          bun install --frozen-lockfile --ignore-scripts
          bun run test
          bun run build
      - name: Commit verified review fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/protection-center-batch5-review-fix.yml
          git add dashboard ci/test-suite-ratchet-baseline.json src/codex_plugin_scanner/guard/daemon/static .github/workflows/protection-center-batch5-review-fix.yml
          git diff --cached --check
          git commit -m "fix(protection-center): prevent stale Test Lab results"
          git push origin HEAD:feat/protection-center-05-test-activity
