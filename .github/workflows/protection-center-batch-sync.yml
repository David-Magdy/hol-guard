name: Protection Center batch 1 source and bundle sync

on:
  push:
    branches:
      - feat/protection-center-01-foundation

permissions:
  contents: write

concurrency:
  group: protection-center-batch-1-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Apply validated compatibility edits
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "dashboard/src/app.tsx",
              'if (view === "extensions") return "Extensions";',
              'if (view === "extensions") return "Protection Center";',
          )
          replace_once(
              "dashboard/src/approval-center-primitives.tsx",
              '{ href: "/extensions", label: "Extensions", view: "extensions", icon: HiMiniPuzzlePiece },',
              '{ href: "/extensions", label: "Protections", view: "extensions", icon: HiMiniPuzzlePiece },',
          )

          detail_path = Path("dashboard/src/extension-control-center-detail.tsx")
          detail = detail_path.read_text(encoding="utf-8")
          old_tabs = '''const TABS: Array<{ id: ExtensionDetailTab; label: string }> = [\n  { id: "overview", label: "Overview" },\n  { id: "commands", label: "Commands & rules" },\n  { id: "policy", label: "Policy" },\n  { id: "test-lab", label: "Test Lab" },\n  { id: "activity", label: "Activity" },\n];'''
          new_tabs = '''const TABS: Array<{ id: ExtensionDetailTab; label: string }> = [\n  { id: "overview", label: "Overview" },\n  { id: "commands", label: "Commands & rules" },\n];'''
          if detail.count(old_tabs) != 1:
              raise SystemExit("extension-control-center-detail.tsx: tab contract changed unexpectedly")
          detail = detail.replace(old_tabs, new_tabs, 1)
          marker = '  const setTab = (tab: ExtensionDetailTab) => props.onUrlState({ ...props.urlState, tab, ruleId: tab === "commands" ? props.urlState.ruleId : null });'
          if detail.count(marker) != 1:
              raise SystemExit("extension-control-center-detail.tsx: setTab marker changed unexpectedly")
          detail = detail.replace(marker, '  const activeTab: ExtensionDetailTab = TABS.some((item) => item.id === props.urlState.tab) ? props.urlState.tab : "overview";\n' + marker, 1)
          detail = detail.replace('props.urlState.tab ===', 'activeTab ===')
          detail = detail.replace('<HiMiniArrowLeft className="size-4" />Extensions</button>', '<HiMiniArrowLeft className="size-4" />Protections</button>')
          test_button = '<button type="button" onClick={props.onTest} className="mt-7 min-h-11 rounded-xl bg-brand-blue px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-dark">Test this rule</button>'
          if detail.count(test_button) != 1:
              raise SystemExit("extension-control-center-detail.tsx: Test this rule action changed unexpectedly")
          detail = detail.replace(test_button, '')
          overview_marker = '      {activeTab === "overview" ? <section'
          if detail.count(overview_marker) != 1:
              raise SystemExit("extension-control-center-detail.tsx: overview panel marker changed unexpectedly")
          notice = '      {activeTab !== props.urlState.tab ? <p role="status" className="mt-4 rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600">This older link points to a section that is not available in this build. Showing Overview instead.</p> : null}\n\n'
          detail = detail.replace(overview_marker, notice + overview_marker, 1)
          detail_path.write_text(detail, encoding="utf-8")

          routing_path = Path("dashboard/src/app-routing.test.ts")
          routing = routing_path.read_text(encoding="utf-8")
          route_assert = 'assert(viewTitle("about") === "About", "about view title is About");'
          if routing.count(route_assert) != 1:
              raise SystemExit("app-routing.test.ts: title marker changed unexpectedly")
          routing = routing.replace(route_assert, route_assert + '\nassert(viewTitle("extensions") === "Protection Center", "extensions compatibility view uses Protection Center title");', 1)
          routing_path.write_text(routing, encoding="utf-8")

          package_path = Path("dashboard/package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          new_test = "tsx src/protection-center/protection-center.test.tsx"
          parts = [part.strip() for part in package["scripts"]["test"].split("&&")]
          if new_test not in parts:
              parts.insert(0, new_test)
          package["scripts"]["test"] = " && ".join(parts)
          package_path.write_text(json.dumps(package, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Install dashboard dependencies
        run: cd dashboard && bun install --frozen-lockfile --ignore-scripts

      - name: Run dashboard tests
        run: cd dashboard && bun run test

      - name: Build packaged dashboard assets
        run: cd dashboard && bun run build

      - name: Verify source hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e dashboard/dist

      - name: Commit source edits and deterministic bundle
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/protection-center-batch-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            dashboard/package.json \
            dashboard/src/app.tsx \
            dashboard/src/app-routing.test.ts \
            dashboard/src/approval-center-primitives.tsx \
            dashboard/src/extension-control-center-detail.tsx \
            src/codex_plugin_scanner/guard/daemon/static \
            .github/workflows/protection-center-batch-sync.yml
          git diff --cached --check
          git commit -m "feat(protection-center): integrate foundation and packaged UI"
          git push origin HEAD:feat/protection-center-01-foundation
