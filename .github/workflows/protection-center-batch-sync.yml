name: Protection Center batch 3 detail sync

on:
  push:
    branches:
      - feat/protection-center-03-module-detail

permissions:
  contents: write

concurrency:
  group: protection-center-batch-3-detail
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Integrate Protection Module detail
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import json

          path = Path("dashboard/src/protection-center/protection-center-workspace.tsx")
          text = path.read_text(encoding="utf-8")
          old_import = 'import { ExtensionControlCenterDetail } from "../extension-control-center-detail";\n'
          if text.count(old_import) != 1:
              raise SystemExit("legacy detail import changed unexpectedly")
          text = text.replace(old_import, '', 1)
          marker = 'import { ProtectionLandingExperience } from "./protection-landing-experience";\n'
          if text.count(marker) != 1:
              raise SystemExit("landing import marker changed unexpectedly")
          text = text.replace(marker, marker + 'import { ProtectionModuleDetail } from "./protection-module-detail";\n', 1)

          old_detail = '''  if (routeState.route.kind === "detail" && selectedExtension) {\n    return <><ExtensionControlCenterDetail\n      extension={selectedExtension}\n      effective={state.effective}\n      catalogDigest={state.catalog.catalog_digest}\n      urlState={routeState.detail}\n      onUrlState={updateDetailState}\n      onBack={closeExtension}\n      onBroadControl={() => requestChange({ extension: selectedExtension, enabled: !isExtensionEnabled(state.effective, selectedExtension) })}\n    />{pending ? <ReviewModal change={pending} busy={busy} error={mutationError} approvalGate={resolvedApprovalGate} onCancel={() => { if (!busy) setPending(null); }} onConfirm={confirm} /> : null}{recoveryModal}</>;\n  }'''
          new_detail = '''  if (routeState.route.kind === "detail" && selectedExtension) {\n    return <><ProtectionModuleDetail\n      extension={selectedExtension}\n      effective={state.effective}\n      catalogDigest={state.catalog.catalog_digest}\n      onBack={closeExtension}\n      onChange={() => requestChange({ extension: selectedExtension, enabled: !isExtensionEnabled(state.effective, selectedExtension) })}\n    />{pending ? <ReviewModal change={pending} busy={busy} error={mutationError} approvalGate={resolvedApprovalGate} onCancel={() => { if (!busy) setPending(null); }} onConfirm={confirm} /> : null}{recoveryModal}</>;\n  }'''
          if text.count(old_detail) != 1:
              raise SystemExit("legacy detail render block changed unexpectedly")
          text = text.replace(old_detail, new_detail, 1)

          update_start = '  const updateDetailState = useCallback((next: ExtensionDetailUrlState) => {'
          update_end = '  }, [canonicalSelected]);\n\n'
          start = text.find(update_start)
          if start != -1:
              end = text.find(update_end, start)
              if end == -1:
                  raise SystemExit("detail URL callback terminator not found")
              text = text[:start] + text[end + len(update_end):]
          text = text.replace('  type ExtensionDetailUrlState,\n', '')
          text = "\n".join(line.rstrip() for line in text.splitlines()) + "\n"
          path.write_text(text, encoding="utf-8")

          package_path = Path("dashboard/package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          new_test = "tsx src/protection-center/protection-module-detail.test.tsx"
          parts = [part.strip() for part in package["scripts"]["test"].split("&&")]
          if new_test not in parts:
              parts.insert(2 if len(parts) >= 2 else len(parts), new_test)
          package["scripts"]["test"] = " && ".join(parts)
          package_path.write_text(json.dumps(package, indent=2) + "\n", encoding="utf-8")
          PY
      - run: cd dashboard && bun install --frozen-lockfile --ignore-scripts
      - run: cd dashboard && bun run test
      - run: cd dashboard && bun run build
      - name: Verify and commit deterministic bundle
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e dashboard/dist
          rm .github/workflows/protection-center-batch-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/package.json dashboard/src/protection-center/protection-center-workspace.tsx src/codex_plugin_scanner/guard/daemon/static .github/workflows/protection-center-batch-sync.yml
          git diff --cached --check
          git commit -m "feat(protection-center): integrate plain-language module detail"
          git push origin HEAD:feat/protection-center-03-module-detail
