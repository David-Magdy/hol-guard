name: Protection Center batch 2 source and bundle sync

on:
  push:
    branches:
      - feat/protection-center-02-landing

permissions:
  contents: write

concurrency:
  group: protection-center-batch-2-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Integrate novice landing into compatibility workspace
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import json

          path = Path("dashboard/src/protection-center/protection-center-workspace.tsx")
          text = path.read_text(encoding="utf-8")
          import_marker = 'import { PROTECTION_TERMS } from "./copy/protection-copy";\n'
          addition = 'import { ProtectionLandingExperience } from "./protection-landing-experience";\n'
          if addition not in text:
              if text.count(import_marker) != 1:
                  raise SystemExit("Protection Center import marker changed unexpectedly")
              text = text.replace(import_marker, import_marker + addition, 1)

          status_marker = '    {recoveryStatus ? <p role="status" className="mt-4 rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-700">{recoveryStatus}</p> : null}\n\n'
          landing = '''    {density === "simple" ? <ProtectionLandingExperience\n      catalog={catalogExtensions}\n      catalogDigest={state.catalog.catalog_digest}\n      effective={state.effective}\n      filters={filters}\n      onFilters={(patch) => setFilters((previous) => ({ ...previous, ...patch }))}\n      onClearFilters={() => setFilters(EMPTY_EXTENSION_FILTERS)}\n      onOpen={openExtension}\n    /> : null}\n\n'''
          if landing not in text:
              if text.count(status_marker) != 1:
                  raise SystemExit("Protection Center status marker changed unexpectedly")
              text = text.replace(status_marker, status_marker + landing, 1)

          section_start = '    <section aria-labelledby="protection-modules-heading" className="mt-8">\n'
          section_end = '    </section>\n\n    {density === "developer" ?'
          if section_start in text:
              if text.count(section_start) != 1 or text.count(section_end) != 1:
                  raise SystemExit("Legacy module section markers changed unexpectedly")
              text = text.replace(section_start, '    {density !== "simple" ? <section aria-labelledby="protection-modules-heading" className="mt-8">\n', 1)
              text = text.replace(section_end, '    </section> : null}\n\n    {density === "developer" ?', 1)

          text = "\n".join(line.rstrip() for line in text.splitlines()) + "\n"
          path.write_text(text, encoding="utf-8")

          package_path = Path("dashboard/package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          new_test = "tsx src/protection-center/protection-landing.test.tsx"
          parts = [part.strip() for part in package["scripts"]["test"].split("&&")]
          if new_test not in parts:
              parts.insert(1 if parts else 0, new_test)
          package["scripts"]["test"] = " && ".join(parts)
          package_path.write_text(json.dumps(package, indent=2) + "\n", encoding="utf-8")
          PY
      - run: cd dashboard && bun install --frozen-lockfile --ignore-scripts
      - run: cd dashboard && bun run test
      - run: cd dashboard && bun run build
      - name: Verify and commit deterministic bundle
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e dashboard/dist
          rm .github/workflows/protection-center-batch-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/package.json dashboard/src/protection-center/protection-center-workspace.tsx src/codex_plugin_scanner/guard/daemon/static .github/workflows/protection-center-batch-sync.yml
          git diff --cached --check
          git commit -m "feat(protection-center): integrate novice landing and packaged UI"
          git push origin HEAD:feat/protection-center-02-landing
