name: Protection Center batch 1 review fix sync

on:
  push:
    branches:
      - feat/protection-center-01-foundation

permissions:
  contents: write

concurrency:
  group: protection-center-batch-1-review-fix
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Apply reviewed setup-action fix
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          p = Path("dashboard/src/protection-center/protection-center-workspace.tsx")
          text = p.read_text(encoding="utf-8")
          old = '''  const handlePrimaryStatusAction = () => {\n    if (status.primaryAction === "repair" || status.primaryAction === "retry-repair") {\n      void recover();\n    } else if (status.primaryAction === "review-lockdown") {\n      requestChange({ globalLockdown: false });\n    } else {\n      void load();\n    }\n  };'''
          new = '''  const handlePrimaryStatusAction = () => {\n    if (status.primaryAction === "repair" || status.primaryAction === "retry-repair") {\n      void recover();\n    } else if (status.primaryAction === "review-lockdown") {\n      requestChange({ globalLockdown: false });\n    } else if (status.primaryAction === "finish-setup") {\n      setDensity("advanced");\n      requestAnimationFrame(() => document.getElementById("advanced-protection-controls")?.scrollIntoView({ block: "nearest" }));\n    } else {\n      void load();\n    }\n  };'''
          if text.count(old) != 1:
              raise SystemExit("primary-action handler changed unexpectedly")
          text = text.replace(old, new, 1)
          old_section = '{density !== "simple" ? <section className="mt-6 space-y-3" aria-label="Advanced protection controls">'
          new_section = '{density !== "simple" ? <section id="advanced-protection-controls" className="mt-6 space-y-3" aria-label="Advanced protection controls">'
          if text.count(old_section) != 1:
              raise SystemExit("advanced-controls section changed unexpectedly")
          text = text.replace(old_section, new_section, 1)
          p.write_text(text, encoding="utf-8")
          PY
      - run: cd dashboard && bun install --frozen-lockfile --ignore-scripts
      - run: cd dashboard && bun run test
      - run: cd dashboard && bun run build
      - name: Verify and commit deterministic bundle
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm .github/workflows/protection-center-batch-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/src/protection-center/protection-center-workspace.tsx src/codex_plugin_scanner/guard/daemon/static .github/workflows/protection-center-batch-sync.yml
          git diff --cached --check
          git commit -m "fix(protection-center): reveal required enrollment steps"
          git push origin HEAD:feat/protection-center-01-foundation
