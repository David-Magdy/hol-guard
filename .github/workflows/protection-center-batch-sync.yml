name: Protection Center batch 2 refinement sync

on:
  push:
    branches:
      - feat/protection-center-02-landing

permissions:
  contents: write

concurrency:
  group: protection-center-batch-2-refinement
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Apply reviewed landing refinements
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "dashboard/src/protection-center/model/protection-landing.ts",
              '    const recencyScore = used ? Math.max(0, 10_000_000_000_000 - Math.max(0, Date.now() - Date.parse(used.lastAt))) : 0;',
              '    const recencyScore = used ? Math.max(0, Date.parse(used.lastAt)) : 0;',
          )

          panels = Path("dashboard/src/protection-center/components/protection-landing-panels.tsx")
          text = panels.read_text(encoding="utf-8")
          text = text.replace('import { useMemo, useState } from "react";', 'import { useEffect, useMemo, useRef, useState } from "react";', 1)
          old = '''  const hasInUse = props.modules.some((module) => module.section === "in-use");\n  const [section, setSection] = useState<ProtectionModuleSection>(hasInUse ? "in-use" : "recommended");\n  const [query, setQuery] = useState("");\n  const [advancedOpen, setAdvancedOpen] = useState(false);'''
          new = '''  const hasInUse = props.modules.some((module) => module.section === "in-use");\n  const [section, setSection] = useState<ProtectionModuleSection>(hasInUse ? "in-use" : "recommended");\n  const sectionTouched = useRef(false);\n  const [query, setQuery] = useState("");\n  const [advancedOpen, setAdvancedOpen] = useState(false);\n  useEffect(() => {\n    if (hasInUse && !sectionTouched.current && section !== "in-use") setSection("in-use");\n  }, [hasInUse, section]);'''
          if text.count(old) != 1:
              raise SystemExit("ProtectionModuleExplorer state block changed unexpectedly")
          text = text.replace(old, new, 1)
          old_click = 'onClick={() => setSection(id)}'
          new_click = 'onClick={() => { sectionTouched.current = true; setSection(id); }}'
          if text.count(old_click) != 1:
              raise SystemExit("ProtectionModuleExplorer tab click changed unexpectedly")
          text = text.replace(old_click, new_click, 1)
          panels.write_text(text, encoding="utf-8")

          workspace = Path("dashboard/src/protection-center/protection-center-workspace.tsx")
          text = workspace.read_text(encoding="utf-8")
          state_marker = '  const [provenanceOpen, setProvenanceOpen] = useState(false);'
          if text.count(state_marker) != 1:
              raise SystemExit("workspace provenance state changed unexpectedly")
          text = text.replace(state_marker, state_marker + '\n  const [troubleshootingOpen, setTroubleshootingOpen] = useState(false);', 1)
          old_setup = '''    } else if (status.primaryAction === "finish-setup") {\n      setDensity("advanced");\n      requestAnimationFrame(() => document.getElementById("advanced-protection-controls")?.scrollIntoView({ block: "nearest" }));'''
          new_setup = '''    } else if (status.primaryAction === "finish-setup") {\n      setDensity("advanced");\n      setTroubleshootingOpen(true);\n      requestAnimationFrame(() => document.getElementById("advanced-protection-controls")?.scrollIntoView({ block: "nearest" }));'''
          if text.count(old_setup) != 1:
              raise SystemExit("workspace setup action changed unexpectedly")
          text = text.replace(old_setup, new_setup, 1)
          old_banner = '      <ExtensionStatusBanner busy={recoveryBusy} effective={state.effective} error={recoveryError} status={recoveryStatus} onRecover={() => { void recover(); }} onRetry={load} />'
          new_banner = '''      <details open={troubleshootingOpen} onToggle={(event) => setTroubleshootingOpen(event.currentTarget.open)} className="rounded-2xl border border-slate-200 bg-white p-4">\n        <summary className="cursor-pointer text-sm font-semibold text-slate-800">Troubleshooting</summary>\n        <div className="mt-3"><ExtensionStatusBanner busy={recoveryBusy} effective={state.effective} error={recoveryError} status={recoveryStatus} onRecover={() => { void recover(); }} onRetry={load} /></div>\n      </details>'''
          if text.count(old_banner) != 1:
              raise SystemExit("workspace recovery banner changed unexpectedly")
          text = text.replace(old_banner, new_banner, 1)
          workspace.write_text(text, encoding="utf-8")

          experience = Path("dashboard/src/protection-center/protection-landing-experience.tsx")
          text = experience.read_text(encoding="utf-8")
          old_health = '      setHealthResult(evaluateProtectionHealth(catalog.catalog_digest, effective, runtime));'
          new_health = '''      const result = evaluateProtectionHealth(catalog.catalog_digest, effective, runtime);\n      if (catalog.catalog_digest !== props.catalogDigest) {\n        result.status = "needs-attention";\n        result.summary = "Protection data changed since this page loaded. Refresh Protection Center before making changes.";\n        result.checks.push({ id: "view-freshness", label: "This page matches the latest protection catalog", passed: false });\n      }\n      setHealthResult(result);'''
          if text.count(old_health) != 1:
              raise SystemExit("health result marker changed unexpectedly")
          experience.write_text(text.replace(old_health, new_health, 1), encoding="utf-8")

          workflow = Path(".github/workflows/extension-control-center-installed-ci.yml")
          text = workflow.read_text(encoding="utf-8")
          marker = '            installed-protection-center-simple-800.png \\\n            installed-protection-center-simple-1440.png; do'
          replacement = '            installed-protection-center-simple-800.png \\\n            installed-protection-center-simple-1024.png \\\n            installed-protection-center-simple-1440.png \\\n            installed-protection-center-simple-zoom-200.png; do'
          if text.count(marker) != 1:
              raise SystemExit("installed proof screenshot list changed unexpectedly")
          workflow.write_text(text.replace(marker, replacement, 1), encoding="utf-8")
          PY
      - run: cd dashboard && bun install --frozen-lockfile --ignore-scripts
      - run: cd dashboard && bun run test
      - run: cd dashboard && bun run build
      - name: Verify and commit deterministic bundle
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e dashboard/dist
          rm .github/workflows/protection-center-batch-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            dashboard/src/protection-center/model/protection-landing.ts \
            dashboard/src/protection-center/components/protection-landing-panels.tsx \
            dashboard/src/protection-center/protection-center-workspace.tsx \
            dashboard/src/protection-center/protection-landing-experience.tsx \
            .github/workflows/extension-control-center-installed-ci.yml \
            src/codex_plugin_scanner/guard/daemon/static \
            .github/workflows/protection-center-batch-sync.yml
          git diff --cached --check
          git commit -m "fix(protection-center): refine novice landing interactions"
          git push origin HEAD:feat/protection-center-02-landing
