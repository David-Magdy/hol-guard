name: Snapshot final scanner assurance branch

on:
  push:
    branches:
      - feat/scanner-assurance-rust-hardening-20260816
    paths:
      - .github/workflows/tmp-snapshot-scanner-assurance-final.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/scanner-assurance-rust-hardening-20260816
          persist-credentials: false
      - name: Record branch state
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > scanner-assurance-branch-sha.txt
          git status --short > scanner-assurance-branch-status.txt
      - name: Upload branch snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scanner-assurance-final-branch-source
          path: |
            scanner-assurance-branch-sha.txt
            scanner-assurance-branch-status.txt
            pyproject.toml
            uv.lock
            rust/scanner-engine
            schemas
            src/codex_plugin_scanner
            tests
            scripts
            docs/ai-plugin-scanner
            .github/workflows
            .scanner-assurance-final
            .scanner-assurance-final-diagnostics
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
