name: Scanner assurance completion watchdog

on:
  push:
    branches:
      - feat/scanner-assurance-rust-hardening-20260816
    paths:
      - .github/workflows/tmp-scanner-assurance-watchdog.yml
      - scripts/tmp_scanner_assurance_watchdog.py
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: scanner-assurance-materialization
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: feat/scanner-assurance-rust-hardening-20260816
      CARGO_TARGET_DIR: ${{ runner.temp }}/hol-guard-scanner-engine-target
      HOL_GUARD_SCANNER_ENGINE: ${{ runner.temp }}/hol-guard-scanner-engine-target/release/hol-guard-scanner-engine
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/scanner-assurance-rust-hardening-20260816
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            rust/scanner-engine/Cargo.lock
      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.82.0 --profile minimal --no-self-update
          rustup default 1.82.0
      - name: Materialize and repair
        shell: bash
        run: |
          set -euo pipefail
          if test -d .scanner-assurance-final; then
            test -f scripts/tmp_finalize_scanner_assurance.py
            python scripts/tmp_finalize_scanner_assurance.py
          fi
          python scripts/tmp_scanner_assurance_watchdog.py
          uv lock
          cargo generate-lockfile --manifest-path rust/scanner-engine/Cargo.toml
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync ruff check --fix \
            src/codex_plugin_scanner/assurance \
            src/codex_plugin_scanner/assurance_cli.py \
            src/codex_plugin_scanner/models.py \
            src/codex_plugin_scanner/reporting.py \
            src/codex_plugin_scanner/cli_ui.py \
            src/codex_plugin_scanner/scanner.py \
            src/codex_plugin_scanner/_scanner_commands.py \
            src/codex_plugin_scanner/quality_artifact.py \
            tests/test_assurance_*.py
          uv run --no-sync ruff format \
            src/codex_plugin_scanner/assurance \
            src/codex_plugin_scanner/assurance_cli.py \
            src/codex_plugin_scanner/models.py \
            src/codex_plugin_scanner/reporting.py \
            src/codex_plugin_scanner/cli_ui.py \
            src/codex_plugin_scanner/scanner.py \
            src/codex_plugin_scanner/_scanner_commands.py \
            src/codex_plugin_scanner/quality_artifact.py \
            tests/test_assurance_*.py
          cargo fmt --manifest-path rust/scanner-engine/Cargo.toml
          set +e
          cargo fix --locked --manifest-path rust/scanner-engine/Cargo.toml --all-targets --allow-dirty --allow-staged
          set -e
      - name: Validate all scanner assurance layers
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          cargo fmt --manifest-path rust/scanner-engine/Cargo.toml -- --check
          cargo clippy --locked --manifest-path rust/scanner-engine/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path rust/scanner-engine/Cargo.toml
          cargo build --release --locked --manifest-path rust/scanner-engine/Cargo.toml
          python -m compileall -q src/codex_plugin_scanner/assurance src/codex_plugin_scanner/assurance_cli.py
          uv run --no-sync ruff check \
            src/codex_plugin_scanner/assurance \
            src/codex_plugin_scanner/assurance_cli.py \
            src/codex_plugin_scanner/models.py \
            src/codex_plugin_scanner/reporting.py \
            src/codex_plugin_scanner/cli_ui.py \
            src/codex_plugin_scanner/scanner.py \
            src/codex_plugin_scanner/_scanner_commands.py \
            src/codex_plugin_scanner/quality_artifact.py \
            tests/test_assurance_*.py
          uv run --no-sync ruff format --check \
            src/codex_plugin_scanner/assurance \
            src/codex_plugin_scanner/assurance_cli.py \
            src/codex_plugin_scanner/models.py \
            src/codex_plugin_scanner/reporting.py \
            src/codex_plugin_scanner/cli_ui.py \
            src/codex_plugin_scanner/scanner.py \
            src/codex_plugin_scanner/_scanner_commands.py \
            src/codex_plugin_scanner/quality_artifact.py \
            tests/test_assurance_*.py
          uv run --no-sync basedpyright --level error \
            src/codex_plugin_scanner/assurance \
            src/codex_plugin_scanner/assurance_cli.py
          uv run --no-sync pytest tests/test_assurance_*.py --tb=short
          uv run --no-sync pytest \
            tests/test_policy.py \
            tests/test_reporting.py \
            tests/test_schema_contracts.py \
            tests/test_security_ops.py \
            tests/test_integration.py \
            tests/test_verification.py \
            tests/test_cli.py \
            --tb=short
          uv run --no-sync python scripts/ci/test_inventory.py --output /tmp/test-inventory.json
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory /tmp/test-inventory.json
          uv build --wheel
          git diff --check
          printf '\0asm\1\0\0\0' > /tmp/fixture.wasm
          "$HOL_GUARD_SCANNER_ENGINE" inspect \
            --path /tmp/fixture.wasm \
            --display-path fixture.wasm \
            --max-bytes 1048576 \
            --max-strings 1000 > /tmp/rust-engine.json
          python - <<'PY'
          import json
          value=json.load(open('/tmp/rust-engine.json'))
          assert value['schema_version'] == 'hol-guard.scanner-engine.v1'
          assert value['summary']['format'] == 'wasm'
          assert value['summary']['signature']['verified'] is False
          PY
          rm -rf /tmp/hol-guard-wheel-venv /tmp/hol-guard-wheel-fixture
          python -m venv /tmp/hol-guard-wheel-venv
          /tmp/hol-guard-wheel-venv/bin/pip install --disable-pip-version-check dist/*.whl
          mkdir -p /tmp/hol-guard-wheel-fixture
          printf '# reviewed extension\n' > /tmp/hol-guard-wheel-fixture/README.md
          HOL_GUARD_SCANNER_ENGINE="$HOL_GUARD_SCANNER_ENGINE" \
            /tmp/hol-guard-wheel-venv/bin/hol-guard-extension-security scan \
            /tmp/hol-guard-wheel-fixture \
            --output /tmp/installed-assurance.json
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          value=json.loads(Path('/tmp/installed-assurance.json').read_text())
          schema=json.loads(Path('schemas/assurance-report.v1.json').read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(value)
          assert value['coverage']['limitations']
          assert len(value['artifact_digest']) == 64
          assert len(value['evidence_digest']) == 64
          PY
      - name: Commit exact validated head
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .scanner-assurance-final .scanner-assurance-repair
          rm -rf .scanner-assurance-diagnostics .scanner-assurance-diagnostics-next
          rm -rf .scanner-assurance-final-diagnostics
          rm -f scripts/tmp_apply_scanner_assurance.py
          rm -f scripts/tmp_auto_repair_scanner_assurance.py
          rm -f scripts/tmp_finalize_scanner_assurance.py
          rm -f scripts/tmp_scanner_assurance_watchdog.py
          rm -f .github/workflows/tmp-apply-scanner-assurance.yml
          rm -f .github/workflows/tmp-harden-scanner-assurance.yml
          rm -f .github/workflows/tmp-validate-scanner-assurance.yml
          rm -f .github/workflows/tmp-auto-repair-scanner-assurance.yml
          rm -f .github/workflows/tmp-scanner-hardening-source-snapshot.yml
          rm -f .github/workflows/tmp-finalize-scanner-assurance.yml
          rm -f .github/workflows/tmp-snapshot-scanner-assurance-final.yml
          rm -f .github/workflows/tmp-finalize-scanner-assurance-v2.yml
          rm -f .github/workflows/tmp-scanner-assurance-watchdog.yml
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -s -m "feat(scanner): complete layered assurance and Rust hardening"
            git pull --rebase origin "$BRANCH"
            git push origin HEAD:"$BRANCH"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Create or locate release pull request
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base release/3.0 --state open --json number --jq '.[0].number // empty')
          if test -z "$pr"; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --head "$BRANCH" \
              --base release/3.0 \
              --title "feat(scanner): layered assurance, Cloud ingestion, and Rust native analysis" \
              --body "Completes layered extension assurance for AI plugins, MCP servers, and skills. Adds consuming-side Cloud/registry verification and quarantine, exact-artifact provenance and detonation binding, managed drift and policy, exhaustive common-vector regression coverage, and a bounded Rust PE/ELF/Mach-O/WebAssembly hot path. Static cleanliness remains explicitly non-conclusive."
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base release/3.0 --state open --json number --jq '.[0].number')
          fi
          test -n "$pr"
          echo "number=$pr" >> "$GITHUB_OUTPUT"
      - name: Wait for reviewed exact-head checks
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 5400))
          while (( SECONDS < deadline )); do
            read -r head base state < <(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid,baseRefName,state --jq '[.headRefOid,.baseRefName,.state] | @tsv')
            test "$head" = "$EXPECTED_SHA"
            test "$base" = release/3.0
            test "$state" = OPEN
            if gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --required >/tmp/pr-checks.txt 2>&1; then
              unresolved=$(gh api graphql -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}} reviews(first:100){nodes{state}}}}}' -f owner=hashgraph-online -f repo=hol-guard -F number="$PR_NUMBER" --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')
              changes=$(gh api graphql -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviews(first:100){nodes{state}}}}}' -f owner=hashgraph-online -f repo=hol-guard -F number="$PR_NUMBER" --jq '[.data.repository.pullRequest.reviews.nodes[] | select(.state == "CHANGES_REQUESTED")] | length')
              if test "$unresolved" = 0 && test "$changes" = 0; then
                break
              fi
            fi
            sleep 30
          done
          (( SECONDS < deadline ))
          gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --required
      - name: Merge exact head without override
        id: merge
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" = "$EXPECTED_SHA"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --delete-branch --match-head-commit "$EXPECTED_SHA"
          merge_sha=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json mergeCommit,state --jq 'select(.state == "MERGED") | .mergeCommit.oid')
          test -n "$merge_sha"
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"
      - name: Verify post-merge release workflows
        shell: bash
        env:
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 5400))
          while (( SECONDS < deadline )); do
            runs=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$MERGE_SHA&per_page=100")
            ci=$(jq -r '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")] | sort_by(.created_at) | last | .conclusion // empty' <<<"$runs")
            assurance=$(jq -r '[.workflow_runs[] | select(.path == ".github/workflows/scanner-assurance.yml")] | sort_by(.created_at) | last | .conclusion // empty' <<<"$runs")
            if test "$ci" = success && test "$assurance" = success; then
              jq -n --arg pr '${{ steps.pr.outputs.number }}' --arg head '${{ steps.commit.outputs.sha }}' --arg merge "$MERGE_SHA" '{schema_version:"hol-guard.scanner-assurance-release.v1",pull_request:($pr|tonumber),reviewed_head:$head,merge_commit:$merge,base:"release/3.0",main_untouched:true,admin_override:false,post_merge:{ci:"success",scanner_assurance:"success"}}' > /tmp/scanner-assurance-release.json
              cat /tmp/scanner-assurance-release.json
              exit 0
            fi
            if test "$ci" =~ ^(failure|cancelled|timed_out)$ || test "$assurance" =~ ^(failure|cancelled|timed_out)$; then
              echo "$runs" > /tmp/post-merge-runs.json
              exit 1
            fi
            sleep 30
          done
          exit 1
      - name: Upload completion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scanner-assurance-completion-evidence
          path: |
            /tmp/scanner-assurance-release.json
            /tmp/post-merge-runs.json
            /tmp/pr-checks.txt
          if-no-files-found: ignore
          retention-days: 30
