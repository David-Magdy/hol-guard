name: Fix release 3.0 final contracts

on:
  push:
    branches:
      - fix/release-3.0-cline-dashboard-contract

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true

      - name: Fix release and product-model contracts
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path(".github/workflows/publish.yml"); s=p.read_text(); old="  pull_request:\n    branches: [main, release/3.0, release/3.1]\n"; new="  pull_request:\n    branches: [main, release/3.0]\n"; assert old in s; p.write_text(s.replace(old,new,1))'
          python -c 'from pathlib import Path; p=Path("tests/test_guard_product_model_contracts.py"); s=p.read_text(); old="        \"cursor\",\n        \"gemini\",\n"; new="        \"cursor\",\n        \"cline\",\n        \"gemini\",\n"; assert old in s; p.write_text(s.replace(old,new,1))'

      - name: Commit scoped contract fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/publish.yml tests/test_guard_product_model_contracts.py
          git commit -m "fix(release): align 3.0 canary and harness contracts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
