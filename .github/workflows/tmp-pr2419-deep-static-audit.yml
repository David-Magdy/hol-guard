name: PR 2419 deep static audit

on:
  push:
    branches:
      - refactor/release-3-code-quality-hardening
    paths:
      - .github/workflows/tmp-pr2419-deep-static-audit.yml

permissions:
  contents: read

concurrency:
  group: pr-2419-deep-static-audit
  cancel-in-progress: true

jobs:
  audit:
    if: >-
      github.repository == 'hashgraph-online/hol-guard' &&
      github.ref == 'refs/heads/refactor/release-3-code-quality-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: refactor/release-3-code-quality-hardening
          fetch-depth: 10000
          show-progress: false
          persist-credentials: false
      - name: Reconcile current release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet --no-tags --depth=10000 \
            origin release/3.0:refs/remotes/origin/release/3.0
          set +e
          git merge --no-commit --no-ff origin/release/3.0
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            for path in "${conflicts[@]}"; do
              case "$path" in
                ci/test-suite-ratchet-baseline.json)
                  python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = "ci/test-suite-ratchet-baseline.json"
          payloads = [
              json.loads(subprocess.check_output(["git", "show", f":{stage}:{path}"], text=True))
              for stage in (2, 3)
          ]
          Path(path).write_text(
              json.dumps(
                  {
                      "maximum_collected_cases": max(item["maximum_collected_cases"] for item in payloads),
                      "maximum_test_source_lines": max(item["maximum_test_source_lines"] for item in payloads),
                      "schema_version": 1,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
                  git add "$path"
                  ;;
                tests/fixtures/guard-command-corpus/decision-diff-report.json)
                  git checkout --ours -- "$path"
                  git add "$path"
                  ;;
                tests/test_release_train_workflow.py)
                  git checkout --theirs -- "$path"
                  git add "$path"
                  ;;
                *)
                  echo "Unexpected merge conflict: $path" >&2
                  exit 1
                  ;;
              esac
            done
            test -z "$(git diff --name-only --diff-filter=U)"
          fi
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
          save-cache: false
      - name: Install project development environment
        run: uv sync --frozen --extra dev --python 3.12
      - name: Run Ruff dead-code checks
        shell: bash
        run: |
          set +e
          uv run --no-sync ruff check \
            src scripts ci action integrations guarded-repository \
            --select F401,F811,F821,F841,RUF100 \
            --output-format concise \
            > "${RUNNER_TEMP}/ruff-dead-code.txt" 2>&1
          status=$?
          echo "ruff_status=$status" >> "${RUNNER_TEMP}/audit-status.txt"
          cat "${RUNNER_TEMP}/ruff-dead-code.txt"
          exit 0
      - name: Run conservative Vulture scan
        shell: bash
        run: |
          set +e
          uvx --from vulture==2.14 vulture \
            src/codex_plugin_scanner \
            scripts \
            --min-confidence 80 \
            --sort-by-size \
            > "${RUNNER_TEMP}/vulture.txt" 2>&1
          status=$?
          echo "vulture_status=$status" >> "${RUNNER_TEMP}/audit-status.txt"
          cat "${RUNNER_TEMP}/vulture.txt"
          exit 0
      - name: Find exact duplicate source blocks
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          from collections import defaultdict
          from pathlib import Path

          roots = [Path("src"), Path("scripts"), Path("ci"), Path("dashboard/src"), Path("rust")]
          suffixes = {".py", ".rs", ".js", ".mjs", ".cjs", ".ts", ".tsx"}
          excluded = {"node_modules", "target", "static", "assets", ".venv", "__pycache__"}
          window = 12
          groups: dict[str, list[dict[str, object]]] = defaultdict(list)
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix.lower() not in suffixes:
                      continue
                  if any(part in excluded for part in path.parts):
                      continue
                  lines = path.read_text(encoding="utf-8", errors="ignore").splitlines()
                  normalized: list[tuple[int, str]] = []
                  for number, line in enumerate(lines, 1):
                      stripped = line.strip()
                      if not stripped or stripped.startswith(("#", "//")):
                          continue
                      stripped = re.sub(r"\s+", " ", stripped)
                      normalized.append((number, stripped))
                  for index in range(0, max(0, len(normalized) - window + 1)):
                      block = normalized[index : index + window]
                      payload = "\n".join(line for _number, line in block)
                      if len(payload) < 180:
                          continue
                      digest = hashlib.sha256(payload.encode("utf-8")).hexdigest()
                      groups[digest].append(
                          {
                              "path": path.as_posix(),
                              "start_line": block[0][0],
                              "end_line": block[-1][0],
                              "preview": payload[:500],
                          }
                      )
          result = []
          for digest, instances in groups.items():
              distinct_paths = {str(item["path"]) for item in instances}
              if len(distinct_paths) < 2:
                  continue
              result.append({"digest": digest, "instances": instances})
          result.sort(
              key=lambda item: (len(item["instances"]), len(item["instances"][0]["preview"])),
              reverse=True,
          )
          output = Path("${RUNNER_TEMP}") / "duplicate-blocks.json"
          output.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"duplicate block groups: {len(result)}")
          PY
      - name: Run existing structural audit
        shell: bash
        run: |
          PYTHONPATH=scripts/ci uv run --no-sync python scripts/ci/code_quality_audit.py \
            --root . \
            --json-output "${RUNNER_TEMP}/code-quality-audit.json"
      - name: Upload deep audit results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-2419-deep-static-audit
          path: |
            ${{ runner.temp }}/audit-status.txt
            ${{ runner.temp }}/ruff-dead-code.txt
            ${{ runner.temp }}/vulture.txt
            ${{ runner.temp }}/duplicate-blocks.json
            ${{ runner.temp }}/code-quality-audit.json
          if-no-files-found: error
          retention-days: 1
