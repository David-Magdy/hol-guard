name: Finalize Managed Controls batch 02 evidence

on:
  pull_request:
    branches:
      - release/3.0
    paths:
      - .github/workflows/finalize-managed-controls-batch02.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-managed-controls-batch02-evidence
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'managed-controls/batch-02-actions-limits-clean'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: managed-controls/batch-02-actions-limits-clean
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Refresh exact source-bound decision evidence
        run: |
          uv run --no-sync python tests/guard_command_decision_diff.py --write
          uv run --no-sync python tests/guard_command_decision_diff.py --check

      - name: Refresh reviewed structural-quality baseline
        run: |
          uv run --no-sync python scripts/ci/code_quality_audit.py \
            --root . \
            --baseline ci/code-quality-baseline.json \
            --write-baseline
          uv run --no-sync python scripts/ci/code_quality_audit.py \
            --root . \
            --baseline ci/code-quality-baseline.json \
            --json-output code-quality-audit.json

      - name: Verify test-suite ratchet and changed Python
        run: |
          uv run --no-sync python scripts/ci/test_inventory.py --output test-inventory.json
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory test-inventory.json
          uv run --no-sync ruff check \
            src/codex_plugin_scanner/guard/daemon/extension_control_api.py \
            src/codex_plugin_scanner/guard/daemon/server.py \
            src/codex_plugin_scanner/guard/runtime/command_extensions.py \
            src/codex_plugin_scanner/guard/runtime/extension_control_limits.py \
            src/codex_plugin_scanner/guard/runtime/extension_control_resolver.py \
            tests/test_guard_extension_control_catalog_wire.py \
            tests/test_managed_controls_limits.py
          uv run --no-sync ruff format --check \
            src/codex_plugin_scanner/guard/daemon/extension_control_api.py \
            src/codex_plugin_scanner/guard/daemon/server.py \
            src/codex_plugin_scanner/guard/runtime/command_extensions.py \
            src/codex_plugin_scanner/guard/runtime/extension_control_limits.py \
            src/codex_plugin_scanner/guard/runtime/extension_control_resolver.py \
            tests/test_guard_extension_control_catalog_wire.py \
            tests/test_managed_controls_limits.py

      - name: Verify focused Managed Controls contracts
        run: |
          uv run --no-sync pytest \
            tests/test_managed_controls_limits.py \
            tests/test_guard_extension_control_api.py \
            tests/test_guard_extension_control_catalog_detail.py \
            tests/test_guard_extension_control_catalog_wire.py \
            --tb=short

      - name: Commit exact generated evidence and remove temporary workflows
        run: |
          rm -f \
            .github/workflows/finalize-managed-controls-batch02.yml \
            .github/workflows/points-portal-source-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: refresh managed controls release evidence"
          git push origin HEAD:managed-controls/batch-02-actions-limits-clean
