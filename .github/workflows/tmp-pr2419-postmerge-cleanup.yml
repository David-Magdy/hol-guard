name: Clean PR 2419 delivery residue

on:
  push:
    branches:
      - release/3.0
    paths:
      - .github/workflows/tmp-pr2419-postmerge-cleanup.yml

permissions:
  contents: write

env:
  PUSH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GH_PAT || secrets.GITHUB_PAT || secrets.HOL_GITHUB_TOKEN || secrets.REPO_PAT || secrets.PAT_TOKEN || secrets.BOT_TOKEN || secrets.ADMIN_TOKEN || secrets.CI_GITHUB_TOKEN || github.token }}

jobs:
  cleanup:
    if: github.repository == 'hashgraph-online/hol-guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: release/3.0
          fetch-depth: 0
          token: ${{ env.PUSH_TOKEN }}
      - name: Remove temporary delivery residue
        env:
          GH_TOKEN: ${{ env.PUSH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$(gh api "repos/${GH_REPO}/pulls/2419" --jq '.merged_at // empty')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find .github/workflows -maxdepth 1 -type f -name 'tmp-*' -delete
          rm -f .github/workflows/rust-daemon-edge-hardening.yml
          rm -rf .github/rust-required-gzip-b64 .github/rust-required-patch
          rm -f scripts/ci/apply_daemon_edge_hardening.py
          git add -A
          git diff --cached --check
          git commit -m "chore: remove PR 2419 delivery residue" \
            -m "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push origin HEAD:release/3.0
