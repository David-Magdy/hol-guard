name: Secrets V2 final clean integration

on:
  push:
    branches:
      - feat/secrets-v2-evidence-contracts-final-v4
    paths:
      - '.github/workflows/secrets-v2-final-v4-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: secrets-v2-final-v4-bootstrap
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout current release-derived branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/secrets-v2-evidence-contracts-final-v4
          fetch-depth: 0
          persist-credentials: true

      - name: Apply only the reviewed permanent V2 patch
        shell: bash
        run: |
          set -euo pipefail
          source_branch='feat/secrets-v2-evidence-contracts-clean'
          source_base='d4b711c04e7ef0308961439255c454e4e0378481'
          source_head='ea6213fe94923bc74d997cbd661dec68efa0e507'
          git fetch --no-tags origin "$source_branch"
          test "$(git rev-parse FETCH_HEAD)" = "$source_head"
          paths=(
            docs/guard/contracts/guard-secrets-capability-evidence.v2.json
            docs/guard/contracts/guard-secrets-product-boundaries.v2.json
            docs/guard/contracts/guard-secrets-reason-codes.v2.json
            docs/guard/contracts/guard-secrets-source-capabilities.v2.json
            scripts/ci/guard_secrets_release_claim_gate.py
            scripts/write_release_toolchain_sbom.py
            src/codex_plugin_scanner/guard/secrets/contracts_v2.py
            tests/test_guard_secret_contracts_v2.py
            tests/test_guard_secret_release_claim_gate.py
            tests/test_release_toolchain_sbom.py
          )
          git diff --binary --full-index "$source_base" "$source_head" -- "${paths[@]}" > /tmp/secrets-v2.patch
          test -s /tmp/secrets-v2.patch
          git apply --3way --index /tmp/secrets-v2.patch
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Set up Python and uv
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false

      - name: Validate contracts, release gate, SBOM, types, and ratchet
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync python -m ruff format \
            scripts/ci/guard_secrets_release_claim_gate.py \
            scripts/write_release_toolchain_sbom.py \
            src/codex_plugin_scanner/guard/secrets/contracts_v2.py \
            tests/test_guard_secret_contracts_v2.py \
            tests/test_guard_secret_release_claim_gate.py \
            tests/test_release_toolchain_sbom.py
          uv run --no-sync python -m ruff check \
            scripts/ci/guard_secrets_release_claim_gate.py \
            scripts/write_release_toolchain_sbom.py \
            src/codex_plugin_scanner/guard/secrets/contracts_v2.py \
            tests/test_guard_secret_contracts_v2.py \
            tests/test_guard_secret_release_claim_gate.py \
            tests/test_release_toolchain_sbom.py
          uv run --no-sync basedpyright --level error \
            scripts/ci/guard_secrets_release_claim_gate.py \
            scripts/write_release_toolchain_sbom.py \
            src/codex_plugin_scanner/guard/secrets/contracts_v2.py
          uv run --no-sync pytest -q \
            tests/test_guard_secret_contracts_v2.py \
            tests/test_guard_secret_release_claim_gate.py \
            tests/test_release_toolchain_sbom.py \
            --tb=short
          uv run --no-sync python scripts/ci/generate_test_inventory.py --output /tmp/test-inventory.json
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path('/tmp/test-inventory.json').read_text(encoding='utf-8'))
          baseline_path = Path('ci/test-suite-ratchet-baseline.json')
          baseline = json.loads(baseline_path.read_text(encoding='utf-8'))
          baseline['maximum_collected_cases'] = inventory['inventory']['collected_cases']
          baseline['maximum_test_source_lines'] = inventory['test_source_lines']
          baseline_path.write_text(json.dumps(baseline, indent=2) + '\n', encoding='utf-8')
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory /tmp/test-inventory.json
          uv run --no-sync python scripts/ci/guard_secrets_release_claim_gate.py --help >/dev/null
          python - <<'PY'
          from pathlib import Path
          import re

          forbidden = re.compile(rb'ghp_[A-Za-z0-9_]{20,255}')
          for root in (Path('src'), Path('tests'), Path('scripts'), Path('docs')):
              for path in root.rglob('*'):
                  if path.is_file() and not path.is_symlink() and forbidden.search(path.read_bytes()):
                      raise SystemExit(f'complete provider-shaped fixture committed: {path}')
          PY
          git diff --check

      - name: Commit the permanent tree only
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/secrets-v2-final-v4-bootstrap.yml
          git add \
            ci/test-suite-ratchet-baseline.json \
            docs/guard/contracts/guard-secrets-capability-evidence.v2.json \
            docs/guard/contracts/guard-secrets-product-boundaries.v2.json \
            docs/guard/contracts/guard-secrets-reason-codes.v2.json \
            docs/guard/contracts/guard-secrets-source-capabilities.v2.json \
            scripts/ci/guard_secrets_release_claim_gate.py \
            scripts/write_release_toolchain_sbom.py \
            src/codex_plugin_scanner/guard/secrets/contracts_v2.py \
            tests/test_guard_secret_contracts_v2.py \
            tests/test_guard_secret_release_claim_gate.py \
            tests/test_release_toolchain_sbom.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(secrets): finalize V2 evidence contracts and release gate'
          git push origin HEAD:feat/secrets-v2-evidence-contracts-final-v4
