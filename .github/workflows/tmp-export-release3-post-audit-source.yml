name: Temporary export release 3 post-audit source

on:
  push:
    branches:
      - chore/release-3-post-audit-cleanup-20260819
    paths:
      - .github/workflows/tmp-export-release3-post-audit-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: chore/release-3-post-audit-cleanup-20260819
          fetch-depth: 1
          persist-credentials: false
      - name: Archive exact source tree
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.venv --exclude=.uv-cache -czf "$RUNNER_TEMP/release3-post-audit-source.tgz" .
      - name: Upload source tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release3-post-audit-source
          path: ${{ runner.temp }}/release3-post-audit-source.tgz
          if-no-files-found: error
          retention-days: 1
