name: Temporary apply release 3 post-audit cleanup

on:
  push:
    branches:
      - chore/release-3-post-audit-cleanup-20260819
    paths:
      - .github/workflows/tmp-export-release3-post-audit-source.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-3-post-audit-cleanup-apply
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: chore/release-3-post-audit-cleanup-20260819
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Apply reviewed cleanup patch and remove delivery machinery
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/post-audit-patch/pr-a.b64 | gzip --decompress > "$RUNNER_TEMP/pr-a.patch"
          git apply --index "$RUNNER_TEMP/pr-a.patch"
          rm -f .github/workflows/tmp-export-release3-post-audit-source.yml
          rm -f .github/post-audit-patch/pr-a.b64
          rmdir .github/post-audit-patch 2>/dev/null || true
          git add -A
          git diff --cached --check
      - name: Install locked development environment
        shell: bash
        run: uv sync --frozen --extra dev --python 3.12
      - name: Validate formatting, typing, audit, evidence, and tests
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync ruff check \
            scripts/ci/code_quality_ast.py \
            scripts/ci/code_quality_audit.py \
            scripts/ci/code_quality_report.py \
            scripts/ci/workflow_hygiene.py \
            tests/test_code_quality_audit.py
          uv run --no-sync ruff format --check \
            scripts/ci/code_quality_ast.py \
            scripts/ci/code_quality_audit.py \
            scripts/ci/code_quality_report.py \
            scripts/ci/workflow_hygiene.py \
            tests/test_code_quality_audit.py
          uv run --no-sync basedpyright --level error
          uv run --no-sync python -m compileall -q src scripts tests
          uv run --no-sync pytest -q tests/test_code_quality_audit.py --tb=short
          uv run --no-sync python scripts/ci/code_quality_audit.py \
            --root . \
            --baseline ci/code-quality-baseline.json \
            --json-output "$RUNNER_TEMP/code-quality-audit.json"
          cp tests/fixtures/guard-command-corpus/decision-diff-report.json "$RUNNER_TEMP/decision-diff-before.json"
          uv run --no-sync python tests/guard_command_decision_diff.py --write
          cmp "$RUNNER_TEMP/decision-diff-before.json" tests/fixtures/guard-command-corpus/decision-diff-report.json
          uv run --no-sync python tests/guard_command_decision_diff.py --check
          uv run --no-sync python scripts/ci/test_inventory.py --output "$RUNNER_TEMP/test-inventory.json"
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory "$RUNNER_TEMP/test-inventory.json"
          git diff --check
          git diff --exit-code -- tests/fixtures/guard-command-corpus/decision-diff-report.json
      - name: Commit exact validated tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git status --short)"
          git commit -s -m "chore(release-3): remove post-audit residue and harden hygiene gates"
          git pull --rebase origin chore/release-3-post-audit-cleanup-20260819
          git push origin HEAD:chore/release-3-post-audit-cleanup-20260819
