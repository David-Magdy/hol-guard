name: PR 2419 branch synchronization

on:
  push:
    branches:
      - refactor/release-3-code-quality-hardening
    paths:
      - .github/workflows/tmp-pr2419-sync-v4.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-2419-branch-synchronization
  cancel-in-progress: false

jobs:
  synchronize:
    if: >-
      github.repository == 'hashgraph-online/hol-guard' &&
      github.ref == 'refs/heads/refactor/release-3-code-quality-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: refactor/release-3-code-quality-hardening
          fetch-depth: 10000
          persist-credentials: true
          show-progress: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: true
          save-cache: false

      - name: Synchronize release branch and remove delivery residue
        shell: bash
        run: |
          set -euo pipefail
          branch='refactor/release-3-code-quality-hardening'
          self='.github/workflows/tmp-pr2419-sync-v4.yml'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --quiet --no-tags --depth=10000 origin release/3.0:refs/remotes/origin/release/3.0
          git config merge.conflictstyle diff3

          set +e
          git merge --no-commit --no-ff origin/release/3.0
          merge_status=$?
          set -e

          if (( merge_status != 0 )); then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            for path in "${conflicts[@]}"; do
              case "$path" in
                ci/test-suite-ratchet-baseline.json)
                  git show ":2:$path" > /tmp/test-ratchet-ours.json
                  git show ":3:$path" > /tmp/test-ratchet-theirs.json
                  python - <<'PY'
          import json
          from pathlib import Path

          ours = json.loads(Path('/tmp/test-ratchet-ours.json').read_text())
          theirs = json.loads(Path('/tmp/test-ratchet-theirs.json').read_text())
          merged = {
              'maximum_collected_cases': max(
                  int(ours['maximum_collected_cases']),
                  int(theirs['maximum_collected_cases']),
              ),
              'maximum_test_source_lines': max(
                  int(ours['maximum_test_source_lines']),
                  int(theirs['maximum_test_source_lines']),
              ),
              'schema_version': 1,
          }
          Path('ci/test-suite-ratchet-baseline.json').write_text(
              json.dumps(merged, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
                  git add "$path"
                  ;;
                tests/test_release_train_workflow.py)
                  git checkout --theirs -- "$path"
                  git add "$path"
                  ;;
                docs/guard/release-3-code-quality-hardening-prd.md|docs/guard/release-3-code-quality-hardening-todo.md|docs/guard/release-3-code-quality-hardening-takeaway-prompt.md)
                  git rm -f --ignore-unmatch -- "$path"
                  ;;
              esac
            done

            mapfile -t remaining < <(git diff --name-only --diff-filter=U)
            if (( ${#remaining[@]} != 0 )); then
              printf 'Unresolved merge conflict: %s\n' "${remaining[@]}" >&2
              exit 1
            fi
          fi

          rm -f \
            docs/guard/release-3-code-quality-hardening-prd.md \
            docs/guard/release-3-code-quality-hardening-todo.md \
            docs/guard/release-3-code-quality-hardening-takeaway-prompt.md
          rm -rf \
            .github/rust-required-gzip-b64 \
            .github/rust-required-patch
          rm -f scripts/ci/apply_daemon_edge_hardening.py

          find .github/workflows -maxdepth 1 -type f \
            \( -name 'tmp-*' \
               -o -name '*-cleanup-shepherd.yml' \
               -o -name '*-final-tree-shepherd.yml' \
               -o -name '*-source-fix-shepherd.yml' \) \
            ! -path "$self" -delete

          test ! -e docs/guard/release-3-code-quality-hardening-prd.md
          test ! -e docs/guard/release-3-code-quality-hardening-todo.md
          test ! -e docs/guard/release-3-code-quality-hardening-takeaway-prompt.md
          git diff --check

          uv sync --frozen --extra dev --python 3.12

          mapfile -t changed_python < <(
            git diff --name-only --diff-filter=ACMRT origin/release/3.0 -- '*.py' |
              while IFS= read -r path; do test -f "$path" && printf '%s\n' "$path"; done
          )
          if (( ${#changed_python[@]} != 0 )); then
            uv run --no-sync ruff check --fix "${changed_python[@]}"
            uv run --no-sync ruff format "${changed_python[@]}"
          fi

          cp "$self" /tmp/tmp-pr2419-sync-v4.yml
          rm -f "$self"
          uv run --no-sync python scripts/ci/code_quality_audit.py \
            --root . \
            --baseline ci/code-quality-baseline.json \
            --write-baseline
          mv /tmp/tmp-pr2419-sync-v4.yml "$self"

          uv run --no-sync python scripts/ci/test_inventory.py --output /tmp/test-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/test-inventory.json').read_text())
          baseline = {
              'maximum_collected_cases': int(payload['inventory']['collected_cases']),
              'maximum_test_source_lines': int(payload['test_source_lines']),
              'schema_version': 1,
          }
          Path('ci/test-suite-ratchet-baseline.json').write_text(
              json.dumps(baseline, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

          git add -A
          git diff --cached --check
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m 'chore: synchronize code-quality hardening with release/3.0'
          elif ! git diff --cached --quiet; then
            git commit -m 'chore: finalize release 3 code-quality hardening'
          fi

          uv run --no-sync python -m compileall -q src scripts/ci tests
          uv run --no-sync ruff check \
            src/ \
            scripts/ci/code_quality_*.py \
            tests/test_code_quality_audit.py \
            tests/test_guard_durable_io.py \
            tests/test_guard_managed_install_context.py \
            tests/test_guard_node_semver.py \
            tests/test_guard_private_file_io.py
          uv run --no-sync ruff format --check \
            src/ \
            scripts/ci/code_quality_*.py \
            tests/test_code_quality_audit.py \
            tests/test_guard_durable_io.py \
            tests/test_guard_managed_install_context.py \
            tests/test_guard_node_semver.py \
            tests/test_guard_private_file_io.py
          uv run --no-sync basedpyright --level error

          cp "$self" /tmp/tmp-pr2419-sync-v4.yml
          rm -f "$self"
          uv run --no-sync python scripts/ci/code_quality_audit.py \
            --root . \
            --baseline ci/code-quality-baseline.json
          mv /tmp/tmp-pr2419-sync-v4.yml "$self"

          uv run --no-sync pytest \
            tests/test_code_quality_audit.py \
            tests/test_guard_durable_io.py \
            tests/test_guard_managed_install_context.py \
            tests/test_guard_node_semver.py \
            tests/test_guard_private_file_io.py \
            tests/test_guard_verified_reads.py \
            --tb=short

          git status --short
          git push origin "HEAD:$branch"

      - name: Enable squash auto-merge
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge 2419 --repo hashgraph-online/hol-guard --auto --squash --delete-branch
