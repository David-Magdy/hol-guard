name: Fix PR 2077 warning receipt aggregate

on:
  push:
    branches:
      - chore/rebuild-pr-2077-clean
    paths:
      - .github/workflows/fix-pr-2077-warn-receipts.yml

permissions:
  contents: write

concurrency:
  group: fix-pr-2077-warn-receipts
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: desktop/3.0-contracts
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Apply warning receipt aggregate fix
        run: |
          python - <<'PY'
          from pathlib import Path

          store_path = Path("src/codex_plugin_scanner/guard/store_receipts.py")
          store_text = store_path.read_text(encoding="utf-8")
          old = "coalesce(sum(case when s.policy_decision = 'allow' then 1 else 0 end), 0) as approved,"
          new = "coalesce(sum(case when s.policy_decision in ('allow', 'warn') then 1 else 0 end), 0) as approved,"
          if store_text.count(old) != 1:
              raise SystemExit(f"expected one approved receipt aggregate, found {store_text.count(old)}")
          store_path.write_text(store_text.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_guard_desktop_contract.py")
          test_text = test_path.read_text(encoding="utf-8")
          old_name = "def test_receipt_summary_uses_global_latest_timestamp_when_day_is_empty(tmp_path) -> None:"
          new_name = "def test_receipt_summary_uses_global_latest_and_counts_warnings_as_approved(tmp_path) -> None:"
          if test_text.count(old_name) != 1:
              raise SystemExit(f"expected one receipt summary test, found {test_text.count(old_name)}")
          test_text = test_text.replace(old_name, new_name, 1)
          anchor = '''    assert summary == {
        "total": 0,
        "blocked": 0,
        "approved": 0,
        "latest_at": timestamp,
    }
'''
          addition = '''    assert summary == {
        "total": 0,
        "blocked": 0,
        "approved": 0,
        "latest_at": timestamp,
    }

    warning_timestamp = "2026-08-06T12:00:00+00:00"
    store.add_receipt(
        GuardReceipt(
            receipt_id="warning-receipt-in-day-window",
            timestamp=warning_timestamp,
            harness="codex",
            artifact_id="codex:project:warning",
            artifact_hash="sha256:warning",
            policy_decision="warn",
            capabilities_summary="warning",
            changed_capabilities=(),
            provenance_summary="test",
        )
    )

    warning_summary = store.receipt_summary_between(
        start_at="2026-08-06T00:00:00+00:00",
        before_at="2026-08-07T00:00:00+00:00",
    )

    assert warning_summary == {
        "total": 1,
        "blocked": 0,
        "approved": 1,
        "latest_at": warning_timestamp,
    }
'''
          if test_text.count(anchor) != 1:
              raise SystemExit(f"expected one receipt summary assertion anchor, found {test_text.count(anchor)}")
          test_path.write_text(test_text.replace(anchor, addition, 1), encoding="utf-8")
          PY

      - name: Install frozen dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Refresh evidence and reviewed ratchet ceiling
        run: |
          set -euo pipefail
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/guard/store_receipts.py \
            tests/test_guard_desktop_contract.py
          uv run --no-sync python tests/guard_command_decision_diff.py --write
          uv run --no-sync python scripts/ci/test_inventory.py --output test-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path("test-inventory.json").read_text(encoding="utf-8"))
          baseline_path = Path("ci/test-suite-ratchet-baseline.json")
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          baseline["maximum_collected_cases"] = max(
              int(baseline["maximum_collected_cases"]),
              int(inventory["inventory"]["collected_cases"]),
          )
          baseline["maximum_test_source_lines"] = max(
              int(baseline["maximum_test_source_lines"]),
              int(inventory["test_source_lines"]),
          )
          baseline_path.write_text(json.dumps(baseline, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Validate final tree
        run: |
          set -euo pipefail
          uv run --no-sync python -m ruff format --check \
            src/codex_plugin_scanner/guard/store_receipts.py \
            tests/test_guard_desktop_contract.py
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/store_receipts.py \
            tests/test_guard_desktop_contract.py
          uv run --no-sync pytest tests/test_guard_desktop_contract.py --tb=short
          uv run --no-sync pytest \
            tests/test_guard_package_shims.py::test_package_manager_shim_waits_out_transient_store_writer_lock \
            --tb=short
          uv run --no-sync python tests/guard_command_decision_diff.py --check
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory test-inventory.json
          rm test-inventory.json

      - name: Publish validated product tree
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: 8bd5b61604ba8fe28ad373768589341839f6b3bb
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/codex_plugin_scanner/guard/store_receipts.py \
            tests/test_guard_desktop_contract.py \
            tests/fixtures/guard-command-corpus/decision-diff-report.json \
            ci/test-suite-ratchet-baseline.json
          git diff --cached --check
          git commit -m "fix(desktop): count warning receipts as approved"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/chore/pr-2077-warn-receipt-fix
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
