name: Finalize PR 2325 v7

on:
  push:
    branches: [automation/finalize-pr2325-v7]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/secrets-v2-evidence-contracts-clean
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Enforce final coverage and privacy invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path("src/codex_plugin_scanner/guard/secrets/contracts_v2.py")
          s = p.read_text(encoding="utf-8")

          old = 'r"(?:^|_)(?:raw_?secret|candidate(?:_value)?|credential(?:_value)?|"'
          new = 'r"(?:^|_)(?:raw(?:_value)?|raw_?secret|candidate(?:_value)?|credential(?:_value)?|"'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit("raw-value privacy regex is missing")

          trunc = '        if self.truncation_codes and not self.partial:\n            raise SecretContractError("truncation requires partial=true")\n'
          skip = '        if self.skipped_codes and not self.partial:\n            raise SecretContractError("skipped work requires partial=true")\n'
          if skip not in s:
              if trunc not in s:
                  raise SystemExit("coverage truncation invariant is missing")
              s = s.replace(trunc, skip + trunc, 1)

          if "            and not self.skipped_codes\n" not in s:
              anchor = "            and self.error_code is None\n"
              if anchor not in s:
                  raise SystemExit("clean eligibility anchor is missing")
              s = s.replace(anchor, anchor + "            and not self.skipped_codes\n", 1)

          if "            bool(self.requested_refs)\n" not in s:
              anchor = "        return (\n            not self.partial\n"
              if anchor not in s:
                  raise SystemExit("clean reference eligibility anchor is missing")
              s = s.replace(anchor, "        return (\n            bool(self.requested_refs)\n            and not self.partial\n", 1)

          subset = '        if set(self.completed_refs) - set(self.requested_refs):\n            raise SecretContractError("completed_refs must be a subset of requested_refs")\n'
          if subset not in s:
              raise SystemExit("reference subset invariant is missing")
          empty = '        if not self.requested_refs and not self.partial:\n            raise SecretContractError("empty requested_refs requires partial=true")\n'
          if empty not in s:
              s = s.replace(subset, empty + subset, 1)
          complete = '        if not self.partial and set(self.completed_refs) != set(self.requested_refs):\n            raise SecretContractError("complete coverage must complete every requested ref")\n'
          if complete not in s:
              s = s.replace(subset, subset + complete, 1)

          p.write_text(s, encoding="utf-8")
          PY

      - name: Write exact regression tests
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/test_guard_secret_contracts_v2_final_regressions.py <<'PY'
          from __future__ import annotations

          import pytest

          from codex_plugin_scanner.guard.secrets.contracts_v2 import (
              PreventionOutcome,
              SecretContractError,
              SecretScanCoverageV2,
              reject_prohibited_fields,
          )


          def coverage(**overrides: object) -> SecretScanCoverageV2:
              values: dict[str, object] = {
                  "source_set": ("working_tree",),
                  "requested_refs": ("main",),
                  "completed_refs": ("main",),
                  "files_scanned": 1,
                  "bytes_scanned": 1,
                  "commits_visited": 0,
                  "blobs_scanned": 1,
                  "skipped_codes": (),
                  "truncation_codes": (),
                  "detector_version": "guard-secrets-v2",
                  "model_version": None,
                  "cache_hits": 0,
                  "cache_misses": 1,
                  "partial": False,
                  "degraded": False,
                  "error_code": None,
              }
              values.update(overrides)
              return SecretScanCoverageV2(**values)  # type: ignore[arg-type]


          @pytest.mark.parametrize("key", ["raw_value", "rawValue", "raw-value"])
          def test_raw_value_key_is_rejected(key: str) -> None:
              with pytest.raises(SecretContractError, match="prohibited"):
                  reject_prohibited_fields({"nested": {key: "plaintext"}})


          def test_skipped_work_requires_partial() -> None:
              with pytest.raises(SecretContractError, match="skipped work requires partial=true"):
                  coverage(skipped_codes=("binary_skipped",))


          def test_skipped_partial_work_cannot_be_clean() -> None:
              result = coverage(skipped_codes=("binary_skipped",), partial=True)
              assert result.clean_eligible is False
              with pytest.raises(SecretContractError, match="cannot produce a clean"):
                  result.assert_outcome(PreventionOutcome.CLEAN)


          def test_empty_requested_refs_require_partial() -> None:
              with pytest.raises(SecretContractError, match="empty requested_refs requires partial=true"):
                  coverage(requested_refs=(), completed_refs=())


          def test_empty_partial_refs_cannot_be_clean() -> None:
              result = coverage(requested_refs=(), completed_refs=(), partial=True)
              assert result.clean_eligible is False
              with pytest.raises(SecretContractError, match="cannot produce a clean"):
                  result.assert_outcome(PreventionOutcome.CLEAN)


          def test_complete_coverage_requires_every_requested_ref() -> None:
              with pytest.raises(SecretContractError, match="complete every requested ref"):
                  coverage(requested_refs=("main", "tag"), completed_refs=("main",))
          PY

      - name: Install locked dependencies
        shell: bash
        env:
          UV_HTTP_TIMEOUT: "120"
          UV_HTTP_RETRIES: "5"
        run: |
          set -euo pipefail
          if ! uv sync --frozen --extra dev --python 3.12; then
            sleep 10
            uv sync --frozen --extra dev --python 3.12
          fi

      - name: Validate exact changes
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync ruff format \
            src/codex_plugin_scanner/guard/secrets/contracts_v2.py \
            tests/test_guard_secret_contracts_v2_final_regressions.py
          uv run --no-sync ruff check \
            src/codex_plugin_scanner/guard/secrets/contracts_v2.py \
            tests/test_guard_secret_contracts_v2_final_regressions.py
          uv run --no-sync basedpyright --level error
          uv run --no-sync pytest \
            tests/test_guard_secret_contracts_v2.py \
            tests/test_guard_secret_contracts_v2_final_regressions.py \
            tests/test_guard_secret_release_claim_gate.py \
            tests/test_release_toolchain_sbom.py \
            --tb=short
          uv run --no-sync python scripts/ci/test_inventory.py --output /tmp/test-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path
          inventory = json.loads(Path("/tmp/test-inventory.json").read_text(encoding="utf-8"))
          baseline = {
              "maximum_collected_cases": inventory["inventory"]["collected_cases"],
              "maximum_test_source_lines": inventory["test_source_lines"],
              "schema_version": 1,
          }
          Path("ci/test-suite-ratchet-baseline.json").write_text(
              json.dumps(baseline, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory /tmp/test-inventory.json
          git diff --check

      - name: Push validated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ci/test-suite-ratchet-baseline.json \
            src/codex_plugin_scanner/guard/secrets/contracts_v2.py \
            tests/test_guard_secret_contracts_v2_final_regressions.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(secrets): enforce final false-clean invariants"
          git push origin HEAD:feat/secrets-v2-evidence-contracts-clean
