name: Address final PR 2110 review assertion

on:
  push:
    branches: [tmp/pr2110-finalize-20260807]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Apply review assertion to exact PR head
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HEAD=b45320430f3a3ed7d87e63e2b206f45627891ec6
          git fetch origin main fix/protection-repair-dashboard-regressions
          test "$(git rev-parse origin/fix/protection-repair-dashboard-regressions)" = "$EXPECTED_HEAD"
          git reset --hard "$EXPECTED_HEAD"
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_guard_policy_integrity.py')
          text = path.read_text(encoding='utf-8')
          marker = 'def test_no_keyring_local_vault_keeps_persistent_local_allow_authoritative('
          start = text.index(marker)
          end = text.index('\ndef test_', start + len(marker))
          block = text[start:end]
          old = '    assert resolved is not None\n'
          new = '    assert resolved == "allow"\n'
          if new not in block:
              if old not in block:
                  raise SystemExit('review assertion anchor missing')
              block = block.replace(old, new, 1)
              text = text[:start] + block + text[end:]
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Validate exact regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet uv
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync ruff check tests/test_guard_policy_integrity.py
          uv run --no-sync ruff format --check tests/test_guard_policy_integrity.py
          uv run --no-sync pytest -q tests/test_guard_policy_integrity.py::test_no_keyring_local_vault_keeps_persistent_local_allow_authoritative --tb=short
      - name: Push to PR branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin fix/protection-repair-dashboard-regressions
          test "$(git rev-parse origin/fix/protection-repair-dashboard-regressions)" = b45320430f3a3ed7d87e63e2b206f45627891ec6
          git add tests/test_guard_policy_integrity.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(guard): assert restored local allow action'
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" push origin HEAD:fix/protection-repair-dashboard-regressions
