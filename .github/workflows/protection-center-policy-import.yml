name: Protection Center Batch 4 secure policy import
on:
  push:
    branches: [feat/protection-center-04-policy-editor]
permissions:
  contents: write
concurrency:
  group: protection-center-batch-4-policy-import
  cancel-in-progress: true
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Sync release and import reviewed engine
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin release/3.0 feat/extension-control-center-02-permissions
          git merge --no-edit origin/release/3.0
          git show origin/feat/extension-control-center-02-permissions:dashboard/e2e/installed-extension-control-center.spec.ts > dashboard/e2e/installed-extension-policy-editor.spec.ts
          set +e
          git merge --no-ff --no-commit origin/feat/extension-control-center-02-permissions
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            for path in "${conflicts[@]}"; do
              case "$path" in
                dashboard/package.json|dashboard/e2e/installed-extension-control-center.spec.ts|dashboard/src/extension-control-center-detail.tsx|dashboard/src/extensions-workspace.tsx|.github/workflows/extension-control-center-installed-ci.yml|src/codex_plugin_scanner/guard/daemon/static/*)
                  git checkout --ours -- "$path"; git add "$path" ;;
                *) echo "Unexpected conflict: $path" >&2; exit 1 ;;
              esac
            done
          fi
          git checkout HEAD -- .github/workflows/extension-control-center-installed-ci.yml
          git add . dashboard/e2e/installed-extension-policy-editor.spec.ts
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m "feat(protection-center): import reviewed extension policy engine"
      - name: Adapt imported tests to current release contracts
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          projection_path = Path('tests/test_guard_extension_control_projection.py')
          projection_text = projection_path.read_text()
          if 'class NullStore' in projection_text and 'def load_extension_control_authority' not in projection_text:
              if 'from codex_plugin_scanner.guard.runtime.extension_control_authority import' not in projection_text:
                  projection_text = projection_text.replace(
                      'from __future__ import annotations\n',
                      'from __future__ import annotations\n\nfrom codex_plugin_scanner.guard.runtime.extension_control_authority import AuthorityHealth, ExtensionControlAuthorityView\n',
                      1,
                  )
              projection_text = projection_text.replace(
                  'class NullStore:',
                  'class NullStore:\n    def load_extension_control_authority(self, *, catalog_digest: str):\n        return ExtensionControlAuthorityView(AuthorityHealth.PROTECTED, 0, catalog_digest, ())\n',
                  1,
              )
              projection_path.write_text(projection_text)

          api_path = Path('tests/test_guard_extension_control_api.py')
          api_text = api_path.read_text()
          if 'effective.pop("projection")' not in api_text:
              marker = '''    assert catalog["limits"] == {\n        "max_body_bytes": 1_000_000,\n        "max_controls": 4096,\n        "max_observations": 2048,\n    }\n    assert effective == {'''
              replacement = '''    assert catalog["limits"] == {\n        "max_body_bytes": 1_000_000,\n        "max_controls": 4096,\n        "max_observations": 2048,\n    }\n    projection = cast(dict[str, object], effective.pop("projection"))\n    assert projection["schema_version"] == "guard.daemon.extension-control-projection.v1"\n    assert projection["revision"] == effective["revision"]\n    assert projection["catalog_digest"] == effective["catalog_digest"]\n    assert projection["health"] == effective["health"]\n    assert isinstance(projection["extensions"], list)\n    assert isinstance(projection["permissions"], list)\n    assert effective == {'''
              if api_text.count(marker) != 1:
                  raise SystemExit('extension-control API bounded DTO assertion changed unexpectedly')
              api_path.write_text(api_text.replace(marker, replacement, 1))
          PY
          git add tests/test_guard_extension_control_projection.py tests/test_guard_extension_control_api.py
          git commit -m "test(protection-center): align imported engine with current contracts" || true
      - name: Add dashboard test contracts
        shell: bash
        run: |
          python <<'PY'
          import json
          from pathlib import Path
          p=Path('dashboard/package.json'); data=json.loads(p.read_text())
          tests=['tsx src/extension-control-preview-normalize.test.ts','tsx src/extension-control-projection-normalize.test.ts','tsx src/extension-policy-draft.test.ts','tsx src/extension-policy-rebase.test.ts']
          parts=[x.strip() for x in data['scripts']['test'].split('&&')]
          for t in reversed(tests):
              if t not in parts: parts.insert(3,t)
          data['scripts']['test']=' && '.join(parts); p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Verify secure engine and dashboard
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync pytest -q tests/test_guard_extension_control_projection.py tests/test_guard_extension_control_semantic_preview.py tests/test_guard_extension_control_api.py tests/test_guard_extension_control_authority.py --tb=short
          cd dashboard
          bun install --frozen-lockfile --ignore-scripts
          bun run test
          bun run build
      - name: Commit deterministic output
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm .github/workflows/protection-center-policy-import.yml
          git add dashboard/package.json src/codex_plugin_scanner/guard/daemon/static .github/workflows/protection-center-policy-import.yml
          git commit -m "test(protection-center): verify secure policy engine"
          git push origin HEAD:feat/protection-center-04-policy-editor
