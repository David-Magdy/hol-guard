name: Protection Center Batch 4 secure policy import

on:
  push:
    branches:
      - feat/protection-center-04-policy-editor

permissions:
  contents: write

concurrency:
  group: protection-center-batch-4-policy-import
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Synchronize current release and import PR 2193 reviewed engine
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Forward-port the current release first. This preserves post-2193 authority,
          # daemon, migration, and regression contracts instead of validating the
          # imported engine against a stale stacked release baseline.
          git fetch origin release/3.0 feat/extension-control-center-02-permissions
          git merge --no-edit origin/release/3.0

          git show origin/feat/extension-control-center-02-permissions:dashboard/e2e/installed-extension-control-center.spec.ts \
            > dashboard/e2e/installed-extension-policy-editor.spec.ts

          set +e
          git merge --no-ff --no-commit origin/feat/extension-control-center-02-permissions
          merge_status=$?
          set -e
          if [[ $merge_status -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Merge conflicts:\n%s\n' "${conflicts[@]}"
            for path in "${conflicts[@]}"; do
              case "$path" in
                dashboard/package.json|dashboard/e2e/installed-extension-control-center.spec.ts|dashboard/src/extension-control-center-detail.tsx|dashboard/src/extensions-workspace.tsx|.github/workflows/extension-control-center-installed-ci.yml|src/codex_plugin_scanner/guard/daemon/static/*)
                  git checkout --ours -- "$path"
                  git add "$path"
                  ;;
                *)
                  echo "Unexpected Batch 4 conflict: $path" >&2
                  exit 1
                  ;;
              esac
            done
          fi

          git checkout HEAD -- .github/workflows/extension-control-center-installed-ci.yml
          git add .github/workflows/extension-control-center-installed-ci.yml dashboard/e2e/installed-extension-policy-editor.spec.ts
          if git diff --name-only --diff-filter=U | grep -q .; then
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi
          git commit -m "feat(protection-center): import reviewed extension policy engine"

      - name: Integrate policy engine test contracts
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import json

          package_path = Path("dashboard/package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          tests = [
              "tsx src/extension-control-preview-normalize.test.ts",
              "tsx src/extension-control-projection-normalize.test.ts",
              "tsx src/extension-policy-draft.test.ts",
              "tsx src/extension-policy-rebase.test.ts",
          ]
          parts = [part.strip() for part in package["scripts"]["test"].split("&&")]
          for test in reversed(tests):
              if test not in parts:
                  parts.insert(3 if len(parts) >= 3 else len(parts), test)
          package["scripts"]["test"] = " && ".join(parts)
          package_path.write_text(json.dumps(package, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Verify imported secure engine
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync pytest -q \
            tests/test_guard_extension_control_projection.py \
            tests/test_guard_extension_control_semantic_preview.py \
            tests/test_guard_extension_control_api.py \
            tests/test_guard_extension_control_authority.py \
            --tb=short
          cd dashboard
          bun install --frozen-lockfile --ignore-scripts
          bun run test
          bun run build
      - name: Commit deterministic bundle and remove importer
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e dashboard/dist
          rm .github/workflows/protection-center-policy-import.yml
          git add \
            dashboard/package.json \
            src/codex_plugin_scanner/guard/daemon/static \
            .github/workflows/protection-center-policy-import.yml
          git diff --cached --check
          git commit -m "test(protection-center): verify imported secure policy engine"
          git push origin HEAD:feat/protection-center-04-policy-editor
