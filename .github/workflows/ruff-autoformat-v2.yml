name: Apply Ruff formatting to V2 contract

on:
  push:
    branches:
      - fix/ci-bundle-20260813

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/ci-bundle-20260813
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Format exact file
        run: |
          python -m pip install --disable-pip-version-check --no-input ruff==0.15.17
          python -m ruff format src/codex_plugin_scanner/guard/secrets/contracts_v2.py
          python -m ruff check src/codex_plugin_scanner/guard/secrets/contracts_v2.py
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/codex_plugin_scanner/guard/secrets/contracts_v2.py
          git commit -m "style(secrets): apply Ruff formatting"
          git push origin HEAD:fix/ci-bundle-20260813
