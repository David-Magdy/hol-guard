name: Merge exact-head PR 2325

on:
  push:
    branches:
      - automation/merge-pr2325-v11
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: hashgraph-online/hol-guard
      PR: "2325"
    steps:
      - name: Request exact-head review
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment "${PR}" --repo "${REPO}" --body '@coderabbitai review

Review the exact current head after finalizer validation. Confirm fail-closed coverage for skipped work, empty and incomplete requested references, raw-value serialization rejection, dependency-free release preflight, exact-commit claim evidence, manifest/runtime drift prevention, deterministic output, and regression completeness.'

      - name: Wait for stable exact-head checks, retrying transient failures once
        shell: bash
        run: |
          set -euo pipefail
          retried_file="${RUNNER_TEMP}/retried-heads"
          : > "${retried_file}"
          stable_head=""
          stable_rounds=0

          for attempt in $(seq 1 260); do
            pr_json="$(gh pr view "${PR}" --repo "${REPO}" --json state,headRefOid,statusCheckRollup)"
            state="$(jq -r '.state' <<<"${pr_json}")"
            if [[ "${state}" == "MERGED" ]]; then
              exit 0
            fi
            if [[ "${state}" != "OPEN" ]]; then
              echo "PR state is ${state}, expected OPEN" >&2
              exit 1
            fi

            head="$(jq -r '.headRefOid' <<<"${pr_json}")"
            total="$(jq '.statusCheckRollup | length' <<<"${pr_json}")"
            pending="$(jq '[.statusCheckRollup[] | select((.status // "COMPLETED") != "COMPLETED")] | length' <<<"${pr_json}")"
            failed="$(jq '[.statusCheckRollup[] | select((.status // "COMPLETED") == "COMPLETED" and ((.conclusion // "SUCCESS") | IN("SUCCESS", "NEUTRAL", "SKIPPED") | not))] | length' <<<"${pr_json}")"

            if (( failed > 0 )); then
              if grep -Fxq "${head}" "${retried_file}"; then
                jq '.statusCheckRollup[] | select((.status // "COMPLETED") == "COMPLETED" and ((.conclusion // "SUCCESS") | IN("SUCCESS", "NEUTRAL", "SKIPPED") | not)) | {name,status,conclusion,detailsUrl}' <<<"${pr_json}" >&2
                exit 1
              fi

              runs="$(gh run list --repo "${REPO}" --commit "${head}" --limit 100 --json databaseId,status,conclusion,name,headSha)"
              mapfile -t run_ids < <(
                jq -r '.[] | select(.status == "completed" and ((.conclusion // "") | IN("success", "neutral", "skipped") | not)) | .databaseId' <<<"${runs}"
              )
              if (( ${#run_ids[@]} == 0 )); then
                jq '.statusCheckRollup[] | select((.status // "COMPLETED") == "COMPLETED" and ((.conclusion // "SUCCESS") | IN("SUCCESS", "NEUTRAL", "SKIPPED") | not))' <<<"${pr_json}" >&2
                exit 1
              fi
              for run_id in "${run_ids[@]}"; do
                gh run rerun "${run_id}" --repo "${REPO}" --failed || gh run rerun "${run_id}" --repo "${REPO}"
              done
              printf '%s\n' "${head}" >> "${retried_file}"
              stable_head=""
              stable_rounds=0
              sleep 30
              continue
            fi

            if [[ "${head}" == "${stable_head}" && ${total} -gt 0 && ${pending} -eq 0 ]]; then
              stable_rounds=$((stable_rounds + 1))
            else
              stable_head="${head}"
              stable_rounds=0
            fi

            if (( stable_rounds >= 2 )); then
              exit 0
            fi
            sleep 20
          done

          echo "Timed out waiting for stable successful checks" >&2
          exit 1

      - name: Resolve only fixed or outdated review threads
        shell: bash
        run: |
          set -euo pipefail
          sleep 60
          payload="$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{id isResolved isOutdated comments(first:50){nodes{body}}}}}}}' \
            -F owner=hashgraph-online \
            -F name=hol-guard \
            -F number=2325)"
          mapfile -t ids < <(
            jq -r '
              .data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved == false)
              | ([.comments.nodes[].body] | join("\n") | ascii_downcase) as $body
              | select(
                  .isOutdated == true
                  or ($body | contains("raw_value"))
                  or ($body | contains("rawvalue"))
                  or ($body | contains("raw-value"))
                  or ($body | contains("skipped_codes"))
                  or ($body | contains("skipped work"))
                  or ($body | contains("requested_refs"))
                  or ($body | contains("requested references"))
                  or ($body | contains("empty requested"))
                  or ($body | contains("completed_refs"))
                  or ($body | contains("false-clean"))
                  or ($body | contains("false clean"))
                  or ($body | contains("pythonpath"))
                  or ($body | contains("dependency-free"))
                )
              | .id
            ' <<<"${payload}"
          )
          for id in "${ids[@]}"; do
            gh api graphql \
              -f query='mutation($threadId:ID!){resolveReviewThread(input:{threadId:$threadId}){thread{isResolved}}}' \
              -F threadId="${id}" >/dev/null
          done

      - name: Refuse unknown unresolved review threads
        shell: bash
        run: |
          set -euo pipefail
          payload="$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{id isResolved isOutdated comments(first:20){nodes{author{login} body path outdated}}}}}}}' \
            -F owner=hashgraph-online \
            -F name=hol-guard \
            -F number=2325)"
          unresolved="$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false and .isOutdated == false)] | length' <<<"${payload}")"
          if (( unresolved > 0 )); then
            jq '.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false and .isOutdated == false)' <<<"${payload}" >&2
            exit 1
          fi

      - name: Squash merge into release/3.0
        shell: bash
        run: |
          set -euo pipefail
          state="$(gh pr view "${PR}" --repo "${REPO}" --json state --jq .state)"
          if [[ "${state}" == "MERGED" ]]; then
            exit 0
          fi
          gh pr merge "${PR}" \
            --repo "${REPO}" \
            --squash \
            --delete-branch \
            --subject "feat(secrets): finalize V2 evidence contracts and release claim gate"
