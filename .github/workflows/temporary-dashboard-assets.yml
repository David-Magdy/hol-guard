name: Temporary dashboard asset refresh

on:
  push:
    branches:
      - fix/dashboard-responsive-layout

permissions:
  contents: write

jobs:
  refresh-dashboard-assets:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/dashboard-responsive-layout
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Build dashboard assets
        run: |
          cd dashboard
          bun install --frozen-lockfile
          bun run build

      - name: Commit generated assets
        run: |
          if git diff --quiet -- src/codex_plugin_scanner/guard/daemon/static; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/codex_plugin_scanner/guard/daemon/static
          git commit -m "build(dashboard): refresh generated assets"
          git push origin HEAD:fix/dashboard-responsive-layout
