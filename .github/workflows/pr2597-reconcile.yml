name: PR 2597 release reconciliation

on:
  push:
    branches:
      - fix/network-isolation-dockerlabs-rem-121-139
    paths:
      - .github/workflows/pr2597-reconcile.yml

permissions:
  contents: write

concurrency:
  group: pr-2597-release-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: fix/network-isolation-dockerlabs-rem-121-139
          persist-credentials: true

      - name: Rebuild the PR on the reviewed release tree
        shell: bash
        env:
          BASE_SHA: 1989b4a8c9a12e62a4ab7197865cbd0b38bdeef8
          EXPECTED_PATCH_SHA256: a7a71b33d404d0a2847e1fe570034810d7bc9b6d85bde09a18fdd84cc8e7a5b4
          TARGET_BRANCH: fix/network-isolation-dockerlabs-rem-121-139
        run: |
          set -euo pipefail

          cat .github/pr2597-reconcile.patch.b64.part-* > /tmp/pr2597.patch.b64
          base64 --decode /tmp/pr2597.patch.b64 > /tmp/pr2597.patch
          printf '%s  %s\n' "$EXPECTED_PATCH_SHA256" /tmp/pr2597.patch | sha256sum --check --strict

          git rm -r -f --ignore-unmatch .
          git checkout "$BASE_SHA" -- .
          git apply --index --whitespace=error-all /tmp/pr2597.patch
          git diff --cached --check

          cat > /tmp/expected-files <<'EOF'
          ci/code-quality-baseline.json
          ci/test-suite-ratchet-baseline.json
          src/codex_plugin_scanner/guard/daemon/hook_process_runner.py
          tests/test_guard_hook_process_deferred_startup.py
          tests/test_guard_hook_process_runner.py
          EOF
          git diff --cached --name-only | sort > /tmp/actual-files
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

          PYTHONPATH=src python3 scripts/ci/test_inventory.py --output /tmp/test-inventory.json
          PYTHONPATH=src python3 scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory /tmp/test-inventory.json
          PYTHONPATH=src python3 scripts/ci/code_quality_audit.py \
            --root . \
            --baseline ci/code-quality-baseline.json \
            --json-output /tmp/code-quality-audit.json
          python3 -m py_compile \
            src/codex_plugin_scanner/guard/daemon/hook_process_runner.py \
            tests/test_guard_hook_process_deferred_startup.py \
            tests/test_guard_hook_process_runner.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --signoff -m 'fix(ci): reconcile PR 2597 with current release/3.0'
          git push origin "HEAD:$TARGET_BRANCH"

# retriggered through Git Data API so the push event is emitted
