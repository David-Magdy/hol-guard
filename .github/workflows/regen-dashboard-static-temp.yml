name: Regenerate dashboard static (temporary)

on:
  push:
    branches:
      - fix/supply-chain-repair-staged-state-main

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Build dashboard
        run: |
          cd dashboard
          bun install --frozen-lockfile
          bun run build
      - name: Commit generated static assets and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/codex_plugin_scanner/guard/daemon/static
          git rm .github/workflows/regen-dashboard-static-temp.yml
          git commit -m "build(dashboard): regenerate static assets"
          git push origin "HEAD:${GITHUB_REF_NAME}"
