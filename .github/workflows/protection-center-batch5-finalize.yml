name: Protection Center Batch 5 finalize
on:
  push:
    branches: [feat/protection-center-05-test-activity]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Transform Batch 5 source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/protection_center_batch5_transform.py
          git diff --check
      - name: Verify Python authority and Test Lab
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync pytest -q \
            tests/test_guard_extension_control_test_lab.py \
            tests/test_guard_extension_control_authority.py \
            tests/test_guard_extension_control_api.py
      - name: Verify dashboard and build static bundle
        shell: bash
        run: |
          set -euo pipefail
          cd dashboard
          bun install --frozen-lockfile --ignore-scripts
          bun run test
          bun run build
      - name: Commit verified Batch 5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/protection-center-batch5-finalize.yml
          rm scripts/ci/protection_center_batch5_transform.py
          git add dashboard src/codex_plugin_scanner/guard/daemon tests .github/workflows/protection-center-batch5-finalize.yml scripts/ci/protection_center_batch5_transform.py
          git diff --cached --check
          git commit -m "feat(protection-center): add verified local history and Test Lab"
          git push origin HEAD:feat/protection-center-05-test-activity