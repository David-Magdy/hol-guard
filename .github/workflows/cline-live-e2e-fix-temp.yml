name: Temporary Cline fixed E2E probe

on:
  push:
    branches:
      - test/cline-live-e2e-fix-20260808
    paths:
      - .github/workflows/cline-live-e2e-fix-temp.yml

permissions:
  contents: read

jobs:
  posttool-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out validation branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Apply candidate Cline post-tool mediation fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/codex_plugin_scanner/guard/cli/commands_support_runtime_artifacts.py')
          text = path.read_text(encoding='utf-8')
          old = 'if harness in {"codex", "pi", "omp"} and event_name == "PostToolUse":'
          new = 'if harness in {"codex", "cline", "pi", "omp"} and event_name == "PostToolUse":'
          if old not in text:
              raise SystemExit('post-tool harness gate not found')
          text = text.replace(old, new, 1)
          old_label = 'harness_label = {"pi": "Pi", "omp": "Oh My Pi"}.get(canonical_harness, "Codex")'
          new_label = 'harness_label = {"cline": "Cline", "pi": "Pi", "omp": "Oh My Pi"}.get(canonical_harness, "Codex")'
          if old_label not in text:
              raise SystemExit('post-tool harness label not found')
          path.write_text(text.replace(old_label, new_label, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- src/codex_plugin_scanner/guard/cli/commands_support_runtime_artifacts.py

      - name: Build and install candidate wheel
        shell: bash
        run: |
          set -euo pipefail
          uv build
          wheel=$(find dist -maxdepth 1 -name 'hol_guard-*.whl' -print -quit)
          python -m venv "$RUNNER_TEMP/guard-venv"
          "$RUNNER_TEMP/guard-venv/bin/pip" install "$wheel"

      - name: Probe Cline post-tool credential output
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/cline-post-home"
          export HOL_GUARD_HOME="$HOME/.hol-guard"
          mkdir -p "$HOME/workspace"
          cd "$HOME/workspace"
          printf 'AKIAABCDEFGHIJKLMNOP\n' > public.txt

          python - <<'PY' > "$RUNNER_TEMP/post.json"
          import json
          from pathlib import Path
          target = str(Path.cwd() / 'public.txt')
          secret = 'AKIAABCDEFGHIJKLMNOP'
          payload = {
              'hookName': 'PostToolUse',
              'hook_event_name': 'PostToolUse',
              'tool_result': {
                  'id': 'posttool-probe',
                  'name': 'run_commands',
                  'input': {'commands': [f'cat {target}']},
                  'output': secret,
              },
              'postToolUse': {
                  'toolName': 'run_commands',
                  'parameters': {'commands': json.dumps([f'cat {target}'])},
                  'result': secret,
                  'success': True,
                  'executionTimeMs': 1,
              },
          }
          print(json.dumps(payload, separators=(',', ':')))
          PY

          set +e
          "$RUNNER_TEMP/guard-venv/bin/python" -I -s -m codex_plugin_scanner.cli \
            guard hook --harness cline --json \
            < "$RUNNER_TEMP/post.json" \
            > "$RUNNER_TEMP/out.json" 2> "$RUNNER_TEMP/err.txt"
          status=$?
          set -e
          echo "status=$status"
          cat "$RUNNER_TEMP/out.json"
          cat "$RUNNER_TEMP/err.txt"
          python - "$RUNNER_TEMP/out.json" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          print('policy_action=', payload.get('policy_action'))
          print('artifact_id=', payload.get('artifact_id'))
          assert payload.get('policy_action') == 'require-reapproval', payload
          assert ':tool-output:' in payload.get('artifact_id', ''), payload
          assert payload.get('policy_composition', {}).get('current_config_action') == 'require-reapproval', payload
          PY
