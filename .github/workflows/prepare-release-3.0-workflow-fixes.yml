name: Prepare release 3.0 workflow fixes

on:
  push:
    branches:
      - fix/release-3.0-cline-dashboard-contract

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Restrict Publish PR gate to active release train
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/publish.yml")
          text = path.read_text(encoding="utf-8")
          old = "  pull_request:\n    branches: [main, release/3.0, release/3.1]\n"
          new = "  pull_request:\n    branches: [main, release/3.0]\n"
          if text.count(old) != 1:
              raise RuntimeError("expected exactly one Publish PR branch filter")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Create exact corrected Publish blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > publish-blob.json
          import base64
          import json
          from pathlib import Path

          raw = Path(".github/workflows/publish.yml").read_bytes()
          print(json.dumps({"content": base64.b64encode(raw).decode("ascii"), "encoding": "base64"}))
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" \
            --input publish-blob.json --jq .sha > publish-blob-sha.txt
          test -s publish-blob-sha.txt
          cat publish-blob-sha.txt

      - name: Upload corrected Publish blob SHA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-3.0-publish-blob
          path: publish-blob-sha.txt
          if-no-files-found: error
