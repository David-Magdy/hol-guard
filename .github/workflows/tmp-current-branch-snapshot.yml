name: Current scanner assurance branch snapshot

on:
  push:
    branches:
      - feat/scanner-assurance-rust-hardening-20260816
    paths:
      - .github/workflows/tmp-current-branch-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Build tracked source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/scanner-assurance-current
          git rev-parse HEAD > /tmp/scanner-assurance-current/commit.txt
          git ls-files -z | tar --null -czf /tmp/scanner-assurance-current/source.tar.gz -T -
          git ls-files > /tmp/scanner-assurance-current/inventory.txt
      - name: Upload source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scanner-assurance-current-source
          path: /tmp/scanner-assurance-current
          if-no-files-found: error
          retention-days: 3
