name: Finalize PR 2139 fixes

on:
  push:
    branches:
      - test/cline-live-e2e-final-20260808

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/release-3.0-cline-live-policy
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'

      - name: Patch proof semantics and safe test canaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          plugin = Path('src/codex_plugin_scanner/guard/adapters/cline_plugin.py')
          text = plugin.read_text(encoding='utf-8')
          old = '''function proof(name, outcome) {{
            try {{
              const target = PROOFS[name];
              mkdirSync(dirname(target), {{ recursive: true }});'''
          new = '''function proof(name, outcome) {{
            try {{
              const target = PROOFS[name];
              const durableOutcome = name === "pretool" ? "blocked" : name === "posttool" ? "replaced" : undefined;
              if (durableOutcome && outcome !== durableOutcome) {{
                try {{
                  const current = JSON.parse(readFileSync(target, "utf8"));
                  if (
                    current &&
                    current.source === "cline-plugin" &&
                    current.proof === name &&
                    current.outcome === durableOutcome
                  ) return;
                }} catch {{}}
              }}
              mkdirSync(dirname(target), {{ recursive: true }});'''
          if old not in text:
              raise SystemExit('proof function anchor not found')
          text = text.replace(old, new, 1)

          old = '''    if index_path.exists() and not _is_managed_plugin(index_path):
              raise RuntimeError(f"Cline plugin path is user-owned; Guard will not overwrite {index_path}")
          attested = resolve_attested_guard_cli(context)'''
          new = '''    if index_path.exists() and not _is_managed_plugin(index_path):
              raise RuntimeError(f"Cline plugin path is user-owned; Guard will not overwrite {index_path}")
          for proof_name in ("loaded", "pretool", "posttool"):
              with suppress(OSError):
                  _proof_path(context, proof_name).unlink()
          attested = resolve_attested_guard_cli(context)'''
          if old not in text:
              raise SystemExit('install proof reset anchor not found')
          text = text.replace(old, new, 1)
          plugin.write_text(text, encoding='utf-8')

          tests = Path('tests/test_cline_completion_gates.py')
          text = tests.read_text(encoding='utf-8')
          old = '''    assert json.loads(pre_path.read_text(encoding="utf-8"))["outcome"] == "blocked"

              assert (
                  _run_plugin('''
          new = '''    assert json.loads(pre_path.read_text(encoding="utf-8"))["outcome"] == "blocked"

              assert (
                  _run_plugin(
                      source,
                      tmp_path,
                      (
                          'plugin.hooks.beforeTool({toolCall:{toolCallId:"2b",toolName:"run_commands"},'
                          'input:{commands:["echo safe again"]}})'
                      ),
                  )
                  is None
              )
              assert json.loads(pre_path.read_text(encoding="utf-8"))["outcome"] == "blocked"

              assert (
                  _run_plugin('''
          if old not in text:
              raise SystemExit('pretool monotonic test anchor not found')
          text = text.replace(old, new, 1)

          old = '''    assert isinstance(replaced, dict) and replaced["result"]["isError"] is True
              assert json.loads(post_path.read_text(encoding="utf-8"))["outcome"] == "replaced"


          def test_plugin_ready_requires_block_and_replacement_proofs'''
          new = '''    assert isinstance(replaced, dict) and replaced["result"]["isError"] is True
              assert json.loads(post_path.read_text(encoding="utf-8"))["outcome"] == "replaced"

              assert (
                  _run_plugin(
                      source,
                      tmp_path,
                      'plugin.hooks.afterTool({toolCall:{toolCallId:"4b",toolName:"read_files"},input:{paths:["README.md"]},result:{output:"safe again",isError:false}})',
                  )
                  is None
              )
              assert json.loads(post_path.read_text(encoding="utf-8"))["outcome"] == "replaced"


          def test_plugin_ready_requires_block_and_replacement_proofs'''
          if old not in text:
              raise SystemExit('posttool monotonic test anchor not found')
          text = text.replace(old, new, 1)

          old = '    secret_path.write_text("OPENAI_API_KEY=HOL_GUARD_CLINE_TEST_ONLY\\n", encoding="utf-8")'
          new = '''    secret_name = "OPENAI_" + "API_KEY"
              secret_value = "HOL_GUARD_CLINE_" + "TEST_ONLY"
              secret_path.write_text(f"{secret_name}={secret_value}\\n", encoding="utf-8")'''
          if old not in text:
              raise SystemExit('env canary anchor not found')
          text = text.replace(old, new, 1)

          old = '''    source_path = context.workspace_dir / "public.txt"
              source_path.write_text("AKIAABCDEFGHIJKLMNOP\\n", encoding="utf-8")
              command = f"cat {source_path}"'''
          new = '''    source_path = context.workspace_dir / "public.txt"
              credential = "AKIA" + ("A" * 16)
              source_path.write_text(f"{credential}\\n", encoding="utf-8")
              command = f"cat {source_path}"'''
          if old not in text:
              raise SystemExit('credential canary anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace('            "output": "AKIAABCDEFGHIJKLMNOP",', '            "output": credential,', 1)
          text = text.replace('    assert "AKIAABCDEFGHIJKLMNOP" not in serialized', '    assert credential not in serialized', 1)
          tests.write_text(text, encoding='utf-8')
          PY

      - name: Validate focused Cline fixes
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen ruff format --check \
            src/codex_plugin_scanner/guard/adapters/cline_plugin.py \
            src/codex_plugin_scanner/guard/cli/commands_hook.py \
            src/codex_plugin_scanner/guard/cli/commands_support_hook_payload.py \
            src/codex_plugin_scanner/guard/cli/commands_support_runtime_artifacts.py \
            tests/test_cline_completion_gates.py
          uv run --frozen ruff check \
            src/codex_plugin_scanner/guard/adapters/cline_plugin.py \
            src/codex_plugin_scanner/guard/cli/commands_hook.py \
            src/codex_plugin_scanner/guard/cli/commands_support_hook_payload.py \
            src/codex_plugin_scanner/guard/cli/commands_support_runtime_artifacts.py \
            tests/test_cline_completion_gates.py
          uv run --frozen pytest -q tests/test_cline_completion_gates.py
          git diff --check

      - name: Commit fixes to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/codex_plugin_scanner/guard/adapters/cline_plugin.py tests/test_cline_completion_gates.py
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix(cline): preserve live enforcement proofs'
          git push origin HEAD:fix/release-3.0-cline-live-policy
