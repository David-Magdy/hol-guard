name: Secrets platform hardening bootstrap

on:
  push:
    branches:
      - fix/secrets-e2e-platform-hardening-v2

permissions:
  contents: write

concurrency:
  group: secrets-platform-hardening-bootstrap
  cancel-in-progress: false

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/secrets-e2e-platform-hardening-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false

      - name: Install locked development environment
        run: uv sync --frozen --extra dev --python 3.12

      - name: Format and lint the permanent hardening slice
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/codex_plugin_scanner/guard/secrets/setup_diagnostics.py
            src/codex_plugin_scanner/guard/secrets/git_subprocess.py
            src/codex_plugin_scanner/guard/secrets/cli.py
            src/codex_plugin_scanner/guard/secrets/precommit.py
            src/codex_plugin_scanner/guard/secrets/secret_repository_scanner.py
            src/codex_plugin_scanner/guard/secrets/secret_staged_scanner.py
            scripts/ci/run_guard_secrets_platform_smoke_v2.py
            tests/test_guard_secret_platform_hardening.py
          )
          uv run --no-sync python -m ruff format "${files[@]}"
          uv run --no-sync python -m ruff check --fix "${files[@]}"
          uv run --no-sync python -m ruff format "${files[@]}"
          uv run --no-sync python -m ruff check "${files[@]}"

      - name: Remove superseded smoke script and advance exact test ratchet
        shell: bash
        run: |
          set -euo pipefail
          git rm -f scripts/ci/run_guard_secrets_platform_smoke.py
          uv run --no-sync python scripts/ci/generate_test_inventory.py --output /tmp/test-inventory.json
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path('/tmp/test-inventory.json').read_text(encoding='utf-8'))
          baseline_path = Path('ci/test-suite-ratchet-baseline.json')
          baseline = json.loads(baseline_path.read_text(encoding='utf-8'))
          baseline['maximum_collected_cases'] = inventory['inventory']['collected_cases']
          baseline['maximum_test_source_lines'] = inventory['test_source_lines']
          baseline_path.write_text(json.dumps(baseline, indent=2) + '\n', encoding='utf-8')
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory /tmp/test-inventory.json

      - name: Type-check and run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync basedpyright --level error \
            src/codex_plugin_scanner/guard/secrets/setup_diagnostics.py \
            src/codex_plugin_scanner/guard/secrets/git_subprocess.py \
            src/codex_plugin_scanner/guard/secrets/cli.py \
            src/codex_plugin_scanner/guard/secrets/precommit.py \
            src/codex_plugin_scanner/guard/secrets/secret_repository_scanner.py \
            src/codex_plugin_scanner/guard/secrets/secret_staged_scanner.py \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            tests/test_guard_secret_platform_hardening.py
          uv run --no-sync pytest -q \
            tests/test_guard_secret_platform_hardening.py \
            tests/test_guard_secret_detection.py \
            tests/test_guard_secret_assignment_precision.py \
            tests/test_guard_secret_fixture_precision.py \
            tests/test_guard_secret_redaction.py \
            --tb=short

      - name: Build and exercise the exact wheel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          uv build --wheel --out-dir dist
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv run --no-sync python scripts/ci/run_guard_secrets_platform_smoke_v2.py --wheel "$wheel"
          git diff --check

      - name: Commit permanent files and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/secrets-platform-hardening-bootstrap.yml
          git add \
            .github/workflows/secrets-platform-e2e.yml \
            ci/test-suite-ratchet-baseline.json \
            docs/guard/secrets-platform-hardening.md \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            src/codex_plugin_scanner/guard/secrets \
            tests/test_guard_secret_platform_hardening.py
          git commit -m 'fix(secrets): validate cross-platform end-to-end hardening'
          git push origin HEAD:fix/secrets-e2e-platform-hardening-v2
