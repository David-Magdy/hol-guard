name: Temporary Rust program documents

on:
  push:
    branches:
      - feat/rust-safety-kernel-pretool-completion-v2
    paths:
      - .github/workflows/tmp-rust-program-docs.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/rust-safety-kernel-pretool-completion-v2
          fetch-depth: 1
      - name: Write canonical documents and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path

          todo = ""
          prompt = ""
          Path("docs/guard/rust-safety-kernel-pretool-todo.md").write_bytes(base64.b64decode(todo))
          Path("docs/guard/rust-safety-kernel-pretool-takeaway-prompt.md").write_bytes(base64.b64decode(prompt))
          Path(".github/workflows/tmp-rust-program-docs.yml").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/guard/rust-safety-kernel-pretool-todo.md docs/guard/rust-safety-kernel-pretool-takeaway-prompt.md .github/workflows/tmp-rust-program-docs.yml
          git commit -m "docs(guard): add Rust completion TODO and takeaway prompt"
          git push origin HEAD:feat/rust-safety-kernel-pretool-completion-v2
