name: Apply Desktop Core feed regression test once

on:
  push:
    branches:
      - fix/desktop-core-feed-arm64-wheel

permissions:
  contents: write

jobs:
  apply-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/desktop-core-feed-arm64-wheel
          persist-credentials: true

      - name: Add wheel-selection regression assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/test_desktop_core_alpha_feed_security.py')
          text = path.read_text(encoding='utf-8')
          anchor = (
              '    assert \'test "$WHEEL_COUNT" -eq 1\' in text\n'
              '    assert \'test -f "$WHEEL"\' in text\n'
          )
          replacement = anchor + (
              '    assert \'--pattern "hol_guard-${CORE_VERSION}-*-macosx_*_arm64.whl"\' in text\n'
              '    assert \'-name "hol_guard-${CORE_VERSION}-*-macosx_*_arm64.whl"\' in text\n'
              '    assert \'--pattern "hol_guard-${CORE_VERSION}-*.whl"\' not in text\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit('Desktop Core feed security-test anchor changed unexpectedly')
          path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_desktop_core_alpha_feed_security.py
          git commit -m "test(release): bind Core feed to the arm64 wheel"
          git push origin HEAD:fix/desktop-core-feed-arm64-wheel
