name: Protection Center Batch 5 latest release sync
on:
  push:
    branches: [feat/protection-center-05-test-activity]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Compose current release source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin release/3.0
          set +e
          git merge --no-commit --no-ff origin/release/3.0
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            allowed="$(printf '%s\n' ci/test-suite-ratchet-baseline.json src/codex_plugin_scanner/guard/daemon/static/assets/guard-dashboard.js | sort)"
            if [ "$conflicts" != "$allowed" ]; then
              echo "Unexpected merge conflicts:"; printf '%s\n' "$conflicts"; exit 1
            fi
            git checkout --ours ci/test-suite-ratchet-baseline.json
            git checkout --ours src/codex_plugin_scanner/guard/daemon/static/assets/guard-dashboard.js
            git add ci/test-suite-ratchet-baseline.json src/codex_plugin_scanner/guard/daemon/static/assets/guard-dashboard.js
          fi
      - name: Recompute ratchet and verify Python
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync python scripts/ci/test_inventory.py --output test-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path
          inventory = json.loads(Path('test-inventory.json').read_text())['inventory']
          baseline = {
              'maximum_collected_cases': inventory['collected_cases'],
              'maximum_test_source_lines': json.loads(Path('test-inventory.json').read_text())['test_source_lines'],
              'schema_version': 1,
          }
          Path('ci/test-suite-ratchet-baseline.json').write_text(json.dumps(baseline, indent=2) + '\n')
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py --baseline ci/test-suite-ratchet-baseline.json --inventory test-inventory.json
          uv run --no-sync python -m ruff check src/
          uv run --no-sync python -m ruff format --check src/
          uv run --no-sync pytest -q \
            tests/test_guard_approval_scope_contract.py \
            tests/test_guard_extension_control_authority.py \
            tests/test_guard_extension_control_test_lab.py
      - name: Verify dashboard and rebuild combined static assets
        shell: bash
        run: |
          set -euo pipefail
          cd dashboard
          bun install --frozen-lockfile --ignore-scripts
          bun run test
          bun run build
          cd ..
          git diff --check
      - name: Commit composed release sync
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/protection-center-batch5-resync.yml
          git add ci/test-suite-ratchet-baseline.json dashboard src/codex_plugin_scanner/guard/daemon/static .github/workflows/protection-center-batch5-resync.yml
          git diff --cached --check
          git commit -m "chore(protection-center): sync latest release/3.0"
          git push origin HEAD:feat/protection-center-05-test-activity
