name: Temporary PreToolUse native authority source export

on:
  push:
    branches:
      - tmp/pretool-native-authority-source-20260815
    paths:
      - .github/workflows/tmp-export-pretool-native-authority-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: tmp/pretool-native-authority-source-20260815
          fetch-depth: 1
          persist-credentials: false
      - name: Archive exact source
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/source-sha.txt"
          tar --exclude=.git --exclude=.venv --exclude=.uv-cache -czf "$RUNNER_TEMP/source.tgz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pretool-native-authority-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/source.tgz
            ${{ runner.temp }}/source-sha.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
