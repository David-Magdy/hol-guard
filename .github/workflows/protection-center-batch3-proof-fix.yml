name: Protection Center Batch 3 proof fix
on:
  push:
    branches:
      - feat/protection-center-03-module-detail-final
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Correct installed proof selectors
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/ci/protection_center_batch3_proof_fix.py
          rm .github/workflows/protection-center-batch3-proof-fix.yml
          rm scripts/ci/protection_center_batch3_proof_fix.py
          git add dashboard/e2e/installed-extension-control-center.spec.ts .github/workflows/protection-center-batch3-proof-fix.yml scripts/ci/protection_center_batch3_proof_fix.py
          git diff --cached --check
          git commit -m "test(protection-center): verify applied policy after editor refresh"
          git push origin HEAD:feat/protection-center-03-module-detail-final