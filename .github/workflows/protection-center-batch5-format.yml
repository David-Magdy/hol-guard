name: Protection Center Batch 5 format
on:
  push:
    branches: [feat/protection-center-05-test-activity]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Format and verify
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/guard/daemon/extension_control_test_api.py \
            src/codex_plugin_scanner/guard/store_extension_control_authority_transitions.py
          uv run --no-sync python -m ruff check src/
          uv run --no-sync python -m ruff format --check src/
          uv run --no-sync pytest -q \
            tests/test_guard_extension_control_authority.py \
            tests/test_guard_extension_control_test_lab.py
          git diff --check
      - name: Commit verified formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/protection-center-batch5-format.yml
          git add src/codex_plugin_scanner/guard/daemon/extension_control_test_api.py \
            src/codex_plugin_scanner/guard/store_extension_control_authority_transitions.py \
            .github/workflows/protection-center-batch5-format.yml
          git diff --cached --check
          git commit -m "style(protection-center): apply canonical Python formatting"
          git push origin HEAD:feat/protection-center-05-test-activity
