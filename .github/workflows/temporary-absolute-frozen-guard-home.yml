name: Temporary absolute frozen guard home

on:
  push:
    branches:
      - fix/main-frozen-hook-bridge-hardening

permissions:
  contents: write

jobs:
  fix-test-ratchet-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/main-frozen-hook-bridge-hardening
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: 0.9.26
          enable-cache: true

      - name: Install frozen development environment
        run: uv sync --frozen --extra dev --python 3.12

      - name: Require absolute reviewed Guard home
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/codex_plugin_scanner/guard/adapters/bounded_cli_hook_bridge.py')
          text = source.read_text(encoding='utf-8')
          old = '''    try:
              supplied_guard_home = Path(cli_args[3]).resolve(strict=False)
              expected_guard_home = guard_home.resolve(strict=False)
          except (OSError, RuntimeError):
              return None
          '''
          new = '''    supplied_guard_home_value = Path(cli_args[3])
          if not supplied_guard_home_value.is_absolute() or not guard_home.is_absolute():
              return None
          try:
              supplied_guard_home = supplied_guard_home_value.resolve(strict=False)
              expected_guard_home = guard_home.resolve(strict=False)
          except (OSError, RuntimeError):
              return None
          '''
          if text.count(old) != 1:
              raise SystemExit('absolute Guard-home validation anchor changed')
          source.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_bounded_cli_hook_bridge.py')
          test_text = tests.read_text(encoding='utf-8')
          if 'def test_relative_frozen_guard_home_denies_before_daemon_dispatch(' in test_text:
              raise SystemExit('absolute Guard-home regression already present')
          addition = '''

          def test_relative_frozen_guard_home_denies_before_daemon_dispatch(
              monkeypatch: pytest.MonkeyPatch,
              tmp_path: Path,
          ) -> None:
              config = _config(tmp_path, harness="grok")
              cli_args = cast(list[str], config["cli_args"])
              relative_guard_home = Path.cwd().relative_to(Path.cwd()) / (tmp_path / "guard-home").relative_to(Path.cwd())
              cli_args[3] = str(relative_guard_home)
              config["frozen_launcher"] = True
              monkeypatch.setattr(bounded_cli_hook_bridge.sys, "frozen", True, raising=False)

              def forbidden_daemon(**kwargs: object) -> object:
                  del kwargs
                  raise AssertionError("relative frozen Guard home must not reach the daemon")

              monkeypatch.setattr(bounded_cli_hook_bridge, "_try_daemon_hook", forbidden_daemon)
              output = io.StringIO()
              with redirect_stdout(output):
                  returncode = bounded_cli_hook_bridge.run_bounded_cli_hook(config, input_text="{}")

              assert returncode == 0
              assert _json_object(output.getvalue())["decision"] == "deny"


          def test_relative_configured_guard_home_denies_before_daemon_dispatch(
              monkeypatch: pytest.MonkeyPatch,
              tmp_path: Path,
          ) -> None:
              config = _config(tmp_path, harness="grok")
              config["guard_home"] = "relative-guard-home"
              cli_args = cast(list[str], config["cli_args"])
              cli_args[3] = "relative-guard-home"
              config["frozen_launcher"] = True
              monkeypatch.setattr(bounded_cli_hook_bridge.sys, "frozen", True, raising=False)

              def forbidden_daemon(**kwargs: object) -> object:
                  del kwargs
                  raise AssertionError("relative configured Guard home must not reach the daemon")

              monkeypatch.setattr(bounded_cli_hook_bridge, "_try_daemon_hook", forbidden_daemon)
              output = io.StringIO()
              with redirect_stdout(output):
                  returncode = bounded_cli_hook_bridge.run_bounded_cli_hook(config, input_text="{}")

              assert returncode == 0
              assert _json_object(output.getvalue())["decision"] == "deny"
          '''
          tests.write_text(test_text.rstrip() + addition + '\n', encoding='utf-8')
          PY

      - name: Format and validate focused contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync ruff format \
            src/codex_plugin_scanner/guard/adapters/bounded_cli_hook_bridge.py \
            tests/test_bounded_cli_hook_bridge.py
          uv run --no-sync ruff check \
            src/codex_plugin_scanner/guard/adapters/bounded_cli_hook_bridge.py \
            tests/test_bounded_cli_hook_bridge.py
          uv run --no-sync pytest -q \
            tests/test_bounded_cli_hook_bridge.py \
            tests/test_cli.py \
            tests/test_cli_only_hook_resilience.py \
            tests/test_guard_copilot_adapter.py \
            tests/test_hermes_adapter.py \
            tests/test_openclaw_adapter.py \
            --tb=short
          uv run --no-sync basedpyright --level error \
            src/codex_plugin_scanner/guard/adapters/bounded_cli_hook_bridge.py \
            tests/test_bounded_cli_hook_bridge.py

      - name: Advance exact test-suite ratchet
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/ci/test_inventory.py --output test-inventory.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          full = json.loads(Path('test-inventory.json').read_text(encoding='utf-8'))
          inventory = full['inventory']
          Path('ci/test-suite-ratchet-baseline.json').write_text(
              json.dumps(
                  {
                      'maximum_collected_cases': inventory['collected_cases'],
                      'maximum_test_source_lines': full['test_source_lines'],
                      'schema_version': 1,
                  },
                  indent=2,
              ) + '\n',
              encoding='utf-8',
          )
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory test-inventory.json

      - name: Commit fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm .github/workflows/temporary-absolute-frozen-guard-home.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/codex_plugin_scanner/guard/adapters/bounded_cli_hook_bridge.py \
            tests/test_bounded_cli_hook_bridge.py \
            ci/test-suite-ratchet-baseline.json
          git commit -m "fix(hooks): require absolute frozen Guard home"
          git push origin HEAD:fix/main-frozen-hook-bridge-hardening
