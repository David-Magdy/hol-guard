name: Managed Controls batch 02 exact-head evidence refresh

on:
  pull_request:
    branches:
      - release/3.0
    paths:
      - '.github/workflows/managed-controls-batch02-ci-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: managed-controls-batch02-ci-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'managed-controls/batch-02-actions-limits-clean'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: managed-controls/batch-02-actions-limits-clean
          fetch-depth: 0

      - name: Refresh source-bound decision evidence
        env:
          PYTHONPATH: src
        run: |
          python tests/guard_command_decision_diff.py --write
          python tests/guard_command_decision_diff.py --check

      - name: Refresh reviewed structural quality baseline
        run: |
          python scripts/ci/code_quality_audit.py \
            --root . \
            --baseline ci/code-quality-baseline.json \
            --write-baseline \
            --json-output code-quality-audit.json
          python scripts/ci/code_quality_audit.py \
            --root . \
            --baseline ci/code-quality-baseline.json \
            --json-output code-quality-audit-verify.json

      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/managed-controls-batch02-ci-refresh.yml
          git add -A
          git diff --cached --check
          git commit -m "test: refresh Managed Controls exact-head evidence"
          git push origin HEAD:managed-controls/batch-02-actions-limits-clean
