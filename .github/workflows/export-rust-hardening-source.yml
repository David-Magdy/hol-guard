name: Apply Rust hardening foundation

on:
  push:
    branches: [feat/rust-hardening-foundation]
    paths:
      - ".github/workflows/export-rust-hardening-source.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: feat/rust-hardening-foundation
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat ci/rust-hardening-foundation.patch.gz.b64.part{00,01,02,03} > "$RUNNER_TEMP/foundation.patch.gz.b64"
          echo "9c086e123a1099b24640192c32291bfe7d1a1083db0c17e0ea1b258ccfa859b5  $RUNNER_TEMP/foundation.patch.gz.b64" | sha256sum --check
          base64 --decode "$RUNNER_TEMP/foundation.patch.gz.b64" > "$RUNNER_TEMP/foundation.patch.gz"
          echo "89968dede8a147c825c2f48d25e01de025cb7dd3f2368fb2209acb98d1d683e0  $RUNNER_TEMP/foundation.patch.gz" | sha256sum --check
          gzip --decompress --stdout "$RUNNER_TEMP/foundation.patch.gz" > "$RUNNER_TEMP/foundation.patch"
          echo "54f6fbaa5124406bf33ac0dcecb2cf5b6553260d106830be96e508143bee63f3  $RUNNER_TEMP/foundation.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/foundation.patch"
          git apply --index "$RUNNER_TEMP/foundation.patch"
          git diff --cached --check
      - name: Validate source-of-truth contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m ruff format --check tests/test_rust_hardening_contracts.py
          uv run --no-sync python -m ruff check tests/test_rust_hardening_contracts.py
          uv run --no-sync pytest -q tests/test_rust_hardening_contracts.py --tb=short
          git diff --check
      - name: Commit validated foundation
        shell: bash
        run: |
          set -euo pipefail
          git rm ci/rust-hardening-foundation.patch.gz.b64.part{00,01,02,03}
          git diff --cached --check
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git commit --signoff -m "docs(guard): define native runtime hardening gates"
          branch=feat/rust-hardening-foundation
          remote_sha=$(git ls-remote --exit-code origin "refs/heads/${branch}" | awk '{print $1}')
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "Foundation branch moved while validation was running" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/${branch}"
