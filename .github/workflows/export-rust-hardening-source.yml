name: Export Rust hardening source snapshot

on:
  push:
    branches: [feat/rust-hardening-foundation]
    paths:
      - ".github/workflows/export-rust-hardening-source.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.venv \
            --exclude=node_modules \
            --exclude=target \
            --exclude='*.pyc' \
            -czf "$RUNNER_TEMP/hol-guard-source.tgz" .
          sha256sum "$RUNNER_TEMP/hol-guard-source.tgz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hol-guard-source-${{ github.sha }}
          path: ${{ runner.temp }}/hol-guard-source.tgz
          if-no-files-found: error
          retention-days: 1
