name: Desktop contract CI

on:
  push:
    branches:
      - desktop/3.0-contracts
    paths:
      - src/codex_plugin_scanner/guard/cli/commands_dispatch_desktop.py
      - src/codex_plugin_scanner/guard/cli/commands_parser_desktop.py
      - src/codex_plugin_scanner/guard/cli/commands_parser.py
      - src/codex_plugin_scanner/guard/cli/commands_router.py
      - src/codex_plugin_scanner/guard/cli/commands_support.py
      - tests/test_guard_desktop_contract.py
      - docs/guard/desktop-bootstrap-contract.md
      - .github/workflows/desktop-contract-ci.yml

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out contract branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Normalize explicit dispatcher imports
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/codex_plugin_scanner/guard/cli/commands_dispatch_desktop.py")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              "import importlib.metadata\nimport json\n",
              "import argparse\nimport importlib.metadata\nimport json\nimport sys\n",
              1,
          )
          path.write_text(source, encoding="utf-8")
          PY

      - name: Format and lint contract sources
        run: |
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/guard/cli/commands_dispatch_desktop.py \
            src/codex_plugin_scanner/guard/cli/commands_parser_desktop.py \
            tests/test_guard_desktop_contract.py
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/cli/commands_dispatch_desktop.py \
            src/codex_plugin_scanner/guard/cli/commands_parser_desktop.py \
            tests/test_guard_desktop_contract.py

      - name: Run contract tests
        run: uv run --no-sync pytest tests/test_guard_desktop_contract.py --tb=short

      - name: Smoke test CLI projection
        run: |
          export HOL_GUARD_HOME="$RUNNER_TEMP/guard-home"
          mkdir -p "$HOL_GUARD_HOME"
          uv run --no-sync hol-guard desktop bootstrap --json > "$RUNNER_TEMP/desktop-bootstrap.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "desktop-bootstrap.json"
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["schema"] == "guard-desktop-bootstrap.v1"
          assert payload["status"] in {
              "ready",
              "attention_required",
              "setup_required",
              "runtime_unavailable",
              "incompatible",
          }
          PY

      - name: Commit formatter output
        run: |
          git add \
            src/codex_plugin_scanner/guard/cli/commands_dispatch_desktop.py \
            src/codex_plugin_scanner/guard/cli/commands_parser_desktop.py \
            tests/test_guard_desktop_contract.py
          if git diff --cached --quiet; then
            echo "No formatter changes"
            exit 0
          fi
          git commit -m "style: format Desktop contract sources"
          git push origin HEAD:desktop/3.0-contracts
