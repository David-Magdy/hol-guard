name: Format native release verifier

on:
  push:
    branches: [feat/rust-runtime-native-publish]
    paths:
      - ".github/workflows/native-release-format-fix.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: feat/rust-runtime-native-publish
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Apply deterministic Ruff formatting
        run: |
          set -euo pipefail
          uv run --no-sync python -m ruff format \
            scripts/verify_native_runtime_release.py \
            ci/native_runtime/test_native_runtime_release.py
          uv run --no-sync python -m ruff format --check \
            scripts/verify_native_runtime_release.py \
            ci/native_runtime/test_native_runtime_release.py
          git rm .github/workflows/native-release-format-fix.yml
          git add scripts/verify_native_runtime_release.py ci/native_runtime/test_native_runtime_release.py
          git diff --cached --check
      - name: Commit exact formatter output
        run: |
          set -euo pipefail
          branch=feat/rust-runtime-native-publish
          remote_sha=$(git ls-remote --exit-code origin "refs/heads/${branch}" | awk '{print $1}')
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "Publication branch moved while formatting" >&2
            exit 1
          fi
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git commit -m "style(release): format native publication verifier"
          git push origin "HEAD:refs/heads/${branch}"
