name: Protection Center Batch 5 sync release
on:
  push:
    branches: [feat/protection-center-05-test-activity]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Compose current release into Batch 5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin release/3.0
          set +e
          git merge --no-commit --no-ff origin/release/3.0
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "ci/test-suite-ratchet-baseline.json" ]; then
              echo "Unexpected merge conflicts:" >&2
              printf '%s\n' "$conflicts" >&2
              exit 1
            fi
            git checkout --ours ci/test-suite-ratchet-baseline.json
            git add ci/test-suite-ratchet-baseline.json
          fi
          rm .github/workflows/protection-center-batch5-sync-release.yml
          git add .github/workflows/protection-center-batch5-sync-release.yml
          git diff --cached --check
          git commit -m "chore(protection-center): sync current release/3.0"
          git push origin HEAD:feat/protection-center-05-test-activity
