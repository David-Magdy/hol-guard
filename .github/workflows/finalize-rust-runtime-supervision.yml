name: Finalize Rust runtime supervision

on:
  push:
    branches: [feat/rust-runtime-supervision-final]
    paths:
      - ".github/workflows/finalize-rust-runtime-supervision.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: feat/rust-runtime-supervision-final
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Prepare toolchains
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
      - name: Repair resident supervision lint findings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          rust_path = Path("rust/crates/guard-runtime/src/main.rs")
          rust_text = rust_path.read_text(encoding="utf-8")
          old = "    Hook(NativeHookRequestV1),\n"
          new = "    Hook(Box<NativeHookRequestV1>),\n"
          if rust_text.count(old) != 1:
              raise RuntimeError("resident request enum anchor changed")
          rust_path.write_text(rust_text.replace(old, new, 1), encoding="utf-8")

          py_path = Path("src/codex_plugin_scanner/guard/native_runtime_resident.py")
          py_text = py_path.read_text(encoding="utf-8")
          old_loop = "        for key, candidate in tuple(_SERVICES.items()):\n"
          new_loop = "        for key in tuple(_SERVICES):\n"
          if py_text.count(old_loop) != 1:
              raise RuntimeError("resident stale-service loop anchor changed")
          py_path.write_text(py_text.replace(old_loop, new_loop, 1), encoding="utf-8")
          PY
      - name: Validate supervision foundation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo fmt --manifest-path rust/Cargo.toml --all --check
          cargo check --manifest-path rust/Cargo.toml --locked --workspace --all-targets
          cargo clippy --manifest-path rust/Cargo.toml --locked --workspace --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --locked --workspace --all-targets
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/native_runtime.py \
            src/codex_plugin_scanner/guard/native_runtime_identity.py \
            src/codex_plugin_scanner/guard/native_runtime_resident.py \
            src/codex_plugin_scanner/guard/native_runtime_supervisor.py \
            tests/test_native_runtime_identity.py \
            tests/test_native_runtime_supervisor.py
          uv run --no-sync pytest -q \
            tests/test_native_runtime_identity.py \
            tests/test_native_runtime_supervisor.py \
            tests/test_rust_hardening_contracts.py \
            --tb=short
          git diff --check
      - name: Commit validated supervision foundation
        shell: bash
        run: |
          set -euo pipefail
          branch=feat/rust-runtime-supervision-final
          remote_sha=$(git ls-remote --exit-code origin "refs/heads/${branch}" | awk '{print $1}')
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "Branch moved while supervision validation ran" >&2
            exit 1
          fi
          rm -f .github/workflows/finalize-rust-runtime-supervision.yml
          git add -A
          git diff --cached --check
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git commit --signoff -m "fix(guard): finalize native supervision validation"
          git push origin "HEAD:refs/heads/${branch}"
