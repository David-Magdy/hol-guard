name: Temporary native supervision source snapshot

on:
  push:
    branches:
      - feat/rust-runtime-supervision-final
    paths:
      - .github/workflows/finalize-rust-runtime-supervision.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/rust-runtime-supervision-final
          fetch-depth: 1
          persist-credentials: false
      - name: Archive exact source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.venv --exclude=.uv-cache -czf "$RUNNER_TEMP/supervision-source.tgz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: supervision-source-${{ github.sha }}
          path: ${{ runner.temp }}/supervision-source.tgz
          if-no-files-found: error
          retention-days: 1
