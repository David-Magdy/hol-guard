name: Protection Center Batch 6 final base sync
on:
  push:
    branches: [feat/protection-center-06-cloud-boundary-hardening]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Compose latest release/3.0
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/3.0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-edit origin/release/3.0; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'merge conflicts: %s\n' "${conflicts[*]:-none}"
            if [[ ${#conflicts[@]} -ne 1 || "${conflicts[0]}" != "ci/test-suite-ratchet-baseline.json" ]]; then
              exit 1
            fi
            git checkout --theirs ci/test-suite-ratchet-baseline.json
            git add ci/test-suite-ratchet-baseline.json
          fi
      - name: Install verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
      - name: Recalculate ratchet from composed inventory
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/ci/test_inventory.py --output /tmp/protection-center-inventory.json
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path('/tmp/protection-center-inventory.json').read_text(encoding='utf-8'))
          values = inventory['inventory']
          baseline = {
              'maximum_collected_cases': values['collected_cases'],
              'maximum_test_source_lines': inventory['test_source_lines'],
              'schema_version': 1,
          }
          Path('ci/test-suite-ratchet-baseline.json').write_text(json.dumps(baseline, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(baseline, sort_keys=True))
          PY
          git add ci/test-suite-ratchet-baseline.json
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory /tmp/protection-center-inventory.json
          git diff --check
      - name: Verify composed Protection Center contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/daemon/server.py \
            tests/test_guard_extension_control_dashboard_session_auth.py \
            tests/test_guard_extension_control_test_lab.py \
            tests/test_guard_extension_control_api.py
          uv run --no-sync python -m ruff format --check \
            src/codex_plugin_scanner/guard/daemon/server.py \
            tests/test_guard_extension_control_dashboard_session_auth.py \
            tests/test_guard_extension_control_test_lab.py \
            tests/test_guard_extension_control_api.py
          uv run --no-sync basedpyright --level error
          uv run --no-sync pytest -q \
            tests/test_guard_extension_control_dashboard_session_auth.py \
            tests/test_guard_extension_control_test_lab.py \
            tests/test_guard_extension_control_api.py \
            tests/test_guard_frozen_daemon_runtime.py
          git diff --check
      - name: Commit composition, remove temporary workflow, and push
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "chore(protection-center): sync latest release/3.0"
          else
            git add ci/test-suite-ratchet-baseline.json
            if ! git diff --cached --quiet; then
              git commit -m "test(protection-center): reconcile final suite ratchet"
            fi
          fi
          rm .github/workflows/protection-center-batch6-final-base-sync.yml
          git add .github/workflows/protection-center-batch6-final-base-sync.yml
          git commit -m "chore(protection-center): remove final base sync workflow"
          git push origin HEAD:feat/protection-center-06-cloud-boundary-hardening
