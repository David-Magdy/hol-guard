name: Protection Center Batch 6 final release sync
on:
  push:
    branches: [feat/protection-center-06-cloud-boundary-hardening]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Compose current release/3.0
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/3.0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/release/3.0
          git diff --check HEAD^ HEAD
      - name: Install verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
      - name: Verify composed Protection Center auth and API
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/daemon/server.py \
            tests/test_guard_extension_control_dashboard_session_auth.py \
            tests/test_guard_extension_control_test_lab.py \
            tests/test_guard_extension_control_api.py
          uv run --no-sync python -m ruff format --check \
            src/codex_plugin_scanner/guard/daemon/server.py \
            tests/test_guard_extension_control_dashboard_session_auth.py \
            tests/test_guard_extension_control_test_lab.py \
            tests/test_guard_extension_control_api.py
          uv run --no-sync basedpyright --level error
          uv run --no-sync pytest -q \
            tests/test_guard_extension_control_dashboard_session_auth.py \
            tests/test_guard_extension_control_test_lab.py \
            tests/test_guard_extension_control_api.py
          git diff --check
      - name: Remove temporary workflow and push verified composition
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/protection-center-batch6-final-release-sync.yml
          git add .github/workflows/protection-center-batch6-final-release-sync.yml
          git commit -m "chore(protection-center): remove final sync workflow"
          git push origin HEAD:feat/protection-center-06-cloud-boundary-hardening
