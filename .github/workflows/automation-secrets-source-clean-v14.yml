name: Materialize clean HOL Guard Secrets source v14

on:
  push:
    branches:
      - automation/secrets-source-clean-v14

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: automation-secrets-source-clean-v14
  cancel-in-progress: true

jobs:
  materialize-validate-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TARGET_BRANCH: release/3.0
      OUTPUT_BRANCH: fix/secrets-platform-git-hook-clean-20260815
      PLATFORM_REF: 1143f6e3eb355e6de1e434083ff2c974efd78708
      PROCESS_REF: 5f5befcf2aa847d2813d40e8bf47f4ce4f5a95d2
      OBJECT_REF: 1de19656af287ced5a8cac17b2986053c125afca
      HOOK_REF: d8c4a8939973ee695bffa39217e3e0e036cdcca0
    steps:
      - name: Checkout automation source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: automation/secrets-source-clean-v14
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch reviewed source objects and reset to current release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}" \
            "+refs/heads/fix/secrets-e2e-platform-hardening-v2:refs/remotes/origin/fix/secrets-e2e-platform-hardening-v2" \
            "+refs/heads/fix/secrets-git-process-hardening-v2:refs/remotes/origin/fix/secrets-git-process-hardening-v2" \
            "+refs/heads/fix/secrets-git-object-edge-hardening:refs/remotes/origin/fix/secrets-git-object-edge-hardening" \
            "+refs/heads/fix/secrets-hook-identity-final-v2:refs/remotes/origin/fix/secrets-hook-identity-final-v2"
          for commit in "$PLATFORM_REF" "$PROCESS_REF" "$OBJECT_REF" "$HOOK_REF"; do
            git cat-file -e "${commit}^{commit}"
          done
          git checkout -B "$OUTPUT_BRANCH" "origin/$TARGET_BRANCH"

      - name: Materialize reviewed permanent source
        shell: bash
        run: |
          set -euo pipefail
          git show "$HOOK_REF":scripts/ci/secrets_complete_repair.py > /tmp/secrets_complete_repair.py
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('/tmp/secrets_complete_repair.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)target\.write_bytes\('
              r'zlib\.decompress\(base64\.b64decode\(payload\)\)\)\s*$'
          )
          match = pattern.search(text)
          if match is None:
              raise SystemExit('repair write boundary changed unexpectedly')
          indent = match.group('indent')
          replacement = '\n'.join(
              [
                  f'{indent}try:',
                  f'{indent}    materialized = zlib.decompress(base64.b64decode(payload))',
                  f'{indent}except zlib.error:',
                  f'{indent}    if target.as_posix() != "src/codex_plugin_scanner/guard/secrets/git_subprocess.py":',
                  f'{indent}        raise',
                  f'{indent}    copy_file(platform_ref, target.as_posix())',
                  f'{indent}    continue',
                  f'{indent}target.write_bytes(materialized)',
              ]
          )
          patched, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'unexpected repair replacement count: {count}')
          path.write_text(patched, encoding='utf-8')
          PY
          python /tmp/secrets_complete_repair.py

          mkdir -p .github/workflows tests
          git show "$PLATFORM_REF":.github/workflows/secrets-platform-e2e.yml > .github/workflows/secrets-platform-e2e.yml
          git show "$HOOK_REF":tests/test_guard_secret_hook_identity_worktree.py > tests/test_guard_secret_hook_identity_worktree.py
          git show "$HOOK_REF":tests/test_guard_secret_sparse_bare_repository.py > tests/test_guard_secret_sparse_bare_repository.py

          test -f src/codex_plugin_scanner/guard/secrets/git_safe.py
          test -f src/codex_plugin_scanner/guard/secrets/git_subprocess.py
          test -f src/codex_plugin_scanner/guard/secrets/setup_diagnostics.py
          test -f scripts/ci/run_guard_secrets_platform_smoke_v2.py
          test -f scripts/ci/run_guard_secrets_pipx_smoke.py
          test -f .github/workflows/secrets-platform-e2e.yml
          test ! -e scripts/ci/secrets_complete_repair.py

      - name: Set up Python and uv
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false

      - name: Install locked environment
        run: uv sync --frozen --extra dev --python 3.12

      - name: Format lint and type-check changed Python
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_python < <(git diff --name-only --diff-filter=ACM | grep -E '\.py$' | sort)
          test "${#changed_python[@]}" -gt 0
          uv run --no-sync python -m ruff format "${changed_python[@]}"
          uv run --no-sync python -m ruff check --fix "${changed_python[@]}"
          uv run --no-sync python -m ruff format "${changed_python[@]}"
          uv run --no-sync python -m ruff check "${changed_python[@]}"
          uv run --no-sync basedpyright --level error "${changed_python[@]}"

      - name: Run complete Secrets test suite and ratchet
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' tests < <(find tests -maxdepth 1 -type f \( -name '*secret*.py' -o -name '*secrets*.py' \) -print0 | sort -z)
          test "${#tests[@]}" -gt 0
          uv run --no-sync pytest -q "${tests[@]}" --tb=short
          uv run --no-sync python scripts/ci/generate_test_inventory.py --output /tmp/test-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path('/tmp/test-inventory.json').read_text(encoding='utf-8'))
          path = Path('ci/test-suite-ratchet-baseline.json')
          baseline = json.loads(path.read_text(encoding='utf-8'))
          baseline['maximum_collected_cases'] = int(inventory['inventory']['collected_cases'])
          baseline['maximum_test_source_lines'] = int(inventory['test_source_lines'])
          path.write_text(json.dumps(baseline, indent=2) + '\n', encoding='utf-8')
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory /tmp/test-inventory.json

      - name: Build exact wheel and exercise installed lifecycles
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          uv build --wheel --out-dir dist
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv run --no-sync python scripts/ci/run_guard_secrets_platform_smoke_v2.py --wheel "$wheel"
          uv run --no-sync python scripts/ci/run_guard_secrets_pipx_smoke.py --wheel "$wheel"
          git diff --check

      - name: Enforce source-only change boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only > /tmp/changed-files.txt
          cat /tmp/changed-files.txt
          if grep -E '^\.github/workflows/.*(bootstrap|finalizer|shepherd|integration|repair|transfer|export)' /tmp/changed-files.txt; then
            echo 'temporary workflow leaked into permanent source change' >&2
            exit 1
          fi
          if grep -E '(^|/)(secrets_complete_repair\.py|chunk-[0-9]+)$' /tmp/changed-files.txt; then
            echo 'temporary transfer artifact leaked into permanent source change' >&2
            exit 1
          fi

      - name: Commit and publish clean source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix(secrets): complete platform Git and hook hardening'
          git push --force origin HEAD:"$OUTPUT_BRANCH"
