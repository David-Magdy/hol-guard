name: Temporary final Rust supervision source snapshot

on:
  push:
    branches:
      - tmp/rust-supervision-final-source-20260813
    paths:
      - .github/workflows/tmp-rust-supervision-final-source.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: tmp/rust-supervision-final-source-20260813
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-supervision-final-source-${{ github.sha }}
          path: |
            ci/native_runtime/test_guard_native_runtime_resident.py
            ci/native_runtime/test_guard_native_runtime_windows_resident.py
            ci/test-suite-ratchet-baseline.json
            docs/guard/contracts/rust-native-capability-ownership.v1.json
            docs/guard/rust-runtime-hardening-todo.md
            rust/Cargo.lock
            rust/Cargo.toml
            rust/crates/guard-contracts/src/lib.rs
            rust/crates/guard-hook-core/src/lib.rs
            rust/crates/guard-runtime/Cargo.toml
            rust/crates/guard-runtime/src/main.rs
            rust/crates/guard-runtime/src/resident.rs
            src/codex_plugin_scanner/guard/daemon/server.py
            src/codex_plugin_scanner/guard/native_runtime.py
            src/codex_plugin_scanner/guard/native_runtime_identity.py
            src/codex_plugin_scanner/guard/native_runtime_resident.py
            src/codex_plugin_scanner/guard/native_runtime_supervisor.py
            tests/test_native_runtime_identity.py
            tests/test_native_runtime_supervisor.py
            tests/test_rust_hardening_contracts.py
          if-no-files-found: error
          retention-days: 1
