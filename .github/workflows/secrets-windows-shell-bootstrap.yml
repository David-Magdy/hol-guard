name: Guard Secrets Windows shell bootstrap

on:
  push:
    branches:
      - fix/secrets-windows-shell-diagnostic-v2

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-validate-and-open:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/secrets-windows-shell-diagnostic-v2
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false
      - name: Add a trusted Windows hook-shell probe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          git_path=Path('src/codex_plugin_scanner/guard/secrets/git_safe.py')
          text=git_path.read_text(encoding='utf-8')
          marker='def trusted_windows_hook_shell('
          if marker not in text:
              block=r'''


          def trusted_windows_hook_shell(
              repository_root: Path,
              source: Mapping[str, str] | None = None,
          ) -> bool:
              """Return whether a trusted Git-for-Windows POSIX hook shell exists."""

              ambient = os.environ if source is None else source
              candidates: list[Path] = []
              for directory in _safe_path_entries(ambient, repository_root=repository_root):
                  candidates.extend((directory / "sh.exe", directory / "bash.exe"))
              for key in ("PROGRAMFILES", "PROGRAMFILES(X86)", "LOCALAPPDATA"):
                  raw = ambient.get(key)
                  if not raw:
                      continue
                  base = Path(raw).expanduser()
                  if not base.is_absolute():
                      continue
                  candidates.extend(
                      (
                          base / "Git" / "bin" / "sh.exe",
                          base / "Git" / "usr" / "bin" / "sh.exe",
                          base / "Programs" / "Git" / "bin" / "sh.exe",
                          base / "Programs" / "Git" / "usr" / "bin" / "sh.exe",
                      )
                  )
              seen: set[Path] = set()
              for candidate in candidates:
                  if candidate in seen:
                      continue
                  seen.add(candidate)
                  if _trusted_executable(candidate, repository_root) is not None:
                      return True
              return False
          '''
              git_path.write_text(text.rstrip()+block+'\n',encoding='utf-8')

          doctor_path=Path('src/codex_plugin_scanner/guard/secrets/doctor.py')
          doctor=doctor_path.read_text(encoding='utf-8')
          if 'trusted_windows_hook_shell' not in doctor:
              doctor=doctor.replace('from .git_safe import run_git', 'from .git_safe import run_git, trusted_windows_hook_shell', 1)
          start=doctor.find('def _windows_shell_available() -> bool:')
          end=doctor.find('\n\ndef ', start+1)
          if start == -1 or end == -1:
              raise SystemExit('legacy Windows shell helper was not found')
          replacement='''def _windows_shell_available(repository_root: Path) -> bool:\n    return trusted_windows_hook_shell(repository_root)'''
          doctor=doctor[:start]+replacement+doctor[end:]
          old='if platform_name == "windows" and not _windows_shell_available():'
          new='if platform_name == "windows" and not _windows_shell_available(root):'
          if old not in doctor:
              raise SystemExit('Windows shell call site was not found')
          doctor=doctor.replace(old,new,1)
          doctor_path.write_text(doctor,encoding='utf-8')
          PY
      - name: Validate Windows diagnostic security
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/guard/secrets/git_safe.py \
            src/codex_plugin_scanner/guard/secrets/doctor.py \
            tests/test_guard_secret_windows_shell_security.py
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/secrets/git_safe.py \
            src/codex_plugin_scanner/guard/secrets/doctor.py \
            tests/test_guard_secret_windows_shell_security.py
          PYTHONPATH=src uv run --no-sync pytest -q \
            tests/test_guard_secret_windows_shell_security.py \
            tests/test_guard_secret_git_process_security.py \
            tests/test_guard_secret_doctor.py \
            --tb=short
          uv run --no-sync basedpyright --level error \
            src/codex_plugin_scanner/guard/secrets/git_safe.py \
            src/codex_plugin_scanner/guard/secrets/doctor.py \
            tests/test_guard_secret_windows_shell_security.py
      - name: Advance reviewed test ratchet exactly
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/ci/generate_test_inventory.py --output /tmp/windows-shell-inventory.json
          python - <<'PY'
          from pathlib import Path
          import json
          inv=json.loads(Path('/tmp/windows-shell-inventory.json').read_text())
          path=Path('ci/test-suite-ratchet-baseline.json')
          baseline=json.loads(path.read_text())
          baseline['maximum_collected_cases']=int(inv['inventory']['collected_cases'])
          baseline['maximum_test_source_lines']=int(inv['test_source_lines'])
          path.write_text(json.dumps(baseline,indent=2)+'\n')
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py --baseline ci/test-suite-ratchet-baseline.json --inventory /tmp/windows-shell-inventory.json
          git diff --check
      - name: Commit without bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/secrets-windows-shell-bootstrap.yml
          git add ci/test-suite-ratchet-baseline.json src/codex_plugin_scanner/guard/secrets/git_safe.py src/codex_plugin_scanner/guard/secrets/doctor.py tests/test_guard_secret_windows_shell_security.py
          git commit -m 'fix(secrets): trust only external Windows hook shells'
          git push origin HEAD:fix/secrets-windows-shell-diagnostic-v2
      - name: Open protected review and request auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --head fix/secrets-windows-shell-diagnostic-v2 --base release/3.0 --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            gh pr create --head fix/secrets-windows-shell-diagnostic-v2 --base release/3.0 --title 'fix(secrets): trust only external Windows hook shells' --body 'Prevents repository-local, relative Program Files, relative PATH, and world-writable hook shells from satisfying the Windows setup diagnostic. The probe now reuses the hardened executable trust boundary and standard absolute Git-for-Windows locations. Base remains release/3.0.'
            pr_number="$(gh pr list --head fix/secrets-windows-shell-diagnostic-v2 --base release/3.0 --state open --json number --jq '.[0].number')"
          fi
          gh pr merge "$pr_number" --auto --squash --delete-branch
