name: Normalize autonomous Rust P1 and P2 history v2

on:
  push:
    branches:
      - automation/rust-p1-p2-end-to-end
    paths:
      - .github/workflows/tmp-rust-p1-p2-signoff-rescue-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-p1-p2-signoff-rescue
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BASE: release/3.0
      BRANCH: feat/rust-p1-p2-autonomous
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: release/3.0
          fetch-depth: 0
          persist-credentials: true
      - name: Wait for the autonomous implementation branch to settle
        shell: bash
        run: |
          set -euo pipefail
          previous=''
          stable=0
          for attempt in $(seq 1 70); do
            current=$(git ls-remote --exit-code origin "refs/heads/$BRANCH" 2>/dev/null | awk '{print $1}' || true)
            if [[ "$current" =~ ^[0-9a-f]{40}$ ]]; then
              if [[ "$current" == "$previous" ]]; then
                stable=$((stable + 1))
                (( stable >= 4 )) && exit 0
              else
                previous="$current"
                stable=0
              fi
            fi
            sleep 30
          done
          [[ "$previous" =~ ^[0-9a-f]{40}$ ]] || exit 0
      - name: Replace autonomous history with one signed-off commit
        shell: bash
        run: |
          set -euo pipefail
          remote_sha=$(git ls-remote --exit-code origin "refs/heads/$BRANCH" | awk '{print $1}')
          [[ "$remote_sha" =~ ^[0-9a-f]{40}$ ]]
          git fetch --force origin "$BASE:refs/remotes/origin/$BASE" "$BRANCH:refs/remotes/origin/$BRANCH"
          ahead=$(git rev-list --count "refs/remotes/origin/$BASE..refs/remotes/origin/$BRANCH")
          (( ahead > 0 )) || exit 0
          git checkout -B "$BRANCH" "refs/remotes/origin/$BRANCH"
          git reset --soft "refs/remotes/origin/$BASE"
          git config user.name 'Michael Kantor'
          git config user.email '6068672+kantorcodes@users.noreply.github.com'
          git commit --signoff -m 'feat(guard): complete Rust runtime P1 and P2 migration'
          git push --force-with-lease="refs/heads/$BRANCH:$remote_sha" origin HEAD:"refs/heads/$BRANCH"
