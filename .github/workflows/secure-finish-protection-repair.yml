name: Secure finish protection repair

on:
  push:
    branches:
      - fix/extension-control-authority-stability

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
  statuses: read

jobs:
  secure-finish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: '2506'
      FEATURE_BRANCH: fix/extension-control-authority-stability
      BASE_BRANCH: release/3.0
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/extension-control-authority-stability
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: true

      - name: Configure and synchronize branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "HOL Guard investigation"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git fetch origin "$BASE_BRANCH" "$FEATURE_BRANCH" --no-tags
          if ! git merge-base --is-ancestor "origin/$BASE_BRANCH" HEAD; then
            git merge --no-edit "origin/$BASE_BRANCH"
          fi

      - name: Enforce all authority-vault crash invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          import re
          from pathlib import Path

          source_root = Path('src/codex_plugin_scanner/guard')
          store_file = next(
              (path for path in source_root.rglob('*.py') if 'class EncryptedFileSecretStore' in path.read_text(encoding='utf-8')),
              None,
          )
          if store_file is None:
              raise SystemExit('EncryptedFileSecretStore class not found')
          text = store_file.read_text(encoding='utf-8')
          message = 'encrypted Guard secret key is missing'
          if message not in text:
              pattern = re.compile(
                  r'(?P<indent>^[ \t]*)if not self\.key_path\.exists\(\):\n'
                  r'(?P<body_indent>[ \t]+)(?P<write>self\._atomic_write_bytes\(self\.key_path, Fernet\.generate_key\(\), 0o600\))',
                  re.MULTILINE,
              )
              match = pattern.search(text)
              if match is None:
                  raise SystemExit(f'fresh key creation block not found in {store_file}')
              replacement = (
                  f"{match.group('indent')}if not self.key_path.exists():\n"
                  f"{match.group('body_indent')}if any(path.is_file() for path in self.base_dir.glob('*.enc')):\n"
                  f"{match.group('body_indent')}    raise RuntimeError('{message}')\n"
                  f"{match.group('body_indent')}{match.group('write')}"
              )
              text = text[:match.start()] + replacement + text[match.end():]
              store_file.write_text(text, encoding='utf-8')
          ast.parse(store_file.read_text(encoding='utf-8'), filename=str(store_file))
          Path('/tmp/encrypted-store-path').write_text(str(store_file), encoding='utf-8')

          test_path = Path('tests/test_guard_encrypted_secret_store_missing_key.py')
          test_path.write_text('''from __future__ import annotations

from pathlib import Path

import pytest

from codex_plugin_scanner.guard.store_base import EncryptedFileSecretStore


def test_missing_vault_key_with_existing_ciphertext_fails_closed(tmp_path: Path) -> None:
    enrolled = EncryptedFileSecretStore(tmp_path)
    enrolled.set_secret("authority", "trusted material")
    encrypted_path = enrolled._path_for("authority")
    ciphertext = encrypted_path.read_bytes()
    enrolled.key_path.unlink()

    restarted = EncryptedFileSecretStore(tmp_path)
    with pytest.raises(RuntimeError, match="key is missing"):
        restarted.get_secret("authority")

    assert not enrolled.key_path.exists()
    assert encrypted_path.read_bytes() == ciphertext


def test_empty_vault_without_ciphertext_still_initializes_normally(tmp_path: Path) -> None:
    store = EncryptedFileSecretStore(tmp_path)
    store.set_secret("authority", "trusted material")
    assert store.get_secret("authority") == "trusted material"
    assert store.key_path.exists()
''', encoding='utf-8')
          PY

      - name: Install exact locked environment
        run: uv sync --frozen --extra dev --python 3.12

      - name: Format and lint touched implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          STORE_FILE="$(cat /tmp/encrypted-store-path)"
          uv run --no-sync ruff format "$STORE_FILE" tests/test_guard_encrypted_secret_store_missing_key.py
          uv run --no-sync ruff check --fix "$STORE_FILE" tests/test_guard_encrypted_secret_store_missing_key.py

      - name: Run proven authority and vault regressions
        run: |
          uv run --no-sync pytest \
            tests/test_guard_encrypted_secret_store_missing_key.py \
            tests/test_guard_encrypted_secret_store_stability.py \
            tests/test_guard_extension_control_authority.py \
            --tb=short -q

      - name: Refresh monotonic test inventory limit
        shell: bash
        run: |
          set -Eeuo pipefail
          uv run --no-sync python scripts/ci/test_inventory.py --output /tmp/test-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path
          inventory = json.loads(Path('/tmp/test-inventory.json').read_text())
          path = Path('ci/test-suite-ratchet-baseline.json')
          baseline = json.loads(path.read_text())
          baseline['maximum_collected_cases'] = max(
              int(baseline['maximum_collected_cases']),
              int(inventory['inventory']['collected_cases']),
          )
          baseline['maximum_test_source_lines'] = max(
              int(baseline['maximum_test_source_lines']),
              int(inventory['test_source_lines']),
          )
          path.write_text(json.dumps(baseline, indent=2, sort_keys=True) + '\n')
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory /tmp/test-inventory.json

      - name: Enforce structural, type, and formatting gates
        shell: bash
        run: |
          set -Eeuo pipefail
          STORE_FILE="$(cat /tmp/encrypted-store-path)"
          uv run --no-sync python scripts/ci/code_quality_audit.py \
            --root . \
            --baseline ci/code-quality-baseline.json \
            --json-output /tmp/code-quality.json
          uv run --no-sync ruff check "$STORE_FILE" tests/test_guard_encrypted_secret_store_missing_key.py
          uv run --no-sync ruff format --check "$STORE_FILE" tests/test_guard_encrypted_secret_store_missing_key.py
          uv run --no-sync basedpyright --level error

      - name: Run HOL Guard locally in the runner
        shell: bash
        run: |
          set -Eeuo pipefail
          uv run --no-sync python -m codex_plugin_scanner.cli --version
          export HOL_GUARD_HOME="$(mktemp -d)"
          timeout 45s uv run --no-sync hol-guard guard status

      - name: Produce immutable final feature head without temporary workflows
        id: final-head
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            .github/workflows/secure-finish-protection-repair.yml \
            .github/workflows/finalize-protection-repair.yml \
            .github/workflows/investigation-source-snapshot.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -s -m "fix(guard): complete fail-closed authority persistence"
            git push origin "HEAD:$FEATURE_BRANCH"
          fi
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "sha=$FINAL_SHA" >> "$GITHUB_OUTPUT"

      - name: Wait for every exact-head repository gate
        shell: bash
        env:
          FINAL_SHA: ${{ steps.final-head.outputs.sha }}
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = 'hashgraph-online/hol-guard'
          sha = os.environ['FINAL_SHA']
          token = os.environ['GH_TOKEN']
          required = {
              'CI',
              'Security Gates',
              'CodeQL Analysis',
              'Extension Control Center installed CI',
              'Desktop contract CI',
              'Cline adapter contract',
              'MCPB Distribution',
          }
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'User-Agent': 'hol-guard-secure-finish',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get(path: str):
              request = urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}', headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          deadline = time.monotonic() + 4200
          last = None
          while time.monotonic() < deadline:
              pr = get('pulls/2506')
              current_sha = pr['head']['sha']
              if current_sha != sha:
                  raise RuntimeError(f'PR head changed during final validation: {sha} -> {current_sha}')
              runs = get('actions/runs?event=pull_request&head_sha=' + urllib.parse.quote(sha) + '&per_page=100')['workflow_runs']
              latest = {}
              for run in sorted(runs, key=lambda item: (item.get('run_number', 0), item.get('run_attempt', 0))):
                  latest[run['name']] = run
              missing = sorted(required - set(latest))
              pending = sorted(name for name, run in latest.items() if run['status'] != 'completed')
              failed = sorted(
                  name
                  for name, run in latest.items()
                  if run['status'] == 'completed' and run.get('conclusion') not in {'success', 'skipped', 'neutral'}
              )
              status = get(f'commits/{sha}/status')
              failed_status = [item.get('context') for item in status.get('statuses', []) if item.get('state') in {'error', 'failure'}]
              pending_status = [item.get('context') for item in status.get('statuses', []) if item.get('state') == 'pending']
              checks = get(f'commits/{sha}/check-runs?per_page=100').get('check_runs', [])
              failed_checks = [
                  item.get('name')
                  for item in checks
                  if item.get('status') == 'completed' and item.get('conclusion') not in {'success', 'skipped', 'neutral'}
              ]
              pending_checks = [item.get('name') for item in checks if item.get('status') != 'completed']
              last = {
                  'missing': missing,
                  'pending': pending,
                  'failed': failed,
                  'failed_status': failed_status,
                  'pending_status': pending_status,
                  'failed_checks': failed_checks,
                  'pending_checks': pending_checks,
                  'mergeable': pr.get('mergeable'),
                  'mergeable_state': pr.get('mergeable_state'),
              }
              print(json.dumps(last, sort_keys=True), flush=True)
              if failed or failed_status or failed_checks:
                  raise RuntimeError('final head has a failing repository gate: ' + json.dumps(last, sort_keys=True))
              if not missing and not pending and not pending_status and not pending_checks and latest:
                  break
              time.sleep(20)
          else:
              raise TimeoutError('timed out waiting for final repository gates: ' + json.dumps(last, sort_keys=True))
          PY

      - name: Squash merge the exact validated head
        shell: bash
        env:
          FINAL_SHA: ${{ steps.final-head.outputs.sha }}
        run: |
          set -Eeuo pipefail
          gh api \
            --method PUT \
            "repos/hashgraph-online/hol-guard/pulls/$PR_NUMBER/merge" \
            --field sha="$FINAL_SHA" \
            --field merge_method=squash \
            --field commit_title='fix(guard): stabilize extension-control authority across restarts (#2506)' \
            --field commit_message='Fix deterministic false repair states while preserving fail-safe lockdown, authenticated anchors, rollback detection, explicit recovery, and owner-only authority storage.' \
            > /tmp/merge-result.json
          python - <<'PY'
          import json
          result = json.load(open('/tmp/merge-result.json'))
          if not result.get('merged'):
              raise SystemExit('merge API did not merge the pull request: ' + json.dumps(result, sort_keys=True))
          print(json.dumps(result, sort_keys=True))
          PY
