name: Temporary Cline action-envelope fix proof

on:
  push:
    branches:
      - test/cline-live-e2e-20260808
    paths:
      - .github/workflows/cline-live-e2e-temp.yml
      - src/codex_plugin_scanner/guard/**
      - pyproject.toml
      - uv.lock

permissions:
  contents: read

jobs:
  exact-hook-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Apply candidate Cline action-envelope fix in runner checkout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/codex_plugin_scanner/guard/cli/commands_support_hook_payload.py')
          text = path.read_text(encoding='utf-8')
          needle = '        "codex",\n        "claude-code",\n'
          replacement = '        "codex",\n        "cline",\n        "claude-code",\n'
          if needle not in text:
              raise SystemExit('expected action-envelope harness set not found')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- src/codex_plugin_scanner/guard/cli/commands_support_hook_payload.py

      - name: Build and install HOL Guard wheel
        shell: bash
        run: |
          set -euo pipefail
          uv build
          wheel=$(find dist -maxdepth 1 -name 'hol_guard-*.whl' -print -quit)
          python -m venv "$RUNNER_TEMP/guard-venv"
          "$RUNNER_TEMP/guard-venv/bin/pip" install "$wheel"
          "$RUNNER_TEMP/guard-venv/bin/hol-guard" --version

      - name: Run exact attested Cline Guard command
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/cline-decision-home"
          export HOL_GUARD_HOME="$HOME/.hol-guard"
          export PATH="$RUNNER_TEMP/guard-venv/bin:$PATH"
          mkdir -p "$HOME/workspace"
          cd "$HOME/workspace"
          printf 'OPENAI_API_KEY=HOL_GUARD_CLINE_DIAGNOSTIC_ONLY\n' > .env

          python - <<'PY' > "$RUNNER_TEMP/cline-read-payload.json"
          import json
          from pathlib import Path
          target = str(Path.cwd() / '.env')
          payload = {
              'hookName': 'PreToolUse',
              'hook_event_name': 'PreToolUse',
              'tool_call': {
                  'id': 'live-diagnostic',
                  'name': 'read_files',
                  'input': {'path': target},
              },
              'preToolUse': {
                  'toolName': 'read_files',
                  'parameters': {'path': target},
              },
          }
          print(json.dumps(payload, separators=(',', ':')))
          PY

          set +e
          "$RUNNER_TEMP/guard-venv/bin/python" -I -s -m codex_plugin_scanner.cli \
            guard hook --harness cline --json \
            < "$RUNNER_TEMP/cline-read-payload.json" \
            > "$RUNNER_TEMP/cline-read-stdout.txt" \
            2> "$RUNNER_TEMP/cline-read-stderr.txt"
          status=$?
          set -e
          echo "Guard exit status: $status"
          echo '--- stdout ---'
          cat "$RUNNER_TEMP/cline-read-stdout.txt"
          echo '--- stderr ---'
          cat "$RUNNER_TEMP/cline-read-stderr.txt"
          python - "$RUNNER_TEMP/cline-read-stdout.txt" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          assert payload['policy_action'] == 'require-reapproval', payload
          assert payload['artifact_id'].startswith('cline:project:file-read:'), payload
          assert payload['policy_composition']['current_config_action'] == 'require-reapproval', payload
          PY

      - name: Verify isolated Cline normalizer availability
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/cline-decision-home"
          export HOL_GUARD_HOME="$HOME/.hol-guard"
          "$RUNNER_TEMP/guard-venv/bin/python" -I -s - <<'PY'
          from codex_plugin_scanner.guard.adapters import get_adapter
          from codex_plugin_scanner.guard.runtime.actions import action_envelope_harnesses, normalize_harness_payload
          get_adapter('cline')
          assert 'cline' in action_envelope_harnesses()
          envelope = normalize_harness_payload(
              'cline',
              'PreToolUse',
              {
                  'hookName': 'PreToolUse',
                  'tool_call': {'name': 'read_files', 'input': {'path': '.env'}},
                  'preToolUse': {'toolName': 'read_files', 'parameters': {'path': '.env'}},
              },
          )
          assert envelope.harness == 'cline'
          assert envelope.action_type == 'file_read'
          assert envelope.tool_name == 'read_file'
          PY
