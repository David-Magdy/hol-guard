name: Temporary Cline decision diagnostic

on:
  push:
    branches:
      - test/cline-live-e2e-20260808
    paths:
      - .github/workflows/cline-live-e2e-temp.yml
      - src/codex_plugin_scanner/guard/adapters/cline*.py
      - src/codex_plugin_scanner/guard/runtime/**
      - pyproject.toml
      - uv.lock

permissions:
  contents: read

jobs:
  decision-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Build and install HOL Guard wheel
        shell: bash
        run: |
          set -euo pipefail
          uv build
          wheel=$(find dist -maxdepth 1 -name 'hol_guard-*.whl' -print -quit)
          python -m venv "$RUNNER_TEMP/guard-venv"
          "$RUNNER_TEMP/guard-venv/bin/pip" install "$wheel"
          "$RUNNER_TEMP/guard-venv/bin/hol-guard" --version

      - name: Reproduce exact Cline read_files decision
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/cline-decision-home"
          export HOL_GUARD_HOME="$HOME/.hol-guard"
          export PATH="$RUNNER_TEMP/guard-venv/bin:$PATH"
          mkdir -p "$HOME/workspace"
          cd "$HOME/workspace"
          printf 'OPENAI_API_KEY=HOL_GUARD_CLINE_DIAGNOSTIC_ONLY\n' > .env

          python - <<'PY' > "$RUNNER_TEMP/cline-read-payload.json"
          import json
          from pathlib import Path
          target = str(Path.cwd() / '.env')
          payload = {
              'hookName': 'PreToolUse',
              'hook_event_name': 'PreToolUse',
              'tool_call': {
                  'id': 'live-diagnostic',
                  'name': 'read_files',
                  'input': {'path': target},
              },
              'preToolUse': {
                  'toolName': 'read_files',
                  'parameters': {'path': target},
              },
          }
          print(json.dumps(payload, separators=(',', ':')))
          PY

          echo '=== exact Cline payload ==='
          cat "$RUNNER_TEMP/cline-read-payload.json"
          echo
          echo '=== Guard decision ==='
          set +e
          hol-guard --harness cline --json < "$RUNNER_TEMP/cline-read-payload.json" | tee "$RUNNER_TEMP/cline-read-decision.json"
          status=${PIPESTATUS[0]}
          set -e
          echo "Guard exit status: $status"

      - name: Inspect normalized Cline action and sensitive-request extraction
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/cline-decision-home"
          export HOL_GUARD_HOME="$HOME/.hol-guard"
          export PYTHONPATH="$RUNNER_TEMP/guard-venv/lib/python3.12/site-packages"
          cd "$HOME/workspace"
          "$RUNNER_TEMP/guard-venv/bin/python" - <<'PY'
          import json
          from pathlib import Path
          from codex_plugin_scanner.guard.adapters.cline_hook_payload import prepare_cline_hook_payload, normalize_cline_payload
          from codex_plugin_scanner.guard.runtime.secret_file_requests import extract_sensitive_file_read_request_from_action

          target = str(Path.cwd() / '.env')
          payload = {
              'hookName': 'PreToolUse',
              'hook_event_name': 'PreToolUse',
              'tool_call': {'id': 'live-diagnostic', 'name': 'read_files', 'input': {'path': target}},
              'preToolUse': {'toolName': 'read_files', 'parameters': {'path': target}},
          }
          prepared = prepare_cline_hook_payload(payload)
          action = normalize_cline_payload(payload, workspace=Path.cwd(), home_dir=Path.home())
          print('prepared=', json.dumps(prepared, sort_keys=True, default=str))
          print('action=', action)
          try:
              request = extract_sensitive_file_read_request_from_action(action)
          except TypeError:
              request = extract_sensitive_file_read_request_from_action(action, workspace=Path.cwd(), home_dir=Path.home())
          print('sensitive_request=', request)
          PY
