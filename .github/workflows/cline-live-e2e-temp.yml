name: Temporary Cline exact hook diagnostic

on:
  push:
    branches:
      - test/cline-live-e2e-20260808
    paths:
      - .github/workflows/cline-live-e2e-temp.yml
      - src/codex_plugin_scanner/guard/adapters/cline*.py
      - src/codex_plugin_scanner/guard/runtime/**
      - pyproject.toml
      - uv.lock

permissions:
  contents: read

jobs:
  exact-hook-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Build and install HOL Guard wheel
        shell: bash
        run: |
          set -euo pipefail
          uv build
          wheel=$(find dist -maxdepth 1 -name 'hol_guard-*.whl' -print -quit)
          python -m venv "$RUNNER_TEMP/guard-venv"
          "$RUNNER_TEMP/guard-venv/bin/pip" install "$wheel"
          "$RUNNER_TEMP/guard-venv/bin/hol-guard" --version

      - name: Run exact generated Cline Guard command
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/cline-decision-home"
          export HOL_GUARD_HOME="$HOME/.hol-guard"
          export PATH="$RUNNER_TEMP/guard-venv/bin:$PATH"
          mkdir -p "$HOME/workspace"
          cd "$HOME/workspace"
          printf 'OPENAI_API_KEY=HOL_GUARD_CLINE_DIAGNOSTIC_ONLY\n' > .env

          python - <<'PY' > "$RUNNER_TEMP/cline-read-payload.json"
          import json
          from pathlib import Path
          target = str(Path.cwd() / '.env')
          payload = {
              'hookName': 'PreToolUse',
              'hook_event_name': 'PreToolUse',
              'tool_call': {
                  'id': 'live-diagnostic',
                  'name': 'read_files',
                  'input': {'path': target},
              },
              'preToolUse': {
                  'toolName': 'read_files',
                  'parameters': {'path': target},
              },
          }
          print(json.dumps(payload, separators=(',', ':')))
          PY

          echo '=== exact Cline payload ==='
          cat "$RUNNER_TEMP/cline-read-payload.json"
          echo
          echo '=== Guard hook decision ==='
          set +e
          hol-guard guard hook --harness cline --json < "$RUNNER_TEMP/cline-read-payload.json" \
            >"$RUNNER_TEMP/cline-read-stdout.txt" 2>"$RUNNER_TEMP/cline-read-stderr.txt"
          status=$?
          set -e
          echo "Guard exit status: $status"
          echo '--- stdout ---'
          cat "$RUNNER_TEMP/cline-read-stdout.txt"
          echo '--- stderr ---'
          cat "$RUNNER_TEMP/cline-read-stderr.txt"
          test -s "$RUNNER_TEMP/cline-read-stdout.txt"

      - name: Exercise generated plugin block parser against exact decision
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/cline-decision-home"
          export HOL_GUARD_HOME="$HOME/.hol-guard"
          export PATH="$RUNNER_TEMP/guard-venv/bin:$PATH"
          mkdir -p "$HOME/.cline"
          hol-guard apps connect cline --surface plugin --json > "$RUNNER_TEMP/connect.json"
          plugin="$HOME/.cline/plugins/hol-guard/index.js"
          test -f "$plugin"
          grep -F 'guard", "hook"' "$plugin" || true
          grep -F 'policy_action' "$plugin"
          grep -F 'decision_v2_json' "$plugin" || true
