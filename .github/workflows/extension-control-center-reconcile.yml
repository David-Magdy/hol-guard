name: Extension Control Center reconcile

on:
  push:
    branches:
      - feat/extension-control-center-01-details

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/extension-control-center-01-details
          fetch-depth: 0
      - name: Merge current release train
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin release/3.0
          set +e
          git merge --no-commit --no-ff origin/release/3.0
          merge_status=$?
          set -e
          if [[ "$merge_status" -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Merge conflicts: %s\n' "${conflicts[*]}"
            if [[ "${#conflicts[@]}" -ne 1 || "${conflicts[0]}" != "ci/test-suite-ratchet-baseline.json" ]]; then
              echo "Unexpected release conflict; refusing automated resolution." >&2
              exit 1
            fi
            git checkout --theirs ci/test-suite-ratchet-baseline.json
            git add ci/test-suite-ratchet-baseline.json
          fi
          if [[ -f .git/MERGE_HEAD ]]; then
            git commit -m "Merge release/3.0 into extension control center"
          fi
      - name: Apply degraded-authority review fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected source fragment not found in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "dashboard/src/extension-controls-api.ts",
              'health: "unenrolled" | "protected" | "tampered" | "degraded-unacknowledged" | "recovery-required";',
              'health: "unenrolled" | "protected" | "tampered" | "degraded-unacknowledged" | "degraded-acknowledged" | "recovery-required";',
          )
          replace(
              "dashboard/src/extension-controls-api.ts",
              '''export async function previewExtensionMutation(payload: ExtensionMutationPayload): Promise<Record<string, unknown>> {''',
              '''export async function acknowledgeDegradedExtensionControlAuthority(credentials?: {\n  approval_password?: string;\n  approval_totp_code?: string;\n}): Promise<EffectiveExtensionControls> {\n  return normalizeEffectiveExtensionControls(await request("/v1/extension-controls/acknowledge-degraded", {\n    method: "POST",\n    headers: { "Content-Type": "application/json" },\n    body: JSON.stringify({\n      session_nonce: crypto.randomUUID().replaceAll("-", ""),\n      ...credentials,\n    }),\n  }));\n}\n\nexport async function previewExtensionMutation(payload: ExtensionMutationPayload): Promise<Record<string, unknown>> {''',
          )
          replace(
              "dashboard/src/extension-controls-normalize.ts",
              '["unenrolled", "protected", "tampered", "degraded-unacknowledged", "recovery-required"] as const',
              '["unenrolled", "protected", "tampered", "degraded-unacknowledged", "degraded-acknowledged", "recovery-required"] as const',
          )
          replace(
              "dashboard/src/extensions-workspace.tsx",
              '''import {\n  applyExtensionMutation,''',
              '''import {\n  acknowledgeDegradedExtensionControlAuthority,\n  applyExtensionMutation,''',
          )
          replace(
              "dashboard/src/extensions-workspace.tsx",
              '''export type ExtensionRecoveryAction = { copyLabel: string; command: string; description: string; title: string };''',
              '''export type ExtensionRecoveryAction = { actionLabel?: string; copyLabel: string; command: string; description: string; title: string };''',
          )
          replace(
              "dashboard/src/extensions-workspace.tsx",
              '''export function extensionRecoveryAction(health: EffectiveExtensionControls["health"]): ExtensionRecoveryAction | null {\n  if (health === "protected") return null;\n  if (health === "tampered" || health === "recovery-required") {\n    return {\n      title: "Repair extension controls",\n      copyLabel: "Copy repair command",\n      description: "Guard locked these settings after detecting damaged authority data. Authenticate on this device to rebuild trusted authority.",\n      command: "hol-guard command controls recover-authority",\n    };\n  }\n  return {\n    title: "Finish local enrollment",\n    copyLabel: "Copy enrollment command",\n    description: "Authenticate in this device's terminal to protect extension settings, then check again.",\n    command: "hol-guard command controls enroll",\n  };\n}''',
              '''export function extensionRecoveryAction(health: EffectiveExtensionControls["health"]): ExtensionRecoveryAction | null {\n  if (health === "protected") return null;\n  if (health === "tampered" || health === "recovery-required") {\n    return {\n      title: "Repair extension controls",\n      actionLabel: "Repair now",\n      copyLabel: "Copy repair command",\n      description: "Guard locked these settings after detecting damaged authority data. Authenticate on this device to rebuild trusted authority.",\n      command: "hol-guard command controls recover-authority",\n    };\n  }\n  if (health === "degraded-unacknowledged") {\n    return {\n      title: "Acknowledge degraded extension controls",\n      actionLabel: "Acknowledge degraded state",\n      copyLabel: "Copy status command",\n      description: "Guard is failing closed because extension-control authority is degraded. Authenticate to acknowledge the degraded state. Acknowledgement does not restore protected authority.",\n      command: "hol-guard status",\n    };\n  }\n  if (health === "degraded-acknowledged") {\n    return {\n      title: "Degraded extension controls acknowledged",\n      copyLabel: "Copy status command",\n      description: "Guard remains fail-closed while extension-control authority is degraded. Restore protected authority before changing extension policy.",\n      command: "hol-guard status",\n    };\n  }\n  return {\n    title: "Finish local enrollment",\n    copyLabel: "Copy enrollment command",\n    description: "Authenticate in this device's terminal to protect extension settings, then check again.",\n    command: "hol-guard command controls enroll",\n  };\n}''',
          )
          replace(
              "dashboard/src/extensions-workspace.tsx",
              '''  const repairable = props.effective.health === "tampered" || props.effective.health === "recovery-required";''',
              '''  const repairable = props.effective.health === "tampered" || props.effective.health === "recovery-required" || props.effective.health === "degraded-unacknowledged";\n  const busyLabel = props.effective.health === "degraded-unacknowledged" ? "Acknowledging…" : "Repairing…";''',
          )
          replace(
              "dashboard/src/extensions-workspace.tsx",
              '''{props.busy ? "Repairing…" : "Repair now"}''',
              '''{props.busy ? busyLabel : recovery?.actionLabel}''',
          )
          replace(
              "dashboard/src/extensions-workspace.tsx",
              '''  const recover = useCallback(async (credentials?: { approval_password?: string; approval_totp_code?: string }) => {\n    setRecoveryBusy(true);\n    setRecoveryError(null);\n    setRecoveryStatus("Repairing extension controls…");\n    try {\n      const effective = await recoverExtensionControlAuthority(credentials);\n      if (effective.health !== "protected") throw new Error("Guard could not restore protected extension controls.");\n      if (state.kind === "ready") setState({ ...state, effective });\n      setRecoveryApprovalOpen(false);\n      setRecoveryStatus("Extension controls repaired.");\n    } catch (error) {\n      if (!credentials && requiresExtensionRecoveryApproval(error)) {\n        await resolveApprovalGate();\n        setRecoveryApprovalOpen(true);\n      } else {\n        setRecoveryError(error instanceof Error ? error.message : "Guard could not repair extension controls.");\n        setRecoveryStatus(null);\n      }\n    } finally {\n      setRecoveryBusy(false);\n    }\n  }, [resolveApprovalGate, state]);''',
              '''  const recover = useCallback(async (credentials?: { approval_password?: string; approval_totp_code?: string }) => {\n    const acknowledgingDegraded = state.kind === "ready" && state.effective.health === "degraded-unacknowledged";\n    setRecoveryBusy(true);\n    setRecoveryError(null);\n    setRecoveryStatus(acknowledgingDegraded ? "Acknowledging degraded extension controls…" : "Repairing extension controls…");\n    try {\n      const effective = acknowledgingDegraded\n        ? await acknowledgeDegradedExtensionControlAuthority(credentials)\n        : await recoverExtensionControlAuthority(credentials);\n      if (acknowledgingDegraded) {\n        if (effective.health !== "degraded-acknowledged") throw new Error("Guard could not acknowledge the degraded authority state.");\n        if (state.kind === "ready") setState({ ...state, effective });\n        setRecoveryApprovalOpen(false);\n        setRecoveryStatus("Degraded state acknowledged. Guard remains fail-closed until protected authority is restored.");\n      } else {\n        if (effective.health !== "protected") throw new Error("Guard could not restore protected extension controls.");\n        if (state.kind === "ready") setState({ ...state, effective });\n        setRecoveryApprovalOpen(false);\n        setRecoveryStatus("Extension controls repaired.");\n      }\n    } catch (error) {\n      if (!credentials && requiresExtensionRecoveryApproval(error)) {\n        await resolveApprovalGate();\n        setRecoveryApprovalOpen(true);\n      } else {\n        setRecoveryError(error instanceof Error ? error.message : acknowledgingDegraded ? "Guard could not acknowledge degraded extension controls." : "Guard could not repair extension controls.");\n        setRecoveryStatus(null);\n      }\n    } finally {\n      setRecoveryBusy(false);\n    }\n  }, [resolveApprovalGate, state]);''',
          )
          replace(
              "dashboard/src/extensions-workspace.tsx",
              '''  const recoveryBanner = <ExtensionStatusBanner busy={recoveryBusy} effective={state.effective} error={recoveryError} status={recoveryStatus} onRecover={() => { void recover(); }} onRetry={load} />;\n  const recoveryModal = recoveryApprovalOpen ? <ApprovalProofModal title="Repair extension controls" detail="Authenticate this repair on your device. Guard uses the proof once and does not store it." confirmLabel="Repair controls" approvalGate={resolvedApprovalGate} busy={recoveryBusy} error={recoveryError} onCancel={() => { if (!recoveryBusy) setRecoveryApprovalOpen(false); }} onConfirm={(credentials) => { void recover(credentials); }} /> : null;''',
              '''  const acknowledgingDegraded = state.effective.health === "degraded-unacknowledged";\n  const recoveryBanner = <ExtensionStatusBanner busy={recoveryBusy} effective={state.effective} error={recoveryError} status={recoveryStatus} onRecover={() => { void recover(); }} onRetry={load} />;\n  const recoveryModal = recoveryApprovalOpen ? <ApprovalProofModal title={acknowledgingDegraded ? "Acknowledge degraded extension controls" : "Repair extension controls"} detail={acknowledgingDegraded ? "Authenticate this acknowledgement on your device. Guard remains fail-closed until protected authority is restored." : "Authenticate this repair on your device. Guard uses the proof once and does not store it."} confirmLabel={acknowledgingDegraded ? "Acknowledge degraded state" : "Repair controls"} approvalGate={resolvedApprovalGate} busy={recoveryBusy} error={recoveryError} onCancel={() => { if (!recoveryBusy) setRecoveryApprovalOpen(false); }} onConfirm={(credentials) => { void recover(credentials); }} /> : null;''',
          )
          replace(
              "dashboard/src/extensions-workspace.test.ts",
              '''assert.deepEqual(extensionRecoveryAction("recovery-required"), extensionRecoveryAction("tampered"));''',
              '''assert.deepEqual(extensionRecoveryAction("recovery-required"), extensionRecoveryAction("tampered"));\nassert.equal(extensionRecoveryAction("degraded-unacknowledged")?.actionLabel, "Acknowledge degraded state");\nassert.equal(extensionRecoveryAction("degraded-unacknowledged")?.command, "hol-guard status");\nassert.match(extensionRecoveryAction("degraded-unacknowledged")?.description ?? "", /failing closed/);\nassert.equal(extensionRecoveryAction("degraded-acknowledged")?.actionLabel, undefined);\nassert.match(extensionRecoveryAction("degraded-acknowledged")?.description ?? "", /fail-closed/);''',
          )
          replace(
              "dashboard/src/extensions-workspace.test.ts",
              '''assert.match(recoveryMarkup, /Check again/);''',
              '''assert.match(recoveryMarkup, /Check again/);\n\nconst degradedMarkup = renderToStaticMarkup(createElement(ExtensionStatusBanner, {\n  effective: {\n    schema_version: "1.0.0", health: "degraded-unacknowledged", revision: 5, catalog_digest: "a".repeat(64),\n    global_lockdown: true, controls: [], failures: [{ code: "cloud_layer_missing" }], layers: [],\n  },\n  onRecover: () => undefined,\n  onRetry: () => undefined,\n}));\nassert.match(degradedMarkup, /Acknowledge degraded state/);\nassert.match(degradedMarkup, /hol-guard status/);\nassert.doesNotMatch(degradedMarkup, /Finish local enrollment/);''',
          )
          replace(
              "dashboard/src/extension-controls-normalize.test.ts",
              '''assert.equal(normalizeEffectiveExtensionControls(effective()).controls[0]?.state, "disabled");''',
              '''assert.equal(normalizeEffectiveExtensionControls(effective()).controls[0]?.state, "disabled");\nconst acknowledged = effective();\nacknowledged.health = "degraded-acknowledged";\nassert.equal(normalizeEffectiveExtensionControls(acknowledged).health, "degraded-acknowledged");''',
          )
          PY
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Validate dashboard and refresh checked-in bundle
        run: |
          cd dashboard
          bun install --frozen-lockfile
          bun run test
          bun run build
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Recalculate reviewed test-suite ratchet
        shell: bash
        run: |
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync python scripts/ci/test_inventory.py --output /tmp/test-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/test-inventory.json').read_text())
          baseline = {
              'maximum_collected_cases': payload['inventory']['collected_cases'],
              'maximum_test_source_lines': payload['test_source_lines'],
              'schema_version': 1,
          }
          Path('ci/test-suite-ratchet-baseline.json').write_text(json.dumps(baseline, indent=2, sort_keys=True) + '\n')
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py --baseline ci/test-suite-ratchet-baseline.json --inventory /tmp/test-inventory.json
      - name: Commit reconciled branch
        shell: bash
        run: |
          set -euo pipefail
          git add dashboard ci/test-suite-ratchet-baseline.json src/codex_plugin_scanner/guard/daemon/static
          if git diff --cached --quiet; then
            echo "No reconciliation changes required."
            exit 0
          fi
          git commit -m "fix(guard): handle degraded extension authority states"
          git push origin HEAD:feat/extension-control-center-01-details
