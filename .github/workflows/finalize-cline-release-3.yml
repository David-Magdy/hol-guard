name: Finalize Cline release 3.0 closure

on:
  push:
    branches:
      - feat/cline-adapter
    paths:
      - .github/workflows/finalize-cline-release-3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/cline-adapter
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Apply closure fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              if old not in text:
                  raise SystemExit(f"Expected patch anchor not found in {path}: {old[:120]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"Patch anchor is not unique in {path}: {old[:120]!r}")
              write(path, text.replace(old, new, 1))

          contracts = "src/codex_plugin_scanner/guard/adapters/contracts.py"
          text = read(contracts)
          if '"cline": "Cline",' not in text:
              text = text.replace('    "cursor": "Cursor",\n', '    "cursor": "Cursor",\n    "cline": "Cline",\n', 1)
          if 'harness="cline"' not in text:
              anchor = '''        docs_path="docs/guard/cursor-local-cloud-contract.md",\n        icon_label="Cursor",\n    ),\n    HarnessProtectionContract(\n        harness="gemini",'''
              cline_block = '''        docs_path="docs/guard/cursor-local-cloud-contract.md",\n        icon_label="Cursor",\n    ),\n    HarnessProtectionContract(\n        harness="cline",\n        install_aliases=("cline", "cline-cli", "cline-vscode"),\n        config_paths=(\n            "~/.cline/hooks/",\n            "~/.cline/plugins/",\n            "~/.cline/data/settings/cline_mcp_settings.json",\n            "~/.cline/settings/cline_mcp_settings.json",\n            "~/Documents/Cline/Hooks/",\n            "~/Documents/Cline/Plugins/",\n        ),\n        event_surfaces=("shell", "prompt", "mcp_tool", "file_read", "file_write", "tool_result", "network_request"),\n        native_approval=False,\n        browser_fallback=True,\n        resume_support=False,\n        known_blind_spots=(\n            "Native Cline PostToolUse hooks are observation-only and cannot replace a result already returned to "\n            "the model; full post-tool output mediation requires the Guard-managed Cline plugin transport. "\n            "JetBrains protection is reported as unverified until a live pre-tool deny proof is observed."\n        ),\n        smoke_command="hol-guard apps test cline --json",\n        surface_capabilities=("auto", "hooks", "plugin", "cli", "all"),\n        supported_actions=(\n            "connect:auto",\n            "connect:hooks",\n            "connect:plugin",\n            "connect:cli",\n            "connect:all",\n            "test:auto",\n            "test:hooks",\n            "test:plugin",\n            "test:cli",\n            "test:all",\n            "repair:auto",\n            "repair:hooks",\n            "repair:plugin",\n            "repair:cli",\n            "repair:all",\n            "disconnect:auto",\n            "disconnect:hooks",\n            "disconnect:plugin",\n            "disconnect:cli",\n            "disconnect:all",\n        ),\n        docs_path="docs/guard/cline-local-protection-contract.md",\n        icon_label="Cline",\n    ),\n    HarnessProtectionContract(\n        harness="gemini",'''
              if anchor not in text:
                  raise SystemExit("Cursor contract insertion anchor not found")
              text = text.replace(anchor, cline_block, 1)
          write(contracts, text)

          write(
              "src/codex_plugin_scanner/guard/adapters/cline_contract.py",
              '''"""Canonical Cline harness protection contract."""\n\nfrom __future__ import annotations\n\nfrom .contracts import HarnessProtectionContract, contract_for\n\n_contract = contract_for("cline")\nif _contract is None:  # pragma: no cover - import-time invariant\n    raise RuntimeError("Cline must be registered in the canonical harness contracts")\nCLINE_CONTRACT: HarnessProtectionContract = _contract\n\n\ndef register_cline_contract() -> None:\n    """Compatibility no-op: Cline is registered statically with shared contracts."""\n\n\nregister_cline_contract()\n\n__all__ = ["CLINE_CONTRACT", "register_cline_contract"]\n''',
          )

          product_model = "src/codex_plugin_scanner/guard/product_model.py"
          text = read(product_model)
          canonical_match = re.search(r"CANONICAL_HARNESS_VALUES = \(.*?\n\)", text, flags=re.S)
          if canonical_match is None:
              raise SystemExit("CANONICAL_HARNESS_VALUES not found")
          canonical = canonical_match.group(0)
          if '    "cline",\n' not in canonical:
              canonical = canonical.replace('    "cursor",\n', '    "cursor",\n    "cline",\n', 1)
              text = text[: canonical_match.start()] + canonical + text[canonical_match.end() :]
              write(product_model, text)

          schema_path = "src/codex_plugin_scanner/guard/schemas/guard_product_model_v1.json"
          schema = json.loads(read(schema_path))
          for key in ("canonical_harnesses", "supported_harnesses"):
              values = schema[key]
              if "cline" not in values:
                  cursor_index = values.index("cursor")
                  values.insert(cursor_index + 1, "cline")
          write(schema_path, json.dumps(schema, indent=4) + "\n")

          parser_path = "src/codex_plugin_scanner/guard/cli/commands_parser_local.py"
          replace_once(
              parser_path,
              '        app_parser.add_argument("--surface", choices=("editor", "cli"))\n',
              '        app_parser.add_argument("--surface", choices=("editor", "cli", "auto", "hooks", "plugin", "all"))\n',
          )

          interaction_path = "src/codex_plugin_scanner/guard/cli/commands_support_interaction.py"
          replace_once(
              interaction_path,
              '    surface_args = f" --surface {surface}" if surface in {"editor", "cli"} else ""\n',
              '    surface_args = f" --surface {surface}" if surface else ""\n',
          )

          hooks_path = "src/codex_plugin_scanner/guard/adapters/cline_hooks.py"
          replace_once(
              hooks_path,
              '''def proof():\n    try:\n        PROOF.parent.mkdir(parents=True,exist_ok=True)\n        source="synthetic" if os.environ.get("HOL_GUARD_CLINE_CANARY")=="1" else "cline"\n        temp=PROOF.with_name(PROOF.name+".tmp")\n        temp.write_text(json.dumps({{"schema_version":1,"event":EVENT,"source":source,"timestamp":time.time()}},sort_keys=True),encoding="utf-8")\n        os.replace(temp,PROOF)\n    except OSError: pass\n''',
              '''def proof(outcome):\n    try:\n        PROOF.parent.mkdir(parents=True,exist_ok=True)\n        source="synthetic" if os.environ.get("HOL_GUARD_CLINE_CANARY")=="1" else "cline"\n        temp=PROOF.with_name(PROOF.name+".tmp")\n        temp.write_text(json.dumps({{"schema_version":1,"event":EVENT,"source":source,"outcome":outcome,"timestamp":time.time()}},sort_keys=True),encoding="utf-8")\n        os.replace(temp,PROOF)\n    except OSError: pass\n''',
          )
          replace_once(
              hooks_path,
              '''    proof()\n    if BLOCKING: emit({{"cancel":denied,"errorMessage":why if denied else "","contextModification":why if denied else ""}})\n    else: emit({{"cancel":False,"contextModification":why if denied else ""}})\n''',
              '''    outcome="blocked" if BLOCKING and denied else "allowed" if BLOCKING else "observed"\n    proof(outcome)\n    if BLOCKING: emit({{"cancel":denied,"errorMessage":why if denied else "","contextModification":why if denied else ""}})\n    else: emit({{"cancel":False,"contextModification":why if denied else ""}})\n''',
          )
          replace_once(
              hooks_path,
              '''    return {"present": True, "fresh": fresh, "live": fresh and value.get("source") == "cline", "event": event}\n''',
              '''    return {\n        "present": True,\n        "fresh": fresh,\n        "live": fresh and value.get("source") == "cline",\n        "event": event,\n        "outcome": value.get("outcome"),\n    }\n''',
          )
          replace_once(
              hooks_path,
              '''    pre, post = _proof_state(context, "PreToolUse"), _proof_state(context, "PostToolUse")\n    return {\n        "installed": not missing,\n        "integrity_ok": not missing and not modified,\n        "synthetic_canary_ok": canary.get("ok") is True,\n        "live_pretool_proof": pre,\n        "live_posttool_proof": post,\n        "pretool_blocking_proven": pre.get("live") is True,\n        "posttool_observation_proven": post.get("live") is True,\n        "post_tool_output_mediation": "observation-only",\n        "missing_events": missing,\n        "modified_events": modified,\n        "ready": not missing and not modified and canary.get("ok") is True and pre.get("live") is True,\n    }\n''',
              '''    pre, post = _proof_state(context, "PreToolUse"), _proof_state(context, "PostToolUse")\n    pretool_blocking_proven = pre.get("live") is True and pre.get("outcome") == "blocked"\n    posttool_observation_proven = post.get("live") is True and post.get("outcome") == "observed"\n    return {\n        "installed": not missing,\n        "integrity_ok": not missing and not modified,\n        "synthetic_canary_ok": canary.get("ok") is True,\n        "live_pretool_proof": pre,\n        "live_posttool_proof": post,\n        "pretool_blocking_proven": pretool_blocking_proven,\n        "posttool_observation_proven": posttool_observation_proven,\n        "post_tool_output_mediation": "observation-only",\n        "missing_events": missing,\n        "modified_events": modified,\n        "ready": not missing and not modified and canary.get("ok") is True and pretool_blocking_proven,\n    }\n''',
          )

          plugin_path = "src/codex_plugin_scanner/guard/adapters/cline_plugin.py"
          replace_once(
              plugin_path,
              '''function proof(name) {{\n  try {{\n    const target = PROOFS[name];\n    mkdirSync(dirname(target), {{ recursive: true }});\n    const temporary = `${{target}}.tmp`;\n    writeFileSync(temporary, JSON.stringify({{\n      schema_version: 1,\n      source: "cline-plugin",\n      proof: name,\n      timestamp: Date.now() / 1000,\n    }}));\n    renameSync(temporary, target);\n  }} catch {{\n    // Proof persistence is diagnostic; enforcement still follows Guard's decision.\n  }}\n}}\n''',
              '''function proof(name, outcome) {{\n  try {{\n    const target = PROOFS[name];\n    mkdirSync(dirname(target), {{ recursive: true }});\n    const temporary = `${{target}}.tmp`;\n    writeFileSync(temporary, JSON.stringify({{\n      schema_version: 1,\n      source: "cline-plugin",\n      proof: name,\n      outcome,\n      timestamp: Date.now() / 1000,\n    }}));\n    renameSync(temporary, target);\n  }} catch {{\n    // Proof persistence is diagnostic; enforcement still follows Guard's decision.\n  }}\n}}\n''',
          )
          replace_once(
              plugin_path,
              '''    async beforeRun() {{\n      proof("loaded");\n      return undefined;\n    }},\n    async beforeTool({{ toolCall, input }}) {{\n      const decision = invokeGuard("PreToolUse", toolCall, input, undefined);\n      if (!decision.ok) return {{ skip: true, reason: decision.reason }};\n      proof("pretool");\n      if (!guardBlocks(decision.payload)) return undefined;\n      return {{ skip: true, reason: guardReason(decision.payload) || "HOL Guard blocked this action." }};\n    }},\n    async afterTool({{ toolCall, input, result }}) {{\n      const decision = invokeGuard("PostToolUse", toolCall, input, result);\n      if (!decision.ok) return blockedResult(decision.reason, result?.metadata);\n      proof("posttool");\n      const replacement = reviewedOutput(decision.payload);\n      if (guardBlocks(decision.payload)) {{\n        const reason = guardReason(decision.payload) || "HOL Guard withheld this tool result.";\n        return blockedResult(reason, result?.metadata);\n      }}\n      if (replacement !== undefined) return {{ result: {{ ...result, output: replacement }} }};\n      return undefined;\n    }},\n''',
              '''    async beforeRun() {{\n      proof("loaded", "loaded");\n      return undefined;\n    }},\n    async beforeTool({{ toolCall, input }}) {{\n      const decision = invokeGuard("PreToolUse", toolCall, input, undefined);\n      if (!decision.ok) {{\n        proof("pretool", "blocked");\n        return {{ skip: true, reason: decision.reason }};\n      }}\n      if (!guardBlocks(decision.payload)) {{\n        proof("pretool", "allowed");\n        return undefined;\n      }}\n      proof("pretool", "blocked");\n      return {{ skip: true, reason: guardReason(decision.payload) || "HOL Guard blocked this action." }};\n    }},\n    async afterTool({{ toolCall, input, result }}) {{\n      const decision = invokeGuard("PostToolUse", toolCall, input, result);\n      if (!decision.ok) {{\n        proof("posttool", "replaced");\n        return blockedResult(decision.reason, result?.metadata);\n      }}\n      const replacement = reviewedOutput(decision.payload);\n      if (guardBlocks(decision.payload)) {{\n        proof("posttool", "replaced");\n        const reason = guardReason(decision.payload) || "HOL Guard withheld this tool result.";\n        return blockedResult(reason, result?.metadata);\n      }}\n      if (replacement !== undefined) {{\n        proof("posttool", "replaced");\n        return {{ result: {{ ...result, output: replacement }} }};\n      }}\n      proof("posttool", "unchanged");\n      return undefined;\n    }},\n''',
          )
          replace_once(
              plugin_path,
              '''    return {\n        "present": True,\n        "fresh": fresh,\n        "live": fresh and payload.get("source") == "cline-plugin",\n        "proof": name,\n    }\n''',
              '''    return {\n        "present": True,\n        "fresh": fresh,\n        "live": fresh and payload.get("source") == "cline-plugin",\n        "proof": name,\n        "outcome": payload.get("outcome"),\n    }\n''',
          )
          replace_once(
              plugin_path,
              '''    loaded = _proof_state(context, "loaded")\n    pretool = _proof_state(context, "pretool")\n    posttool = _proof_state(context, "posttool")\n    return {\n        "installed": installed,\n        "integrity_ok": integrity_ok,\n        "loaded_proof": loaded,\n        "live_pretool_proof": pretool,\n        "live_posttool_proof": posttool,\n        "pretool_blocking_proven": pretool.get("live") is True,\n        "posttool_replacement_proven": posttool.get("live") is True,\n        "post_tool_output_mediation": "replaceable",\n        "ready": bool(\n            integrity_ok\n            and loaded.get("live") is True\n            and pretool.get("live") is True\n            and posttool.get("live") is True\n        ),\n    }\n''',
              '''    loaded = _proof_state(context, "loaded")\n    pretool = _proof_state(context, "pretool")\n    posttool = _proof_state(context, "posttool")\n    pretool_blocking_proven = pretool.get("live") is True and pretool.get("outcome") == "blocked"\n    posttool_replacement_proven = posttool.get("live") is True and posttool.get("outcome") == "replaced"\n    return {\n        "installed": installed,\n        "integrity_ok": integrity_ok,\n        "loaded_proof": loaded,\n        "live_pretool_proof": pretool,\n        "live_posttool_proof": posttool,\n        "pretool_blocking_proven": pretool_blocking_proven,\n        "posttool_replacement_proven": posttool_replacement_proven,\n        "post_tool_output_mediation": "replaceable",\n        "ready": bool(\n            integrity_ok\n            and loaded.get("live") is True\n            and loaded.get("outcome") == "loaded"\n            and pretool_blocking_proven\n            and posttool_replacement_proven\n        ),\n    }\n''',
          )

          contract_doc = "docs/guard/cline-local-protection-contract.md"
          text = read(contract_doc)
          if "cline-security-closure.md" not in text:
              text += '''\n## Security closure and rollback\n\nThe release evidence, rollback procedure, managed state locations, and proof semantics are documented in [Cline security closure](./cline-security-closure.md).\n'''
              write(contract_doc, text)

          write(
              "docs/guard/cline-security-closure.md",
              '''# Cline security closure and rollback\n\nThis document is the release/3.0 closure record for the HOL Guard Cline adapter. Runtime status is evidence-based: installed files alone are never treated as proof that Cline is protected.\n\n## Managed locations\n\nGuard-owned state lives below `~/.hol-guard/managed/cline/` (or the configured Guard home):\n\n- `adapter-state.json` records the selected enforcement transport.\n- `native-hooks-state.json` records native hook paths and integrity digests.\n- `plugin-state.json` records the managed plugin path and digest.\n- `proofs/native-*.json` and `proofs/plugin-*.json` store bounded runtime proof metadata only.\n- `hook-workers/` contains Guard-owned native hook workers.\n- `mcp-backups/*.json` stores the exact original MCP settings text plus original/managed hashes for conservative restoration.\n\nCline-facing Guard assets are written only to supported Guard-owned slots, principally `~/Documents/Cline/Hooks/` for native hooks and `~/.cline/plugins/hol-guard/` for the managed plugin. User-owned files at those slots are not overwritten.\n\n## Proof semantics\n\n- A synthetic install canary validates generated bridge syntax/wire behavior but never counts as live Cline proof.\n- Native `PreToolUse` is considered blocking-proven only after a fresh live Cline invocation records an actual `blocked` outcome. Allowed traffic does not make the transport ready.\n- Native `PostToolUse` is observation-only and never grants output-replacement coverage.\n- Plugin pre-tool coverage requires a fresh live `blocked`/skip outcome.\n- Plugin post-tool coverage requires a fresh live `replaced` outcome where the plugin returned a model-visible replacement or withheld result.\n- Plugin `full`/ready status additionally requires a fresh load proof and current managed-file integrity.\n- Proofs expire and are invalidated by missing or modified managed assets.\n\n## Boundary closure\n\n| Boundary | Implementation | Evidence / expected status |\n| --- | --- | --- |\n| Shell and package commands | `cline_hook_payload.py`, native/plugin pre-tool bridges | Parallel commands are evaluated independently; action-bearing bridge failures fail closed. |\n| File read/write and patch | `cline_hook_payload.py` | Typed/current inputs are authoritative; contradictory compatibility fields are rejected. |\n| MCP stdio | `cline_mcp.py` | Eligible local stdio servers are proxied through existing Guard MCP policy. |\n| Remote/OAuth MCP | `cline_mcp.py` | Preserved unchanged and reported as a blind spot; credentials are not copied into evidence. |\n| Browser/network | `cline_hook_payload.py` | URL-bearing actions use the shared Guard action model. |\n| Prompt/lifecycle | native hook bridge | Bounded local evidence only; lifecycle failures do not falsely become enforcement proof. |\n| Native output | native `PostToolUse` | Observation-only; no model-visible replacement claim. |\n| Plugin output | plugin `afterTool` | Full status requires an actual replacement/withheld live outcome. |\n| Bridge timeout/crash/malformed response | native/plugin bridges | Action-bearing pre-tool paths deny/skip rather than silently allow. |\n| Managed-file tamper | hook/plugin integrity digests | Verification degrades and recommends repair. |\n| Duplicate transports | `ClineHarnessAdapter` reconciliation | One selected enforcement transport; duplicate managed transports are reported and repaired. |\n| User customization | hook/plugin ownership checks and MCP hash restoration | User-owned/modified files are retained instead of overwritten or deleted. |\n| JetBrains | detection only | Unverified until an exact live blocking proof exists. |\n\n## Roll back plugin mode to native hooks\n\n1. Run `hol-guard apps connect cline --surface hooks --json` (or `repair` with the same surface).\n2. Guard installs and validates the native transport before removing a healthy managed plugin. If the target transport cannot be validated, the prior transport is retained and the transition is reported as incomplete.\n3. Run `hol-guard apps test cline --surface hooks --json`. Expect `pre-execution` only after live blocked proof; native post-tool remains observation-only.\n\n## Disconnect and MCP restoration\n\nUse `hol-guard apps disconnect cline --surface all` and follow the returned confirmation command. Guard removes only ownership-verified managed hooks/plugin/shims. MCP restoration occurs only when the current config hash still matches the Guard-managed version; then the exact original text from `mcp-backups/` is restored. If the user edited the config after Guard installation, Guard retains both the user file and backup and reports manual reconciliation instead of clobbering the edit.\n\n## Release limitations\n\n- Native VS Code hooks are the default IDE transport.\n- VS Code plugin mode is not considered supported merely because a version contains plugin code; it requires explicit live capability proof.\n- JetBrains remains detect-only/unverified without a live deny proof.\n- Native `PostToolUse` cannot replace model-visible output.\n- Synthetic package/CI smoke proves packaging and bridge construction, not a live IDE security boundary.\n''',
          )

          test_contract = '''from __future__ import annotations\n\nimport json\nfrom pathlib import Path\n\nfrom codex_plugin_scanner.guard.adapters.contracts import contract_for, setup_contract_for\nfrom codex_plugin_scanner.guard.product_model import CANONICAL_HARNESS_VALUES, SUPPORTED_HARNESS_VALUES\n\n\ndef test_cline_is_a_canonical_static_contract() -> None:\n    contract = contract_for("cline")\n    assert contract is not None\n    assert contract.harness == "cline"\n    assert contract_for("cline-cli") is contract\n    assert contract_for("cline-vscode") is contract\n    assert contract.surface_capabilities == ("auto", "hooks", "plugin", "cli", "all")\n    assert "cline" in CANONICAL_HARNESS_VALUES\n    assert "cline" in SUPPORTED_HARNESS_VALUES\n\n\ndef test_cline_setup_contract_exposes_transport_actions() -> None:\n    setup = setup_contract_for("cline")\n    assert setup is not None\n    assert "connect:plugin" in setup.supported_actions\n    assert "test:hooks" in setup.supported_actions\n    assert setup.docs_path == "docs/guard/cline-local-protection-contract.md"\n\n\ndef test_product_model_schema_contains_cline() -> None:\n    schema_path = Path(__file__).parents[1] / "src" / "codex_plugin_scanner" / "guard" / "schemas" / "guard_product_model_v1.json"\n    schema = json.loads(schema_path.read_text(encoding="utf-8"))\n    assert "cline" in schema["canonical_harnesses"]\n    assert "cline" in schema["supported_harnesses"]\n'''
          write("tests/test_cline_contract_registration.py", test_contract)

          test_surfaces = '''from __future__ import annotations\n\nfrom codex_plugin_scanner.cli import _build_parser\n\n\ndef test_cline_apps_parser_accepts_transport_surfaces() -> None:\n    parser = _build_parser("hol-guard", program_mode="hol-guard")\n    for action in ("connect", "test", "repair", "disconnect"):\n        for surface in ("auto", "hooks", "plugin", "cli", "all"):\n            args = parser.parse_args(["apps", action, "cline", "--surface", surface])\n            assert args.harness == "cline"\n            assert args.surface == surface\n'''
          write("tests/test_cline_cli_surfaces.py", test_surfaces)

          workflow_path = ".github/workflows/cline-contract-ci.yml"
          workflow = read(workflow_path)
          workflow = workflow.replace(
              "      - src/codex_plugin_scanner/guard/adapters/__init__.py\n",
              "      - src/codex_plugin_scanner/guard/adapters/__init__.py\n      - src/codex_plugin_scanner/guard/adapters/contracts.py\n      - src/codex_plugin_scanner/guard/product_model.py\n      - src/codex_plugin_scanner/guard/schemas/guard_product_model_v1.json\n      - src/codex_plugin_scanner/guard/cli/commands_support_interaction.py\n",
          )
          workflow = workflow.replace(
              "          tests/test_cline_mcp.py\n",
              "          tests/test_cline_mcp.py\n          tests/test_cline_contract_registration.py\n          tests/test_cline_cli_surfaces.py\n",
          )
          package_anchor = '''      - name: Smoke test built wheel\n        shell: bash\n        run: |\n          wheel=$(find dist -maxdepth 1 -name 'hol_guard-*.whl' -print -quit)\n          test -n "$wheel"\n          uv tool run --from "$wheel" hol-guard --version\n'''
          package_replacement = '''      - name: Smoke test built wheel and Cline lifecycle\n        shell: bash\n        run: |\n          set -euo pipefail\n          wheel=$(find dist -maxdepth 1 -name 'hol_guard-*.whl' -print -quit)\n          test -n "$wheel"\n          uv tool run --from "$wheel" hol-guard --version\n          export HOME="$RUNNER_TEMP/cline-wheel-home"\n          export HOL_GUARD_HOME="$HOME/.hol-guard"\n          mkdir -p "$HOME"\n          uv tool run --from "$wheel" hol-guard apps connect cline --surface hooks --dry-run --json > "$RUNNER_TEMP/cline-dry-run.json"\n          test ! -e "$HOME/Documents/Cline/Hooks/PreToolUse"\n          uv venv "$RUNNER_TEMP/cline-wheel-venv" --python 3.12\n          uv pip install --python "$RUNNER_TEMP/cline-wheel-venv/bin/python" "$wheel"\n          "$RUNNER_TEMP/cline-wheel-venv/bin/python" - <<'PYSMOKE'\n          from pathlib import Path\n          import os\n          from codex_plugin_scanner.guard.adapters.base import HarnessContext\n          from codex_plugin_scanner.guard.adapters.cline import ClineHarnessAdapter\n\n          home = Path(os.environ["HOME"])\n          guard_home = Path(os.environ["HOL_GUARD_HOME"])\n          workspace = home / "workspace"\n          workspace.mkdir(parents=True, exist_ok=True)\n          context = HarnessContext(home_dir=home, workspace_dir=workspace, guard_home=guard_home)\n          adapter = ClineHarnessAdapter()\n          manifest = adapter.install(context, surface="hooks")\n          assert manifest["active_transport"] == "hooks"\n          probe = adapter.runtime_probe(context)\n          assert probe is not None\n          hooks = probe["native_hooks"]\n          assert hooks["installed"] is True\n          assert hooks["synthetic_canary_ok"] is True\n          assert hooks["pretool_blocking_proven"] is False\n          assert hooks["ready"] is False\n          result = adapter.uninstall(context, surface="all")\n          assert result["complete"] is True\n          PYSMOKE\n          test ! -e "$HOME/Documents/Cline/Hooks/PreToolUse"\n'''
          if package_anchor not in workflow:
              raise SystemExit("Cline package smoke anchor not found")
          workflow = workflow.replace(package_anchor, package_replacement, 1)
          write(workflow_path, workflow)
          PY

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Format and lint affected Python
        run: |
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/guard/adapters/contracts.py \
