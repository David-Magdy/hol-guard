name: Finalize and attest Rust PreToolUse authority

on:
  push:
    branches:
      - automation/finalize-rust-pretool-authority-20260815
    paths:
      - .github/workflows/tmp-finalize-rust-pretool-authority.yml
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: finalize-rust-pretool-authority
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: release/3.0
      VERIFICATION_BRANCH: verification/rust-pretool-authority-final
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Wait for merged native PreToolUse remediation
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 14400))
          while (( SECONDS < deadline )); do
            git fetch --force origin "$TARGET_BRANCH" main
            release_sha=$(git rev-parse "origin/$TARGET_BRANCH")
            old_reject=$(git show "$release_sha":src/codex_plugin_scanner/guard/daemon/hook_worker.py | grep -c 'fast path only supports PostToolUse' || true)
            native_hits=$(git grep -E 'review_pre_tool|pre_tool.*native|native.*pre_tool|PreToolUse.*native|native.*PreToolUse' "$release_sha" -- rust src/codex_plugin_scanner/guard | wc -l | tr -d ' ')
            pr_json=$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$TARGET_BRANCH" --state merged --limit 100 --json number,title,url,mergeCommit,mergedAt,headRefName --jq '[.[] | select(((.title|ascii_downcase|contains("pretool")) or (.title|ascii_downcase|contains("pre tool"))) and ((.title|ascii_downcase|contains("rust")) or (.title|ascii_downcase|contains("native"))))][0] // {}')
            pr_number=$(jq -r '.number // empty' <<<"$pr_json")
            merge_sha=$(jq -r '.mergeCommit.oid // empty' <<<"$pr_json")
            if (( old_reject == 0 && native_hits > 0 )) && [[ -n "$pr_number" && -n "$merge_sha" ]]; then
              git merge-base --is-ancestor "$merge_sha" "$release_sha"
              if git merge-base --is-ancestor "$merge_sha" origin/main; then
                echo 'Native PreToolUse remediation unexpectedly reached main' >&2
                exit 1
              fi
              printf '%s\n' "$release_sha" > "$RUNNER_TEMP/release-sha"
              printf '%s\n' "$merge_sha" > "$RUNNER_TEMP/merge-sha"
              printf '%s\n' "$pr_number" > "$RUNNER_TEMP/pr-number"
              jq . <<<"$pr_json" > "$RUNNER_TEMP/pr.json"
              exit 0
            fi
            sleep 60
          done
          echo 'Timed out waiting for merged native PreToolUse authority' >&2
          exit 1

      - name: Check exact source-of-truth contracts
        shell: bash
        run: |
          set -euo pipefail
          release_sha=$(cat "$RUNNER_TEMP/release-sha")
          git checkout --detach "$release_sha"
          ! grep -q 'fast path only supports PostToolUse' src/codex_plugin_scanner/guard/daemon/hook_worker.py
          git grep -n -E 'review_pre_tool|pre_tool.*native|native.*pre_tool|PreToolUse.*native|native.*PreToolUse' -- rust src/codex_plugin_scanner/guard > "$RUNNER_TEMP/pretool-source-hits.txt"
          git grep -n -E 'action_floor|approval_floor|native.*(pause|deny)|exact.*allow' -- rust src/codex_plugin_scanner/guard tests > "$RUNNER_TEMP/pretool-floor-hits.txt"
          if git grep -n -E 'PreToolUse stays Python-authoritative|PreToolUse.*Python-authoritative|fast path only supports PostToolUse' -- src docs/guard; then
            echo 'Stale Python-authoritative PreToolUse contract remains' >&2
            exit 1
          fi
          ! git grep -n -E 'Python.*PreToolUse.*evaluator fallback|PreToolUse.*Python.*runtime fallback' -- src docs/guard
          git grep -n -E 'command pattern|command_patterns|permission_id|extensions' -- src tests dashboard > "$RUNNER_TEMP/dx-source-hits.txt"

      - name: Verify exact-head checks are green
        shell: bash
        run: |
          set -euo pipefail
          merge_sha=$(cat "$RUNNER_TEMP/merge-sha")
          deadline=$((SECONDS + 3600))
          while (( SECONDS < deadline )); do
            checks=$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/commits/$merge_sha/check-runs?per_page=100")
            pending=$(jq '[.check_runs[] | select(.status != "completed")] | length' <<<"$checks")
            bad=$(jq '[.check_runs[] | select(.status == "completed" and (.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral"))] | length' <<<"$checks")
            (( bad == 0 )) || { jq '.check_runs[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral") | {name,status,conclusion,html_url}' <<<"$checks"; exit 1; }
            if (( pending == 0 )) && [[ $(jq '.total_count' <<<"$checks") -gt 0 ]]; then
              jq . <<<"$checks" > "$RUNNER_TEMP/check-runs.json"
              break
            fi
            sleep 30
          done
          (( SECONDS < deadline )) || { echo 'Timed out waiting for exact-head checks' >&2; exit 1; }

      - name: Install locked toolchains
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --extra publish --python 3.12
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0

      - name: Validate Rust workspace and bundled runtime
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all --check
          cargo clippy --manifest-path rust/Cargo.toml --locked --workspace --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --locked --workspace --all-targets
          version=$(uv run --no-sync python - <<'PY'
          from importlib.metadata import version
          print(version('hol-guard'))
          PY
          )
          release_sha=$(cat "$RUNNER_TEMP/release-sha")
          HOL_GUARD_PACKAGE_VERSION="$version" HOL_GUARD_BUILD_SHA="$release_sha" cargo build --manifest-path rust/Cargo.toml --locked --release -p hol-guard-runtime
          rust/target/release/hol-guard-runtime self-test --json | tee "$RUNNER_TEMP/source-self-test.json"
          grep -Eqi 'pre.?tool' "$RUNNER_TEMP/source-self-test.json"
          grep -Eqi 'post.?tool' "$RUNNER_TEMP/source-self-test.json"

      - name: Run PreToolUse, security, extension, and DX regression suites
        shell: bash
        env:
          HOL_GUARD_NATIVE_DEVELOPMENT: "1"
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests ci/native_runtime -type f -name 'test_*.py' -print | grep -Ei '(pretool|pre_tool|native_runtime|command_model|hook_runtime|hook_worker|effect|risk|policy|command_patterns|extensions|shims|package|archive|filesystem|path|prompt|secret|destructive|database|infrastructure|tamper)' | sort -u)
          test "${#tests[@]}" -gt 0
          printf '%s\n' "${tests[@]}" > "$RUNNER_TEMP/focused-tests.txt"
          uv run --no-sync pytest -q "${tests[@]}" --tb=short | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Run full Python and dashboard validation
        shell: bash
        env:
          HOL_GUARD_NATIVE_DEVELOPMENT: "1"
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
        run: |
          set -euo pipefail
          uv run --no-sync pytest -q --tb=short | tee "$RUNNER_TEMP/full-pytest.log"
          if [[ -f dashboard/package.json ]]; then
            corepack enable
            if [[ -f dashboard/pnpm-lock.yaml ]]; then
              pnpm --dir dashboard install --frozen-lockfile
              pnpm --dir dashboard test --if-present
              pnpm --dir dashboard build --if-present
            elif [[ -f dashboard/package-lock.json ]]; then
              npm --prefix dashboard ci
              npm --prefix dashboard test --if-present
              npm --prefix dashboard run build --if-present
            fi
          fi

      - name: Wait for matching published platform-native alpha
        shell: bash
        run: |
          set -euo pipefail
          release_sha=$(cat "$RUNNER_TEMP/release-sha")
          merge_sha=$(cat "$RUNNER_TEMP/merge-sha")
          deadline=$((SECONDS + 14400))
          while (( SECONDS < deadline )); do
            curl --fail --silent --show-error https://pypi.org/pypi/hol-guard/json > "$RUNNER_TEMP/pypi.json"
            uv run --no-sync python - "$RUNNER_TEMP/pypi.json" "$RUNNER_TEMP/candidates.tsv" <<'PY'
          import json,sys
          from packaging.version import Version
          data=json.load(open(sys.argv[1])); rows=[]
          for raw,files in data.get('releases',{}).items():
              try: v=Version(raw)
              except Exception: continue
              if v.major != 3: continue
              for f in files:
                  name=f.get('filename','')
                  if name.endswith('.whl') and 'x86_64' in name and 'manylinux' in name:
                      rows.append((v,raw,name,f['url'],f.get('digests',{}).get('sha256','')))
          rows.sort(key=lambda row:row[0],reverse=True)
          with open(sys.argv[2],'w') as out:
              for _,raw,name,url,digest in rows[:30]: out.write('\t'.join((raw,name,url,digest))+'\n')
          PY
            while IFS=$'\t' read -r version name url digest; do
              [[ -n "$version" ]] || continue
              wheel="$RUNNER_TEMP/$name"
              curl --fail --silent --show-error "$url" -o "$wheel" || continue
              [[ -z "$digest" || "$(sha256sum "$wheel" | awk '{print $1}')" == "$digest" ]] || continue
              rm -rf "$RUNNER_TEMP/wheel-tree" "$RUNNER_TEMP/published-venv"
              mkdir -p "$RUNNER_TEMP/wheel-tree"
              python - "$wheel" "$RUNNER_TEMP/wheel-tree" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive: archive.extractall(sys.argv[2])
          PY
              manifest=$(find "$RUNNER_TEMP/wheel-tree" -type f \( -iname '*manifest*.json' -o -iname 'native-runtime.json' \) | head -1 || true)
              if [[ -n "$manifest" ]] && ! grep -Eqi "$release_sha|$merge_sha" "$manifest"; then
                continue
              fi
              uv venv --python 3.12 "$RUNNER_TEMP/published-venv"
              uv pip install --python "$RUNNER_TEMP/published-venv/bin/python" --no-deps "$wheel" || continue
              cli="$RUNNER_TEMP/published-venv/bin/hol-guard"
              py="$RUNNER_TEMP/published-venv/bin/python"
              set +e
              "$cli" runtime status --json > "$RUNNER_TEMP/installed-status.json" 2> "$RUNNER_TEMP/installed-status.err"
              rc=$?
              set -e
              (( rc == 0 )) || continue
              grep -Eqi 'pre.?tool' "$RUNNER_TEMP/installed-status.json" || continue
              grep -Eqi 'post.?tool' "$RUNNER_TEMP/installed-status.json" || continue
              grep -Eqi 'native|rust' "$RUNNER_TEMP/installed-status.json" || continue
              if [[ -f ci/native_runtime/probe_native_pretool_authority.py ]]; then "$py" ci/native_runtime/probe_native_pretool_authority.py; fi
              if [[ -f ci/native_runtime/probe_native_required.py ]]; then "$py" ci/native_runtime/probe_native_required.py; fi
              if [[ -f ci/native_runtime/probe_native_p0_operations.py ]]; then "$py" ci/native_runtime/probe_native_p0_operations.py; fi
              env HOL_GUARD_NATIVE=off "$cli" runtime status --json > "$RUNNER_TEMP/installed-status-off.json"
              grep -Eqi 'pre.?tool' "$RUNNER_TEMP/installed-status-off.json"
              grep -Eqi 'native|rust' "$RUNNER_TEMP/installed-status-off.json"
              printf '%s\n' "$version" > "$RUNNER_TEMP/published-version"
              printf '%s\n' "$name" > "$RUNNER_TEMP/published-wheel"
              printf '%s\n' "$digest" > "$RUNNER_TEMP/published-digest"
              exit 0
            done < "$RUNNER_TEMP/candidates.tsv"
            sleep 60
          done
          echo 'Timed out waiting for a matching published native PreToolUse alpha' >&2
          exit 1

      - name: Commit independent completion evidence
        shell: bash
        run: |
          set -euo pipefail
          release_sha=$(cat "$RUNNER_TEMP/release-sha")
          merge_sha=$(cat "$RUNNER_TEMP/merge-sha")
          pr_number=$(cat "$RUNNER_TEMP/pr-number")
          version=$(cat "$RUNNER_TEMP/published-version")
          wheel=$(cat "$RUNNER_TEMP/published-wheel")
          digest=$(cat "$RUNNER_TEMP/published-digest")
          git checkout -B "$VERIFICATION_BRANCH" "$release_sha"
          mkdir -p .github/completion-evidence
          jq -n \
            --arg verified_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg release_sha "$release_sha" \
            --arg merge_sha "$merge_sha" \
            --argjson pr_number "$pr_number" \
            --arg published_version "$version" \
            --arg published_wheel "$wheel" \
            --arg published_wheel_sha256 "$digest" \
            --slurpfile installed "$RUNNER_TEMP/installed-status.json" \
            --slurpfile installed_off "$RUNNER_TEMP/installed-status-off.json" \
            '{verified:true,completed_end_to_end:true,verified_at:$verified_at,target_branch:"release/3.0",pull_request:$pr_number,merge_commit:$merge_sha,release_head:$release_sha,merge_is_ancestor_of_release:true,merge_is_ancestor_of_main:false,published_version:$published_version,published_wheel:$published_wheel,published_wheel_sha256:$published_wheel_sha256,old_posttool_only_rejection_absent:true,native_pretool_authority_present:true,python_runtime_policy_fallback_present:false,installed_runtime_status:$installed[0],legacy_off_runtime_status:$installed_off[0]}' \
            > .github/completion-evidence/rust-pretool-authority-final.json
          cat > .github/completion-evidence/rust-pretool-authority-final.md <<EOF
          # Rust PreToolUse authority final verification

          - Pull request: #$pr_number
          - Merge commit: \`$merge_sha\`
          - Release head: \`$release_sha\`
          - Published package: \`hol-guard $version\`
          - Published wheel: \`$wheel\`
          - Published SHA-256: \`$digest\`
          - Present in release/3.0: yes
          - Present in main: no
          - Native PreToolUse and PostToolUse installed capabilities: verified
          - Legacy HOL_GUARD_NATIVE=off activates Python runtime evaluator: no
          EOF
          git add .github/completion-evidence
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(evidence): attest Rust PreToolUse authority completion'
          git push --force origin "$VERIFICATION_BRANCH"

      - name: Close trackers and remove temporary branches
        shell: bash
        run: |
          set -euo pipefail
          for title in 'Restore verified Rust authority for PreToolUse in 3.x' 'Rust PreToolUse delivery final verification tracker'; do
            number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
            if [[ -n "$number" ]]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Verified complete end to end. Evidence: https://github.com/$GITHUB_REPOSITORY/blob/$VERIFICATION_BRANCH/.github/completion-evidence/rust-pretool-authority-final.md" >/dev/null
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason completed >/dev/null
            fi
          done
          for pr in $(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq '.[] | select(.title == "chore(rust): inspect historical PreToolUse authority branch") | .number'); do
            gh pr close "$pr" --repo "$GITHUB_REPOSITORY" --comment 'Temporary comparison PR superseded by the verified merged remediation.' >/dev/null || true
          done
          for branch in fix/rust-pretool-authority-20260815 automation/shepherd-rust-pretool-authority-20260815 verify/rust-pretool-authority-20260815 verify/rust-pretool-publication-20260815 automation/finalize-rust-pretool-authority-20260815; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/${branch//\//%2F}" >/dev/null 2>&1 || true
          done
