name: Diagnose Rust safety-kernel merge

on:
  push:
    branches: [feat/rust-safety-kernel-integration-final]
    paths:
      - ".github/workflows/diagnose-rust-safety-kernel-merge.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: feat/rust-safety-kernel-integration-final
      - name: Diagnose merge conflicts
        shell: bash
        run: |
          set -u
          git config user.name "HOL Guard merge diagnostic"
          git config user.email "noreply@hol.org"
          git fetch origin release/3.0 feat/rust-runtime-supervision-final
          git merge --no-commit --no-ff origin/release/3.0 || true
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "release/3.0 conflicts:"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git commit -m "temporary release merge" || true
          git merge --no-commit --no-ff origin/feat/rust-runtime-supervision-final || true
          echo "supervision conflicts:"
          git diff --name-only --diff-filter=U
          git diff --cc
          test -z "$(git diff --name-only --diff-filter=U)"
