name: Diagnose Rust safety-kernel merge

on:
  push:
    branches: [feat/rust-safety-kernel-integration-final]
    paths:
      - ".github/workflows/diagnose-rust-safety-kernel-merge.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: feat/rust-safety-kernel-integration-final
      - name: Diagnose merge conflicts
        shell: bash
        run: |
          set -u
          git config user.name "HOL Guard merge diagnostic"
          git config user.email "noreply@hol.org"
          git fetch origin release/3.0 feat/rust-runtime-supervision-final
          git merge --no-commit --no-ff origin/release/3.0 >/tmp/release-merge.log 2>&1 || true
          release_conflicts="$(git diff --name-only --diff-filter=U)"
          echo "RELEASE_CONFLICTS_BEGIN"
          printf '%s\n' "$release_conflicts"
          echo "RELEASE_CONFLICTS_END"
          if [[ -n "$release_conflicts" ]]; then
            exit 1
          fi
          git commit -m "temporary release merge" >/dev/null 2>&1 || true
          git merge --no-commit --no-ff origin/feat/rust-runtime-supervision-final >/tmp/supervision-merge.log 2>&1 || true
          supervision_conflicts="$(git diff --name-only --diff-filter=U)"
          echo "SUPERVISION_CONFLICTS_BEGIN"
          printf '%s\n' "$supervision_conflicts"
          echo "SUPERVISION_CONFLICTS_END"
          test -z "$supervision_conflicts"
