name: Trigger code-quality finalizer

on:
  push:
    branches:
      - refactor/release-3-code-quality-hardening
    paths:
      - .github/workflows/tmp-trigger-code-quality-finalizer.yml

permissions:
  contents: write

jobs:
  trigger:
    if: github.repository == 'hashgraph-online/hol-guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: refactor/release-3-code-quality-hardening
      - name: Trigger final validation on the current branch head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/tmp-trigger-code-quality-finalizer.yml
          printf '\n' >> .github/workflows/tmp-ruff-code-quality-fix.yml
          git add .github/workflows/tmp-trigger-code-quality-finalizer.yml \
            .github/workflows/tmp-ruff-code-quality-fix.yml
          git diff --cached --check
          git commit -m "ci: retrigger code quality finalization"
          git push origin HEAD:refactor/release-3-code-quality-hardening
