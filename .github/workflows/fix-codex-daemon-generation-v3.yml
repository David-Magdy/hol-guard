name: Fix Codex daemon generation semantics v3

on:
  push:
    branches: [feat/rust-runtime-native-publish]
    paths:
      - ".github/workflows/fix-codex-daemon-generation-v3.yml"

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: feat/rust-runtime-native-publish
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Patch immutable daemon-generation checks and regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          transport_path = Path("src/codex_plugin_scanner/guard/adapters/codex_daemon_hook_transport.py")
          fixture_path = Path("tests/codex_daemon_hook_bridge_fixtures.py")
          test_path = Path("tests/test_codex_daemon_hook_bridge.py")
          original_transport = transport_path.read_text(encoding="utf-8")
          original_fixture = fixture_path.read_text(encoding="utf-8")
          original_test = test_path.read_text(encoding="utf-8")
          runner_temp.joinpath("daemon-generation-original-test-lines.json").write_text(
              json.dumps(
                  {
                      str(fixture_path): len(original_fixture.splitlines()),
                      str(test_path): len(original_test.splitlines()),
                  },
                  sort_keys=True,
              ),
              encoding="utf-8",
          )

          generation_check = "current_state != state or not secrets.compare_digest(current_key, discovery_key)"
          replacement = "_daemon_generation_identity(current_state) != _daemon_generation_identity(state)\n                or not secrets.compare_digest(current_key, discovery_key)"
          if original_transport.count(generation_check) != 2:
              raise RuntimeError("Expected exactly two whole-state generation checks")
          transport_path.write_text(
              original_transport.replace(generation_check, replacement),
              encoding="utf-8",
          )

          fixture_anchor = "            if type(self).challenge_mode == \"replace-state\":\n"
          fixture_lines = [
              "            if type(self).challenge_mode == \"refresh-trust-status\":",
              "                current_state_id = state.get(\"state_id\")",
              "                current_started_at = state.get(\"started_at\")",
              "                assert isinstance(current_state_id, str)",
              "                assert isinstance(current_started_at, str)",
              "                daemon_manager.write_guard_daemon_state(",
              "                    guard_home,",
              "                    self.server.server_address[1],",
              "                    type(self).auth_token,",
              "                    pid=os.getpid(),",
              "                    state_id=current_state_id,",
              "                    started_at=current_started_at,",
              "                    trust_status={\"status\": \"verified\"},",
              "                )",
              "                type(self).challenge_mode = \"valid\"",
          ]
          fixture_insertion = "\n".join(fixture_lines) + "\n"
          if original_fixture.count(fixture_anchor) != 1:
              raise RuntimeError("Expected the replacement-state fixture anchor once")
          fixture_path.write_text(
              original_fixture.replace(fixture_anchor, fixture_insertion + fixture_anchor, 1),
              encoding="utf-8",
          )

          test_anchor = "def test_repeated_generation_rollover_stays_bounded(monkeypatch: pytest.MonkeyPatch) -> None:\n"
          regression_lines = [
              "def test_authenticated_trust_metadata_refresh_keeps_same_generation(",
              "    tmp_path: Path,",
              "    monkeypatch: pytest.MonkeyPatch,",
              "    capsys: pytest.CaptureFixture[str],",
              ") -> None:",
              "    guard_home = tmp_path / \"guard-home\"",
              "    daemon = HTTPServer((\"127.0.0.1\", 0), _DaemonHandler)",
              "    daemon_thread = threading.Thread(target=daemon.serve_forever, daemon=True)",
              "    daemon_thread.start()",
              "    _write_authenticated_daemon_files(guard_home, daemon.server_address[1])",
              "    _DaemonHandler.challenge_mode = \"refresh-trust-status\"",
              "    monkeypatch.setattr(",
              "        \"sys.stdin\",",
              "        io.StringIO(json.dumps({\"hook_event_name\": \"UserPromptSubmit\"})),",
              "    )",
              "    config = _bridge_config(guard_home, daemon.server_address[1])",
              "    config[\"fallback_command\"] = [sys.executable, \"-c\", \"raise SystemExit(1)\"]",
              "",
              "    try:",
              "        exit_code = bridge.main(**config)",
              "    finally:",
              "        daemon.shutdown()",
              "        daemon_thread.join(timeout=5)",
              "",
              "    assert exit_code == 0",
              "    assert _DaemonHandler.challenge_count == 1",
              "    assert _DaemonHandler.captured_guard_token == \"fixture-token\"",
              "    assert json.loads(str(_DaemonHandler.captured_hook_body))[\"hook_event_name\"] == \"UserPromptSubmit\"",
              "    assert json.loads(capsys.readouterr().out) == {}",
              "",
              "",
          ]
          regression = "\n".join(regression_lines)
          if original_test.count(test_anchor) != 1:
              raise RuntimeError("Expected the bounded rollover test anchor once")
          test_path.write_text(
              original_test.replace(test_anchor, regression + test_anchor, 1),
              encoding="utf-8",
          )
          PY
      - name: Install locked test dependencies
        run: uv sync --frozen --extra dev --python 3.12
      - name: Format and update the test-suite ratchet exactly
        shell: bash
        run: |
          files=(
            src/codex_plugin_scanner/guard/adapters/codex_daemon_hook_transport.py
            tests/codex_daemon_hook_bridge_fixtures.py
            tests/test_codex_daemon_hook_bridge.py
          )
          uv run --no-sync ruff format "${files[@]}"
          uv run --no-sync ruff check "${files[@]}"
          uv run --no-sync ruff format --check "${files[@]}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          original = json.loads(
              Path(os.environ["RUNNER_TEMP"], "daemon-generation-original-test-lines.json").read_text(
                  encoding="utf-8"
              )
          )
          delta = sum(
              len(Path(path).read_text(encoding="utf-8").splitlines()) - old_lines
              for path, old_lines in original.items()
          )
          if delta <= 0:
              raise RuntimeError("Expected the daemon generation regression to add test lines")
          baseline_path = Path("ci/test-suite-ratchet-baseline.json")
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          baseline["maximum_test_source_lines"] += delta
          baseline_path.write_text(json.dumps(baseline, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Verify generation security and formerly flaky real-daemon path
        shell: bash
        run: |
          uv run --no-sync pytest -q \
            tests/test_codex_daemon_hook_bridge.py::test_authenticated_generation_rollover_is_rediscovered_once \
            tests/test_codex_daemon_hook_bridge.py::test_repeated_generation_rollover_stays_bounded \
            tests/test_codex_daemon_hook_bridge.py::test_authenticated_trust_metadata_refresh_keeps_same_generation \
            --tb=short
          node_one='tests/test_codex_daemon_hook_bridge.py::test_bridge_real_daemon_allows_static_github_content_read_with_safe_jq_filter[gh pr view 1 -tREVIEW]'
          node_two='tests/test_codex_daemon_hook_bridge.py::test_bridge_real_daemon_allows_static_github_content_read_with_safe_jq_filter[gh run list -cREVIEW_SHA]'
          for attempt in 1 2 3 4; do
            echo "Real-daemon generation verification attempt ${attempt}"
            uv run --no-sync pytest -q "$node_one" "$node_two" --tb=short
          done
      - name: Commit verified fix and remove all staging workflows
        shell: bash
        run: |
          git diff --check
          git rm -- \
            .github/workflows/fix-codex-daemon-generation-v3.yml \
            .github/workflows/fix-codex-daemon-test-readiness-v2.yml \
            .github/workflows/fix-codex-daemon-test-readiness.yml
          git add \
            ci/test-suite-ratchet-baseline.json \
            src/codex_plugin_scanner/guard/adapters/codex_daemon_hook_transport.py \
            tests/codex_daemon_hook_bridge_fixtures.py \
            tests/test_codex_daemon_hook_bridge.py
          actual=$(git diff --cached --name-only | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/fix-codex-daemon-generation-v3.yml' \
            '.github/workflows/fix-codex-daemon-test-readiness-v2.yml' \
            '.github/workflows/fix-codex-daemon-test-readiness.yml' \
            'ci/test-suite-ratchet-baseline.json' \
            'src/codex_plugin_scanner/guard/adapters/codex_daemon_hook_transport.py' \
            'tests/codex_daemon_hook_bridge_fixtures.py' \
            'tests/test_codex_daemon_hook_bridge.py' | sort)
          if [[ "$actual" != "$expected" ]]; then
            printf 'Unexpected staged files:\n%s\n' "$actual" >&2
            exit 1
          fi
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git commit --signoff -m "fix(daemon): distinguish trust refreshes from generation changes"
          git push origin HEAD:feat/rust-runtime-native-publish
