name: Managed Controls release sync

on:
  push:
    branches:
      - managed-controls/batch-13-local-parser-shared-posture

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Merge current release branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin release/3.0
          if ! git merge --no-edit origin/release/3.0; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = "ci/test-suite-ratchet-baseline.json"
            git checkout --ours ci/test-suite-ratchet-baseline.json
            git add ci/test-suite-ratchet-baseline.json
            git commit --no-edit
          fi
          rm -f .github/workflows/managed-controls-sync-pr2519.yml
          git add -A
          git commit -m "chore(ci): remove temporary release sync workflow"
          git push origin HEAD:managed-controls/batch-13-local-parser-shared-posture
