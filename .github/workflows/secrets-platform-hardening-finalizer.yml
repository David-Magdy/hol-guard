name: Secrets platform hardening finalizer

on:
  push:
    branches:
      - fix/secrets-e2e-platform-hardening-v2

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: secrets-platform-hardening-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel superseded branch automation
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          current = int(os.environ['GITHUB_RUN_ID'])
          branch = 'fix/secrets-e2e-platform-hardening-v2'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'User-Agent': 'hol-guard-secrets-finalizer',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          for status in ('queued', 'in_progress'):
              url = f'https://api.github.com/repos/{repository}/actions/runs?branch={branch}&status={status}&per_page=100'
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  runs = json.load(response).get('workflow_runs', [])
              for run in runs:
                  if int(run['id']) == current:
                      continue
                  if run.get('name') not in {
                      'Secrets platform hardening bootstrap',
                      'Secrets platform hardening finalizer',
                  }:
                      continue
                  cancel = urllib.request.Request(
                      f"https://api.github.com/repos/{repository}/actions/runs/{run['id']}/cancel",
                      method='POST',
                      headers=headers,
                  )
                  try:
                      urllib.request.urlopen(cancel, timeout=20).read()
                  except Exception:
                      pass
          PY

      - name: Checkout latest hardening branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/secrets-e2e-platform-hardening-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false

      - name: Install locked development environment
        run: uv sync --frozen --extra dev --python 3.12

      - name: Remove temporary automation and superseded smoke
        shell: bash
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/secrets-platform-hardening-bootstrap.yml \
            .github/workflows/secrets-platform-hardening-finalizer.yml \
            scripts/ci/run_guard_secrets_platform_smoke.py

      - name: Format and lint permanent implementation
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/codex_plugin_scanner/guard/secrets/setup_diagnostics.py
            src/codex_plugin_scanner/guard/secrets/git_subprocess.py
            src/codex_plugin_scanner/guard/secrets/cli.py
            src/codex_plugin_scanner/guard/secrets/precommit.py
            src/codex_plugin_scanner/guard/secrets/secret_repository_scanner.py
            src/codex_plugin_scanner/guard/secrets/secret_staged_scanner.py
            scripts/ci/run_guard_secrets_platform_smoke_v2.py
            tests/test_guard_secret_platform_hardening.py
            tests/test_guard_secret_git_subprocess_hardening.py
          )
          uv run --no-sync python -m ruff format "${files[@]}"
          uv run --no-sync python -m ruff check --fix "${files[@]}"
          uv run --no-sync python -m ruff format "${files[@]}"
          uv run --no-sync python -m ruff check "${files[@]}"

      - name: Advance exact anti-gaming ratchet
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/ci/generate_test_inventory.py --output /tmp/test-inventory.json
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path('/tmp/test-inventory.json').read_text(encoding='utf-8'))
          baseline_path = Path('ci/test-suite-ratchet-baseline.json')
          baseline = json.loads(baseline_path.read_text(encoding='utf-8'))
          baseline['maximum_collected_cases'] = inventory['inventory']['collected_cases']
          baseline['maximum_test_source_lines'] = inventory['test_source_lines']
          baseline_path.write_text(json.dumps(baseline, indent=2) + '\n', encoding='utf-8')
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory /tmp/test-inventory.json

      - name: Type-check the complete changed boundary
        shell: bash
        run: |
          uv run --no-sync basedpyright --level error \
            src/codex_plugin_scanner/guard/secrets/setup_diagnostics.py \
            src/codex_plugin_scanner/guard/secrets/git_subprocess.py \
            src/codex_plugin_scanner/guard/secrets/cli.py \
            src/codex_plugin_scanner/guard/secrets/precommit.py \
            src/codex_plugin_scanner/guard/secrets/secret_repository_scanner.py \
            src/codex_plugin_scanner/guard/secrets/secret_staged_scanner.py \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            tests/test_guard_secret_platform_hardening.py \
            tests/test_guard_secret_git_subprocess_hardening.py

      - name: Run the complete Secrets-focused suite
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' tests < <(find tests -maxdepth 1 -type f \( -name '*secret*.py' -o -name '*secrets*.py' \) -print0 | sort -z)
          test "${#tests[@]}" -gt 0
          uv run --no-sync pytest -q "${tests[@]}" --tb=short

      - name: Reject persisted credentials and unsafe subprocess patterns
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          import re

          provider_patterns = (
              re.compile(rb'gh[pousr]_[A-Za-z0-9_]{20,255}'),
              re.compile(rb'sk-(?:(?:proj|svcacct)-)?[A-Za-z0-9_-]{20,255}'),
              re.compile(rb'AKIA[0-9A-Z]{16}'),
          )
          for root_name in ('src', 'tests', 'scripts', 'docs'):
              root = Path(root_name)
              for path in root.rglob('*'):
                  if not path.is_file() or path.is_symlink():
                      continue
                  data = path.read_bytes()
                  for pattern in provider_patterns:
                      if pattern.search(data):
                          raise SystemExit(f'complete provider-shaped credential committed: {path}')
          subprocess_source = Path('src/codex_plugin_scanner/guard/secrets/git_subprocess.py').read_text(encoding='utf-8')
          for required in ('shell=False', 'stdin=subprocess.DEVNULL', 'GIT_CONFIG_GLOBAL', 'core.fsmonitor=false'):
              if required not in subprocess_source:
                  raise SystemExit(f'missing hardened Git invariant: {required}')
          PY

      - name: Build and exercise the exact installed wheel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          uv build --wheel --out-dir dist
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv run --no-sync python scripts/ci/run_guard_secrets_platform_smoke_v2.py --wheel "$wheel"
          git diff --check

      - name: Commit exact validated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/secrets-platform-e2e.yml \
            ci/test-suite-ratchet-baseline.json \
            docs/guard/secrets-platform-hardening.md \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            src/codex_plugin_scanner/guard/secrets \
            tests/test_guard_secret_platform_hardening.py \
            tests/test_guard_secret_git_subprocess_hardening.py
          git commit -m 'fix(secrets): finalize cross-platform end-to-end hardening'
          git push origin HEAD:fix/secrets-e2e-platform-hardening-v2

      - name: Dispatch exact-head permanent platform matrix
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/secrets-platform-e2e.yml/dispatches" \
            --data '{"ref":"fix/secrets-e2e-platform-hardening-v2"}'
