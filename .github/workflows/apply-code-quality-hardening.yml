name: Apply release 3 code-quality hardening

on:
  push:
    branches:
      - refactor/release-3-code-quality-hardening
    paths:
      - .github/workflows/apply-code-quality-hardening.yml

permissions:
  contents: write

concurrency:
  group: apply-release-3-code-quality-hardening
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'hashgraph-online/hol-guard' &&
      github.ref == 'refs/heads/refactor/release-3-code-quality-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: refactor/release-3-code-quality-hardening
          fetch-depth: 0
      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/code-quality-payload/part-00 \
            .github/code-quality-payload/part-01 \
            .github/code-quality-payload/correct-02-00 \
            .github/code-quality-payload/correct-02-01 \
            .github/code-quality-payload/correct-02-02 \
            .github/code-quality-payload/correct-02-03 \
            .github/code-quality-payload/part-03 \
            .github/code-quality-payload/part-04 \
            .github/code-quality-payload/part-05 \
            .github/code-quality-payload/part-06 \
            .github/code-quality-payload/part-07 \
            .github/code-quality-payload/part-08 \
            .github/code-quality-payload/part-09 \
            > /tmp/code-quality.patch.xz.b64
          test "$(wc -c < /tmp/code-quality.patch.xz.b64)" -eq 75452
          echo "a2bbdda7fb0c6b41166952069c2636ac564b74bb37bab2dce798a180ba17968b  /tmp/code-quality.patch.xz.b64" | sha256sum --check --strict
          base64 --decode /tmp/code-quality.patch.xz.b64 > /tmp/code-quality.patch.xz
          echo "7429c0d0b9df248b43a863ea699e3f62af754e3f0d9379be221443b95ecfe34f  /tmp/code-quality.patch.xz" | sha256sum --check --strict
          xz --decompress --stdout /tmp/code-quality.patch.xz > /tmp/code-quality.patch
          echo "45c3c57dbf6b5040607fb9f7f884583a8a24cb5a441d3782b9ca4714ec5f7aaf  /tmp/code-quality.patch" | sha256sum --check --strict
          git apply --check /tmp/code-quality.patch
          git apply /tmp/code-quality.patch

          test "$(wc -c < .github/code-quality-payload/digest-fix)" -eq 1616
          echo "1357fd5607ad30cb2b3ab395cfb2517e8987c7aadb80cc796046675d8b43f3f7  .github/code-quality-payload/digest-fix" | sha256sum --check --strict
          base64 --decode .github/code-quality-payload/digest-fix > /tmp/code-quality-digest-fix.patch.xz
          echo "41a00efb0dfda2065a0167997f744a7ca9131b32532afaebf60f9fa645bb7779  /tmp/code-quality-digest-fix.patch.xz" | sha256sum --check --strict
          xz --decompress --stdout /tmp/code-quality-digest-fix.patch.xz > /tmp/code-quality-digest-fix.patch
          echo "2cc4a1aa2bc9ec9077dbc3e1942affbc3ad6b6dd96b97a2ddcf700856ee2c851  /tmp/code-quality-digest-fix.patch" | sha256sum --check --strict
          git apply --check /tmp/code-quality-digest-fix.patch
          git apply /tmp/code-quality-digest-fix.patch

          rm -f \
            .github/rust-required-gzip-b64/part-000 \
            .github/rust-required-gzip-b64/segment-001-005 \
            .github/rust-required-gzip-b64/segment-006-010 \
            .github/rust-required-patch/part-00 \
            .github/workflows/code-quality-audit-export.yml \
            .github/workflows/daemon-edge-cleanup-shepherd.yml \
            .github/workflows/daemon-edge-final-tree-shepherd.yml \
            .github/workflows/daemon-edge-source-fix-shepherd.yml \
            .github/workflows/tmp-apply-rust-daemon-edge-hardening.yml \
            .github/workflows/tmp-coordinate-rust-daemon-edge-hardening-v2.yml \
            .github/workflows/tmp-coordinate-rust-daemon-edge-hardening.yml \
            .github/workflows/tmp-expedite-rust-daemon-edge-hardening.yml \
            .github/workflows/tmp-finalize-rust-daemon-edge-hardening-v2.yml \
            .github/workflows/tmp-finalize-rust-daemon-edge-hardening.yml \
            .github/workflows/tmp-import-pr2372-regression-assets-v2.yml \
            .github/workflows/tmp-import-pr2372-regression-assets.yml \
            .github/workflows/tmp-recover-rust-daemon-edge-hardening-v2.yml \
            .github/workflows/tmp-recover-rust-daemon-edge-hardening.yml \
            .github/workflows/tmp-rust-required-latest-source.yml \
            .github/workflows/tmp-shepherd-rust-daemon-edge-hardening.yml \
            scripts/ci/apply_daemon_edge_hardening.py
          rmdir .github/rust-required-gzip-b64 .github/rust-required-patch 2>/dev/null || true
          rm -rf .github/code-quality-payload
          rm -f .github/workflows/apply-code-quality-hardening.yml

          rm -rf ci/code-quality-workflow-payload
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          payload_root = root / "ci" / "code-quality-workflow-payload"
          files_root = payload_root / "files"
          files_root.mkdir(parents=True, exist_ok=True)

          raw = subprocess.check_output(
              [
                  "git",
                  "ls-files",
                  "--modified",
                  "--deleted",
                  "--others",
                  "--exclude-standard",
                  "-z",
                  "--",
                  ".github/workflows",
              ]
          )
          paths = sorted(
              {
                  item.decode("utf-8")
                  for item in raw.split(b"\0")
                  if item
              }
          )
          records: list[dict[str, object]] = []
          for relative in paths:
              source = root / relative
              if source.is_file():
                  data = source.read_bytes()
                  payload_name = hashlib.sha256(relative.encode("utf-8")).hexdigest() + ".txt"
                  payload_path = files_root / payload_name
                  payload_path.write_bytes(data)
                  records.append(
                      {
                          "path": relative,
                          "operation": "upsert",
                          "payload": payload_path.relative_to(root).as_posix(),
                          "bytes": len(data),
                          "sha256": hashlib.sha256(data).hexdigest(),
                      }
                  )
              else:
                  records.append({"path": relative, "operation": "delete"})

          if not records:
              raise SystemExit("expected at least one workflow change")
          (payload_root / "manifest.json").write_text(
              json.dumps({"version": 1, "files": records}, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          git diff --check
      - name: Compile changed Python
        run: |
          python -m compileall -q src scripts/ci \
            tests/test_code_quality_audit.py \
            tests/test_guard_durable_io.py \
            tests/test_guard_managed_install_context.py \
            tests/test_guard_node_semver.py \
            tests/test_guard_private_file_io.py
      - name: Verify audit baseline
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/ci python scripts/ci/code_quality_audit.py \
            --root . \
            --baseline ci/code-quality-baseline.json
      - name: Restore workflow tree for token-safe push
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree -- .github/workflows
          git clean -f -- .github/workflows
          git diff --check
      - name: Commit finalized non-workflow tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "workflow changes escaped staging boundary" >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m "refactor: harden release 3 code quality"
          git push origin HEAD:refactor/release-3-code-quality-hardening
