name: One-shot sync main into release 3.0

on:
  push:
    branches:
      - chore/sync-main-into-release-3.0-20260812

permissions:
  contents: write

concurrency:
  group: one-shot-sync-main-release-3-0
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reconciliation branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile current main fixes by intent
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main

          commits=(
            ab6f25e23ce1382f7d8ecb7e0a86baadbf9a8c3b
            5be17fcedcfe2e6d1681fc7d443e12bbf3265e4b
            19d014ed3b958fafb67cfa9f76548717cff4eb42
            4c78c424dd63fac40b3c6eea490253bc373390ad
            e08becfc101bc5becfe7d443ae738976fdc1cd76
            f5166e7e84e48682e8b96823071a56c72e43f74f
            d8e5f11d952af726026d0d6a6cced0f0f9d0084f
            939d19674920765ff93cd1b80271fb4e49404378
            c4d0480349e5bdcbe6d6d04f3366fc3ce0efb947
          )

          for commit in "${commits[@]}"; do
            git cherry-pick -x -X theirs "$commit"
          done

          git merge --no-ff -s ours origin/main \
            -m "chore(release): record current main ancestry after semantic reconciliation"

          git rm .github/workflows/one-shot-sync-main-release-3-0.yml
          git commit -m "chore(ci): remove one-shot branch reconciliation workflow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
