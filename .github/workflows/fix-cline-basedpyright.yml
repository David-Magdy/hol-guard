name: Fix Cline basedpyright closure

on:
  push:
    branches:
      - fix/release-3.0-cline-dashboard-contract

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true

      - name: Apply scoped typing fixes
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("src/codex_plugin_scanner/guard/cli/install_commands.py"); s=p.read_text(); old="from ..adapters.contracts import contract_for\nfrom ..adapters.cursor import CursorHarnessAdapter\n"; new="from ..adapters.cline import ClineHarnessAdapter\nfrom ..adapters.contracts import contract_for\nfrom ..adapters.cursor import CursorHarnessAdapter\n"; assert old in s; p.write_text(s.replace(old,new,1))'
          python -c 'from pathlib import Path; p=Path("src/codex_plugin_scanner/guard/cli/install_commands.py"); s=p.read_text(); old="    if active:\n        return adapter.install(context, surface=surface)  # type: ignore[call-arg]\n    return adapter.uninstall(context, surface=surface)  # type: ignore[call-arg]\n"; new="    if isinstance(adapter, ClineHarnessAdapter):\n        return adapter.install(context, surface=surface) if active else adapter.uninstall(context, surface=surface)\n    raise ValueError(f\"Unsupported {setup_contract.display_name} surface: {surface}\")\n"; assert old in s; p.write_text(s.replace(old,new,1))'
          python -c 'from pathlib import Path; p=Path("src/codex_plugin_scanner/guard/adapters/cline_plugin.py"); s=p.read_text(); old="    installed = isinstance(index_path_value, str) and Path(index_path_value).is_file()\n    if installed and isinstance(expected, str):\n        path = Path(index_path_value)\n"; new="    installed = isinstance(index_path_value, str) and Path(index_path_value).is_file()\n    if isinstance(index_path_value, str) and installed and isinstance(expected, str):\n        path = Path(index_path_value)\n"; assert old in s; p.write_text(s.replace(old,new,1))'

      - name: Commit scoped typing fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/codex_plugin_scanner/guard/cli/install_commands.py src/codex_plugin_scanner/guard/adapters/cline_plugin.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(cline): satisfy surface dispatch typing"
          git push origin "HEAD:${GITHUB_REF_NAME}"
