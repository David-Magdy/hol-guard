name: Managed controls dashboard sync

on:
  push:
    paths:
      - '.github/workflows/managed-controls-dashboard-sync.yml'

permissions:
  contents: write

jobs:
  sync-dashboard:
    if: startsWith(github.ref_name, 'managed-controls/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Apply reviewed vocabulary fixes
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('dashboard/src/app.tsx'): [
                  ('if (view === "policy") return "Policy";', 'if (view === "policy") return "Rules & exceptions";'),
              ],
              Path('dashboard/src/scrg171-172.test.ts'): [
                  ('rulesTab?.textContent?.includes("Policy") === true', 'rulesTab?.textContent?.includes("Remembered decisions") === true'),
              ],
          }
          for path, changes in replacements.items():
              value = path.read_text(encoding='utf-8')
              for old, new in changes:
                  if old not in value:
                      raise SystemExit(f'missing expected text in {path}: {old}')
                  value = value.replace(old, new, 1)
              path.write_text(value, encoding='utf-8')
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Test and build dashboard
        working-directory: dashboard
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run build
      - name: Commit synchronized source and bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/src/app.tsx dashboard/src/scrg171-172.test.ts src/codex_plugin_scanner/guard/daemon/static
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: sync managed controls dashboard bundle'
          git push origin "HEAD:${GITHUB_REF_NAME}"
