name: Extension Control Center installed CI

on:
  pull_request:
    branches:
      - release/3.0
    paths:
      - dashboard/**
      - src/codex_plugin_scanner/guard/daemon/**
      - src/codex_plugin_scanner/guard/runtime/command_extensions.py
      - src/codex_plugin_scanner/guard/runtime/command_permission_catalog.py
      - src/codex_plugin_scanner/guard/runtime/extension_control_*.py
      - tests/dockerlabs/command-extension-analytics/**
      - tests/test_guard_extension_control_catalog_detail.py
      - tests/fixtures/extension-controls/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/extension-control-center-installed-ci.yml
  push:
    branches:
      - release/3.0
    paths:
      - dashboard/**
      - src/codex_plugin_scanner/guard/daemon/**
      - src/codex_plugin_scanner/guard/runtime/command_extensions.py
      - src/codex_plugin_scanner/guard/runtime/command_permission_catalog.py
      - src/codex_plugin_scanner/guard/runtime/extension_control_*.py
      - tests/dockerlabs/command-extension-analytics/**
      - tests/test_guard_extension_control_catalog_detail.py
      - tests/fixtures/extension-controls/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/extension-control-center-installed-ci.yml

permissions:
  contents: read

concurrency:
  group: extension-control-center-installed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Build exact wheel and isolated installed interpreter
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          VERSION=$(uv run --no-sync python scripts/sync_repo_version.py --check)
          uv build --wheel --out-dir dist
          WHEEL=$(find dist -maxdepth 1 -type f -name 'hol_guard-*.whl' -print)
          test -n "$WHEEL"
          test "$(printf '%s\n' "$WHEEL" | wc -l)" -eq 1
          python -m venv "$RUNNER_TEMP/hol-guard-ecc-venv"
          CANARY_PYTHON="$RUNNER_TEMP/hol-guard-ecc-venv/bin/python"
          PYTHONPATH= "$CANARY_PYTHON" -m pip install --no-compile --index-url https://pypi.org/simple "$WHEEL"
          PYTHONPATH= "$CANARY_PYTHON" -c 'import codex_plugin_scanner, importlib.metadata as m; print(m.version("hol-guard"))'
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CANARY_PYTHON=$CANARY_PYTHON" >> "$GITHUB_ENV"
          echo "HOL_GUARD_WHEEL=$GITHUB_WORKSPACE/$WHEEL" >> "$GITHUB_ENV"
          sha256sum "$WHEEL" > extension-control-center-wheel.sha256

      - name: Install dashboard and Chromium dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd dashboard
          bun install --frozen-lockfile --ignore-scripts
          bunx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apparmor bubblewrap
          sudo tee /etc/apparmor.d/hol-guard-bwrap >/dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>
          /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/hol-guard-bwrap

      - name: Run installed daemon and Chromium proof
        shell: bash
        env:
          HOL_GUARD_LAB_EXPECTED_VERSION: ${{ env.VERSION }}
          HOL_GUARD_LAB_PYTHON: ${{ env.CANARY_PYTHON }}
        run: |
          set -euo pipefail
          mkdir -p installed-ecc-proof
          cd tests/dockerlabs/command-extension-analytics
          bun run typecheck
          PYTHONPATH= HOL_GUARD_WHEEL="$HOL_GUARD_WHEEL" \
            bun run guard:test:command-extension-analytics \
            > "$GITHUB_WORKSPACE/installed-ecc-proof/dockerlab.json"

      - name: Verify Extension Control Center browser evidence
        shell: bash
        run: |
          set -euo pipefail
          proof_dir=.artifacts/command-extension-analytics/playwright-output
          for screenshot in \
            installed-extension-catalog.png \
            installed-extension-rule-detail.png; do
            count=$(find "$proof_dir" -type f -name "$screenshot" | wc -l)
            test "$count" -eq 1
          done
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('installed-ecc-proof/dockerlab.json').read_text(encoding='utf-8'))
          assert payload['status'] == 'pass'
          assert payload['playwright'] == 'passed'
          assert payload['privacy'] == {'api': 'clean', 'database': 'clean', 'export': 'clean', 'sse': 'clean'}
          assert payload['persistence']['beforeRestart'] == payload['persistence']['afterRestart']
          PY

      - name: Upload installed browser proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: extension-control-center-installed-proof-${{ runner.os }}
          path: |
            extension-control-center-wheel.sha256
            installed-ecc-proof/dockerlab.json
            .artifacts/command-extension-analytics/playwright-output/**/*.png
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
