name: Validate and export final PR 2419 tree v3

on:
  push:
    branches:
      - refactor/release-3-code-quality-hardening
    paths:
      - .github/workflows/tmp-pr2419-final-tree-v3.yml

permissions:
  contents: read

concurrency:
  group: pr-2419-final-tree-v3
  cancel-in-progress: false

env:
  HEAD_BRANCH: refactor/release-3-code-quality-hardening
  BASE_BRANCH: release/3.0

jobs:
  validate:
    if: github.repository == 'hashgraph-online/hol-guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: refactor/release-3-code-quality-hardening
          fetch-depth: 0
          show-progress: false
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
          save-cache: false
      - name: Execute corrected validated-tree procedure
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 - <<'PY'
          from __future__ import annotations

          import os
          import subprocess
          from pathlib import Path

          import yaml

          workflow = Path(".github/workflows/tmp-pr2419-final-tree-v2.yml")
          payload = yaml.safe_load(workflow.read_text(encoding="utf-8"))
          wanted = (
              "Build final release-based tree",
              "Install development environment",
              "Normalize and validate quality evidence",
              "Run focused regressions",
              "Run complete Python suite",
              "Commit and audit final tree",
              "Export validated binary patch",
          )
          available = {
              str(step.get("name")): step.get("run")
              for step in payload["jobs"]["validate"]["steps"]
              if isinstance(step, dict) and step.get("name")
          }
          missing = [name for name in wanted if not isinstance(available.get(name), str)]
          if missing:
              raise SystemExit(f"missing executable workflow steps: {missing}")

          scripts = [str(available[name]) for name in wanted]
          build_lines = scripts[0].splitlines(keepends=True)
          baseline = (
              '"diff --git a/ci/test-suite-ratchet-baseline.json '
              'b/ci/test-suite-ratchet-baseline.json",'
          )
          fixture = (
              '"diff --git a/tests/fixtures/guard-command-corpus/decision-diff-report.json '
              'b/tests/fixtures/guard-command-corpus/decision-diff-report.json",'
          )
          if not any(fixture in line for line in build_lines):
              for index, line in enumerate(build_lines):
                  if baseline in line:
                      indent = line[: len(line) - len(line.lstrip())]
                      build_lines.insert(index + 1, f"{indent}{fixture}\n")
                      break
              else:
                  raise SystemExit("generated-baseline patch filter marker not found")
          scripts[0] = "".join(build_lines)

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          environment = os.environ.copy()
          for index, (name, script) in enumerate(zip(wanted, scripts, strict=True), start=1):
              script_path = runner_temp / f"pr2419-step-{index}.sh"
              script_path.write_text(script, encoding="utf-8")
              print(f"::group::{name}", flush=True)
              try:
                  subprocess.run(
                      ["bash", "--noprofile", "--norc", str(script_path)],
                      check=True,
                      cwd=Path.cwd(),
                      env=environment,
                  )
              finally:
                  print("::endgroup::", flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr2419-validated-final-patch
          path: |
            ${{ runner.temp }}/pr2419-final.patch
            ${{ runner.temp }}/pr2419-final.json
          if-no-files-found: error
          retention-days: 1
