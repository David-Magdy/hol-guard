name: Protection Center Batch 4 finalize
on:
  push:
    branches: [feat/protection-center-04-policy-editor-final]
permissions:
  contents: write
concurrency:
  group: protection-center-batch4-finalize
  cancel-in-progress: true
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
      - name: Apply friendly secure-editor presentation and verify
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/protection-center-04-policy-editor
          git diff 963de385ef90c60ea78cc1c7b5b3cd05c19ba935^ 963de385ef90c60ea78cc1c7b5b3cd05c19ba935 -- . \
            ':(exclude).github/workflows/protection-center-policy-ux-sync.yml' \
            ':(exclude)src/codex_plugin_scanner/guard/daemon/static/**' > /tmp/batch4-ux.patch
          test -s /tmp/batch4-ux.patch
          git apply --3way --index /tmp/batch4-ux.patch
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync pytest -q \
            tests/test_guard_extension_control_api.py \
            tests/test_guard_extension_control_projection.py \
            tests/test_guard_extension_control_semantic_preview.py \
            --tb=short
          cd dashboard
          bun install --frozen-lockfile --ignore-scripts
          bun run test
          bun run build
          cd ..
          rm .github/workflows/protection-center-batch4-finalize.yml
          git add dashboard src/codex_plugin_scanner/guard/daemon/static .github/workflows/protection-center-batch4-finalize.yml
          git diff --cached --check
          git commit -m "feat(protection-center): simplify secure protection settings"
          git push origin HEAD:feat/protection-center-04-policy-editor-final