name: Apply deterministic Ruff fixes

on:
  push:
    branches:
      - refactor/release-3-code-quality-hardening
    paths:
      - .github/workflows/tmp-ruff-code-quality-fix.yml

permissions:
  contents: write

concurrency:
  group: apply-code-quality-ruff-fixes
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.repository == 'hashgraph-online/hol-guard' &&
      github.ref == 'refs/heads/refactor/release-3-code-quality-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: refactor/release-3-code-quality-hardening
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
          save-cache: false
      - name: Install locked development environment
        run: uv sync --frozen --extra dev --python 3.12
      - name: Apply and verify Ruff fixes
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync ruff check --fix src tests
          uv run --no-sync ruff format src tests
          uv run --no-sync ruff check src tests
          uv run --no-sync ruff format --check src tests
          python -m compileall -q src tests
          git diff --check
      - name: Commit source and test fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "style: apply reviewed Ruff fixes"
          git push origin HEAD:refactor/release-3-code-quality-hardening
