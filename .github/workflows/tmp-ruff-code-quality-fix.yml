name: Diagnose release 3 merge conflicts

on:
  push:
    branches:
      - refactor/release-3-code-quality-hardening
    paths:
      - .github/workflows/tmp-ruff-code-quality-fix.yml

permissions:
  contents: read

concurrency:
  group: diagnose-code-quality-release-merge
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.repository == 'hashgraph-online/hol-guard' &&
      github.ref == 'refs/heads/refactor/release-3-code-quality-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: refactor/release-3-code-quality-hardening
          fetch-depth: 0
          persist-credentials: false
      - name: Diagnose merge with current release/3.0
        shell: bash
        run: |
          set -uo pipefail
          git fetch --no-tags origin release/3.0
          git config merge.conflictstyle diff3
          set +e
          git merge --no-commit --no-ff origin/release/3.0
          status=$?
          set -e
          echo "merge_status=${status}"
          echo "base=$(git rev-parse origin/release/3.0)"
          echo "head=$(git rev-parse HEAD)"
          echo "unmerged_files_begin"
          git diff --name-only --diff-filter=U || true
          echo "unmerged_files_end"
          while IFS= read -r path; do
            test -n "$path" || continue
            echo "===== CONFLICT: $path ====="
            git diff -- "$path" || true
          done < <(git diff --name-only --diff-filter=U)
          git merge --abort >/dev/null 2>&1 || true
          exit 0
