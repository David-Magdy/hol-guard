name: Finalize release 3 code-quality hardening

on:
  push:
    branches:
      - refactor/release-3-code-quality-hardening
    paths:
      - .github/workflows/tmp-ruff-code-quality-fix.yml

permissions:
  contents: write

concurrency:
  group: finalize-release-3-code-quality-hardening
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.repository == 'hashgraph-online/hol-guard' &&
      github.ref == 'refs/heads/refactor/release-3-code-quality-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: refactor/release-3-code-quality-hardening
          fetch-depth: 10000
          show-progress: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
          save-cache: false
      - name: Reconcile, validate, and publish a clean branch history
        shell: bash
        run: |
          set -euo pipefail
          branch="refactor/release-3-code-quality-hardening"
          workflow_path=".github/workflows/tmp-ruff-code-quality-fix.yml"
          original_head="$(git rev-parse HEAD)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet --no-tags --depth=10000 \
            origin release/3.0:refs/remotes/origin/release/3.0

          set +e
          git merge --no-commit --no-ff origin/release/3.0
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            expected=(
              "ci/test-suite-ratchet-baseline.json"
              "tests/fixtures/guard-command-corpus/decision-diff-report.json"
              "tests/test_release_train_workflow.py"
            )
            if [ "${conflicts[*]}" != "${expected[*]}" ]; then
              printf 'Unexpected merge conflicts:\n'
              printf '%s\n' "${conflicts[@]}"
              exit 1
            fi
            git checkout --ours ci/test-suite-ratchet-baseline.json
            git checkout --ours \
              tests/fixtures/guard-command-corpus/decision-diff-report.json
            git checkout --theirs tests/test_release_train_workflow.py
            git add \
              ci/test-suite-ratchet-baseline.json \
              tests/fixtures/guard-command-corpus/decision-diff-report.json \
              tests/test_release_train_workflow.py
            test -z "$(git diff --name-only --diff-filter=U)"
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/ci.yml")
          content = path.read_text(encoding="utf-8")
          marker = "            tests/test_guard_private_file_io.py"
          test_line = "            tests/test_guard_kubernetes_command_support.py"
          existing = content.count(test_line)
          if existing == 0:
              marker_count = content.count(marker)
              if marker_count != 2:
                  raise SystemExit(
                      f"expected two CI lint-list markers, found {marker_count}"
                  )
              content = content.replace(marker, marker + "\n" + test_line)
          elif existing != 2:
              raise SystemExit(
                  f"expected zero or two Kubernetes test entries, found {existing}"
              )
          path.write_text(content, encoding="utf-8")
          PY

          uv sync --frozen --extra dev --python 3.12

          quality_files=(
            scripts/ci/code_quality_ast.py
            scripts/ci/code_quality_audit.py
            src/codex_plugin_scanner/guard/private_file_io.py
            src/codex_plugin_scanner/guard/runtime/kubernetes_command_support.py
            tests/test_code_quality_audit.py
            tests/test_guard_kubernetes_command_support.py
          )
          uv run --no-sync ruff check --fix "${quality_files[@]}"
          uv run --no-sync ruff format "${quality_files[@]}"

          uv run --no-sync python tests/guard_command_decision_diff.py --write
          uv run --no-sync python tests/guard_command_decision_diff.py --check

          rm "$workflow_path"

          uv run --no-sync python scripts/ci/test_inventory.py \
            --output "${RUNNER_TEMP}/test-inventory.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          inventory_path = Path(os.environ["RUNNER_TEMP"]) / "test-inventory.json"
          inventory = json.loads(inventory_path.read_text(encoding="utf-8"))
          payload = {
              "maximum_collected_cases": inventory["inventory"]["collected_cases"],
              "maximum_test_source_lines": inventory["test_source_lines"],
              "schema_version": 1,
          }
          Path("ci/test-suite-ratchet-baseline.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          uv run --no-sync python scripts/ci/code_quality_audit.py \
            --root . \
            --baseline ci/code-quality-baseline.json \
            --write-baseline \
            --markdown-output docs/guard/release-3-code-quality-audit.md
          uv run --no-sync python scripts/ci/code_quality_audit.py \
            --root . \
            --baseline ci/code-quality-baseline.json \
            --json-output "${RUNNER_TEMP}/code-quality-audit.json"

          uv run --no-sync pytest \
            tests/test_code_quality_audit.py \
            tests/test_guard_private_file_io.py \
            tests/test_guard_kubernetes_command_support.py \
            --tb=short

          uv run --no-sync python -m ruff check \
            src/ \
            scripts/ci/code_quality_*.py \
            tests/test_code_quality_audit.py \
            tests/test_guard_durable_io.py \
            tests/test_guard_kubernetes_command_support.py \
            tests/test_guard_managed_install_context.py \
            tests/test_guard_node_semver.py \
            tests/test_guard_private_file_io.py
          uv run --no-sync python -m ruff format --check \
            src/ \
            scripts/ci/code_quality_*.py \
            tests/test_code_quality_audit.py \
            tests/test_guard_durable_io.py \
            tests/test_guard_kubernetes_command_support.py \
            tests/test_guard_managed_install_context.py \
            tests/test_guard_node_semver.py \
            tests/test_guard_private_file_io.py
          uv run --no-sync basedpyright --level error
          uv run --no-sync python -m compileall -q src scripts/ci tests
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/ \
            --select=F401,F811,F841
          if grep -rn "TODO\|FIXME\|HACK\|XXX" \
            src/codex_plugin_scanner/guard/ \
            --include="*.py" | grep -v "# type: ignore"; then
            exit 1
          fi
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory "${RUNNER_TEMP}/test-inventory.json"

          python3 - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          from pathlib import Path

          diff = subprocess.run(
              ["git", "diff", "--unified=0", "origin/release/3.0", "--"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          patterns = {
              "personal email": re.compile(r"(?i)\bmichael@hol\.org\b"),
              "personal name": re.compile(r"(?i)\bmichael\s+kantor\b"),
              "personal handle": re.compile(r"(?i)\bkantorcodes\b"),
              "private conversation URL": re.compile(r"(?i)chatgpt\.com/(?:c|g)/"),
              "private planning path": re.compile(r"(?i)~/?\.codex/plans"),
              "internal planning artifact": re.compile(
                  r"(?i)(?:takeaway\s+prompt|continuation\s+prompt|"
                  r"release-3-code-quality-hardening-(?:prd|todo|takeaway-prompt))"
              ),
              "personal macOS home path": re.compile(
                  r"(?i)/Users/(?:michael|mkantor|kantorcodes)(?:/|\b)"
              ),
              "personal Windows home path": re.compile(
                  r"(?i)C:\\Users\\(?:michael|mkantor|kantorcodes)(?:\\|\b)"
              ),
              "personal Linux home path": re.compile(
                  r"(?i)/home/(?:michael|mkantor|kantorcodes)(?:/|\b)"
              ),
          }
          findings: set[tuple[str, str]] = set()
          current_file = ""
          for line in diff.splitlines():
              if line.startswith("+++ b/"):
                  current_file = line[6:]
                  continue
              if not line.startswith("+") or line.startswith("+++"):
                  continue
              for label, pattern in patterns.items():
                  if pattern.search(line[1:]):
                      findings.add((current_file, label))
          if findings:
              for path, label in sorted(findings):
                  print(f"public-repository hygiene failure: {path}: {label}")
              raise SystemExit(1)

          forbidden_paths = (
              "docs/guard/release-3-code-quality-hardening-prd.md",
              "docs/guard/release-3-code-quality-hardening-todo.md",
              "docs/guard/release-3-code-quality-hardening-takeaway-prompt.md",
          )
          remaining = [path for path in forbidden_paths if Path(path).exists()]
          if remaining:
              raise SystemExit(f"private planning artifacts remain: {remaining}")
          PY

          git diff --check
          git add -A
          git diff --cached --check
          tree="$(git write-tree)"
          commit_message="${RUNNER_TEMP}/commit-message.txt"
          cat > "$commit_message" <<'EOF'
          refactor: harden release 3 code quality

          Consolidate repeated implementations, harden identified edge cases, add
          deterministic structural-quality ratchets, and preserve existing public
          behavior and security boundaries.

          Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          EOF
          new_commit="$(git commit-tree "$tree" -p origin/release/3.0 < "$commit_message")"
          git push \
            --force-with-lease="refs/heads/${branch}:${original_head}" \
            origin "${new_commit}:refs/heads/${branch}"
