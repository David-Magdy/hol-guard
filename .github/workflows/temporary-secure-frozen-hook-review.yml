name: Temporary secure frozen hook review

on:
  push:
    branches:
      - fix/release-30-frozen-cli-hook-bridge-isolated

permissions:
  contents: write

jobs:
  harden-test-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/release-30-frozen-cli-hook-bridge-isolated
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: 0.9.26
          enable-cache: true

      - name: Install frozen development environment
        run: uv sync --frozen --extra dev --python 3.12

      - name: Apply security review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def block(*lines: str) -> str:
              return "\n".join(lines) + "\n"

          bridge_path = Path('src/codex_plugin_scanner/guard/adapters/bounded_cli_hook_bridge.py')
          text = bridge_path.read_text(encoding='utf-8')

          prefix_start = text.index('    expected_prefix = (\n')
          prefix_end = text.index('    json_output = ', prefix_start)
          new_prefix = block(
              '    if len(cli_args) < 6 or tuple(cli_args[:3]) != ("guard", "hook", "--guard-home"):',
              '        return None',
              '    try:',
              '        supplied_guard_home = Path(cli_args[3]).resolve(strict=False)',
              '        expected_guard_home = guard_home.resolve(strict=False)',
              '    except OSError:',
              '        return None',
              '    if supplied_guard_home != expected_guard_home:',
              '        return None',
              '    if tuple(cli_args[4:6]) != ("--harness", harness):',
              '        return None',
              '    tail = cli_args[6:]',
          )
          text = text[:prefix_start] + new_prefix + text[prefix_end:]

          command_start = text.index('    command = ("hook",')
          command_end = text.index('\n\n\ndef _json_object', command_start)
          new_command = block(
              '    command: tuple[str, ...] = (',
              '        "hook",',
              '        "--guard-home",',
              '        str(expected_guard_home),',
              '        "--harness",',
              '        harness,',
              '        *tail,',
              '    )',
              '    if json_output:',
              '        command = (*command, "--json")',
              '    return command',
          ).rstrip('\n')
          text = text[:command_start] + new_command + text[command_end:]

          run_start = text.index('def run_bounded_cli_hook(')
          dispatch_start = text.index('    if frozen_launcher:\n', run_start)
          dispatch_end = text.index('    result = run_isolated_hook_process(', dispatch_start)
          new_dispatch = block(
              '    runtime_frozen = bool(getattr(sys, "frozen", False))',
              '    if runtime_frozen:',
              '        direct_cli_args = _validated_frozen_cli_args(',
              '            cli_args,',
              '            guard_home=guard_home,',
              '            harness=harness,',
              '        )',
              '        if direct_cli_args is None:',
              '            return _emit_failure(harness=harness, input_text=input_text)',
              '        command = (sys.executable, *direct_cli_args)',
              '    elif frozen_launcher:',
              '        return _emit_failure(harness=harness, input_text=input_text)',
              '    else:',
              '        command = isolated_guard_cli_command(',
              '            python_executable,',
              '            package_root,',
              '            cli_args,',
              '        )',
          )
          text = text[:dispatch_start] + new_dispatch + text[dispatch_end:]
          bridge_path.write_text(text, encoding='utf-8')

          tests_path = Path('tests/test_bounded_cli_hook_bridge.py')
          tests = tests_path.read_text(encoding='utf-8')
          marker = '    config["frozen_launcher"] = True\n'
          expected_occurrences = 3
          if tests.count(marker) != expected_occurrences:
              raise SystemExit(f'expected {expected_occurrences} frozen test markers, found {tests.count(marker)}')
          tests = tests.replace(
              marker,
              marker + '    monkeypatch.setattr(bounded_cli_hook_bridge.sys, "frozen", True, raising=False)\n',
          )

          insertion_start = tests.index('def test_frozen_fallback_rejects_forged_executable_and_arguments(')
          insertion_at = tests.index('\n\n@pytest.mark.parametrize("harness", ["hermes", "openclaw"])', insertion_start)
          added_tests = '''


def test_live_frozen_runtime_ignores_forged_config_mode_and_executable(
    monkeypatch: pytest.MonkeyPatch,
    tmp_path: Path,
) -> None:
    observed: list[str] = []

    def run(command: Sequence[str], **kwargs: object) -> BoundedHookProcessResult:
        del kwargs
        observed.extend(command)
        return BoundedHookProcessResult(0, '{"decision":"allow"}\\n', False, False)

    config = _config(tmp_path, harness="grok")
    config["python_executable"] = "/bin/sh"
    config["frozen_launcher"] = False
    monkeypatch.setattr(bounded_cli_hook_bridge.sys, "frozen", True, raising=False)
    monkeypatch.setattr(bounded_cli_hook_bridge.sys, "executable", "/app/hol-guard")
    monkeypatch.setattr(bounded_cli_hook_bridge, "_try_daemon_hook", lambda **kwargs: None)
    monkeypatch.setattr(bounded_cli_hook_bridge, "run_isolated_hook_process", run)

    assert bounded_cli_hook_bridge.run_bounded_cli_hook(config, input_text="{}") == 0
    assert observed == [
        "/app/hol-guard",
        "hook",
        "--guard-home",
        str((tmp_path / "guard-home").resolve()),
        "--harness",
        "grok",
    ]


def test_non_frozen_runtime_rejects_forged_frozen_config(
    monkeypatch: pytest.MonkeyPatch,
    tmp_path: Path,
) -> None:
    config = _config(tmp_path, harness="grok")
    config["frozen_launcher"] = True
    monkeypatch.delattr(bounded_cli_hook_bridge.sys, "frozen", raising=False)
    monkeypatch.setattr(bounded_cli_hook_bridge, "_try_daemon_hook", lambda **kwargs: None)

    def forbidden_runner(*args: object, **kwargs: object) -> BoundedHookProcessResult:
        del args, kwargs
        raise AssertionError("config must not force frozen dispatch")

    monkeypatch.setattr(bounded_cli_hook_bridge, "run_isolated_hook_process", forbidden_runner)
    output = io.StringIO()
    with redirect_stdout(output):
        returncode = bounded_cli_hook_bridge.run_bounded_cli_hook(config, input_text="{}")

    assert returncode == 0
    assert _json_object(output.getvalue())["decision"] == "deny"


def test_frozen_fallback_accepts_equivalent_noncanonical_guard_home(
    monkeypatch: pytest.MonkeyPatch,
    tmp_path: Path,
) -> None:
    observed: list[str] = []

    def run(command: Sequence[str], **kwargs: object) -> BoundedHookProcessResult:
        del kwargs
        observed.extend(command)
        return BoundedHookProcessResult(0, '{"decision":"allow"}\\n', False, False)

    config = _config(tmp_path, harness="grok")
    cli_args = cast(list[str], config["cli_args"])
    cli_args[3] = str(tmp_path / "unused" / ".." / "guard-home")
    config["frozen_launcher"] = True
    monkeypatch.setattr(bounded_cli_hook_bridge.sys, "frozen", True, raising=False)
    monkeypatch.setattr(bounded_cli_hook_bridge.sys, "executable", "/app/hol-guard")
    monkeypatch.setattr(bounded_cli_hook_bridge, "_try_daemon_hook", lambda **kwargs: None)
    monkeypatch.setattr(bounded_cli_hook_bridge, "run_isolated_hook_process", run)

    assert bounded_cli_hook_bridge.run_bounded_cli_hook(config, input_text="{}") == 0
    assert observed == [
        "/app/hol-guard",
        "hook",
        "--guard-home",
        str((tmp_path / "guard-home").resolve()),
        "--harness",
        "grok",
    ]
'''
          tests_path.write_text(tests[:insertion_at] + added_tests + tests[insertion_at:], encoding='utf-8')
          PY

      - name: Format and run focused security contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync ruff format src/codex_plugin_scanner/guard/adapters/bounded_cli_hook_bridge.py tests/test_bounded_cli_hook_bridge.py
          uv run --no-sync ruff check src/codex_plugin_scanner/guard/adapters/bounded_cli_hook_bridge.py tests/test_bounded_cli_hook_bridge.py
          uv run --no-sync pytest -q tests/test_bounded_cli_hook_bridge.py tests/test_cli.py tests/test_cli_only_hook_resilience.py tests/test_guard_copilot_adapter.py tests/test_hermes_adapter.py tests/test_openclaw_adapter.py --tb=short
          uv run --no-sync basedpyright --level error src/codex_plugin_scanner/guard/adapters/bounded_cli_hook_bridge.py tests/test_bounded_cli_hook_bridge.py

      - name: Advance the exact test-suite ratchet
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/ci/test_inventory.py --output test-inventory.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          full = json.loads(Path('test-inventory.json').read_text(encoding='utf-8'))
          inventory = full['inventory']
          baseline = {
              'maximum_collected_cases': inventory['collected_cases'],
              'maximum_test_source_lines': full['test_source_lines'],
              'schema_version': 1,
          }
          Path('ci/test-suite-ratchet-baseline.json').write_text(
              json.dumps(baseline, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py --baseline ci/test-suite-ratchet-baseline.json --inventory test-inventory.json

      - name: Commit reviewed fixes and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm .github/workflows/temporary-secure-frozen-hook-review.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/codex_plugin_scanner/guard/adapters/bounded_cli_hook_bridge.py tests/test_bounded_cli_hook_bridge.py ci/test-suite-ratchet-baseline.json
          git commit -m "fix(hooks): bind frozen fallback to the live runtime"
          git push origin HEAD:fix/release-30-frozen-cli-hook-bridge-isolated
