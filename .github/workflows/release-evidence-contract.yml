name: Release evidence contract

on:
  pull_request:
    branches: [main, release/3.2]
    paths:
      - ".github/workflows/release-evidence-contract.yml"
      - "scripts/ci/final_release_evidence.py"
      - "scripts/ci/validate_release_artifacts.py"
      - "scripts/ci/verify_installed_release_matrix.py"
      - "scripts/release/verify_desktop_core_attestation.py"
      - "tests/test_final_release_evidence.py"
      - "tests/test_validate_release_artifacts.py"
      - "tests/test_verify_desktop_core_attestation.py"
      - "tests/test_verify_installed_release_matrix.py"
      - "docs/guard/release-3-0-final-evidence.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-evidence-contract.yml"
      - "scripts/ci/final_release_evidence.py"
      - "scripts/ci/validate_release_artifacts.py"
      - "scripts/ci/verify_installed_release_matrix.py"
      - "scripts/release/verify_desktop_core_attestation.py"
      - "tests/test_final_release_evidence.py"
      - "tests/test_validate_release_artifacts.py"
      - "tests/test_verify_desktop_core_attestation.py"
      - "tests/test_verify_installed_release_matrix.py"
      - "docs/guard/release-3-0-final-evidence.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Check release evidence formatting
        run: >-
          uv run --no-sync python -m ruff format --check
          scripts/ci/final_release_evidence.py
          scripts/ci/validate_release_artifacts.py
          scripts/ci/verify_installed_release_matrix.py
          scripts/release/verify_desktop_core_attestation.py
          tests/test_final_release_evidence.py
          tests/test_validate_release_artifacts.py
          tests/test_verify_desktop_core_attestation.py
          tests/test_verify_installed_release_matrix.py
      - name: Check release evidence lint
        run: >-
          uv run --no-sync python -m ruff check
          scripts/ci/final_release_evidence.py
          scripts/ci/validate_release_artifacts.py
          scripts/ci/verify_installed_release_matrix.py
          scripts/release/verify_desktop_core_attestation.py
          tests/test_final_release_evidence.py
          tests/test_validate_release_artifacts.py
          tests/test_verify_desktop_core_attestation.py
          tests/test_verify_installed_release_matrix.py
      - name: Run release evidence contracts
        run: >-
          uv run --no-sync pytest -q
          tests/test_final_release_evidence.py
          tests/test_validate_release_artifacts.py
          tests/test_verify_desktop_core_attestation.py
          tests/test_verify_installed_release_matrix.py
          --tb=short
