name: Protection Center Batch 6 review rebuild
on:
  push:
    branches: [feat/protection-center-06-cloud-boundary-hardening]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Verify review fixes and rebuild packaged dashboard
        shell: bash
        run: |
          set -euo pipefail
          cd dashboard
          bun install --frozen-lockfile --ignore-scripts
          bun run test
          bun run build
          cd ..
          git diff --check
      - name: Commit verified packaged assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/protection-center-batch6-review-rebuild.yml
          git add src/codex_plugin_scanner/guard/daemon/static .github/workflows/protection-center-batch6-review-rebuild.yml
          git diff --cached --check
          git commit -m "chore(protection-center): rebuild reviewed dashboard assets"
          git push origin HEAD:feat/protection-center-06-cloud-boundary-hardening
