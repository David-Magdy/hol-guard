name: Sync Desktop contract branch with main

on:
  push:
    branches:
      - desktop/3.0-contracts
    paths:
      - .github/workflows/sync-desktop-contracts-main.yml

permissions:
  contents: write

concurrency:
  group: sync-desktop-contracts-main
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out trusted Desktop branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: desktop/3.0-contracts
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge current main and resolve reviewed generated files
        run: |
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            allowed="$(printf '%s\n' \
              ci/test-suite-ratchet-baseline.json \
              src/codex_plugin_scanner/guard/cli/commands_router.py \
              tests/fixtures/guard-command-corpus/decision-diff-report.json | sort)"
            if [ "$conflicts" != "$allowed" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi

            git checkout --theirs ci/test-suite-ratchet-baseline.json
            git checkout --theirs tests/fixtures/guard-command-corpus/decision-diff-report.json
            git checkout --theirs src/codex_plugin_scanner/guard/cli/commands_router.py
            python - <<'PY'
          from pathlib import Path

          path = Path("src/codex_plugin_scanner/guard/cli/commands_router.py")
          source = path.read_text(encoding="utf-8")
          needle = '    "bootstrap": "_run_guard_bootstrap_command",\n'
          replacement = needle + '    "desktop": "_run_guard_desktop_command",\n'
          if '    "desktop": "_run_guard_desktop_command",\n' not in source:
              if source.count(needle) != 1:
                  raise RuntimeError("could not place Desktop command beside bootstrap")
              source = source.replace(needle, replacement, 1)
          path.write_text(source, encoding="utf-8")
          PY
            git add \
              ci/test-suite-ratchet-baseline.json \
              src/codex_plugin_scanner/guard/cli/commands_router.py \
              tests/fixtures/guard-command-corpus/decision-diff-report.json
          fi

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Regenerate source-bound evidence and reviewed test ratchet
        run: |
          uv run --no-sync python tests/guard_command_decision_diff.py --write
          uv run --no-sync python scripts/ci/test_inventory.py --output test-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path

          inventory_payload = json.loads(Path("test-inventory.json").read_text(encoding="utf-8"))
          baseline_path = Path("ci/test-suite-ratchet-baseline.json")
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          baseline["maximum_collected_cases"] = inventory_payload["inventory"]["collected_cases"]
          baseline["maximum_test_source_lines"] = inventory_payload["test_source_lines"]
          baseline_path.write_text(json.dumps(baseline, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          git add \
            tests/fixtures/guard-command-corpus/decision-diff-report.json \
            ci/test-suite-ratchet-baseline.json

      - name: Validate combined Core tree
        run: |
          uv run --no-sync python -m ruff format --check \
            src/codex_plugin_scanner/guard/cli/commands_dispatch_desktop.py \
            src/codex_plugin_scanner/guard/cli/commands_parser_desktop.py \
            src/codex_plugin_scanner/guard/cli/commands_parser.py \
            src/codex_plugin_scanner/guard/cli/commands_router.py \
            src/codex_plugin_scanner/guard/store_approvals.py \
            src/codex_plugin_scanner/guard/store_approval_facade.py \
            src/codex_plugin_scanner/guard/store_receipts.py \
            tests/test_guard_desktop_contract.py
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/cli/commands_dispatch_desktop.py \
            src/codex_plugin_scanner/guard/cli/commands_parser_desktop.py \
            src/codex_plugin_scanner/guard/cli/commands_parser.py \
            src/codex_plugin_scanner/guard/cli/commands_router.py \
            src/codex_plugin_scanner/guard/store_approvals.py \
            src/codex_plugin_scanner/guard/store_approval_facade.py \
            src/codex_plugin_scanner/guard/store_receipts.py \
            tests/test_guard_desktop_contract.py
          uv run --no-sync pytest \
            tests/test_guard_desktop_contract.py \
            tests/test_guard_network_cli.py \
            tests/test_guard_approval_store_scale.py \
            tests/test_guard_receipt_persistence.py \
            --tb=short
          uv run --no-sync python tests/guard_command_decision_diff.py --check
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory test-inventory.json

      - name: Smoke test Desktop and network routing
        run: |
          export HOL_GUARD_HOME="$RUNNER_TEMP/guard-home"
          mkdir -p "$HOL_GUARD_HOME"
          uv run --no-sync hol-guard desktop bootstrap --json > "$RUNNER_TEMP/desktop-bootstrap.json"
          uv run --no-sync hol-guard network status --json > "$RUNNER_TEMP/network-status.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          desktop = json.loads((root / "desktop-bootstrap.json").read_text(encoding="utf-8"))
          assert desktop["schema"] == "guard-desktop-bootstrap.v1"
          json.loads((root / "network-status.json").read_text(encoding="utf-8"))
          PY

      - name: Commit and push synchronized branch
        run: |
          rm -f test-inventory.json
          git add -A
          git commit -m "merge: synchronize Desktop contract with main"
          git push origin HEAD:desktop/3.0-contracts
