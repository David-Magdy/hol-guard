name: Repair native supervision Rust fixtures

on:
  push:
    branches: [feat/rust-runtime-supervision-final]
    paths:
      - ".github/workflows/fix-supervision-fixtures.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: feat/rust-runtime-supervision-final
      - name: Repair optional identity fixture fields
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("rust/crates/guard-hook-core/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          old = '''            protocol_version: 1,\n            request_id: Some("test".into()),\n            harness: "claude-code".into(),\n'''
          new = '''            protocol_version: 1,\n            request_id: Some("test".into()),\n            operation: None,\n            payload_size_bytes: None,\n            runtime_identity: None,\n            policy_snapshot: None,\n            harness: "claude-code".into(),\n'''
          if text.count(old) != 1:
              raise RuntimeError("NativeHookRequestV1 fixture anchor changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Refresh and verify Rust dependency graph
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
          cargo check --manifest-path rust/Cargo.toml --workspace --all-targets
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          git diff --check
      - name: Commit fixture repair
        shell: bash
        run: |
          set -euo pipefail
          branch=feat/rust-runtime-supervision-final
          remote_sha=$(git ls-remote --exit-code origin "refs/heads/${branch}" | awk '{print $1}')
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "Branch moved while fixture repair ran" >&2
            exit 1
          fi
          rm -f .github/workflows/fix-supervision-fixtures.yml
          git add -A
          git diff --cached --check
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git commit --signoff -m "fix(rust): reconcile native identity fixtures"
          git push origin "HEAD:refs/heads/${branch}"
