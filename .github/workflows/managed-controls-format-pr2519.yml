name: Managed Controls format repair

on:
  push:
    branches:
      - managed-controls/batch-13-local-parser-shared-posture

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false
      - name: Format Managed Controls parser
        run: |
          uvx --from ruff==0.15.17 ruff format \
            src/codex_plugin_scanner/guard/managed_controls_policy_fields.py \
            src/codex_plugin_scanner/guard/managed_controls_policy_fields_core.py
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/codex_plugin_scanner/guard/managed_controls_policy_fields.py \
            src/codex_plugin_scanner/guard/managed_controls_policy_fields_core.py
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git commit -m "style: format Managed Controls parser"
          git push origin HEAD:managed-controls/batch-13-local-parser-shared-posture
