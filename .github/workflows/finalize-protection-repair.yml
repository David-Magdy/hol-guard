name: Finalize protection repair fix

on:
  push:
    branches:
      - fix/extension-control-authority-stability

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/extension-control-authority-stability
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: true

      - name: Merge current release branch
        run: |
          git config user.name "HOL Guard investigation"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git fetch origin release/3.0 fix/extension-control-authority-stability --no-tags
          if ! git merge-base --is-ancestor origin/release/3.0 HEAD; then
            git merge --no-edit origin/release/3.0
          fi

      - name: Enforce missing-key fail-closed invariant
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import re
          from pathlib import Path

          source_root = Path('src/codex_plugin_scanner/guard')
          store_file = next(
              (path for path in source_root.rglob('*.py') if 'class EncryptedFileSecretStore' in path.read_text(encoding='utf-8')),
              None,
          )
          if store_file is None:
              raise SystemExit('EncryptedFileSecretStore class not found')
          text = store_file.read_text(encoding='utf-8')
          message = 'encrypted Guard secret key is missing'
          if message not in text:
              pattern = re.compile(
                  r'(?P<indent>^[ \t]*)if not self\.key_path\.exists\(\):\n'
                  r'(?P<body_indent>[ \t]+)(?P<write>self\._atomic_write_bytes\(self\.key_path, Fernet\.generate_key\(\), 0o600\))',
                  re.MULTILINE,
              )
              match = pattern.search(text)
              if match is None:
                  raise SystemExit(f'fresh key creation block not found in {store_file}')
              replacement = (
                  f"{match.group('indent')}if not self.key_path.exists():\n"
                  f"{match.group('body_indent')}if any(path.is_file() for path in self.base_dir.glob('*.enc')):\n"
                  f"{match.group('body_indent')}    raise RuntimeError('{message}')\n"
                  f"{match.group('body_indent')}{match.group('write')}"
              )
              text = text[:match.start()] + replacement + text[match.end():]
              store_file.write_text(text, encoding='utf-8')
          ast.parse(store_file.read_text(encoding='utf-8'), filename=str(store_file))
          Path('/tmp/encrypted-store-path').write_text(str(store_file), encoding='utf-8')

          test_path = Path('tests/test_guard_encrypted_secret_store_missing_key.py')
          test_path.write_text('''from __future__ import annotations

from pathlib import Path

import pytest

from codex_plugin_scanner.guard.store_base import EncryptedFileSecretStore


def test_missing_vault_key_with_existing_ciphertext_fails_closed(tmp_path: Path) -> None:
    enrolled = EncryptedFileSecretStore(tmp_path)
    enrolled.set_secret("authority", "trusted material")
    encrypted_path = enrolled._path_for("authority")
    ciphertext = encrypted_path.read_bytes()
    enrolled.key_path.unlink()

    restarted = EncryptedFileSecretStore(tmp_path)
    with pytest.raises(RuntimeError, match="key is missing"):
        restarted.get_secret("authority")

    assert not enrolled.key_path.exists()
    assert encrypted_path.read_bytes() == ciphertext


def test_empty_vault_without_ciphertext_still_initializes_normally(tmp_path: Path) -> None:
    store = EncryptedFileSecretStore(tmp_path)
    store.set_secret("authority", "trusted material")
    assert store.get_secret("authority") == "trusted material"
    assert store.key_path.exists()
''', encoding='utf-8')
          PY

      - name: Install exact locked environment
        run: uv sync --frozen --extra dev --python 3.12

      - name: Format and lint touched implementation
        shell: bash
        run: |
          STORE_FILE="$(cat /tmp/encrypted-store-path)"
          uv run --no-sync ruff format "$STORE_FILE" tests/test_guard_encrypted_secret_store_missing_key.py
          uv run --no-sync ruff check --fix "$STORE_FILE" tests/test_guard_encrypted_secret_store_missing_key.py

      - name: Run authority and vault regressions
        run: |
          uv run --no-sync pytest \
            tests/test_guard_encrypted_secret_store_missing_key.py \
            tests/test_guard_encrypted_secret_store_stability.py \
            tests/test_guard_extension_control_authority.py \
            --tb=short -q

      - name: Refresh monotonic test inventory limit
        shell: bash
        run: |
          uv run --no-sync python scripts/ci/test_inventory.py --output /tmp/test-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path
          inventory = json.loads(Path('/tmp/test-inventory.json').read_text())
          path = Path('ci/test-suite-ratchet-baseline.json')
          baseline = json.loads(path.read_text())
          baseline['maximum_collected_cases'] = max(
              int(baseline['maximum_collected_cases']),
              int(inventory['inventory']['collected_cases']),
          )
          baseline['maximum_test_source_lines'] = max(
              int(baseline['maximum_test_source_lines']),
              int(inventory['test_source_lines']),
          )
          path.write_text(json.dumps(baseline, indent=2, sort_keys=True) + '\n')
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory /tmp/test-inventory.json

      - name: Enforce structural, type, and formatting gates
        shell: bash
        run: |
          STORE_FILE="$(cat /tmp/encrypted-store-path)"
          uv run --no-sync python scripts/ci/code_quality_audit.py \
            --root . \
            --baseline ci/code-quality-baseline.json \
            --json-output /tmp/code-quality.json
          uv run --no-sync ruff check "$STORE_FILE" tests/test_guard_encrypted_secret_store_missing_key.py
          uv run --no-sync ruff format --check "$STORE_FILE" tests/test_guard_encrypted_secret_store_missing_key.py
          uv run --no-sync basedpyright --level error

      - name: Run HOL Guard locally
        shell: bash
        run: |
          uv run --no-sync python -m codex_plugin_scanner.cli --version
          export HOL_GUARD_HOME="$(mktemp -d)"
          timeout 45s uv run --no-sync hol-guard guard status

      - name: Commit validated result and remove finalizer
        shell: bash
        run: |
          git rm .github/workflows/finalize-protection-repair.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -s -m "fix(guard): complete authority vault fail-closed handling"
          git push origin HEAD:fix/extension-control-authority-stability
