name: Temporary PR dashboard regeneration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/protection-repair-dashboard-regressions
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Format touched Python source
        run: |
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync ruff check --fix src/codex_plugin_scanner/guard/store_policy_integrity_backend.py
          uv run --no-sync ruff format src/codex_plugin_scanner/guard/store_policy_integrity_backend.py
      - name: Build checked-in dashboard assets
        run: |
          cd dashboard
          bun install --frozen-lockfile
          bun run build
      - name: Commit generated output
        run: |
          if git diff --quiet -- src/codex_plugin_scanner/guard/store_policy_integrity_backend.py src/codex_plugin_scanner/guard/daemon/static; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/codex_plugin_scanner/guard/store_policy_integrity_backend.py src/codex_plugin_scanner/guard/daemon/static
          git commit -m 'build(dashboard): refresh generated assets'
          git push origin HEAD:fix/protection-repair-dashboard-regressions
