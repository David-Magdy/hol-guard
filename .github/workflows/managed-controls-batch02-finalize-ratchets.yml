name: Finalize Managed Controls ratchets

on:
  pull_request:
    branches:
      - release/3.0
    paths:
      - .github/workflows/managed-controls-batch02-finalize-ratchets.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: managed-controls-batch02-finalize-ratchets
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'managed-controls/batch-02-actions-limits-clean'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: managed-controls/batch-02-actions-limits-clean
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Refresh source-bound decision evidence
        run: |
          uv run --no-sync python tests/guard_command_decision_diff.py --write
          uv run --no-sync python tests/guard_command_decision_diff.py --check

      - name: Refresh structural code-quality baseline
        run: |
          uv run --no-sync python scripts/ci/code_quality_audit.py \
            --root . \
            --baseline ci/code-quality-baseline.json \
            --write-baseline \
            --json-output code-quality-audit.json
          uv run --no-sync python scripts/ci/code_quality_audit.py \
            --root . \
            --baseline ci/code-quality-baseline.json \
            --json-output code-quality-audit-verified.json

      - name: Validate focused Managed Controls coverage
        run: |
          uv run --no-sync pytest \
            tests/test_managed_controls_limits.py \
            tests/test_guard_extension_control_api.py \
            tests/test_guard_extension_control_catalog_detail.py \
            tests/test_guard_extension_control_catalog_wire.py \
            tests/test_guard_desktop_contract.py \
            --tb=short
          uv run --no-sync python scripts/ci/test_inventory.py --output test-inventory.json
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory test-inventory.json
          git diff --check

      - name: Commit and push refreshed evidence
        run: |
          rm -f .github/workflows/managed-controls-batch02-finalize-ratchets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: refresh Managed Controls release ratchets"
          git push origin HEAD:managed-controls/batch-02-actions-limits-clean
