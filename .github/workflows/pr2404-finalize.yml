name: Finalize PR 2404

on:
  push:
    branches:
      - fix/mdm-end-to-end-verification
    paths:
      - .github/workflows/pr2404-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-pr-2404
  cancel-in-progress: false

jobs:
  reconcile-validate-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/mdm-end-to-end-verification
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Reconcile the latest release/3.0 tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin release/3.0
          base_sha="$(git rev-parse origin/release/3.0)"
          echo "BASE_SHA=$base_sha" >> "$GITHUB_ENV"

          if git merge-base --is-ancestor "$base_sha" HEAD; then
            echo "release/3.0 is already an ancestor"
          else
            set +e
            git merge --no-commit --no-ff "$base_sha"
            merge_status=$?
            set -e

            if [ "$merge_status" -ne 0 ]; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
              printf 'Merge conflicts:\n'
              printf '  %s\n' "${conflicts[@]}"

              allowed=(
                ci/test-suite-ratchet-baseline.json
              )
              unexpected=()
              for conflict in "${conflicts[@]}"; do
                matched=false
                for candidate in "${allowed[@]}"; do
                  if [ "$conflict" = "$candidate" ]; then
                    matched=true
                    break
                  fi
                done
                if [ "$matched" != true ]; then
                  unexpected+=("$conflict")
                fi
              done

              if [ "${#unexpected[@]}" -ne 0 ]; then
                printf 'Unexpected merge conflicts require semantic review:\n'
                printf '  %s\n' "${unexpected[@]}"
                exit 1
              fi

              git checkout --theirs -- ci/test-suite-ratchet-baseline.json
              git add ci/test-suite-ratchet-baseline.json
            fi
          fi

          test -z "$(git diff --name-only --diff-filter=U)"
          git merge-base --is-ancestor "$base_sha" HEAD || test -f .git/MERGE_HEAD

      - name: Remove planning artifacts owned by this work
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            docs/guard/mdm-cloud-integration-lab-prd.md \
            docs/guard/mdm-cloud-integration-lab-todo.md \
            docs/guard/mdm-cloud-integration-lab-takeaway-prompt.md

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          save-cache: false

      - name: Install the locked development environment
        run: uv sync --frozen --extra dev --python 3.12

      - name: Generate ephemeral MDM lab authority
        shell: bash
        run: |
          set -euo pipefail
          token="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$token"
          echo "HOL_MDM_LAB_ADMIN_TOKEN=$token" >> "$GITHUB_ENV"
          echo "HOL_MDM_LAB_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOL_MDM_LAB_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Format and lint all MDM surfaces
        shell: bash
        run: |
          set -euo pipefail
          surfaces=(
            src/codex_plugin_scanner/guard/mdm/cloud_control.py
            scripts/mdm/cloud-lab
            scripts/mdm/run-cloud-integration-lab.py
            tests/test_guard_mdm_cloud_control.py
            tests/test_guard_mdm_cloud_hardening.py
            tests/test_guard_mdm_cloud_schemas.py
            tests/test_guard_mdm_cloud_lab_registration.py
            tests/test_guard_mdm_cloud_lab_integration.py
          )
          uv run --no-sync ruff check --fix "${surfaces[@]}"
          uv run --no-sync ruff format "${surfaces[@]}"
          uv run --no-sync ruff check "${surfaces[@]}"
          uv run --no-sync ruff format --check "${surfaces[@]}"
          uv run --no-sync ruff check src/
          uv run --no-sync ruff format --check src/

      - name: Run static typing
        run: uv run --no-sync basedpyright --level error

      - name: Enforce the structural code-quality ratchet
        run: |
          uv run --no-sync python scripts/ci/code_quality_audit.py \
            --root . \
            --baseline ci/code-quality-baseline.json \
            --json-output code-quality-audit.json

      - name: Run focused MDM contracts and restart integration tests
        run: |
          uv run --no-sync pytest -q \
            tests/test_guard_mdm_cloud_control.py \
            tests/test_guard_mdm_cloud_hardening.py \
            tests/test_guard_mdm_cloud_schemas.py \
            tests/test_guard_mdm_cloud_lab_registration.py \
            tests/test_guard_mdm_cloud_lab_integration.py

      - name: Recalculate and enforce the test-suite ratchet
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/ci/test_inventory.py --output test-inventory.json
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path("test-inventory.json").read_text(encoding="utf-8"))
          baseline = {
              "maximum_collected_cases": inventory["inventory"]["collected_cases"],
              "maximum_test_source_lines": inventory["test_source_lines"],
              "schema_version": 1,
          }
          Path("ci/test-suite-ratchet-baseline.json").write_text(
              json.dumps(baseline, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory test-inventory.json

      - name: Verify this PR does not add planning documents
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" | grep -Ei '(^|/)(prd|todo|takeaway[-_ ]?prompt)\.md$|[-_](prd|todo)\.md$|takeaway[-_ ]?prompt\.md$' || true)"
          if [ -n "$forbidden" ]; then
            printf 'Planning documents must not be versioned by this PR:\n%s\n' "$forbidden"
            exit 1
          fi

      - name: Validate the Compose model
        shell: bash
        run: |
          docker compose \
            --project-name "pr2404-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --file scripts/mdm/cloud-lab/docker-compose.yml \
            config --quiet

      - name: Run the four-device Cloud integration and restart lab
        shell: bash
        run: |
          mkdir -p artifacts/mdm-cloud-lab
          uv run --no-sync python scripts/mdm/run-cloud-integration-lab.py \
            --project "pr2404-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --artifacts artifacts/mdm-cloud-lab

      - name: Validate bounded evidence and checksum
        run: |
          uv run --no-sync python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          report_path = Path("artifacts/mdm-cloud-lab/mdm-cloud-integration-report.json")
          checksum_path = Path("artifacts/mdm-cloud-lab/mdm-cloud-integration-report.json.sha256")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          expected = checksum_path.read_text(encoding="utf-8").split()[0]
          assert hashlib.sha256(report_path.read_bytes()).hexdigest() == expected
          assert report["healthy"] is True
          assert report["stepCount"] >= 50
          assert report["nativeCertification"]["outcome"] == "not-evaluated"
          assert all(step["passed"] is True for step in report["steps"])
          PY

      - name: Scan the MDM lab for high-severity misconfiguration and secrets
        run: |
          docker run --rm -v "$PWD:/workdir" \
            aquasec/trivy@sha256:85e87be1a96459c38a4eea47dc64eb2d342bb14cd4b4cef96adcf6ff03378b7c \
            fs --scanners misconfig,secret --severity HIGH,CRITICAL \
            --exit-code 1 --quiet /workdir/scripts/mdm/cloud-lab

      - name: Commit and push the reconciled, validated branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr2404-finalize.yml
          rm -rf artifacts/mdm-cloud-lab code-quality-audit.json test-inventory.json
          git add -A
          git diff --cached --check
          test -z "$(git diff --name-only --diff-filter=U)"

          if git diff --cached --quiet && [ ! -f .git/MERGE_HEAD ]; then
            echo "No reconciliation commit is required"
          else
            git commit -s -m "merge: reconcile PR 2404 with release/3.0"
          fi

          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git push origin HEAD:fix/mdm-end-to-end-verification

      - name: Upload bounded diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr2404-finalization-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/mdm-cloud-lab
            code-quality-audit.json
            test-inventory.json
          if-no-files-found: warn
          retention-days: 14
