name: Apply alpha TestPyPI optional patch

on:
  pull_request:
    branches:
      - release/3.0

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/release-3.0-testpypi-optional' && (github.actor_id == 6068672 || github.actor_id == 301892678)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply exact release-train patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/publish.yml')
          text = workflow_path.read_text(encoding='utf-8')
          replacements = [
              (
                  "  publish-alpha-testpypi:\n    name: Verify alpha artifact on TestPyPI\n    if: >-\n      always() &&\n      vars.RELEASE_PUBLISHING_ENABLED == 'true' &&",
                  "  publish-alpha-testpypi:\n    name: Verify alpha artifact on TestPyPI\n    if: >-\n      always() &&\n      vars.RELEASE_PUBLISHING_ENABLED == 'true' &&\n      vars.ALPHA_TESTPYPI_ENABLED == 'true' &&",
              ),
              (
                  "      needs.reserve-alpha-tag.result == 'success' &&\n      needs.publish-alpha-testpypi.result == 'success' &&\n      needs.build.outputs.channel == 'alpha' &&",
                  "      needs.reserve-alpha-tag.result == 'success' &&\n      needs.build.outputs.channel == 'alpha' &&",
              ),
              (
                  "    needs: [build, reserve-alpha-tag, publish-alpha-testpypi]\n    runs-on: ubuntu-latest\n    environment: pypi",
                  "    needs: [build, reserve-alpha-tag]\n    runs-on: ubuntu-latest\n    environment: pypi",
              ),
              (
                  "      - name: Verify the TestPyPI-proven artifact\n        run: sha256sum --check distribution-sha256.txt",
                  "      - name: Verify immutable build artifact\n        run: sha256sum --check distribution-sha256.txt",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one workflow match for: {old!r}; found {text.count(old)}')
              text = text.replace(old, new)
          workflow_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_release_train_workflow.py')
          tests = test_path.read_text(encoding='utf-8')
          test_replacements = [
              (
                  '    assert jobs["publish-alpha-pypi"]["needs"] == ["build", "reserve-alpha-tag", "publish-alpha-testpypi"]\n',
                  '    assert jobs["publish-alpha-pypi"]["needs"] == ["build", "reserve-alpha-tag"]\n',
              ),
              (
                  '    assert "needs.publish-alpha-testpypi.result == \'success\'" in jobs["publish-alpha-pypi"]["if"]\n',
                  '    assert "needs.publish-alpha-testpypi.result == \'success\'" not in jobs["publish-alpha-pypi"]["if"]\n',
              ),
              (
                  '    assert "vars.ALPHA_TESTPYPI_ENABLED" not in jobs["publish-alpha-testpypi"]["if"]\n',
                  '    assert "vars.ALPHA_TESTPYPI_ENABLED == \'true\'" in jobs["publish-alpha-testpypi"]["if"]\n',
              ),
          ]
          for old, new in test_replacements:
              if tests.count(old) != 1:
                  raise SystemExit(f'expected exactly one test match for: {old!r}; found {tests.count(old)}')
              tests = tests.replace(old, new)
          test_path.write_text(tests, encoding='utf-8')
          PY
          git diff --check
          git diff -- .github/workflows/publish.yml tests/test_release_train_workflow.py
      - name: Commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/publish.yml tests/test_release_train_workflow.py; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/publish.yml tests/test_release_train_workflow.py
          git commit -m 'fix(release): make alpha TestPyPI staging optional'
          git push origin HEAD:${{ github.head_ref }}
