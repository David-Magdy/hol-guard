name: MDM evidence probe

on:
  pull_request:
    paths:
      - ".github/workflows/mdm-evidence-probe.yml"
      - "src/codex_plugin_scanner/guard/runtime/verified_github_reads.py"
      - "tests/test_guard_verified_reads.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-digests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Print source evidence digests
        run: |
          sha256sum src/codex_plugin_scanner/guard/runtime/verified_github_reads.py
          sha256sum tests/test_guard_verified_reads.py
