name: Temporary PR 2400 clean delivery

on:
  push:
    branches:
      - tmp/pr2400-deliver-clean-20260816
    paths:
      - .github/workflows/tmp-pr2400-deliver-clean.yml

permissions:
  contents: write

concurrency:
  group: pr2400-clean-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: tmp/pr2400-deliver-clean-20260816
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          save-cache: false
      - name: Reconstruct and apply the reviewed clean patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/pr2400-delivery/part-* | tr -d '\r\n\t ' > "$RUNNER_TEMP/pr2400.patch.gz.b64"
          base64 --decode "$RUNNER_TEMP/pr2400.patch.gz.b64" > "$RUNNER_TEMP/pr2400.patch.gz"
          test "$(sha256sum "$RUNNER_TEMP/pr2400.patch.gz" | awk '{print $1}')" = "f7d75f2c71dcfc1ae25ffd6bce48484b848d5ad48725b9894560394dd14109dd"
          gzip --decompress --stdout "$RUNNER_TEMP/pr2400.patch.gz" > "$RUNNER_TEMP/pr2400.patch"
          test "$(sha256sum "$RUNNER_TEMP/pr2400.patch" | awk '{print $1}')" = "58962afb5aa3b87b22ab2c9ff08d81aa692a860a791a09433ad5420460b08981"
          git reset --hard c7086ba0bfb10d6f1a5f98a3306c8560af4c0518
          git clean -fdx
          git apply --index --whitespace=error-all "$RUNNER_TEMP/pr2400.patch"

          rm -f .github/workflows/tmp-rust-required-latest-source.yml
          rm -rf .github/rust-required-gzip-b64 .github/rust-required-patch
          python - <<'PY'
          from pathlib import Path

          contracts = Path("tests/test_rust_daemon_edge_hardening_contracts.py")
          text = contracts.read_text(encoding="utf-8")
          old = '''def test_no_one_shot_delivery_or_auto_merge_workflows_remain() -> None:
              workflows = ROOT / ".github/workflows"
              assert not list(workflows.glob("tmp-*daemon-edge-hardening*.yml"))
              assert not (ROOT / "scripts/ci/apply_daemon_edge_hardening.py").exists()
              permanent = _source(".github/workflows/rust-daemon-edge-hardening.yml")
              assert "gh pr merge" not in permanent
              assert "/cancel" not in permanent
              assert "git push" not in permanent
          '''
          new = '''def test_no_one_shot_delivery_or_auto_merge_assets_remain() -> None:
              workflows = ROOT / ".github/workflows"
              assert not list(workflows.glob("tmp-*.yml"))
              assert not (ROOT / "scripts/ci/apply_daemon_edge_hardening.py").exists()
              assert not (ROOT / ".github/rust-required-gzip-b64").exists()
              assert not (ROOT / ".github/rust-required-patch").exists()
              permanent = _source(".github/workflows/rust-daemon-edge-hardening.yml")
              assert "gh pr merge" not in permanent
              assert "/cancel" not in permanent
              assert "git push" not in permanent
          '''
          if old not in text:
              raise RuntimeError("daemon hardening cleanup contract anchor changed")
          contracts.write_text(text.replace(old, new, 1), encoding="utf-8")

          todo = Path("docs/guard/rust-daemon-edge-hardening-todo.md")
          text = todo.read_text(encoding="utf-8")
          anchor = "- [x] Add a permanent read-only cross-platform workflow with no merge, cancellation, branch-deletion, or source-mutation powers.\n"
          addition = anchor + "- [x] Remove all one-shot workflows, embedded patch payloads, and temporary migration assets from the protected release tree.\n"
          if anchor not in text:
              raise RuntimeError("daemon hardening TODO cleanup anchor changed")
          todo.write_text(text.replace(anchor, addition, 1), encoding="utf-8")

          prd = Path("docs/guard/rust-daemon-edge-hardening-prd.md")
          text = prd.read_text(encoding="utf-8")
          old = "Completion requires a clean exact head with no temporary delivery workflows or patch applicators, no unresolved review threads, green required checks, merge into `release/3.0` only, successful post-merge workflows, and verification that the merge is absent from `main`."
          new = "Completion requires a clean exact head with no temporary delivery workflows, embedded patch payloads, or patch applicators, no unresolved review threads, green required checks, merge into `release/3.0` only, successful post-merge workflows, and verification that the merge is absent from `main`."
          if old not in text:
              raise RuntimeError("daemon hardening PRD cleanup anchor changed")
          prd.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          git add -A
          git diff --cached --check
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'tmp-*' -print)"
          test ! -e scripts/ci/apply_daemon_edge_hardening.py
          test ! -e .github/rust-required-gzip-b64
          test ! -e .github/rust-required-patch
      - name: Prepare exact toolchains
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
      - name: Validate changed Python and workflow contracts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t python_files < <(git diff --cached --name-only --diff-filter=AM -- '*.py' | sort)
          test "${#python_files[@]}" -gt 0
          uv run --no-sync ruff check "${python_files[@]}"
          uv run --no-sync ruff format --check "${python_files[@]}"
          uv run --no-sync basedpyright --level error \
            src/codex_plugin_scanner/guard/native_runtime_admission.py \
            src/codex_plugin_scanner/guard/daemon/http_admission.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in (
              Path('.github/workflows/native-wheel-ci.yml'),
              Path('.github/workflows/rust-daemon-edge-hardening.yml'),
          ):
              yaml.safe_load(path.read_text(encoding='utf-8'))
          PY
      - name: Run daemon and native edge regression suites
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync pytest -q \
            tests/test_native_runtime_admission.py \
            tests/test_daemon_http_admission.py \
            tests/test_daemon_health_details.py \
            tests/test_daemon_edge_native_wheel_workflow.py \
            tests/test_rust_daemon_edge_hardening_contracts.py \
            tests/test_guard_daemon_adversarial_transport.py \
            tests/test_guard_daemon_manager.py \
            tests/test_guard_daemon_diagnostics.py \
            tests/test_native_runtime_resident.py \
            tests/test_native_runtime_resilience.py \
            --tb=short
          uv run --no-sync python scripts/ci/test_inventory.py --output "$RUNNER_TEMP/test-inventory.json"
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory "$RUNNER_TEMP/test-inventory.json"
      - name: Validate locked Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all --check
          cargo clippy --manifest-path rust/Cargo.toml --locked --workspace --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --locked --workspace --all-targets
      - name: Publish one clean rebased commit to PR 2400
        shell: bash
        run: |
          set -euo pipefail
          expected_old_head="d8b50d6b446c934bb8f0b87f9493db9805a87ea4"
          current_old_head=$(git ls-remote --exit-code origin refs/heads/fix/rust-daemon-ux-hardening-definitive | awk '{print $1}')
          test "$current_old_head" = "$expected_old_head"
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git commit --signoff -m "feat(guard): harden native daemon edge behavior"
          git push --force-with-lease=refs/heads/fix/rust-daemon-ux-hardening-definitive:"$expected_old_head" \
            origin HEAD:refs/heads/fix/rust-daemon-ux-hardening-definitive
