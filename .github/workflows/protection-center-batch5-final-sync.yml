name: Protection Center Batch 5 final release sync
on:
  push:
    branches: [feat/protection-center-05-test-activity]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Merge current release and recompute test ratchet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin release/3.0
          set +e
          git merge --no-commit --no-ff origin/release/3.0
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "ci/test-suite-ratchet-baseline.json" ]; then
              echo "Unexpected merge conflicts:"; printf '%s\n' "$conflicts"; exit 1
            fi
            git checkout --ours ci/test-suite-ratchet-baseline.json
            git add ci/test-suite-ratchet-baseline.json
          fi
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync python scripts/ci/test_inventory.py --output test-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('test-inventory.json').read_text())
          inv = payload['inventory']
          Path('ci/test-suite-ratchet-baseline.json').write_text(json.dumps({
              'maximum_collected_cases': inv['collected_cases'],
              'maximum_test_source_lines': payload['test_source_lines'],
              'schema_version': 1,
          }, indent=2) + '\n')
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py --baseline ci/test-suite-ratchet-baseline.json --inventory test-inventory.json
          uv run --no-sync python -m ruff check src/
          uv run --no-sync python -m ruff format --check src/
          uv run --no-sync basedpyright --level error
          uv run --no-sync pytest -q tests/test_guard_safe_directory_creation.py tests/test_guard_extension_control_test_lab.py
          git add ci/test-suite-ratchet-baseline.json
          git commit --no-edit
          git merge-base --is-ancestor origin/release/3.0 HEAD
          git diff --check
      - name: Remove temporary workflow and push
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/protection-center-batch5-final-sync.yml
          git add .github/workflows/protection-center-batch5-final-sync.yml
          git commit -m "chore(protection-center): remove temporary final sync workflow"
          git push origin HEAD:feat/protection-center-05-test-activity
