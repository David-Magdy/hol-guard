name: Scanner hardening source snapshot

on:
  push:
    branches:
      - feat/scanner-assurance-rust-hardening-20260816
    paths:
      - .github/workflows/tmp-scanner-hardening-source-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Build exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > scanner-hardening-commit.txt
          git status --short > scanner-hardening-status.txt
          tar \
            --exclude=.git \
            --exclude=.venv \
            --exclude='**/__pycache__' \
            --exclude='*.pyc' \
            -czf scanner-hardening-source.tar.gz .
          tar -tzf scanner-hardening-source.tar.gz | sed -n '1,500p' > scanner-hardening-inventory.txt
      - name: Upload source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scanner-hardening-source
          path: |
            scanner-hardening-source.tar.gz
            scanner-hardening-commit.txt
            scanner-hardening-status.txt
            scanner-hardening-inventory.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
