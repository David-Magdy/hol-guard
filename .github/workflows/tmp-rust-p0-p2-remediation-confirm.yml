name: Temporary independently confirm Rust P0-P2 remediation

on:
  push:
    branches:
      - tmp/rust-p0-p2-remediation-confirm-20260815
    paths:
      - .github/workflows/tmp-rust-p0-p2-remediation-confirm.yml

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read
  statuses: read

env:
  CARGO_TERM_COLOR: always
  PYTHONUNBUFFERED: "1"
  HOL_GUARD_NATIVE_DEVELOPMENT: "1"
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  VERIFY_TAG: rust-p0-p2-remediation-verified-2026-08-15

jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: tmp/rust-p0-p2-remediation-confirm-20260815
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
      - name: Wait for the remediation pull request to merge
        id: merged
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 10800))
          number=""
          oid=""
          while (( SECONDS < deadline )); do
            row="$(gh pr list --repo "$REPO" --head fix/rust-p0-p2-regression-hardening --base release/3.0 --state all --limit 20 --json number,state,mergeCommit --jq '.[0] // {}')"
            number="$(jq -r '.number // ""' <<<"$row")"
            state="$(jq -r '.state // ""' <<<"$row")"
            oid="$(jq -r '.mergeCommit.oid // ""' <<<"$row")"
            if [[ "$state" == "MERGED" && -n "$oid" ]]; then break; fi
            sleep 30
          done
          test -n "$number"
          test -n "$oid"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "oid=$oid" >> "$GITHUB_OUTPUT"
      - name: Check out the exact merge commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin release/3.0:refs/remotes/origin/release/3.0 main:refs/remotes/origin/main
          git checkout --detach "${{ steps.merged.outputs.oid }}"
          git merge-base --is-ancestor "${{ steps.merged.outputs.oid }}" refs/remotes/origin/release/3.0
          if git merge-base --is-ancestor "${{ steps.merged.outputs.oid }}" refs/remotes/origin/main; then exit 1; fi
          test -f ci/rust_migration_regression_audit.py
          test -f ci/run_rust_migration_regression.py
          test -f docs/guard/rust-p0-p2-regression-remediation-prd.md
          test -f docs/guard/rust-p0-p2-regression-remediation-todo.md
          test -f docs/guard/rust-p0-p2-regression-remediation-takeaway-prompt.md
          test ! -e .github/workflows/tmp-apply-rust-required.yml
          test -z "$(find .github -maxdepth 2 -type f -path '*rust-required-*' -print -quit)"
      - name: Install locked environment
        run: uv sync --frozen --all-extras --dev
      - name: Re-run the complete remediation audit
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check ci/rust_migration_regression_audit.py ci/run_rust_migration_regression.py tests/test_rust_migration_regression_audit.py
          uv run ruff format --check ci/rust_migration_regression_audit.py ci/run_rust_migration_regression.py tests/test_rust_migration_regression_audit.py
          uv run python ci/rust_migration_regression_audit.py --json-output /tmp/audit.json
          uv run pytest -q tests/test_rust_migration_regression_audit.py
      - name: Re-run complete Rust and retained behavior gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo clippy --manifest-path rust/Cargo.toml --locked --workspace --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --locked --workspace --all-targets
          cargo build --manifest-path rust/Cargo.toml --locked --release --bin hol-guard-runtime
          export HOL_GUARD_NATIVE_BINARY="$GITHUB_WORKSPACE/rust/target/release/hol-guard-runtime"
          uv run python ci/run_rust_migration_regression.py --mode pr --manifest /tmp/regression.json
      - name: Require every post-merge check to be green
        shell: bash
        run: |
          set -euo pipefail
          oid="${{ steps.merged.outputs.oid }}"
          deadline=$((SECONDS + 10800))
          while (( SECONDS < deadline )); do
            response="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$REPO/commits/$oid/check-runs?per_page=100")"
            checks="$(jq '[.check_runs[] | {name,status,conclusion}]' <<<"$response")"
            count="$(jq 'length' <<<"$checks")"
            incomplete="$(jq '[.[] | select(.status != "completed")] | length' <<<"$checks")"
            failed="$(jq '[.[] | select(.status == "completed" and (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped"))] | length' <<<"$checks")"
            combined="$(gh api "/repos/$REPO/commits/$oid/status")"
            state="$(jq -r .state <<<"$combined")"
            status_count="$(jq '.statuses | length' <<<"$combined")"
            if (( failed > 0 )) || [[ "$state" == "failure" || "$state" == "error" ]]; then jq . <<<"$checks"; exit 1; fi
            if (( count >= 3 && incomplete == 0 )) && { (( status_count == 0 )) || [[ "$state" == "success" ]]; }; then break; fi
            sleep 30
          done
          (( SECONDS < deadline ))
      - name: Create immutable verification tag and evidence
        shell: bash
        run: |
          set -euo pipefail
          oid="${{ steps.merged.outputs.oid }}"
          git tag -f -a "$VERIFY_TAG" "$oid" -m "Verified Rust P0-P2 remediation at $oid"
          git push --force origin "refs/tags/$VERIFY_TAG"
          cat > /tmp/completion.json <<JSON
          {"schema_version":1,"verified":true,"pull_request":${{ steps.merged.outputs.number }},"merge_commit":"$oid","verification_tag":"$VERIFY_TAG","target_branch":"release/3.0","present_in_main":false,"post_merge_checks_green":true,"independent_revalidation_green":true}
          JSON
          cat /tmp/completion.json
          {
            echo "## Rust P0-P2 remediation independently verified"
            echo "- Pull request: #${{ steps.merged.outputs.number }}"
            echo "- Merge commit: \`$oid\`"
            echo "- Verification tag: \`$VERIFY_TAG\`"
            echo "- Post-merge and independent checks: green"
            echo "- Present in \`main\`: no"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-p0-p2-independent-verification-${{ steps.merged.outputs.oid }}
          path: |
            /tmp/completion.json
            /tmp/audit.json
            /tmp/regression.json
          if-no-files-found: error
          retention-days: 14
      - name: Delete temporary verifier branches
        if: always() && steps.merged.outputs.oid != ''
        shell: bash
        run: |
          set -euo pipefail
          for branch in tmp/rust-p0-p2-remediation-verifier-20260815 tmp/rust-p0-p2-remediation-verifier-v2-20260815 tmp/rust-p0-p2-remediation-confirm-20260815; do
            encoded="${branch//\//%2F}"
            if gh api "/repos/$REPO/git/ref/heads/$encoded" >/dev/null 2>&1; then gh api --method DELETE "/repos/$REPO/git/refs/heads/$encoded"; fi
          done
