name: Managed Controls PR 2519 finalizer

on:
  push:
    branches:
      - managed-controls/batch-13-local-parser-shared-posture
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: managed-controls-pr2519-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Validate deterministic quality gates
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m ruff check src/
          uv run --no-sync python -m ruff format --check src/
          uv run --no-sync basedpyright --level error
          mapfile -t tests < <(git grep -l 'managed_controls' -- tests | grep '\.py$' || true)
          if ((${#tests[@]})); then
            uv run --no-sync pytest "${tests[@]}" --tb=short
          fi
      - name: Remove temporary repair machinery and retrigger protected checks
        shell: bash
        run: |
          set -euo pipefail
          branch='managed-controls/batch-13-local-parser-shared-posture'
          rm -f \
            .github/workflows/managed-controls-typecheck-pr2519.yml \
            .github/workflows/managed-controls-format-pr2519.yml \
            .github/workflows/managed-controls-repair-pr2519.yml \
            .github/workflows/managed-controls-finalize-pr2519.yml \
            .typecheck-errors.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            git commit --allow-empty -m 'ci: rerun Managed Controls protected checks'
          else
            git commit -m 'chore(ci): finalize Managed Controls parser repair'
          fi
          git push origin "HEAD:$branch"
