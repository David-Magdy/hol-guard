name: Protection Center Batch 2 final sync
on:
  push:
    branches: [feat/protection-center-02-landing]
permissions:
  contents: write
concurrency:
  group: protection-center-batch2-final-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Verify dashboard source and deterministic static bundle
        shell: bash
        run: |
          set -euo pipefail
          cd dashboard
          bun install --frozen-lockfile --ignore-scripts
          bun run test
          bun run build
      - name: Commit verified bundle and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm .github/workflows/protection-center-batch2-final-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/codex_plugin_scanner/guard/daemon/static .github/workflows/protection-center-batch2-final-sync.yml
          git diff --cached --check
          git commit -m "build(protection-center): package final novice landing"
          git push origin HEAD:feat/protection-center-02-landing
