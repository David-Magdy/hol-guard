name: Managed Controls source snapshot

on:
  push:
    branches:
      - managed-controls/batch-02-actions-limits-clean
    paths:
      - .github/workflows/managed-controls-source-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create source archive
        run: |
          tar \
            --exclude=.git \
            --exclude=.venv \
            --exclude=node_modules \
            --exclude=dashboard/node_modules \
            --exclude=dist \
            --exclude=build \
            -czf hol-guard-managed-controls-source.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hol-guard-managed-controls-source
          path: hol-guard-managed-controls-source.tar.gz
          if-no-files-found: error
          retention-days: 1
