name: Guard Cloud source runtime

on:
  pull_request:
    branches:
      - release/3.0
    paths:
      - .github/workflows/points-portal-source-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'managed-controls/batch-02-actions-limits-clean'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact Guard Cloud release head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: hashgraph-online/points-portal
          ref: f6b31c4c377a19bbe9e5f6bcb20640456441afaa
          fetch-depth: 1
          persist-credentials: false
          path: points-portal
      - name: Build exact source archive
        run: |
          cd points-portal
          git archive --format=tar.gz --output=../points-portal-source.tgz HEAD
          git rev-parse HEAD > ../points-portal-source-sha.txt
      - name: Upload exact source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: points-portal-source-runtime
          path: |
            points-portal-source.tgz
            points-portal-source-sha.txt
          if-no-files-found: error
          retention-days: 1
