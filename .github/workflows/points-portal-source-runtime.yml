name: Guard Cloud source runtime

on:
  pull_request:
    branches:
      - release/3.0
    paths:
      - .github/workflows/points-portal-source-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'managed-controls/batch-02-actions-limits-clean'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Guard Cloud release branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: hashgraph-online/points-portal
          ref: release/3.0
          fetch-depth: 1
          persist-credentials: false
          path: points-portal
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        working-directory: points-portal
        run: bun install --frozen-lockfile
      - name: Build source and runtime archives
        run: |
          cd points-portal
          git archive --format=tar.gz --output=../points-portal-source.tgz HEAD
          git rev-parse HEAD > ../points-portal-source-sha.txt
          cp "$(command -v bun)" ../bun-linux-x64
          chmod +x ../bun-linux-x64
          tar -cf - node_modules | zstd -T0 -3 -o ../points-portal-node-modules.tar.zst
      - name: Upload source and Bun
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: points-portal-source-runtime
          path: |
            points-portal-source.tgz
            points-portal-source-sha.txt
            bun-linux-x64
          if-no-files-found: error
          retention-days: 1
      - name: Upload dependencies
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: points-portal-node-modules
          path: points-portal-node-modules.tar.zst
          if-no-files-found: error
          retention-days: 1
