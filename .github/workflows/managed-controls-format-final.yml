name: Format final Managed Controls source

on:
  pull_request:
    branches:
      - release/3.0
    paths:
      - .github/workflows/managed-controls-format-final.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: managed-controls-format-final
  cancel-in-progress: false

jobs:
  format:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'managed-controls/batch-02-actions-limits-clean'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: managed-controls/batch-02-actions-limits-clean
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --extra dev --python 3.12
      - name: Format and verify
        run: |
          uv run --no-sync ruff format src/codex_plugin_scanner/guard/daemon/extension_control_api.py
          uv run --no-sync ruff check src/codex_plugin_scanner/guard/daemon/extension_control_api.py
          uv run --no-sync ruff format --check src/codex_plugin_scanner/guard/daemon/extension_control_api.py
          uv run --no-sync pytest tests/test_guard_extension_control_catalog_wire.py tests/test_managed_controls_limits.py --tb=short
      - name: Commit source and remove one-shot workflow
        run: |
          rm -f .github/workflows/managed-controls-format-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: format Managed Controls catalog API"
          git push origin HEAD:managed-controls/batch-02-actions-limits-clean
