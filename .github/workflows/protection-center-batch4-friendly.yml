name: Protection Center Batch 4 friendly settings
on:
  push:
    branches:
      - feat/protection-center-04-friendly-settings-final
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Apply friendly settings copy
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/protection-center-03-module-detail-final
          git show origin/feat/protection-center-03-module-detail-final:dashboard/src/extension-policy-panel.tsx > dashboard/src/extension-policy-panel.tsx
          python scripts/ci/protection_center_batch4_friendly_transform.py
          python -c 'import json,pathlib; p=pathlib.Path("dashboard/package.json"); d=json.loads(p.read_text()); c="tsx src/extension-policy-panel.copy.test.tsx"; parts=[x.strip() for x in d["scripts"]["test"].split("&&")]; parts.insert(3,c) if c not in parts else None; d["scripts"]["test"]=" && ".join(parts); p.write_text(json.dumps(d,indent=2)+"\n")'
          cd dashboard
          bun install --frozen-lockfile --ignore-scripts
          bun run test
          bun run build
          cd ..
          rm .github/workflows/protection-center-batch4-friendly.yml
          rm scripts/ci/protection_center_batch4_friendly_transform.py
          git add dashboard src/codex_plugin_scanner/guard/daemon/static .github/workflows/protection-center-batch4-friendly.yml scripts/ci/protection_center_batch4_friendly_transform.py
          git diff --cached --check
          git commit -m "feat(protection-center): simplify secure protection settings"
          git push origin HEAD:feat/protection-center-04-friendly-settings-final