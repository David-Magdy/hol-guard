name: Apply daemon authentication and lifecycle race fix

on:
  push:
    branches: [fix/daemon-auth-lifecycle-races]
    paths:
      - ".github/workflows/apply-daemon-auth-lifecycle-race-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: fix/daemon-auth-lifecycle-races
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Apply generation-identity and shutdown-state fixes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          transport_path = Path("src/codex_plugin_scanner/guard/adapters/codex_daemon_hook_transport.py")
          transport = transport_path.read_text(encoding="utf-8")
          old_state_compare = (
              "        if current_state != state or not secrets.compare_digest(current_key, discovery_key):\n"
          )
          new_state_compare = (
              "        if _daemon_generation_identity(current_state) != _daemon_generation_identity(\n"
              "            state\n"
              "        ) or not secrets.compare_digest(current_key, discovery_key):\n"
          )
          if transport.count(old_state_compare) != 2:
              raise RuntimeError("Expected two full-state daemon generation comparisons")
          transport_path.write_text(
              transport.replace(old_state_compare, new_state_compare),
              encoding="utf-8",
          )

          server_path = Path("src/codex_plugin_scanner/guard/daemon/server.py")
          server = server_path.read_text(encoding="utf-8")
          old_start = (
              "    def start(self) -> None:\n"
              "        if self._thread is not None and self._thread.is_alive():\n"
              "            return\n"
              "        self._thread = None\n"
          )
          new_start = (
              "    def start(self) -> None:\n"
              "        if self._thread is not None and self._thread.is_alive():\n"
              "            if self._shutdown_started.is_set():\n"
              "                if self._aibom_refresh_thread is not None and self._aibom_refresh_thread.is_alive():\n"
              "                    raise RuntimeError(\"AIBOM inventory refresh is still stopping\")\n"
              "                raise RuntimeError(\"Guard daemon is still stopping\")\n"
              "            return\n"
              "        self._thread = None\n"
          )
          if server.count(old_start) != 1:
              raise RuntimeError("Expected one GuardDaemonServer.start implementation")
          server_path.write_text(server.replace(old_start, new_start, 1), encoding="utf-8")

          fixture_path = Path("tests/codex_daemon_hook_bridge_fixtures.py")
          fixture = fixture_path.read_text(encoding="utf-8")
          fixture_anchor = (
              "            if type(self).challenge_mode == \"wrong-proof\":\n"
              "                response[\"proof\"] = \"0\" * 64\n"
              "            if type(self).challenge_mode == \"replace-state\":\n"
          )
          fixture_replacement = (
              "            if type(self).challenge_mode == \"wrong-proof\":\n"
              "                response[\"proof\"] = \"0\" * 64\n"
              "            if type(self).challenge_mode == \"refresh-trust-status\":\n"
              "                daemon_manager.write_guard_daemon_state(\n"
              "                    guard_home,\n"
              "                    int(state[\"port\"]),\n"
              "                    type(self).auth_token,\n"
              "                    pid=int(state[\"pid\"]),\n"
              "                    write_auth_token=False,\n"
              "                    host=str(state[\"host\"]),\n"
              "                    state_id=str(state[\"state_id\"]),\n"
              "                    started_at=str(state[\"started_at\"]),\n"
              "                    trust_status={\n"
              "                        \"status\": f\"refreshed-{type(self).challenge_count}\"\n"
              "                    },\n"
              "                )\n"
              "            if type(self).challenge_mode == \"replace-state\":\n"
          )
          if fixture.count(fixture_anchor) != 1:
              raise RuntimeError("Expected one daemon challenge fixture anchor")
          fixture_path.write_text(
              fixture.replace(fixture_anchor, fixture_replacement, 1),
              encoding="utf-8",
          )

          test_path = Path("tests/test_codex_daemon_hook_bridge.py")
          tests = test_path.read_text(encoding="utf-8")
          test_anchor = "\n\ndef test_repeated_generation_rollover_stays_bounded(monkeypatch: pytest.MonkeyPatch) -> None:\n"
          new_test = '''


def test_authenticated_trust_refresh_preserves_daemon_generation(
    tmp_path: Path,
    monkeypatch: pytest.MonkeyPatch,
    capsys: pytest.CaptureFixture[str],
) -> None:
    guard_home = tmp_path / "guard-home"
    daemon = HTTPServer(("127.0.0.1", 0), _DaemonHandler)
    daemon_thread = threading.Thread(target=daemon.serve_forever, daemon=True)
    daemon_thread.start()
    _write_authenticated_daemon_files(guard_home, daemon.server_address[1])
    _DaemonHandler.challenge_mode = "refresh-trust-status"
    monkeypatch.setattr(
        "sys.stdin",
        io.StringIO(json.dumps({"hook_event_name": "PreToolUse", "tool_name": "Bash"})),
    )

    try:
        exit_code = bridge.main(**_bridge_config(guard_home, daemon.server_address[1]))
    finally:
        daemon.shutdown()
        daemon_thread.join(timeout=5)

    state = json.loads((guard_home / "daemon-state.json").read_text(encoding="utf-8"))
    assert exit_code == 0
    assert _DaemonHandler.challenge_count == 1
    assert _DaemonHandler.captured_guard_token == "fixture-token"
    assert state["trust_status"] == {"status": "refreshed-1"}
    assert json.loads(capsys.readouterr().out) == {}
'''
          if tests.count(test_anchor) != 1:
              raise RuntimeError("Expected one generation rollover test anchor")
          test_path.write_text(
              tests.replace(test_anchor, new_test + test_anchor, 1),
              encoding="utf-8",
          )
          PY
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/guard/adapters/codex_daemon_hook_transport.py \
            src/codex_plugin_scanner/guard/daemon/server.py \
            tests/codex_daemon_hook_bridge_fixtures.py \
            tests/test_codex_daemon_hook_bridge.py
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/adapters/codex_daemon_hook_transport.py \
            src/codex_plugin_scanner/guard/daemon/server.py \
            tests/codex_daemon_hook_bridge_fixtures.py \
            tests/test_codex_daemon_hook_bridge.py
      - name: Verify focused regressions
        run: |
          set -euo pipefail
          uv run --no-sync pytest -q \
            tests/test_codex_daemon_hook_bridge.py::test_authenticated_generation_rollover_is_rediscovered_once \
            tests/test_codex_daemon_hook_bridge.py::test_authenticated_trust_refresh_preserves_daemon_generation \
            tests/test_codex_daemon_hook_bridge.py::test_repeated_generation_rollover_stays_bounded \
            tests/test_guard_supply_chain_daemon.py::test_daemon_retains_blocked_aibom_refresh_thread_during_shutdown
      - name: Refresh exact test-suite ratchet
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/ci/test_inventory.py --output "$RUNNER_TEMP/test-inventory.json"
          uv run --no-sync python - "$RUNNER_TEMP/test-inventory.json" <<'PY'
          import json
          import pathlib
          import sys

          inventory = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          payload = {
              "maximum_collected_cases": inventory["inventory"]["collected_cases"],
              "maximum_test_source_lines": inventory["test_source_lines"],
              "schema_version": 1,
          }
          pathlib.Path("ci/test-suite-ratchet-baseline.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Commit verified source and tests
        run: |
          set -euo pipefail
          git add \
            src/codex_plugin_scanner/guard/adapters/codex_daemon_hook_transport.py \
            src/codex_plugin_scanner/guard/daemon/server.py \
            tests/codex_daemon_hook_bridge_fixtures.py \
            tests/test_codex_daemon_hook_bridge.py \
            ci/test-suite-ratchet-baseline.json
          git diff --cached --check
          branch=fix/daemon-auth-lifecycle-races
          remote_sha=$(git ls-remote --exit-code origin "refs/heads/${branch}" | awk '{print $1}')
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "Fix branch moved while applying verified changes" >&2
            exit 1
          fi
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git commit --signoff -m "fix(guard): close daemon authentication lifecycle races"
          git push origin "HEAD:refs/heads/${branch}"
