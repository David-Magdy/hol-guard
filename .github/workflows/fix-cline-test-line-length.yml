name: Fix Cline test line length

on:
  push:
    branches:
      - fix/release-3.0-cline-dashboard-contract

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true

      - name: Split long JavaScript test expressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("tests/test_cline_completion_gates.py"): (
                  "            'plugin.hooks.beforeTool({toolCall:{toolCallId:\"1\",toolName:\"run_commands\"},input:{commands:[\"echo safe\"]}})',\n",
                  "            (\n"
                  "                'plugin.hooks.beforeTool({toolCall:{toolCallId:\"1\",toolName:\"run_commands\"},'\n"
                  "                'input:{commands:[\"echo safe\"]}})'\n"
                  "            ),\n",
              ),
              Path("tests/test_cline_hook_transports.py"): (
                  "        'plugin.hooks.beforeTool({toolCall:{toolCallId:\"1\",toolName:\"run_commands\"},input:{commands:[\"echo safe\",\"BLOCK_ME\"]}})',\n",
                  "        (\n"
                  "            'plugin.hooks.beforeTool({toolCall:{toolCallId:\"1\",toolName:\"run_commands\"},'\n"
                  "            'input:{commands:[\"echo safe\",\"BLOCK_ME\"]}})'\n"
                  "        ),\n",
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected source line not found in {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit scoped lint fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_cline_completion_gates.py tests/test_cline_hook_transports.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(cline): split long test expressions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
