name: Guard Secrets precision bootstrap

on:
  push:
    branches:
      - fix/secrets-ignore-indirect-code-references

permissions:
  contents: write

concurrency:
  group: guard-secrets-precision-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/secrets-ignore-indirect-code-references
          fetch-depth: 0

      - name: Apply reviewed detector precision patch
        shell: bash
        env:
          PATCH_GZIP_BASE64: 
        run: |
          set -euo pipefail
          printf '%s' "${PATCH_GZIP_BASE64}" | base64 --decode | gzip --decompress > /tmp/guard-secrets-precision.patch
          git apply --check /tmp/guard-secrets-precision.patch
          git apply /tmp/guard-secrets-precision.patch
          python -m py_compile \
            src/codex_plugin_scanner/guard/secrets/secret_detection.py \
            tests/test_guard_secret_assignment_precision.py
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('src/codex_plugin_scanner/guard/secrets/secret_detection.py'),
              Path('tests/test_guard_secret_assignment_precision.py'),
              Path('ci/test-suite-ratchet-baseline.json'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if not text.endswith('\n'):
                  raise SystemExit(f'{path}: missing final newline')
              for line_number, line in enumerate(text.splitlines(), 1):
                  if line.rstrip() != line:
                      raise SystemExit(f'{path}:{line_number}: trailing whitespace')
                  if len(line) > 119:
                      raise SystemExit(f'{path}:{line_number}: line exceeds 119 characters')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/guard-secrets-precision-bootstrap.yml
          git add \
            src/codex_plugin_scanner/guard/secrets/secret_detection.py \
            tests/test_guard_secret_assignment_precision.py \
            ci/test-suite-ratchet-baseline.json
          git commit -m 'fix(secrets): ignore indirect credential references'
          git push origin HEAD:fix/secrets-ignore-indirect-code-references
