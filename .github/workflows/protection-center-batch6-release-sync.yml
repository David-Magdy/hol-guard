name: Protection Center Batch 6 release sync
on:
  push:
    branches: [feat/protection-center-06-cloud-boundary-hardening]
permissions:
  contents: write
jobs:
  sync-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Compose current release/3.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin release/3.0
          set +e
          git merge --no-commit --no-ff origin/release/3.0
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -Ev '^(dashboard/package\.json|src/codex_plugin_scanner/guard/daemon/static/.*)$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected merge conflicts:"; printf '%s\n' "$unexpected"; exit 1
            fi
            if git diff --name-only --diff-filter=U | grep -qx 'dashboard/package.json'; then
              git checkout --theirs dashboard/package.json
              git add dashboard/package.json
            fi
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              git checkout --theirs -- "$file"
              git add "$file"
            done < <(git diff --name-only --diff-filter=U | grep '^src/codex_plugin_scanner/guard/daemon/static/' || true)
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('dashboard/package.json')
          data = json.loads(path.read_text())
          additions = [
              'tsx src/protection-center/protection-final-contract.test.ts',
              'tsx src/protection-center/protection-cloud-value.test.tsx',
              'tsx src/protection-center/protection-telemetry.test.ts',
              'tsx src/protection-center/protection-terminology.test.tsx',
              'tsx src/protection-center/protection-final-a11y.test.tsx',
              'tsx src/protection-center/model/protection-author-metadata.test.ts',
              'tsx src/protection-center/model/protection-performance-budgets.test.ts',
          ]
          current = data['scripts']['test'].split(' && ')
          data['scripts']['test'] = ' && '.join(additions + [item for item in current if item not in additions])
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
          git add dashboard/package.json
      - name: Verify final local and Cloud contracts
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync python -m ruff check src/
          uv run --no-sync python -m ruff format --check src/
          uv run --no-sync basedpyright --level error
          uv run --no-sync pytest -q tests/test_guard_cloud_entitlements.py tests/test_guard_extension_control_test_lab.py
          cd dashboard
          bun install --frozen-lockfile --ignore-scripts
          bun run test
          bun run build
          cd ..
          git diff --check
      - name: Commit combined verified tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/protection-center-batch6-release-sync.yml
          git add dashboard src/codex_plugin_scanner/guard/daemon/static .github/workflows/protection-center-batch6-release-sync.yml
          git diff --cached --check
          git commit -m "chore(protection-center): sync final hardening to release/3.0"
          git push origin HEAD:feat/protection-center-06-cloud-boundary-hardening
