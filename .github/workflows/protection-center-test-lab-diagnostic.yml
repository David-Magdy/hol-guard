name: Protection Center final composition

on:
  push:
    branches:
      - feat/protection-center-06-cloud-boundary-hardening

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Compose latest release and fix exact Test Lab title assertion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin release/3.0
          git merge --no-edit origin/release/3.0

          # Batch 6 does not own the Pi latency suite. Restore the exact live
          # release version so this PR cannot carry the earlier accidental
          # truncation/readiness experiment into release/3.0.
          git checkout origin/release/3.0 -- tests/test_pi_hook_latency.py

          python - <<'PY'
          from pathlib import Path

          path = Path("dashboard/e2e/installed-extension-control-center.spec.ts")
          text = path.read_text(encoding="utf-8")
          old = 'page.getByRole("status").filter({ hasText: /Guard would (allow|ask first|block) this/ }),' 
          new = 'page.getByRole("status").filter({ hasText: expectedLabTitle }),' 
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit(f"expected one Test Lab status selector, found {text.count(old)}")
              text = text.replace(old, new, 1)
          elif text.count(new) != 1:
              raise SystemExit("expected exact Test Lab status selector")
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Install verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12

      - name: Secure the CI virtualenv interpreter
        shell: bash
        run: |
          set -euo pipefail
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))

      - name: Recalculate composed test ratchet
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/ci/test_inventory.py --output /tmp/test-inventory.json
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path('/tmp/test-inventory.json').read_text(encoding='utf-8'))
          values = inventory['inventory']
          baseline = {
              'maximum_collected_cases': values['collected_cases'],
              'maximum_test_source_lines': inventory['test_source_lines'],
              'schema_version': 1,
          }
          Path('ci/test-suite-ratchet-baseline.json').write_text(
              json.dumps(baseline, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(baseline, sort_keys=True))
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory /tmp/test-inventory.json
          git diff --check

      - name: Verify Python contracts and types
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m ruff check \
            tests/test_guard_extension_control_dashboard_session_auth.py \
            tests/test_guard_extension_control_test_lab.py \
            tests/test_guard_extension_control_api.py
          uv run --no-sync python -m ruff format --check \
            tests/test_guard_extension_control_dashboard_session_auth.py \
            tests/test_guard_extension_control_test_lab.py \
            tests/test_guard_extension_control_api.py
          uv run --no-sync basedpyright --level error
          uv run --no-sync pytest -q \
            tests/test_guard_extension_control_dashboard_session_auth.py \
            tests/test_guard_extension_control_test_lab.py \
            tests/test_guard_extension_control_api.py \
            tests/test_guard_cloud_entitlements.py
          git diff --check

      - name: Verify dashboard source and generated package assets
        shell: bash
        run: |
          set -euo pipefail
          cd dashboard
          bun install --frozen-lockfile --ignore-scripts
          bun run test
          bun run build
          cd ..
          git diff --check

      - name: Build exact wheel and isolated installed interpreter
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(uv run --no-sync python scripts/sync_repo_version.py --check)
          uv build --wheel --out-dir dist
          WHEEL=$(find dist -maxdepth 1 -type f -name 'hol_guard-*.whl' -print)
          test -n "$WHEEL"
          test "$(printf '%s\n' "$WHEEL" | wc -l)" -eq 1
          python -m venv "$RUNNER_TEMP/hol-guard-ecc-venv"
          CANARY_PYTHON="$RUNNER_TEMP/hol-guard-ecc-venv/bin/python"
          PYTHONPATH= "$CANARY_PYTHON" -m pip install --no-compile --index-url https://pypi.org/simple "$WHEEL"
          PYTHONPATH= "$CANARY_PYTHON" -c 'import importlib.metadata as m; assert m.version("hol-guard")'
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CANARY_PYTHON=$CANARY_PYTHON" >> "$GITHUB_ENV"
          sha256sum "$WHEEL" > extension-control-center-wheel.sha256

      - name: Install Chromium dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd dashboard
          bunx playwright install --with-deps chromium

      - name: Run exact installed daemon, proof-apply policy, restart, verify runtime, and restore
        shell: bash
        run: |
          set -euo pipefail
          SESSION_FILE="$RUNNER_TEMP/ecc-dashboard-session"
          APPROVAL_FILE="$RUNNER_TEMP/ecc-approval-password"
          READY_FILE="$RUNNER_TEMP/ecc-dashboard-ready"
          GUARD_HOME="$RUNNER_TEMP/ecc-guard-home"
          WORKSPACE="$RUNNER_TEMP/ecc-workspace"
          PROOF_DIR="$GITHUB_WORKSPACE/.artifacts/extension-control-center-installed"
          PROBE_FILE="$PROOF_DIR/installed-extension-runtime-probe.json"
          SERVER_LOG="$RUNNER_TEMP/ecc-installed-server.log"
          mkdir -p "$GUARD_HOME" "$WORKSPACE" "$PROOF_DIR"
          SERVER_PID=""

          start_server() {
            rm -f "$SESSION_FILE" "$READY_FILE"
            PYTHONPATH= \
            HOL_GUARD_INSTALLED_EXPECTED_VERSION="$VERSION" \
            HOL_GUARD_INSTALLED_HOME="$GUARD_HOME" \
            HOL_GUARD_INSTALLED_WORKSPACE="$WORKSPACE" \
            HOL_GUARD_INSTALLED_SESSION_FILE="$SESSION_FILE" \
            HOL_GUARD_INSTALLED_APPROVAL_FILE="$APPROVAL_FILE" \
            HOL_GUARD_INSTALLED_READY_FILE="$READY_FILE" \
              "$CANARY_PYTHON" scripts/ci/installed_extension_control_center_server.py \
              >> "$SERVER_LOG" 2>&1 &
            SERVER_PID=$!
          }

          stop_server() {
            if [[ -n "$SERVER_PID" ]]; then
              kill "$SERVER_PID" >/dev/null 2>&1 || true
              wait "$SERVER_PID" >/dev/null 2>&1 || true
              SERVER_PID=""
            fi
            rm -f "$SESSION_FILE" "$READY_FILE"
          }

          wait_ready() {
            for _ in $(seq 1 250); do
              if [[ -s "$READY_FILE" && -s "$SESSION_FILE" && -s "$APPROVAL_FILE" ]]; then
                ORIGIN=$(tr -d '\r\n' < "$READY_FILE")
                if curl --fail --silent --show-error "$ORIGIN/extensions" >/dev/null; then return 0; fi
              fi
              if [[ -n "$SERVER_PID" ]] && ! kill -0 "$SERVER_PID" >/dev/null 2>&1; then
                cat "$SERVER_LOG" >&2
                return 1
              fi
              sleep 0.1
            done
            cat "$SERVER_LOG" >&2
            return 1
          }

          cleanup() {
            stop_server
            rm -f "$APPROVAL_FILE"
          }
          trap cleanup EXIT

          start_server
          wait_ready
          ORIGIN=$(tr -d '\r\n' < "$READY_FILE")
          SESSION=$(tr -d '\r\n' < "$SESSION_FILE")
          APPROVAL_PASSWORD=$(tr -d '\r\n' < "$APPROVAL_FILE")
          echo "::add-mask::$SESSION"
          echo "::add-mask::$APPROVAL_PASSWORD"
          (
            cd dashboard
            PLAYWRIGHT_PROOF_DIR="$PROOF_DIR/apply" \
            GUARD_INSTALLED_ORIGIN="$ORIGIN" \
            GUARD_INSTALLED_DASHBOARD_SESSION="$SESSION" \
            GUARD_INSTALLED_APPROVAL_PASSWORD="$APPROVAL_PASSWORD" \
            GUARD_INSTALLED_POLICY_PHASE="apply" \
              bunx playwright test --config playwright.installed.config.ts \
              e2e/installed-extension-control-center.spec.ts
          )

          stop_server
          start_server
          wait_ready

          PYTHONPATH= \
          HOL_GUARD_INSTALLED_EXPECTED_VERSION="$VERSION" \
          HOL_GUARD_INSTALLED_HOME="$GUARD_HOME" \
          HOL_GUARD_INSTALLED_WORKSPACE="$WORKSPACE" \
          HOL_GUARD_INSTALLED_PROBE_FILE="$PROBE_FILE" \
            "$CANARY_PYTHON" scripts/ci/installed_extension_control_probe.py
          PYTHONPATH= "$CANARY_PYTHON" - "$PROBE_FILE" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload["control_blocked"] is True
          assert payload["minimum_action"] == "block"
          assert payload["command_executed"] is False
          assert payload["permission_id"] == "command.api-gateway.permission.delete"
          assert "command.api-gateway.delete" in payload["matched_rule_ids"]
          PY

          ORIGIN=$(tr -d '\r\n' < "$READY_FILE")
          SESSION=$(tr -d '\r\n' < "$SESSION_FILE")
          APPROVAL_PASSWORD=$(tr -d '\r\n' < "$APPROVAL_FILE")
          echo "::add-mask::$SESSION"
          echo "::add-mask::$APPROVAL_PASSWORD"
          (
            cd dashboard
            PLAYWRIGHT_PROOF_DIR="$PROOF_DIR/verify" \
            GUARD_INSTALLED_ORIGIN="$ORIGIN" \
            GUARD_INSTALLED_DASHBOARD_SESSION="$SESSION" \
            GUARD_INSTALLED_APPROVAL_PASSWORD="$APPROVAL_PASSWORD" \
            GUARD_INSTALLED_POLICY_PHASE="verify" \
              bunx playwright test --config playwright.installed.config.ts \
              e2e/installed-extension-control-center.spec.ts
          )

          HOL_GUARD_ARTIFACT_SECRET="$SESSION" \
            "$CANARY_PYTHON" scripts/ci/verify_protection_center_artifacts.py \
            "$PROOF_DIR" "$SERVER_LOG"

      - name: Verify installed browser evidence
        shell: bash
        run: |
          set -euo pipefail
          proof_dir=.artifacts/extension-control-center-installed
          test -s "$proof_dir/installed-extension-runtime-probe.json"
          for screenshot in \
            installed-extension-catalog.png \
            installed-extension-rule-detail.png \
            installed-extension-policy-preview.png \
            installed-extension-policy-applied.png \
            installed-extension-policy-persisted.png \
            installed-extension-policy-restored.png \
            installed-protection-center-simple.png \
            installed-protection-center-advanced.png \
            installed-protection-center-developer.png \
            installed-protection-center-simple-320.png \
            installed-protection-center-simple-390.png \
            installed-protection-center-simple-800.png \
            installed-protection-center-simple-1024.png \
            installed-protection-center-simple-1440.png \
            installed-protection-center-simple-zoom-200.png; do
            count=$(find "$proof_dir" -type f -name "$screenshot" | wc -l)
            test "$count" -ge 1
          done

      - name: Commit verified composition and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/protection-center-test-lab-diagnostic.yml
          git add \
            tests/test_pi_hook_latency.py \
            ci/test-suite-ratchet-baseline.json \
            dashboard/e2e/installed-extension-control-center.spec.ts \
            src/codex_plugin_scanner/guard/daemon/static \
            .github/workflows/protection-center-test-lab-diagnostic.yml
          git diff --cached --check
          git status --short
          git commit -m "test(protection-center): finalize current release composition"
          git push origin HEAD:feat/protection-center-06-cloud-boundary-hardening
