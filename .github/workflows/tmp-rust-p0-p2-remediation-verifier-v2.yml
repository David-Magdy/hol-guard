name: Temporary Rust P0-P2 remediation verifier v2

on:
  push:
    branches:
      - tmp/rust-p0-p2-remediation-verifier-v2-20260815
    paths:
      - .github/workflows/tmp-rust-p0-p2-remediation-verifier-v2.yml

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  statuses: read

env:
  CARGO_TERM_COLOR: always
  PYTHONUNBUFFERED: "1"
  HOL_GUARD_NATIVE_DEVELOPMENT: "1"
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  HEAD_BRANCH: fix/rust-p0-p2-regression-hardening
  BASE_BRANCH: release/3.0

jobs:
  complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: tmp/rust-p0-p2-remediation-verifier-v2-20260815
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
      - name: Cancel superseded orchestration runs
        shell: bash
        run: |
          set -euo pipefail
          for branch in fix%2Frust-p0-p2-regression-hardening tmp%2Frust-p0-p2-remediation-verifier-20260815; do
            gh api "/repos/$REPO/actions/runs?branch=$branch&per_page=100" \
              --jq '.workflow_runs[] | select(.status != "completed") | .id' \
              | while read -r run_id; do
                  [[ -n "$run_id" ]] || continue
                  gh api --method POST "/repos/$REPO/actions/runs/$run_id/cancel" || true
                done
          done
          sleep 15
      - name: Discover current remediation state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          row="$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --state all --limit 20 --json number,state,mergeCommit --jq '.[0] // {}')"
          echo "number=$(jq -r '.number // ""' <<<"$row")" >> "$GITHUB_OUTPUT"
          echo "state=$(jq -r '.state // ""' <<<"$row")" >> "$GITHUB_OUTPUT"
          echo "merge_oid=$(jq -r '.mergeCommit.oid // ""' <<<"$row")" >> "$GITHUB_OUTPUT"
      - name: Prepare latest feature candidate
        if: steps.state.outputs.state != 'MERGED'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "$HEAD_BRANCH:refs/remotes/origin/$HEAD_BRANCH"
          git fetch --force origin "$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          git checkout -B "$HEAD_BRANCH" "refs/remotes/origin/$HEAD_BRANCH"
          git merge --no-edit "refs/remotes/origin/$BASE_BRANCH"
          rm -f .github/workflows/tmp-finalize-rust-p0-p2-remediation*.yml
          rm -f .github/workflows/rust-remediation-shepherd.yml
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
      - name: Install locked environment
        if: steps.state.outputs.state != 'MERGED'
        run: uv sync --frozen --all-extras --dev
      - name: Format, lint, and ratchet exact coverage
        if: steps.state.outputs.state != 'MERGED'
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format ci/rust_migration_regression_audit.py ci/run_rust_migration_regression.py tests/test_rust_migration_regression_audit.py
          uv run ruff check ci/rust_migration_regression_audit.py ci/run_rust_migration_regression.py tests/test_rust_migration_regression_audit.py
          uv run ruff format --check ci/rust_migration_regression_audit.py ci/run_rust_migration_regression.py tests/test_rust_migration_regression_audit.py
          uv run python ci/rust_migration_regression_audit.py --baseline /tmp/no-baseline.json --json-output /tmp/audit-unratcheted.json >/dev/null
          uv run python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/audit-unratcheted.json').read_text(encoding='utf-8'))
          Path('ci/rust-migration-regression-baseline.json').write_text(
              json.dumps({'schema_version': 1, 'minimum_test_counts': report['test_counts']}, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          uv run python ci/rust_migration_regression_audit.py --json-output /tmp/audit-final.json
          uv run pytest -q tests/test_rust_migration_regression_audit.py
      - name: Validate complete Rust workspace
        if: steps.state.outputs.state != 'MERGED'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo clippy --manifest-path rust/Cargo.toml --locked --workspace --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --locked --workspace --all-targets
          cargo build --manifest-path rust/Cargo.toml --locked --release --bin hol-guard-runtime
          echo "HOL_GUARD_NATIVE_BINARY=$GITHUB_WORKSPACE/rust/target/release/hol-guard-runtime" >> "$GITHUB_ENV"
      - name: Validate retained security and developer experience
        if: steps.state.outputs.state != 'MERGED'
        run: uv run python ci/run_rust_migration_regression.py --mode pr --manifest /tmp/regression-pr.json
      - name: Push exact validated head
        if: steps.state.outputs.state != 'MERGED'
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if ! git diff --cached --quiet; then
            git commit -s -m "test(guard): finalize Rust P0-P2 regression remediation"
          fi
          git push origin HEAD:"$HEAD_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Ensure pull request is open
        if: steps.state.outputs.state != 'MERGED'
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          number="${{ steps.state.outputs.number }}"
          state="${{ steps.state.outputs.state }}"
          if [[ -z "$number" ]]; then
            url="$(gh pr create --repo "$REPO" --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --title 'test(guard): harden Rust P0-P2 regression coverage' --body 'Removes obsolete migration assets and adds executable Rust/Python ownership, security, extension, command-pattern, package, filesystem, installed-artifact, cross-platform, and privacy-safe regression gates. Targets release/3.0 only.')"
            number="${url##*/}"
          elif [[ "$state" == "CLOSED" ]]; then
            gh pr reopen "$number" --repo "$REPO"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Wait for exact-head checks with one retry
        if: steps.state.outputs.state != 'MERGED'
        shell: bash
        run: |
          set -euo pipefail
          pr="${{ steps.pr.outputs.number }}"
          sha="${{ steps.candidate.outputs.sha }}"
          for attempt in 1 2; do
            deadline=$((SECONDS + 10800))
            failed_ids=""
            while (( SECONDS < deadline )); do
              live="$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq .headRefOid)"
              [[ "$live" == "$sha" ]] || { sleep 20; continue; }
              response="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$REPO/commits/$sha/check-runs?per_page=100")"
              checks="$(jq '[.check_runs[] | {id,name,status,conclusion}]' <<<"$response")"
              count="$(jq 'length' <<<"$checks")"
              incomplete="$(jq '[.[] | select(.status != "completed")] | length' <<<"$checks")"
              failed="$(jq '[.[] | select(.status == "completed" and (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped"))] | length' <<<"$checks")"
              failed_ids="$(jq -r '.check_runs[] | select(.status == "completed" and (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")) | .id' <<<"$response")"
              combined="$(gh api "/repos/$REPO/commits/$sha/status")"
              state="$(jq -r .state <<<"$combined")"
              status_count="$(jq '.statuses | length' <<<"$combined")"
              if (( failed == 0 && incomplete == 0 && count >= 5 )) && { (( status_count == 0 )) || [[ "$state" == "success" ]]; }; then
                exit 0
              fi
              if (( failed > 0 )) || [[ "$state" == "failure" || "$state" == "error" ]]; then
                break
              fi
              sleep 30
            done
            [[ "$attempt" == 1 ]] || { jq . <<<"$checks"; exit 1; }
            while read -r check_id; do
              [[ -n "$check_id" ]] || continue
              suite_id="$(gh api "/repos/$REPO/check-runs/$check_id" --jq .check_suite.id)"
              gh api --method POST "/repos/$REPO/check-suites/$suite_id/rerequest" || true
            done <<<"$failed_ids"
            sleep 30
          done
      - name: Require resolved review state
        if: steps.state.outputs.state != 'MERGED'
        shell: bash
        run: |
          set -euo pipefail
          pr="${{ steps.pr.outputs.number }}"
          decision="$(gh pr view "$pr" --repo "$REPO" --json reviewDecision --jq '.reviewDecision // ""')"
          [[ "$decision" != "CHANGES_REQUESTED" ]]
          unresolved="$(gh api graphql -f owner='${{ github.repository_owner }}' -f name='${{ github.event.repository.name }}' -F number="$pr" -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')"
          [[ "$unresolved" == "0" ]]
      - name: Merge exact green head
        if: steps.state.outputs.state != 'MERGED'
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          pr="${{ steps.pr.outputs.number }}"
          sha="${{ steps.candidate.outputs.sha }}"
          gh pr merge "$pr" --repo "$REPO" --merge --delete-branch --match-head-commit "$sha"
          deadline=$((SECONDS + 1200))
          oid=""
          while (( SECONDS < deadline )); do
            state="$(gh pr view "$pr" --repo "$REPO" --json state --jq .state)"
            oid="$(gh pr view "$pr" --repo "$REPO" --json mergeCommit --jq '.mergeCommit.oid // ""')"
            [[ "$state" == "MERGED" && -n "$oid" ]] && break
            sleep 15
          done
          test -n "$oid"
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          echo "oid=$oid" >> "$GITHUB_OUTPUT"
      - name: Resolve merged identity
        id: merged
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.state.outputs.state }}" == "MERGED" ]]; then
            number="${{ steps.state.outputs.number }}"
            oid="${{ steps.state.outputs.merge_oid }}"
          else
            number="${{ steps.merge.outputs.number }}"
            oid="${{ steps.merge.outputs.oid }}"
          fi
          test -n "$number"
          test -n "$oid"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "oid=$oid" >> "$GITHUB_OUTPUT"
      - name: Verify ancestry and post-merge checks
        shell: bash
        run: |
          set -euo pipefail
          oid="${{ steps.merged.outputs.oid }}"
          git fetch --force origin release/3.0:refs/remotes/origin/release/3.0 main:refs/remotes/origin/main
          git merge-base --is-ancestor "$oid" refs/remotes/origin/release/3.0
          if git merge-base --is-ancestor "$oid" refs/remotes/origin/main; then exit 1; fi
          deadline=$((SECONDS + 10800))
          while (( SECONDS < deadline )); do
            response="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$REPO/commits/$oid/check-runs?per_page=100")"
            checks="$(jq '[.check_runs[] | {name,status,conclusion}]' <<<"$response")"
            count="$(jq 'length' <<<"$checks")"
            incomplete="$(jq '[.[] | select(.status != "completed")] | length' <<<"$checks")"
            failed="$(jq '[.[] | select(.status == "completed" and (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped"))] | length' <<<"$checks")"
            combined="$(gh api "/repos/$REPO/commits/$oid/status")"
            state="$(jq -r .state <<<"$combined")"
            status_count="$(jq '.statuses | length' <<<"$combined")"
            if (( failed > 0 )) || [[ "$state" == "failure" || "$state" == "error" ]]; then jq . <<<"$checks"; exit 1; fi
            if (( count >= 3 && incomplete == 0 )) && { (( status_count == 0 )) || [[ "$state" == "success" ]]; }; then break; fi
            sleep 30
          done
          (( SECONDS < deadline ))
      - name: Record completion and clean temporary branches
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/completion.json <<JSON
          {"schema_version":1,"verified":true,"pull_request":${{ steps.merged.outputs.number }},"merge_commit":"${{ steps.merged.outputs.oid }}","target_branch":"release/3.0","present_in_main":false,"post_merge_checks_green":true}
          JSON
          cat /tmp/completion.json
          for branch in fix/rust-p0-p2-regression-hardening tmp/rust-p1-p2-bundle-20260814 tmp/rust-p1-p2-compile-20260815 tmp/rust-p0-p2-remediation-verifier-20260815 tmp/rust-p0-p2-remediation-verifier-v2-20260815; do
            encoded="${branch//\//%2F}"
            if gh api "/repos/$REPO/git/ref/heads/$encoded" >/dev/null 2>&1; then gh api --method DELETE "/repos/$REPO/git/refs/heads/$encoded"; fi
          done
          {
            echo "## Rust P0-P2 remediation complete"
            echo "- Pull request: #${{ steps.merged.outputs.number }}"
            echo "- Merge commit: \`${{ steps.merged.outputs.oid }}\`"
            echo "- Post-merge checks: green"
            echo "- Present in \`main\`: no"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-p0-p2-remediation-v2-completion-${{ steps.merged.outputs.oid }}
          path: /tmp/completion.json
          if-no-files-found: error
          retention-days: 7
