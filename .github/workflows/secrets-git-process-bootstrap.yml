name: Guard Secrets Git process bootstrap

on:
  push:
    branches:
      - fix/secrets-git-process-hardening-v2

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: guard-secrets-git-process-bootstrap
  cancel-in-progress: false

jobs:
  apply-validate-and-open:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/secrets-git-process-hardening-v2
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false

      - name: Replace Git process boundary with trusted executable and bounded pipes
        shell: bash
        run: |
          set -euo pipefail
          cat > src/codex_plugin_scanner/guard/secrets/git_safe.py <<'PY'
          """Hardened, non-interactive Git subprocess helpers for secret scanning."""

          from __future__ import annotations

          import os
          import stat
          import subprocess
          import threading
          from collections.abc import Mapping, Sequence
          from pathlib import Path

          _ALLOWED_ENVIRONMENT_KEYS = frozenset(
              {
                  "APPDATA",
                  "COMSPEC",
                  "HOME",
                  "LANG",
                  "LC_ALL",
                  "LOCALAPPDATA",
                  "PATH",
                  "PATHEXT",
                  "PROGRAMFILES",
                  "PROGRAMFILES(X86)",
                  "SYSTEMDRIVE",
                  "SYSTEMROOT",
                  "TEMP",
                  "TERM",
                  "TMP",
                  "TMPDIR",
                  "USERPROFILE",
                  "WINDIR",
              }
          )
          _GIT_CONFIG_OVERRIDES: tuple[tuple[str, str], ...] = (
              ("credential.helper", ""),
              ("core.askPass", ""),
              ("core.sshCommand", "false"),
              ("protocol.file.allow", "never"),
          )
          _READ_CHUNK_BYTES = 64 * 1024


          def _is_relative_to(path: Path, parent: Path) -> bool:
              try:
                  path.relative_to(parent)
              except ValueError:
                  return False
              return True


          def _safe_path_entries(
              source: Mapping[str, str],
              *,
              repository_root: Path | None = None,
          ) -> tuple[Path, ...]:
              values = source.get("PATH", "").split(os.pathsep)
              candidates: list[Path] = []
              for raw in values:
                  if not raw:
                      continue
                  value = Path(raw).expanduser()
                  if not value.is_absolute():
                      continue
                  try:
                      resolved = value.resolve(strict=True)
                  except (OSError, RuntimeError):
                      continue
                  if not resolved.is_dir():
                      continue
                  if repository_root is not None and _is_relative_to(resolved, repository_root):
                      continue
                  if resolved not in candidates:
                      candidates.append(resolved)
              return tuple(candidates)


          def _known_git_candidates(source: Mapping[str, str]) -> tuple[Path, ...]:
              candidates = [
                  Path("/usr/bin/git"),
                  Path("/usr/local/bin/git"),
                  Path("/opt/homebrew/bin/git"),
                  Path("/opt/local/bin/git"),
                  Path("/snap/bin/git"),
              ]
              for key in ("PROGRAMFILES", "PROGRAMFILES(X86)", "LOCALAPPDATA"):
                  base = source.get(key)
                  if not base:
                      continue
                  root = Path(base)
                  candidates.extend(
                      (
                          root / "Git" / "cmd" / "git.exe",
                          root / "Git" / "bin" / "git.exe",
                          root / "Programs" / "Git" / "cmd" / "git.exe",
                      )
                  )
              return tuple(candidates)


          def _trusted_executable(path: Path, repository_root: Path) -> Path | None:
              try:
                  resolved = path.resolve(strict=True)
                  parent = resolved.parent
                  parent_mode = parent.stat().st_mode
              except (OSError, RuntimeError):
                  return None
              if not resolved.is_file() or _is_relative_to(resolved, repository_root):
                  return None
              if os.name != "nt":
                  if not os.access(resolved, os.X_OK):
                      return None
                  if parent_mode & stat.S_IWOTH:
                      return None
              elif resolved.suffix.lower() not in {".exe", ".cmd", ".bat", ""}:
                  return None
              return resolved


          def _resolve_git_executable(
              repository_root: Path,
              source: Mapping[str, str] | None = None,
          ) -> Path | None:
              ambient = os.environ if source is None else source
              names = ("git.exe", "git.cmd", "git.bat") if os.name == "nt" else ("git",)
              candidates: list[Path] = []
              for directory in _safe_path_entries(ambient, repository_root=repository_root):
                  candidates.extend(directory / name for name in names)
              candidates.extend(_known_git_candidates(ambient))
              seen: set[Path] = set()
              for candidate in candidates:
                  if candidate in seen:
                      continue
                  seen.add(candidate)
                  trusted = _trusted_executable(candidate, repository_root)
                  if trusted is not None:
                      return trusted
              return None


          def safe_git_environment(
              source: Mapping[str, str] | None = None,
              *,
              repository_root: Path | None = None,
              git_executable: Path | None = None,
          ) -> dict[str, str]:
              """Return the narrow environment allowed for local, read-only Git commands."""

              ambient = os.environ if source is None else source
              environment = {
                  key: value
                  for key, value in ambient.items()
                  if key.upper() in _ALLOWED_ENVIRONMENT_KEYS and isinstance(value, str)
              }
              path_entries = list(_safe_path_entries(ambient, repository_root=repository_root))
              if git_executable is not None and git_executable.parent not in path_entries:
                  path_entries.insert(0, git_executable.parent)
              environment["PATH"] = os.pathsep.join(str(path) for path in path_entries)
              environment.update(
                  {
                      "GCM_INTERACTIVE": "Never",
                      "GIT_ASKPASS": "",
                      "GIT_CONFIG_GLOBAL": os.devnull,
                      "GIT_CONFIG_NOSYSTEM": "1",
                      "GIT_CONFIG_SYSTEM": os.devnull,
                      "GIT_OPTIONAL_LOCKS": "0",
                      "GIT_PAGER": "cat",
                      "GIT_TERMINAL_PROMPT": "0",
                      "PAGER": "cat",
                      "SSH_ASKPASS": "",
                  }
              )
              environment["GIT_CONFIG_COUNT"] = str(len(_GIT_CONFIG_OVERRIDES))
              for index, (key, value) in enumerate(_GIT_CONFIG_OVERRIDES):
                  environment[f"GIT_CONFIG_KEY_{index}"] = key
                  environment[f"GIT_CONFIG_VALUE_{index}"] = value
              return environment


          def _run_bounded_command(
              command: Sequence[str],
              *,
              environment: Mapping[str, str],
              timeout_seconds: float,
              input_bytes: bytes | None,
              max_output_bytes: int,
          ) -> subprocess.CompletedProcess[bytes]:
              """Execute without a shell while draining pipes into bounded buffers."""

              argv = [str(value) for value in command]
              if max_output_bytes < 1:
                  return subprocess.CompletedProcess(argv, 125, b"", b"git_output_limit_exceeded")
              try:
                  process = subprocess.Popen(
                      argv,
                      stdin=subprocess.PIPE if input_bytes is not None else subprocess.DEVNULL,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      close_fds=os.name != "nt",
                      env=dict(environment),
                      shell=False,
                  )
              except OSError:
                  return subprocess.CompletedProcess(argv, 124, b"", b"git_process_unavailable")

              stdout = bytearray()
              stderr = bytearray()
              overflow = threading.Event()

              def drain(stream: object, destination: bytearray) -> None:
                  reader = getattr(stream, "read", None)
                  if not callable(reader):
                      return
                  while True:
                      chunk = reader(_READ_CHUNK_BYTES)
                      if not chunk:
                          return
                      remaining = max_output_bytes - len(destination)
                      if remaining > 0:
                          destination.extend(chunk[:remaining])
                      if len(chunk) > remaining:
                          overflow.set()
                          try:
                              process.kill()
                          except OSError:
                              pass
                          return

              threads = [
                  threading.Thread(target=drain, args=(process.stdout, stdout), daemon=True),
                  threading.Thread(target=drain, args=(process.stderr, stderr), daemon=True),
              ]
              for thread in threads:
                  thread.start()

              writer: threading.Thread | None = None
              if input_bytes is not None and process.stdin is not None:
                  def write_input() -> None:
                      try:
                          process.stdin.write(input_bytes)
                          process.stdin.close()
                      except (BrokenPipeError, OSError):
                          pass

                  writer = threading.Thread(target=write_input, daemon=True)
                  writer.start()

              timed_out = False
              try:
                  process.wait(timeout=max(0.01, timeout_seconds))
              except subprocess.TimeoutExpired:
                  timed_out = True
                  try:
                      process.kill()
                  except OSError:
                      pass
                  process.wait(timeout=5.0)
              for thread in threads:
                  thread.join(timeout=5.0)
              if writer is not None:
                  writer.join(timeout=1.0)
              if timed_out:
                  return subprocess.CompletedProcess(argv, 124, bytes(stdout), b"git_timeout")
              if overflow.is_set():
                  return subprocess.CompletedProcess(
                      argv,
                      125,
                      bytes(stdout),
                      b"git_output_limit_exceeded",
                  )
              return subprocess.CompletedProcess(
                  argv,
                  int(process.returncode or 0),
                  bytes(stdout),
                  bytes(stderr),
              )


          def run_git(
              root: Path,
              args: Sequence[str],
              *,
              timeout_seconds: float = 20.0,
              input_bytes: bytes | None = None,
              max_output_bytes: int = 64 * 1024 * 1024,
          ) -> subprocess.CompletedProcess[bytes]:
              """Run one bounded local Git command with a trusted executable."""

              try:
                  repository_root = root.expanduser().resolve(strict=True)
              except (OSError, RuntimeError):
                  return subprocess.CompletedProcess(
                      ["git", *[str(value) for value in args]],
                      124,
                      b"",
                      b"git_repository_unavailable",
                  )
              if input_bytes is not None and len(input_bytes) > max_output_bytes:
                  return subprocess.CompletedProcess(
                      ["git", *[str(value) for value in args]],
                      126,
                      b"",
                      b"git_input_limit_exceeded",
                  )
              executable = _resolve_git_executable(repository_root)
              if executable is None:
                  return subprocess.CompletedProcess(
                      ["git", *[str(value) for value in args]],
                      124,
                      b"",
                      b"git_executable_unavailable",
                  )
              command = [str(executable), "-C", str(repository_root), *[str(value) for value in args]]
              return _run_bounded_command(
                  command,
                  environment=safe_git_environment(
                      repository_root=repository_root,
                      git_executable=executable,
                  ),
                  timeout_seconds=timeout_seconds,
                  input_bytes=input_bytes,
                  max_output_bytes=max_output_bytes,
              )
          PY

      - name: Install, format, and validate
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/guard/secrets/git_safe.py \
            tests/test_guard_secret_git_process_security.py
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/secrets/git_safe.py \
            tests/test_guard_secret_git_process_security.py
          PYTHONPATH=src uv run --no-sync pytest -q \
            tests/test_guard_secret_git_process_security.py \
            tests/test_guard_secret_doctor.py \
            tests/test_guard_secret_coverage_edges.py \
            tests/test_guard_secret_detection.py \
            --tb=short
          uv run --no-sync basedpyright --level error \
            src/codex_plugin_scanner/guard/secrets/git_safe.py \
            tests/test_guard_secret_git_process_security.py

      - name: Advance reviewed test ratchet exactly
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/ci/generate_test_inventory.py --output /tmp/git-process-inventory.json
          python - <<'PY'
          from pathlib import Path
          import json
          inv=json.loads(Path('/tmp/git-process-inventory.json').read_text())
          path=Path('ci/test-suite-ratchet-baseline.json')
          baseline=json.loads(path.read_text())
          baseline['maximum_collected_cases']=int(inv['inventory']['collected_cases'])
          baseline['maximum_test_source_lines']=int(inv['test_source_lines'])
          path.write_text(json.dumps(baseline,indent=2)+'\n')
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py --baseline ci/test-suite-ratchet-baseline.json --inventory /tmp/git-process-inventory.json
          git diff --check

      - name: Commit without bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/secrets-git-process-bootstrap.yml
          git add ci/test-suite-ratchet-baseline.json src/codex_plugin_scanner/guard/secrets/git_safe.py tests/test_guard_secret_git_process_security.py
          git commit -m 'fix(secrets): bound Git process execution and PATH resolution'
          git push origin HEAD:fix/secrets-git-process-hardening-v2

      - name: Open protected review and request auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --head fix/secrets-git-process-hardening-v2 --base release/3.0 --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            gh pr create \
              --head fix/secrets-git-process-hardening-v2 \
              --base release/3.0 \
              --title 'fix(secrets): bound Git process execution and PATH resolution' \
              --body-file - <<'EOF'
          ## Summary

          Hardens the shared Git subprocess boundary used by HOL Guard Secrets.

          - refuses repository-local and relative-PATH Git executable hijacking
          - resolves Git only from absolute, non-repository, non-world-writable executable directories and standard OS install locations
          - drains stdout and stderr concurrently into bounded buffers and kills output bombs
          - enforces command timeout and input ceilings with stable path-free errors
          - preserves fixed argv, `shell=False`, credential-helper suppression, askpass/SSH suppression, disabled prompts, disabled pagers, and isolated Git configuration

          ## Release boundary

          Base is intentionally `release/3.0`. Do not retarget or merge this PR into `main`.
          EOF
            pr_number="$(gh pr list --head fix/secrets-git-process-hardening-v2 --base release/3.0 --state open --json number --jq '.[0].number')"
          fi
          gh pr merge "$pr_number" --auto --squash --delete-branch
