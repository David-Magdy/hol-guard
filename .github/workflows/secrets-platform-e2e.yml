name: Secrets platform end-to-end

on:
  pull_request:
    branches:
      - release/3.0
    paths:
      - '.github/workflows/secrets-platform-e2e.yml'
      - 'ci/test-suite-ratchet-baseline.json'
      - 'docs/guard/secrets-platform-hardening.md'
      - 'scripts/ci/run_guard_secrets_platform_smoke_v2.py'
      - 'src/codex_plugin_scanner/guard/secrets/**'
      - 'tests/test_guard_secret_platform_hardening.py'
      - 'pyproject.toml'
      - 'uv.lock'
  push:
    branches:
      - release/3.0
    paths:
      - '.github/workflows/secrets-platform-e2e.yml'
      - 'ci/test-suite-ratchet-baseline.json'
      - 'docs/guard/secrets-platform-hardening.md'
      - 'scripts/ci/run_guard_secrets_platform_smoke_v2.py'
      - 'src/codex_plugin_scanner/guard/secrets/**'
      - 'tests/test_guard_secret_platform_hardening.py'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-platform-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2022
        python:
          - '3.10'
          - '3.14'
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false

      - name: Install locked development environment
        shell: bash
        run: uv sync --frozen --extra dev --python '${{ matrix.python }}'

      - name: Run permanent platform and Secrets regressions
        shell: bash
        run: >-
          uv run --no-sync pytest -q
          tests/test_guard_secret_platform_hardening.py
          tests/test_guard_secret_detection.py
          tests/test_guard_secret_assignment_precision.py
          tests/test_guard_secret_fixture_precision.py
          tests/test_guard_secret_redaction.py
          --tb=short

      - name: Lint and type-check hardening boundary
        shell: bash
        run: |
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/secrets \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            tests/test_guard_secret_platform_hardening.py
          uv run --no-sync python -m ruff format --check \
            src/codex_plugin_scanner/guard/secrets \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            tests/test_guard_secret_platform_hardening.py
          uv run --no-sync basedpyright --level error \
            src/codex_plugin_scanner/guard/secrets \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            tests/test_guard_secret_platform_hardening.py

      - name: Build exact wheel
        shell: bash
        run: uv build --wheel --out-dir dist

      - name: Exercise installed wheel through real Git and hook operations
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv run --no-sync python scripts/ci/run_guard_secrets_platform_smoke_v2.py --wheel "$wheel"

      - name: Reject complete synthetic provider tokens in the checkout
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(rb"ghp_[A-Za-z0-9_]{20,255}")
          roots = (Path("src"), Path("tests"), Path("scripts"), Path("docs"))
          for root in roots:
              for path in root.rglob("*"):
                  if path.is_file() and not path.is_symlink():
                      data = path.read_bytes()
                      if pattern.search(data):
                          raise SystemExit(f"complete provider-shaped fixture committed: {path}")
          PY
