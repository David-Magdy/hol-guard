name: Apply Core feed discovery assertion once

on:
  push:
    branches:
      - fix/desktop-core-feed-arm64-wheel

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/desktop-core-feed-arm64-wheel
          persist-credentials: true

      - name: Add broad discovery regression assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          test_path = Path('tests/test_desktop_core_alpha_feed_security.py')
          text = test_path.read_text(encoding='utf-8')
          anchor = '    assert \'--pattern "hol_guard-${CORE_VERSION}-*.whl"\' not in text\n'
          addition = anchor + '    assert \'-name "hol_guard-${CORE_VERSION}-*.whl"\' not in text\n'
          if text.count(anchor) != 1:
              raise SystemExit('Expected exactly one broad download assertion anchor')
          test_path.write_text(text.replace(anchor, addition, 1), encoding='utf-8')

          baseline_path = Path('ci/test-suite-ratchet-baseline.json')
          baseline = json.loads(baseline_path.read_text(encoding='utf-8'))
          if baseline.get('maximum_test_source_lines') != 288165:
              raise SystemExit('Unexpected test-suite ratchet baseline')
          baseline['maximum_test_source_lines'] = 288166
          baseline_path.write_text(json.dumps(baseline, indent=2) + '\n', encoding='utf-8')
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_desktop_core_alpha_feed_security.py ci/test-suite-ratchet-baseline.json
          git commit -m "test(release): reject the broad wheel discovery pattern"
          git push origin HEAD:fix/desktop-core-feed-arm64-wheel
