name: Managed controls batch 02 bootstrap

on:
  push:
    branches:
      - managed-controls/batch-02-actions-limits-clean
    paths:
      - '.github/workflows/managed-controls-batch-02-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply-runtime-limits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: managed-controls/batch-02-actions-limits-clean
      - name: Apply bounded runtime limit integration
        shell: python {0}
        run: |
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              value = path.read_text(encoding='utf-8')
              if new in value:
                  return
              if old not in value:
                  raise SystemExit(f'missing expected text in {path}: {old[:80]!r}')
              path.write_text(value.replace(old, new, 1), encoding='utf-8')

          api = Path('src/codex_plugin_scanner/guard/daemon/extension_control_api.py')
          replace_once(
              api,
              '''from ..runtime.extension_control_contract import (\n    CONTROL_SCHEMA_VERSION,\n    ControlLayerKind,\n    ControlTargetKind,\n    ExtensionControl,\n    ExtensionControlLayer,\n)\nfrom ..runtime.extension_control_proof import (''',
              '''from ..runtime.extension_control_contract import (\n    CONTROL_SCHEMA_VERSION,\n    ControlLayerKind,\n    ControlTargetKind,\n    ExtensionControl,\n    ExtensionControlLayer,\n)\nfrom ..runtime.extension_control_limits import (\n    MAX_CONTROL_LAYERS,\n    MAX_CONTROLS_PER_LAYER,\n    MAX_CONTROLS_TOTAL,\n    MAX_OBSERVATIONS,\n    advertised_extension_control_limits,\n)\nfrom ..runtime.extension_control_proof import (''',
          )
          replace_once(
              api,
              '''_MAX_PENDING_PROOFS = 128\n_MAX_APPLIED_MUTATIONS = 128\n_MAX_CONTROLS = 4096\n_MAX_LAYERS = 2\n_MAX_OBSERVATIONS = 2048\n_MAX_EVENT_TARGETS = 512''',
              '''_MAX_PENDING_PROOFS = 128\n_MAX_APPLIED_MUTATIONS = 128\n_MAX_EVENT_TARGETS = 512''',
          )
          replace_once(
              api,
              '''    def catalog(self) -> dict[str, object]:\n        return {\n            "schema_version": _EXTENSION_CONTROL_API_SCHEMA,\n            "control_schema_version": CONTROL_SCHEMA_VERSION,\n            "catalog_digest": self._registry.catalog_digest,\n            "extensions": [extension.to_dict() for extension in self._registry.extensions],\n            "limits": {\n                "max_body_bytes": 1_000_000,\n                "max_controls": _MAX_CONTROLS,\n                "max_observations": _MAX_OBSERVATIONS,\n            },\n        }''',
              '''    def catalog(self) -> dict[str, object]:\n        limits = advertised_extension_control_limits()\n        return {\n            "schema_version": _EXTENSION_CONTROL_API_SCHEMA,\n            "control_schema_version": CONTROL_SCHEMA_VERSION,\n            "catalog_digest": self._registry.catalog_digest,\n            "extensions": [extension.to_dict() for extension in self._registry.extensions],\n            "limits": {\n                **limits,\n                "max_body_bytes": limits["max_catalog_payload_bytes"],\n                "max_controls": limits["max_controls_total"],\n            },\n        }''',
          )
          replace_once(
              api,
              '''        if len(raw_layers) > _MAX_LAYERS:\n            raise ExtensionControlApiError(400, "layer_limit_exceeded")''',
              '''        if len(raw_layers) > MAX_CONTROL_LAYERS:\n            raise ExtensionControlApiError(400, "layer_limit_exceeded")''',
          )
          replace_once(
              api,
              '''            if sum(len(layer.controls) for layer in layers) > _MAX_CONTROLS:\n                raise ExtensionControlApiError(400, "control_limit_exceeded")''',
              '''            if any(len(layer.controls) > MAX_CONTROLS_PER_LAYER for layer in layers):\n                raise ExtensionControlApiError(400, "layer_control_limit_exceeded")\n            if sum(len(layer.controls) for layer in layers) > MAX_CONTROLS_TOTAL:\n                raise ExtensionControlApiError(400, "control_limit_exceeded")''',
          )

          resolver = Path('src/codex_plugin_scanner/guard/runtime/extension_control_resolver.py')
          replace_once(
              resolver,
              '''    ResolverFailureCode,\n)\n\n_FAILURE_REASON = "control.resolver-failure"''',
              '''    ResolverFailureCode,\n)\nfrom .extension_control_limits import (\n    MAX_CONTROL_LAYERS,\n    MAX_CONTROLS_PER_LAYER,\n    MAX_INPUT_TEXT_LENGTH,\n    MAX_OBSERVATIONS,\n    MAX_RESOLUTION_IDS,\n)\n\n_FAILURE_REASON = "control.resolver-failure"''',
          )
          replace_once(
              resolver,
              '''_TRUSTED_LOCKDOWN_SURFACES = frozenset({ControlSurface.TRUSTED_LOCAL_RECOVERY, ControlSurface.TRUSTED_LOCAL_PROOF})\n_MAX_LAYERS = len(ControlLayerKind)\n_MAX_CONTROLS_PER_LAYER = 512\n_MAX_RESOLUTION_IDS = 1024\n_MAX_OBSERVATIONS = 2048\n_MAX_INPUT_TEXT_LENGTH = 256''',
              '''_TRUSTED_LOCKDOWN_SURFACES = frozenset({ControlSurface.TRUSTED_LOCAL_RECOVERY, ControlSurface.TRUSTED_LOCAL_PROOF})''',
          )
          replacements = {
              '_MAX_LAYERS + 1': 'MAX_CONTROL_LAYERS + 1',
              'len(layer_values) > _MAX_LAYERS': 'len(layer_values) > MAX_CONTROL_LAYERS',
              'len(layer.controls) > _MAX_CONTROLS_PER_LAYER': 'len(layer.controls) > MAX_CONTROLS_PER_LAYER',
              'len(extension_ids) > _MAX_RESOLUTION_IDS': 'len(extension_ids) > MAX_RESOLUTION_IDS',
              'len(permission_ids) > _MAX_RESOLUTION_IDS': 'len(permission_ids) > MAX_RESOLUTION_IDS',
              'len(observations) > _MAX_OBSERVATIONS': 'len(observations) > MAX_OBSERVATIONS',
              'len(value) > _MAX_INPUT_TEXT_LENGTH': 'len(value) > MAX_INPUT_TEXT_LENGTH',
              'observations[:_MAX_OBSERVATIONS]': 'observations[:MAX_OBSERVATIONS]',
          }
          value = resolver.read_text(encoding='utf-8')
          for old, new in replacements.items():
              if old in value:
                  value = value.replace(old, new)
              elif new not in value:
                  raise SystemExit(f'missing expected resolver text: {old}')
          resolver.write_text(value, encoding='utf-8')
      - name: Verify focused contracts
        run: |
          python -m compileall -q src/codex_plugin_scanner/guard/runtime/extension_control_limits.py src/codex_plugin_scanner/guard/runtime/extension_control_resolver.py src/codex_plugin_scanner/guard/daemon/extension_control_api.py
      - name: Commit runtime integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/codex_plugin_scanner/guard/daemon/extension_control_api.py src/codex_plugin_scanner/guard/runtime/extension_control_resolver.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat: enforce shared extension control limits'
          git push origin HEAD:managed-controls/batch-02-actions-limits-clean
