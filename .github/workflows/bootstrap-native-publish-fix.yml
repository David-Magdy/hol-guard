name: Stage verified native publication artifact

on:
  push:
    branches: [feat/rust-runtime-native-publish]
    paths:
      - ".github/workflows/bootstrap-native-publish-fix.yml"

permissions:
  actions: read
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: feat/rust-runtime-native-publish
      - name: Download the previously validated payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: native-publication-patch-1ee58e55249bd16f4e8137e8cefbad899e12e629
          path: validated-native-publication
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31512198169
      - name: Verify the immutable payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(find validated-native-publication -type f | sort | sed 's#^validated-native-publication/##')" = "$(printf '%s\n' \
            .github/workflows/publish.yml \
            ci/native_runtime/test_native_runtime_release.py \
            manifest.json \
            tests/test_release_train_workflow.py | sort)"
          test "$(sha256sum validated-native-publication/.github/workflows/publish.yml | awk '{print $1}')" = "695cba2f71d77e32fda83768153f7b6cebd039621fabe3acfe475e53f766449b"
          test "$(sha256sum validated-native-publication/ci/native_runtime/test_native_runtime_release.py | awk '{print $1}')" = "031c3b0179ccddd7e15718a4aa3fbf196be00fdae7c2caeccb8d83fbb47529a0"
          test "$(sha256sum validated-native-publication/tests/test_release_train_workflow.py | awk '{print $1}')" = "da8aad15ede53f5560a0d0f74a304e49abb49ca9cda68fa3dd3c77c72673a31f"
          grep -Fq '"source_sha": "1ee58e55249bd16f4e8137e8cefbad899e12e629"' validated-native-publication/manifest.json
      - name: Stage only non-workflow paths
        shell: bash
        run: |
          set -euo pipefail
          cp validated-native-publication/.github/workflows/publish.yml ci/native_runtime/generated_publish_workflow.yml
          cp validated-native-publication/ci/native_runtime/test_native_runtime_release.py ci/native_runtime/test_native_runtime_release.py
          cp validated-native-publication/tests/test_release_train_workflow.py tests/test_release_train_workflow.py
          git add \
            ci/native_runtime/generated_publish_workflow.yml \
            ci/native_runtime/test_native_runtime_release.py \
            tests/test_release_train_workflow.py
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^\.github/'; then
            echo "The staging commit must not modify GitHub workflow paths" >&2
            exit 1
          fi
          git diff --cached --name-only | grep -Fxq 'ci/native_runtime/generated_publish_workflow.yml'
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git commit -m "fix(release): stage validated native publication payload"
      - name: Push the staging commit
        shell: bash
        run: |
          set -euo pipefail
          branch=feat/rust-runtime-native-publish
          remote_sha=$(git ls-remote --exit-code origin "refs/heads/${branch}" | awk '{print $1}')
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "Publication branch moved while the payload was staged" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/${branch}"
