name: Command matrix finalizer

on:
  pull_request:
    paths:
      - ".github/workflows/command-matrix-diagnostics.yml"
      - "src/codex_plugin_scanner/guard/runtime/**"
      - "tests/**"
      - "ci/test-suite-ratchet-baseline.json"
      - "docs/guard/command-*.md"

permissions:
  contents: write

concurrency:
  group: command-matrix-finalizer-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/command-variants-301-400-aws-long-tail'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Format and lint changed Python sources
        run: |
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/guard/runtime/command_cloud_aws_operation_matrix.py \
            src/codex_plugin_scanner/guard/runtime/command_cloud_extensions.py \
            tests/test_guard_command_cloud_aws_batch_1.py \
            tests/test_guard_command_cloud_aws_batch_4.py
          uv run --no-sync python -m ruff check --fix \
            src/codex_plugin_scanner/guard/runtime/command_cloud_aws_operation_matrix.py \
            src/codex_plugin_scanner/guard/runtime/command_cloud_extensions.py \
            tests/test_guard_command_cloud_aws_batch_1.py \
            tests/test_guard_command_cloud_aws_batch_4.py

      - name: Mark operation matrix complete
        run: |
          uv run --no-sync python - <<'PY'
          import re
          from pathlib import Path

          path = Path("docs/guard/command-extension-operation-matrix-todo.md")
          text = path.read_text(encoding="utf-8")
          if "- Completed batches: 3/4" not in text or "- Completed operation tasks: 300/400" not in text:
              raise SystemExit("unexpected operation matrix progress state")
          text = text.replace("- Completed batches: 3/4", "- Completed batches: 4/4", 1)
          text = text.replace("- Completed operation tasks: 300/400", "- Completed operation tasks: 400/400", 1)

          def complete_task(match: re.Match[str]) -> str:
              task_number = int(match.group(1))
              if 301 <= task_number <= 400:
                  return f"- [x] {match.group(1)}."
              return match.group(0)

          text, completed = re.subn(r"^- \[ \] (\d{3})\.", complete_task, text, flags=re.MULTILINE)
          if completed != 100:
              raise SystemExit(f"expected to complete 100 tasks, completed {completed}")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Regenerate catalog, evidence, and test ratchets
        run: |
          uv run --no-sync python - <<'PY'
          import re
          from pathlib import Path

          from codex_plugin_scanner.guard.runtime.command_extensions import BUILT_IN_COMMAND_EXTENSION_REGISTRY

          digest = BUILT_IN_COMMAND_EXTENSION_REGISTRY.catalog_digest

          catalog_path = Path("tests/fixtures/extension-controls/catalog-baseline.v1.json")
          catalog = catalog_path.read_text(encoding="utf-8")
          catalog, catalog_count = re.subn(
              r'("catalog_digest"\s*:\s*")[0-9a-f]{64}(")',
              rf"\g<1>{digest}\g<2>",
              catalog,
              count=1,
          )
          if catalog_count != 1:
              raise SystemExit("catalog digest replacement did not match exactly once")
          catalog_path.write_text(catalog, encoding="utf-8")

          permission_path = Path("tests/test_guard_command_permission_catalog.py")
          permission = permission_path.read_text(encoding="utf-8")
          permission, permission_count = re.subn(
              r'(catalog_digest\s*==\s*")[0-9a-f]{64}(")',
              rf"\g<1>{digest}\g<2>",
              permission,
              count=1,
          )
          if permission_count != 1:
              raise SystemExit("permission catalog digest replacement did not match exactly once")
          permission_path.write_text(permission, encoding="utf-8")
          print(f"catalog digest: {digest}")
          PY
          uv run --no-sync python tests/guard_command_decision_diff.py --write
          uv run --no-sync python scripts/ci/test_inventory.py --output test-inventory.json
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path("test-inventory.json").read_text(encoding="utf-8"))
          baseline = {
              "maximum_collected_cases": inventory["inventory"]["collected_cases"],
              "maximum_test_source_lines": inventory["test_source_lines"],
              "schema_version": 1,
          }
          Path("ci/test-suite-ratchet-baseline.json").write_text(
              json.dumps(baseline, indent=2, sort_keys=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(baseline, sort_keys=True))
          PY

      - name: Restore permanent workflow and remove finalizer
        run: |
          git fetch origin release/3.0 --depth=1
          git show FETCH_HEAD:.github/workflows/desktop-contract-ci.yml > .github/workflows/desktop-contract-ci.yml
          git rm .github/workflows/command-matrix-diagnostics.yml

      - name: Validate finalized batch
        run: |
          uv run --no-sync python -m ruff format --check \
            src/codex_plugin_scanner/guard/runtime/command_cloud_aws_operation_matrix.py \
            src/codex_plugin_scanner/guard/runtime/command_cloud_extensions.py \
            tests/test_guard_command_cloud_aws_batch_1.py \
            tests/test_guard_command_cloud_aws_batch_4.py
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/runtime/command_cloud_aws_operation_matrix.py \
            src/codex_plugin_scanner/guard/runtime/command_cloud_extensions.py \
            tests/test_guard_command_cloud_aws_batch_1.py \
            tests/test_guard_command_cloud_aws_batch_4.py \
            tests/test_guard_command_permission_catalog.py
          uv run --no-sync pytest -q \
            tests/test_guard_command_cloud_aws_batch_1.py \
            tests/test_guard_command_cloud_aws_batch_4.py \
            tests/test_guard_command_cloud_extensions.py \
            tests/test_guard_command_permission_catalog.py \
            --tb=short
          uv run --no-sync python tests/guard_command_decision_diff.py --check
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory test-inventory.json
          git diff --check

      - name: Commit generated evidence
        run: |
          rm -f test-inventory.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(extensions): finalize AWS long-tail evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
