name: Fix PR 2325 enum and reason contracts

on:
  push:
    branches:
      - automation/fix-pr2325-enums-reasons-final-0814

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/secrets-v2-evidence-contracts-clean
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Apply enum and reason-manifest hardening
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6b161c61198a88412089036616783703780c49ab"
          python - <<'PY'
          from pathlib import Path

          contracts_path = Path("src/codex_plugin_scanner/guard/secrets/contracts_v2.py")
          text = contracts_path.read_text(encoding="utf-8")

          schema_anchor = '_SCHEMA_SOURCE_CAPABILITIES: Final = "guard-secrets-source-capabilities.v2"\n'
          if text.count(schema_anchor) != 1:
              raise SystemExit("reason schema anchor was not unique")
          text = text.replace(
              schema_anchor,
              schema_anchor + '_SCHEMA_REASON_CODES: Final = "guard-secrets-reason-codes.v2"\n',
              1,
          )

          reason_start = text.index("REASON_CODES_V2: Final[frozenset[str]] = frozenset(")
          reason_end = text.index("IGNORE_REASON_CODES_V2: Final[frozenset[str]]", reason_start)
          reason_authority = '''_REASON_CODE_CATEGORIES_MUTABLE: dict[str, tuple[str, ...]] = {
              "coverage": (
                  "archive_budget_exceeded",
                  "binary_skipped",
                  "encoding_unsupported",
                  "file_changed_during_scan",
                  "git_object_missing",
                  "history_shallow",
                  "lfs_object_missing",
                  "max_bytes",
                  "max_commits",
                  "max_files",
                  "max_findings",
                  "source_unreadable",
              ),
              "detector": (
                  "detector_bundle_invalid",
                  "detector_unavailable",
                  "model_bundle_invalid",
                  "model_degraded",
              ),
              "validation": (
                  "validation_error",
                  "validation_rate_limited",
                  "validation_unknown",
                  "validation_unsupported",
              ),
              "policy": ("policy_block", "policy_refresh_required"),
              "worker": ("cleanup_failed", "worker_cancelled", "worker_timeout"),
              "cache": ("cache_stale",),
          }
          REASON_CODE_CATEGORIES_V2: Final[Mapping[str, tuple[str, ...]]] = MappingProxyType(
              dict(_REASON_CODE_CATEGORIES_MUTABLE)
          )
          REASON_CODE_RULES_V2: Final[Mapping[str, bool]] = MappingProxyType(
              {
                  "stable": True,
                  "non_sensitive": True,
                  "unknown_codes_fail_closed": True,
                  "raw_exception_text_forbidden": True,
              }
          )
          REASON_CODES_V2: Final[frozenset[str]] = frozenset(
              code
              for codes in _REASON_CODE_CATEGORIES_MUTABLE.values()
              for code in codes
          )
          '''
          text = text[:reason_start] + reason_authority + text[reason_end:]

          prohibited_old = 'r"(?:^|_)(?:raw(?:_value)?|raw_?secret|candidate(?:_value)?|credential(?:_value)?|"'
          prohibited_new = 'r"(?:^|_)(?:raw_value|raw_?secret|candidate(?:_value)?|credential(?:_value)?|"'
          if text.count(prohibited_old) != 1:
              raise SystemExit("prohibited-key anchor was not unique")
          text = text.replace(prohibited_old, prohibited_new, 1)

          enum_anchor = '''def _enum_value(enum_type: type[Enum], value: object, *, field_name: str) -> Enum:
              text = _required_text(value, field_name=field_name)
              try:
                  return enum_type(text)
              except ValueError as error:
                  raise SecretContractError(f"{field_name}: invalid value") from error
          '''
          enum_helper = enum_anchor + '''

          def _require_enum_instance(value: object, enum_type: type[Enum], *, field_name: str) -> None:
              """Reject raw strings and unrelated enums on direct construction."""

              if not isinstance(value, enum_type):
                  raise SecretContractError(f"{field_name}: expected {enum_type.__name__}")
          '''
          if text.count(enum_anchor) != 1:
              raise SystemExit("enum helper anchor was not unique")
          text = text.replace(enum_anchor, enum_helper, 1)

          def insert_after_post_init(source: str, class_name: str, statements: list[str]) -> str:
              lines = source.splitlines()
              class_index = lines.index(f"class {class_name}:")
              class_end = next(
                  index
                  for index in range(class_index + 1, len(lines))
                  if lines[index].startswith("class ") or lines[index].startswith("@dataclass")
              )
              post_init = lines.index("    def __post_init__(self) -> None:", class_index, class_end)
              lines[post_init + 1:post_init + 1] = statements
              return "\n".join(lines) + "\n"

          text = insert_after_post_init(
              text,
              "SecretIgnoreDecisionV2",
              [
                  '        _require_enum_instance(self.state, SecretIgnoreState, field_name="state")',
                  '        _require_enum_instance(',
                  '            self.requested_scope,',
                  '            SecretIgnoreScope,',
                  '            field_name="requested_scope",',
                  '        )',
              ],
          )
          text = insert_after_post_init(
              text,
              "SecretCustomRuleV2",
              [
                  '        _require_enum_instance(',
                  '            self.matcher_kind,',
                  '            SecretRuleMatcherKind,',
                  '            field_name="matcher_kind",',
                  '        )',
                  '        _require_enum_instance(',
                  '            self.compile_state,',
                  '            SecretRuleCompileState,',
                  '            field_name="compile_state",',
                  '        )',
                  '        _require_enum_instance(',
                  '            self.rollout_state,',
                  '            SecretRolloutState,',
                  '            field_name="rollout_state",',
                  '        )',
              ],
          )
          text = insert_after_post_init(
              text,
              "CapabilityEvidenceV2",
              ['        _require_enum_instance(self.state, ParityState, field_name="state")'],
          )

          manifest_anchor = '''@dataclass(frozen=True, slots=True)
          class OrganizationMetricDefinitionV2:
          '''
          reason_dataclass = '''@dataclass(frozen=True, slots=True)
          class ReasonCodeManifestV2:
              """Runtime-validated reason-code categories and fail-closed rules."""

              category_ids: tuple[str, ...]
              codes: frozenset[str]
              rule_ids: tuple[str, ...]


          ''' + manifest_anchor
          if text.count(manifest_anchor) != 1:
              raise SystemExit("reason manifest dataclass anchor was not unique")
          text = text.replace(manifest_anchor, reason_dataclass, 1)

          parser_anchor = '''def parse_capability_evidence_manifest(payload: Mapping[str, object]) -> CapabilityManifestV2:
          '''
          reason_parser = '''def parse_reason_codes_manifest(payload: Mapping[str, object]) -> ReasonCodeManifestV2:
              """Parse and compare the reason-code manifest to runtime authority."""

              allowed = {"schema", "categories", "rules"}
              unknown = sorted(set(payload) - allowed)
              if unknown:
                  raise SecretContractError(
                      f"{_SCHEMA_REASON_CODES}: unknown fields: {', '.join(unknown)}"
                  )
              if payload.get("schema") != _SCHEMA_REASON_CODES:
                  raise SecretContractError("unsupported reason-code manifest schema")

              categories = _mapping(payload.get("categories"), field_name="categories")
              expected_category_ids = tuple(REASON_CODE_CATEGORIES_V2)
              if tuple(categories) != expected_category_ids:
                  raise SecretContractError(
                      "reason-code category registry does not match the runtime contract"
                  )

              seen: set[str] = set()
              for category_id, expected_codes in REASON_CODE_CATEGORIES_V2.items():
                  declared_codes = _str_tuple(
                      categories.get(category_id),
                      field_name=f"categories.{category_id}",
                      allow_empty=False,
                  )
                  if len(set(declared_codes)) != len(declared_codes):
                      raise SecretContractError(
                          f"categories.{category_id}: reason codes must be unique"
                      )
                  duplicates = sorted(seen.intersection(declared_codes))
                  if duplicates:
                      raise SecretContractError(
                          "reason codes must belong to exactly one category: "
                          + ", ".join(duplicates)
                      )
                  if declared_codes != expected_codes:
                      raise SecretContractError(
                          f"categories.{category_id}: codes do not match the runtime contract"
                      )
                  seen.update(declared_codes)
              if frozenset(seen) != REASON_CODES_V2:
                  raise SecretContractError(
                      "reason-code registry does not match the runtime contract"
                  )

              rules = _mapping(payload.get("rules"), field_name="rules")
              if tuple(rules) != tuple(REASON_CODE_RULES_V2):
                  raise SecretContractError(
                      "reason-code rule registry does not match the runtime contract"
                  )
              for rule_id, expected_value in REASON_CODE_RULES_V2.items():
                  declared_value = _required_bool(
                      rules.get(rule_id),
                      field_name=f"rules.{rule_id}",
                  )
                  if declared_value is not expected_value:
                      raise SecretContractError(
                          f"rules.{rule_id}: policy does not match the runtime contract"
                      )

              return ReasonCodeManifestV2(
                  category_ids=expected_category_ids,
                  codes=frozenset(seen),
                  rule_ids=tuple(REASON_CODE_RULES_V2),
              )


          ''' + parser_anchor
          if text.count(parser_anchor) != 1:
              raise SystemExit("reason parser insertion anchor was not unique")
          text = text.replace(parser_anchor, reason_parser, 1)

          export_replacements = {
              '    "REASON_CODES_V2",\n': '    "REASON_CODE_CATEGORIES_V2",\n    "REASON_CODE_RULES_V2",\n    "REASON_CODES_V2",\n',
              '    "ProductBoundaryManifestV2",\n': '    "ProductBoundaryManifestV2",\n    "ReasonCodeManifestV2",\n',
              '    "parse_product_boundaries_manifest",\n': '    "parse_product_boundaries_manifest",\n    "parse_reason_codes_manifest",\n',
          }
          for old, new in export_replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"export anchor was not unique: {old.strip()}")
              text = text.replace(old, new, 1)
          contracts_path.write_text(text, encoding="utf-8")

          gate_path = Path("scripts/ci/guard_secrets_release_claim_gate.py")
          gate = gate_path.read_text(encoding="utf-8")
          replacements = (
              (
                  '''    Callable[[Mapping[str, object]], object],
              _CapabilityValidator,
          ]:
          ''',
                  '''    Callable[[Mapping[str, object]], object],
              Callable[[Mapping[str, object]], object],
              _CapabilityValidator,
          ]:
          ''',
              ),
              (
                  '''        cast(
                  Callable[[Mapping[str, object]], object],
                  _symbol(module, "parse_source_capabilities_manifest"),
              ),
              cast(
                  _CapabilityValidator,
          ''',
                  '''        cast(
                  Callable[[Mapping[str, object]], object],
                  _symbol(module, "parse_source_capabilities_manifest"),
              ),
              cast(
                  Callable[[Mapping[str, object]], object],
                  _symbol(module, "parse_reason_codes_manifest"),
              ),
              cast(
                  _CapabilityValidator,
          ''',
              ),
              (
                  '''    source_capability_payload: Mapping[str, object],
              exact_release_commit: str | None,
          ''',
                  '''    source_capability_payload: Mapping[str, object],
              reason_code_payload: Mapping[str, object],
              exact_release_commit: str | None,
          ''',
              ),
              (
                  '''        parse_source_capabilities_manifest,
              validate_capability_manifest,
          ''',
                  '''        parse_source_capabilities_manifest,
              parse_reason_codes_manifest,
              validate_capability_manifest,
          ''',
              ),
              (
                  '''        _ = parse_source_capabilities_manifest(source_capability_payload)
              manifest = parse_capability_evidence_manifest(capability_payload)
          ''',
                  '''        _ = parse_source_capabilities_manifest(source_capability_payload)
              _ = parse_reason_codes_manifest(reason_code_payload)
              manifest = parse_capability_evidence_manifest(capability_payload)
          ''',
              ),
              (
                  '''    parser.add_argument("--source-capabilities", type=Path, required=True)
              parser.add_argument("--release-commit", required=True)
          ''',
                  '''    parser.add_argument("--source-capabilities", type=Path, required=True)
              parser.add_argument("--reason-codes", type=Path, required=True)
              parser.add_argument("--release-commit", required=True)
          ''',
              ),
              (
                  '''            source_capability_payload=load_manifest(args.source_capabilities),
                  exact_release_commit=args.release_commit,
          ''',
                  '''            source_capability_payload=load_manifest(args.source_capabilities),
                  reason_code_payload=load_manifest(args.reason_codes),
                  exact_release_commit=args.release_commit,
          ''',
              ),
          )
          for old, new in replacements:
              if gate.count(old) != 1:
                  raise SystemExit(f"gate anchor was not unique: {old.splitlines()[0]}")
              gate = gate.replace(old, new, 1)
          gate_path.write_text(gate, encoding="utf-8")

          toolchain_path = Path("scripts/write_release_toolchain_sbom.py")
          toolchain = toolchain_path.read_text(encoding="utf-8")
          toolchain_replacements = (
              (
                  '_SOURCE_CAPABILITIES_MANIFEST = Path("docs/guard/contracts/guard-secrets-source-capabilities.v2.json")\n',
                  '_SOURCE_CAPABILITIES_MANIFEST = Path("docs/guard/contracts/guard-secrets-source-capabilities.v2.json")\n_REASON_CODES_MANIFEST = Path("docs/guard/contracts/guard-secrets-reason-codes.v2.json")\n',
              ),
              (
                  '''        "--source-capabilities",
                  str(repository_root / _SOURCE_CAPABILITIES_MANIFEST),
                  "--release-commit",
          ''',
                  '''        "--source-capabilities",
                  str(repository_root / _SOURCE_CAPABILITIES_MANIFEST),
                  "--reason-codes",
                  str(repository_root / _REASON_CODES_MANIFEST),
                  "--release-commit",
          ''',
              ),
          )
          for old, new in toolchain_replacements:
              if toolchain.count(old) != 1:
                  raise SystemExit(f"toolchain anchor was not unique: {old.splitlines()[0]}")
              toolchain = toolchain.replace(old, new, 1)
          toolchain_path.write_text(toolchain, encoding="utf-8")

          contracts_tests_path = Path("tests/test_guard_secret_contracts_v2.py")
          tests = contracts_tests_path.read_text(encoding="utf-8")
          test_replacements = (
              (
                  '''    OUTCOME_SURFACE_MAPPING,
              REASON_CODES_V2,
          ''',
                  '''    OUTCOME_SURFACE_MAPPING,
              REASON_CODE_CATEGORIES_V2,
              REASON_CODE_RULES_V2,
              REASON_CODES_V2,
          ''',
              ),
              (
                  '''    parse_product_boundaries_manifest,
              parse_source_capabilities_manifest,
          ''',
                  '''    parse_product_boundaries_manifest,
              parse_reason_codes_manifest,
              parse_source_capabilities_manifest,
          ''',
              ),
              (
                  '_SOURCE_CAPABILITY_PATH = _REPOSITORY_ROOT / "docs/guard/contracts/guard-secrets-source-capabilities.v2.json"\n',
                  '_SOURCE_CAPABILITY_PATH = _REPOSITORY_ROOT / "docs/guard/contracts/guard-secrets-source-capabilities.v2.json"\n_REASON_CODE_PATH = _REPOSITORY_ROOT / "docs/guard/contracts/guard-secrets-reason-codes.v2.json"\n',
              ),
          )
          for old, new in test_replacements:
              if tests.count(old) != 1:
                  raise SystemExit(f"contract-test anchor was not unique: {old.splitlines()[0]}")
              tests = tests.replace(old, new, 1)

          helper_anchor = '''def test_complete_coverage_is_clean_eligible() -> None:
          '''
          direct_helpers = '''def _direct_ignore(**overrides: object) -> SecretIgnoreDecisionV2:
              values: dict[str, object] = {
                  "decision_id": "ignore:direct",
                  "state": SecretIgnoreState.REQUESTED,
                  "requested_scope": SecretIgnoreScope.OCCURRENCE,
                  "durable_match_key": "a" * 64,
                  "reason": "pending_review",
                  "expires_at": datetime.now(timezone.utc) + timedelta(days=7),
                  "detector_version": "guard-secrets-v2",
                  "model_version": None,
                  "requester_id": "user:1",
                  "approver_id": None,
                  "policy_source": "personal",
                  "propagation": ("cli",),
              }
              values.update(overrides)
              return SecretIgnoreDecisionV2(**values)  # type: ignore[arg-type]


          def _direct_custom_rule(**overrides: object) -> SecretCustomRuleV2:
              values: dict[str, object] = {
                  "rule_id": "rule:direct",
                  "version": "1.0.0",
                  "matcher_kind": SecretRuleMatcherKind.REGEX,
                  "matcher_digest": "a" * 64,
                  "safe_fixture_digest": "b" * 64,
                  "provenance_digest": "c" * 64,
                  "compile_state": SecretRuleCompileState.VALID,
                  "complexity_budget": 100,
                  "rollout_state": SecretRolloutState.DRAFT,
                  "surfaces": ("cli",),
              }
              values.update(overrides)
              return SecretCustomRuleV2(**values)  # type: ignore[arg-type]


          ''' + helper_anchor
          if tests.count(helper_anchor) != 1:
              raise SystemExit("direct helper insertion anchor was not unique")
          tests = tests.replace(helper_anchor, direct_helpers, 1)

          ignore_anchor = '''def test_approved_ignore_requires_approver() -> None:
          '''
          enum_tests = '''@pytest.mark.parametrize(
              ("field_name", "value", "expected_type"),
              [
                  ("state", "requested", "SecretIgnoreState"),
                  ("requested_scope", "occurrence", "SecretIgnoreScope"),
              ],
          )
          def test_direct_ignore_rejects_raw_enum_values(
              field_name: str,
              value: str,
              expected_type: str,
          ) -> None:
              with pytest.raises(SecretContractError, match=f"expected {expected_type}"):
                  _direct_ignore(**{field_name: value})


          ''' + ignore_anchor
          if tests.count(ignore_anchor) != 1:
              raise SystemExit("ignore enum test anchor was not unique")
          tests = tests.replace(ignore_anchor, enum_tests, 1)

          custom_anchor = '''def test_active_custom_rule_must_compile_validly() -> None:
          '''
          custom_enum_tests = '''@pytest.mark.parametrize(
              ("field_name", "value", "expected_type"),
              [
                  ("matcher_kind", "regex", "SecretRuleMatcherKind"),
                  ("compile_state", "valid", "SecretRuleCompileState"),
                  ("rollout_state", "active", "SecretRolloutState"),
              ],
          )
          def test_direct_custom_rule_rejects_raw_enum_values(
              field_name: str,
              value: str,
              expected_type: str,
          ) -> None:
              with pytest.raises(SecretContractError, match=f"expected {expected_type}"):
                  _direct_custom_rule(**{field_name: value})


          def test_raw_active_invalid_custom_rule_cannot_bypass_compile_check() -> None:
              with pytest.raises(SecretContractError, match="expected SecretRuleCompileState"):
                  _direct_custom_rule(compile_state="invalid", rollout_state="active")


          ''' + custom_anchor
          if tests.count(custom_anchor) != 1:
              raise SystemExit("custom enum test anchor was not unique")
          tests = tests.replace(custom_anchor, custom_enum_tests, 1)

          capability_anchor = '''def test_release_claim_rejects_unverified_capability() -> None:
          '''
          capability_enum_test = '''def test_direct_capability_rejects_raw_parity_state() -> None:
              with pytest.raises(SecretContractError, match="expected ParityState"):
                  _capability(
                      state="verified_on_release_candidate",
                      release_commit="d" * 40,
                      evidence_artifacts=("sha256:evidence",),
                      gap_label=None,
                  )


          ''' + capability_anchor
          if tests.count(capability_anchor) != 1:
              raise SystemExit("capability enum test anchor was not unique")
          tests = tests.replace(capability_anchor, capability_enum_test, 1)

          reason_old = '''def test_repository_reason_code_registry_matches_runtime() -> None:
              payload = _load(_REPOSITORY_ROOT / "docs/guard/contracts/guard-secrets-reason-codes.v2.json")
              categories = payload["categories"]
              assert isinstance(categories, dict)
              declared = {code for codes in categories.values() for code in codes}
              assert declared == REASON_CODES_V2
          '''
          reason_tests = '''def test_repository_reason_code_manifest_matches_runtime() -> None:
              manifest = parse_reason_codes_manifest(_load(_REASON_CODE_PATH))
              assert manifest.category_ids == tuple(REASON_CODE_CATEGORIES_V2)
              assert manifest.codes == REASON_CODES_V2
              assert manifest.rule_ids == tuple(REASON_CODE_RULES_V2)


          def test_reason_code_manifest_rejects_schema_drift() -> None:
              payload = _load(_REASON_CODE_PATH)
              payload["schema"] = "guard-secrets-reason-codes.v3"
              with pytest.raises(SecretContractError, match="unsupported reason-code"):
                  parse_reason_codes_manifest(payload)


          def test_reason_code_manifest_rejects_category_registry_drift() -> None:
              payload = _load(_REASON_CODE_PATH)
              categories = payload["categories"]
              assert isinstance(categories, dict)
              categories["unreviewed"] = ["unreviewed_reason"]
              with pytest.raises(SecretContractError, match="category registry"):
                  parse_reason_codes_manifest(payload)


          def test_reason_code_manifest_rejects_code_drift() -> None:
              payload = _load(_REASON_CODE_PATH)
              categories = payload["categories"]
              assert isinstance(categories, dict)
              coverage = categories["coverage"]
              assert isinstance(coverage, list)
              coverage[0] = "unreviewed_reason"
              with pytest.raises(SecretContractError, match="codes do not match"):
                  parse_reason_codes_manifest(payload)


          def test_reason_code_manifest_rejects_duplicate_code_in_category() -> None:
              payload = _load(_REASON_CODE_PATH)
              categories = payload["categories"]
              assert isinstance(categories, dict)
              coverage = categories["coverage"]
              assert isinstance(coverage, list)
              coverage.append(coverage[0])
              with pytest.raises(SecretContractError, match="must be unique"):
                  parse_reason_codes_manifest(payload)


          def test_reason_code_manifest_rejects_code_in_multiple_categories() -> None:
              payload = _load(_REASON_CODE_PATH)
              categories = payload["categories"]
              assert isinstance(categories, dict)
              coverage = categories["coverage"]
              detector = categories["detector"]
              assert isinstance(coverage, list)
              assert isinstance(detector, list)
              detector.insert(0, coverage[0])
              with pytest.raises(SecretContractError, match="exactly one category"):
                  parse_reason_codes_manifest(payload)


          @pytest.mark.parametrize("rule_id", tuple(REASON_CODE_RULES_V2))
          def test_reason_code_manifest_rejects_rule_weakening(rule_id: str) -> None:
              payload = _load(_REASON_CODE_PATH)
              rules = payload["rules"]
              assert isinstance(rules, dict)
              rules[rule_id] = False
              with pytest.raises(SecretContractError, match="policy does not match"):
                  parse_reason_codes_manifest(payload)


          def test_reason_code_manifest_rejects_rule_registry_drift() -> None:
              payload = _load(_REASON_CODE_PATH)
              rules = payload["rules"]
              assert isinstance(rules, dict)
              rules["unreviewed"] = True
              with pytest.raises(SecretContractError, match="rule registry"):
                  parse_reason_codes_manifest(payload)
          '''
          if tests.count(reason_old) != 1:
              raise SystemExit("reason registry test anchor was not unique")
          tests = tests.replace(reason_old, reason_tests, 1)
          contracts_tests_path.write_text(tests, encoding="utf-8")

          gate_tests_path = Path("tests/test_guard_secret_release_claim_gate.py")
          gate_tests = gate_tests_path.read_text(encoding="utf-8")
          gate_test_replacements = (
              (
                  '_SOURCE_CAPABILITY_PATH = _REPOSITORY_ROOT / "docs/guard/contracts/guard-secrets-source-capabilities.v2.json"\n',
                  '_SOURCE_CAPABILITY_PATH = _REPOSITORY_ROOT / "docs/guard/contracts/guard-secrets-source-capabilities.v2.json"\n_REASON_CODE_PATH = _REPOSITORY_ROOT / "docs/guard/contracts/guard-secrets-reason-codes.v2.json"\n',
              ),
              (
                  '''    source_capability_payload: dict[str, object] | None = None,
              ) -> tuple[str, ...]:
          ''',
                  '''    source_capability_payload: dict[str, object] | None = None,
              reason_code_payload: dict[str, object] | None = None,
              ) -> tuple[str, ...]:
          ''',
              ),
              (
                  '''        source_capability_payload=(
                  source_capability_payload if source_capability_payload is not None else _load(_SOURCE_CAPABILITY_PATH)
              ),
              exact_release_commit=release_commit,
          ''',
                  '''        source_capability_payload=(
                  source_capability_payload if source_capability_payload is not None else _load(_SOURCE_CAPABILITY_PATH)
              ),
              reason_code_payload=(
                  reason_code_payload if reason_code_payload is not None else _load(_REASON_CODE_PATH)
              ),
              exact_release_commit=release_commit,
          ''',
              ),
              (
                  '''        source_capability_payload=load_manifest(_SOURCE_CAPABILITY_PATH),
              exact_release_commit="a" * 40,
          ''',
                  '''        source_capability_payload=load_manifest(_SOURCE_CAPABILITY_PATH),
              reason_code_payload=load_manifest(_REASON_CODE_PATH),
              exact_release_commit="a" * 40,
          ''',
              ),
              (
                  '''            source_capability_payload=_load(_SOURCE_CAPABILITY_PATH),
                  exact_release_commit=None,
          ''',
                  '''            source_capability_payload=_load(_SOURCE_CAPABILITY_PATH),
                  reason_code_payload=_load(_REASON_CODE_PATH),
                  exact_release_commit=None,
          ''',
              ),
          )
          for old, new in gate_test_replacements:
              if gate_tests.count(old) != 1:
                  raise SystemExit(f"gate-test anchor was not unique: {old.splitlines()[0]}")
              gate_tests = gate_tests.replace(old, new, 1)

          argv_anchor = '''        "--source-capabilities",
                  str(_SOURCE_CAPABILITY_PATH),
          '''
          argv_replacement = argv_anchor + '''        "--reason-codes",
                  str(_REASON_CODE_PATH),
          '''
          if gate_tests.count(argv_anchor) != 3:
              raise SystemExit(f"expected 3 gate argv anchors, found {gate_tests.count(argv_anchor)}")
          gate_tests = gate_tests.replace(argv_anchor, argv_replacement)

          gate_reason_anchor = '''def test_main_returns_zero_for_repository_policy(capsys: pytest.CaptureFixture[str]) -> None:
          '''
          gate_reason_tests = '''def test_reason_code_schema_drift_is_rejected_by_gate() -> None:
              payload = _load(_REASON_CODE_PATH)
              payload["schema"] = "guard-secrets-reason-codes.v3"
              with pytest.raises(ClaimGateError, match="unsupported reason-code"):
                  _validate(_manifest(), reason_code_payload=payload)


          @pytest.mark.parametrize(
              "rule_id",
              (
                  "stable",
                  "non_sensitive",
                  "unknown_codes_fail_closed",
                  "raw_exception_text_forbidden",
              ),
          )
          def test_reason_code_policy_weakening_is_rejected_by_gate(rule_id: str) -> None:
              payload = _load(_REASON_CODE_PATH)
              rules = payload["rules"]
              assert isinstance(rules, dict)
              rules[rule_id] = False
              with pytest.raises(ClaimGateError, match="policy does not match"):
                  _validate(_manifest(), reason_code_payload=payload)


          ''' + gate_reason_anchor
          if gate_tests.count(gate_reason_anchor) != 1:
              raise SystemExit("gate reason test insertion anchor was not unique")
          gate_tests_path.write_text(
              gate_tests.replace(gate_reason_anchor, gate_reason_tests, 1),
              encoding="utf-8",
          )

          toolchain_tests_path = Path("tests/test_release_toolchain_sbom.py")
          toolchain_tests = toolchain_tests_path.read_text(encoding="utf-8")
          command_anchor = '''    assert command[command.index("--source-capabilities") + 1].endswith("guard-secrets-source-capabilities.v2.json")
          '''
          command_replacement = command_anchor + '''    assert command[command.index("--reason-codes") + 1].endswith("guard-secrets-reason-codes.v2.json")
          '''
          if toolchain_tests.count(command_anchor) != 1:
              raise SystemExit("toolchain command assertion anchor was not unique")
          toolchain_tests = toolchain_tests.replace(command_anchor, command_replacement, 1)
          copy_anchor = '''        "docs/guard/contracts/guard-secrets-source-capabilities.v2.json",
          '''
          if toolchain_tests.count(copy_anchor) != 1:
              raise SystemExit("toolchain fixture-copy anchor was not unique")
          toolchain_tests = toolchain_tests.replace(
              copy_anchor,
              copy_anchor + '        "docs/guard/contracts/guard-secrets-reason-codes.v2.json",\n',
              1,
          )
          toolchain_tests_path.write_text(toolchain_tests, encoding="utf-8")
          PY

      - name: Install locked development dependencies
        shell: bash
        env:
          UV_HTTP_TIMEOUT: "120"
          UV_HTTP_RETRIES: "5"
        run: |
          set -euo pipefail
          if ! uv sync --frozen --extra dev --python 3.12; then
            sleep 10
            uv sync --frozen --extra dev --python 3.12
          fi

      - name: Format, lint, type-check, and test
        shell: bash
        run: |
          set -euo pipefail
          changed=(
            src/codex_plugin_scanner/guard/secrets/contracts_v2.py
            scripts/ci/guard_secrets_release_claim_gate.py
            scripts/write_release_toolchain_sbom.py
            tests/test_guard_secret_contracts_v2.py
            tests/test_guard_secret_release_claim_gate.py
            tests/test_release_toolchain_sbom.py
          )
          uv run --no-sync ruff format "${changed[@]}"
          uv run --no-sync ruff check "${changed[@]}"
          uv run --no-sync ruff format --check "${changed[@]}"
          uv run --no-sync basedpyright --level error
          uv run --no-sync pytest \
            tests/test_guard_secret_contracts_v2.py \
            tests/test_guard_secret_release_claim_gate.py \
            tests/test_release_toolchain_sbom.py \
            --tb=short
          python -I -S scripts/write_release_toolchain_sbom.py \
            --output /tmp/release-toolchain.cdx.json \
            --release-version preflight \
            --expected-uv-version 0.9.26 \
            --setup-action-ref fac544c07dec837d0ccb6301d7b5580bf5edae39 \
            --repository-root "$PWD"
          test -s /tmp/release-toolchain.cdx.json

      - name: Reconcile exact test inventory
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/ci/test_inventory.py --output /tmp/test-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path("/tmp/test-inventory.json").read_text(encoding="utf-8"))
          baseline = {
              "maximum_collected_cases": inventory["inventory"]["collected_cases"],
              "maximum_test_source_lines": inventory["test_source_lines"],
              "schema_version": 1,
