name: Materialize permanent Secrets source

on:
  push:
    branches:
      - automation/materialize-secrets-permanent-source-final
    paths:
      - '.github/workflows/materialize-secrets-permanent-source-final.yml'

permissions:
  contents: write

concurrency:
  group: materialize-secrets-permanent-source-final
  cancel-in-progress: false

jobs:
  materialize-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout clean product branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/secrets-permanent-source-final
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch reviewed source snapshots
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/fix/secrets-hook-identity-final-v2:refs/remotes/origin/fix/secrets-hook-identity-final-v2 \
            +refs/heads/fix/secrets-e2e-platform-hardening-v2:refs/remotes/origin/fix/secrets-e2e-platform-hardening-v2 \
            +refs/heads/fix/secrets-git-process-hardening-v2:refs/remotes/origin/fix/secrets-git-process-hardening-v2 \
            +refs/heads/fix/secrets-git-object-edge-hardening:refs/remotes/origin/fix/secrets-git-object-edge-hardening
          git cat-file -e d8c4a8939973ee695bffa39217e3e0e036cdcca0^{commit}
          git cat-file -e 1143f6e3eb355e6de1e434083ff2c974efd78708^{commit}
          git cat-file -e 5f5befcf2aa847d2813d40e8bf47f4ce4f5a95d2^{commit}
          git cat-file -e 1de19656af287ced5a8cac17b2986053c125afca^{commit}

      - name: Materialize permanent reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          git show d8c4a8939973ee695bffa39217e3e0e036cdcca0:scripts/ci/secrets_complete_repair.py > /tmp/secrets_complete_repair.py
          python /tmp/secrets_complete_repair.py
          mkdir -p .github/workflows
          git show 1143f6e3eb355e6de1e434083ff2c974efd78708:.github/workflows/secrets-platform-e2e.yml > .github/workflows/secrets-platform-e2e.yml
          git show d8c4a8939973ee695bffa39217e3e0e036cdcca0:tests/test_guard_secret_hook_identity_worktree.py > tests/test_guard_secret_hook_identity_worktree.py
          git show d8c4a8939973ee695bffa39217e3e0e036cdcca0:tests/test_guard_secret_sparse_bare_repository.py > tests/test_guard_secret_sparse_bare_repository.py
          test -f src/codex_plugin_scanner/guard/secrets/git_safe.py
          test -f src/codex_plugin_scanner/guard/secrets/git_subprocess.py
          test -f src/codex_plugin_scanner/guard/secrets/setup_diagnostics.py
          test -f scripts/ci/run_guard_secrets_platform_smoke_v2.py
          test -f scripts/ci/run_guard_secrets_pipx_smoke.py
          test -f .github/workflows/secrets-platform-e2e.yml
          test ! -e scripts/ci/secrets_complete_repair.py

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false

      - name: Install locked development environment
        shell: bash
        env:
          UV_HTTP_TIMEOUT: '120'
          UV_HTTP_RETRIES: '5'
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12

      - name: Format lint type-check and test Secrets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' source_paths < <(find src/codex_plugin_scanner/guard/secrets -type f -name '*.py' -print0 | sort -z)
          mapfile -d '' test_paths < <(find tests -maxdepth 1 -type f \( -name '*secret*.py' -o -name '*secrets*.py' \) -print0 | sort -z)
          extra_paths=(
            scripts/ci/run_guard_secrets_platform_smoke_v2.py
            scripts/ci/run_guard_secrets_pipx_smoke.py
          )
          test "${#source_paths[@]}" -gt 0
          test "${#test_paths[@]}" -gt 0
          uv run --no-sync python -m ruff format "${source_paths[@]}" "${extra_paths[@]}" "${test_paths[@]}"
          uv run --no-sync python -m ruff check --fix "${source_paths[@]}" "${extra_paths[@]}" "${test_paths[@]}"
          uv run --no-sync python -m ruff format "${source_paths[@]}" "${extra_paths[@]}" "${test_paths[@]}"
          uv run --no-sync python -m ruff check "${source_paths[@]}" "${extra_paths[@]}" "${test_paths[@]}"
          uv run --no-sync basedpyright --level error "${source_paths[@]}" "${extra_paths[@]}" "${test_paths[@]}"
          PYTHONPATH=src uv run --no-sync pytest -q "${test_paths[@]}" --tb=short

      - name: Advance and enforce test-suite ratchet
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/ci/generate_test_inventory.py --output /tmp/secrets-test-inventory.json
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path('/tmp/secrets-test-inventory.json').read_text(encoding='utf-8'))
          path = Path('ci/test-suite-ratchet-baseline.json')
          baseline = json.loads(path.read_text(encoding='utf-8'))
          baseline['maximum_collected_cases'] = inventory['inventory']['collected_cases']
          baseline['maximum_test_source_lines'] = inventory['test_source_lines']
          path.write_text(json.dumps(baseline, indent=2) + '\n', encoding='utf-8')
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory /tmp/secrets-test-inventory.json

      - name: Build exact wheel and run isolated install lifecycles
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          uv build --wheel --out-dir dist
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv run --no-sync python scripts/ci/run_guard_secrets_platform_smoke_v2.py --wheel "$wheel"
          uv run --no-sync python scripts/ci/run_guard_secrets_pipx_smoke.py --wheel "$wheel"
          git diff --check

      - name: Verify source-only change set
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short)"
          test -n "$changed"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E 'secrets_(complete_)?repair|bootstrap|reconcile|shepherd|transfer|source-export|protected-head'; then
            echo 'temporary orchestration residue detected' >&2
            exit 1
          fi

      - name: Commit permanent implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix(secrets): complete permanent platform Git and hook hardening'
          git push origin HEAD:fix/secrets-permanent-source-final
