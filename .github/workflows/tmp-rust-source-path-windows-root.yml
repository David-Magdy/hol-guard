name: Temporary Rust source path Windows root patch

on:
  push:
    branches: [tmp/rust-source-path-windows-root]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix(guard): handle Windows source path roots') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Patch Windows root handling
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('rust/crates/guard-secure-fs/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          old = '''pub fn contains_symlink_component(path: &Path) -> bool {
              let mut current = PathBuf::new();
              for component in path.components() {
                  match component {
                      Component::Prefix(prefix) => current.push(prefix.as_os_str()),
                      Component::RootDir => current.push(Path::new(std::path::MAIN_SEPARATOR_STR)),
                      Component::CurDir => continue,
                      Component::ParentDir => current.push(".."),
                      Component::Normal(part) => current.push(part),
                  }
                  match fs::symlink_metadata(&current) {
                      Ok(metadata) if metadata.file_type().is_symlink() => return true,
                      Ok(_) => {}
                      Err(error) if error.kind() == io::ErrorKind::NotFound => {}
                      Err(_) => return true,
                  }
              }
              false
          }
          '''
          new = '''pub fn contains_symlink_component(path: &Path) -> bool {
              let mut current = PathBuf::new();
              for component in path.components() {
                  let should_stat = match component {
                      Component::Prefix(prefix) => {
                          current.push(prefix.as_os_str());
                          false
                      }
                      Component::RootDir => {
                          current.push(Path::new(std::path::MAIN_SEPARATOR_STR));
                          false
                      }
                      Component::CurDir => continue,
                      Component::ParentDir => {
                          current.push("..");
                          false
                      }
                      Component::Normal(part) => {
                          current.push(part);
                          true
                      }
                  };
                  if !should_stat {
                      continue;
                  }
                  match fs::symlink_metadata(&current) {
                      Ok(metadata) if metadata.file_type().is_symlink() => return true,
                      Ok(_) => {}
                      Err(error) if error.kind() == io::ErrorKind::NotFound => {}
                      Err(_) => return true,
                  }
              }
              false
          }
          '''
          if old not in text:
              raise SystemExit('expected contains_symlink_component body not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Format and verify
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup default 1.88.0
          rustfmt --edition 2021 rust/crates/guard-secure-fs/src/lib.rs
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/crates/guard-secure-fs/src/lib.rs
          git commit -m "fix(guard): handle Windows source path roots"
          git push origin HEAD:tmp/rust-source-path-windows-root
