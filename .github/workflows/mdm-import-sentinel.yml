name: MDM collection sentinel

on:
  pull_request:
    paths:
      - "src/codex_plugin_scanner/guard/mdm/**"
      - "tests/test_guard_mdm_network.py"
      - "tests/test_guard_mdm_adapter_conformance.py"
      - ".github/workflows/mdm-import-sentinel.yml"

permissions:
  contents: read

jobs:
  collection-sentinel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      - run: uv sync --python 3.12 --extra dev --frozen
      - run: >-
          uv run --python 3.12 --no-sync pytest
          -p no:cacheprovider --tb=short -q --collect-only
          tests/test_guard_mdm_network.py
          tests/test_guard_mdm_adapter_conformance.py
