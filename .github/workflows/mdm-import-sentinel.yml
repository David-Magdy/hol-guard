name: MDM network import sentinel

on:
  pull_request:
    paths:
      - "src/codex_plugin_scanner/guard/mdm/**"
      - "scripts/mdm/check-network-import.py"
      - ".github/workflows/mdm-import-sentinel.yml"

permissions:
  contents: read

jobs:
  import-sentinel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      - run: uv sync --python 3.12 --extra dev --frozen
      - id: sentinel
        run: uv run --python 3.12 --no-sync python scripts/mdm/check-network-import.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mdm-network-import-${{ steps.sentinel.outputs.result }}
          path: mdm-import-sentinel.txt
          retention-days: 1
