name: Guard Secrets hardening bootstrap

on:
  push:
    branches:
      - fix/secrets-e2e-platform-hardening

permissions:
  contents: write

concurrency:
  group: guard-secrets-hardening-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/secrets-e2e-platform-hardening
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'

      - name: Materialize reviewed hardening files
        shell: bash
        run: |
          set -euo pipefail
          cat .github/guard-secrets-hardening/payload-*.b64 \
            | base64 --decode \
            | tar -xz
          git rm -r .github/guard-secrets-hardening
          git rm .github/workflows/guard-secrets-hardening-bootstrap.yml

      - name: Install locked development environment
        run: uv sync --frozen --extra dev --python 3.12

      - name: Format permanent Python files
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/guard/secrets/doctor.py \
            src/codex_plugin_scanner/guard/secrets/cli.py \
            scripts/ci/guard_secrets_cross_platform_e2e.py \
            scripts/ci/guard_secrets_installed_wheel_smoke.py \
            tests/test_guard_secret_doctor.py

      - name: Advance the exact test-suite ratchet
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/ci/generate_test_inventory.py \
            --output /tmp/guard-secrets-test-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path('/tmp/guard-secrets-test-inventory.json').read_text())
          payload = {
              'maximum_collected_cases': inventory['inventory']['collected_cases'],
              'maximum_test_source_lines': inventory['test_source_lines'],
              'schema_version': 1,
          }
          Path('ci/test-suite-ratchet-baseline.json').write_text(
              json.dumps(payload, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Validate source, security contracts, and Linux black-box flow
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/secrets/doctor.py \
            src/codex_plugin_scanner/guard/secrets/cli.py \
            scripts/ci/guard_secrets_cross_platform_e2e.py \
            scripts/ci/guard_secrets_installed_wheel_smoke.py \
            tests/test_guard_secret_doctor.py
          uv run --no-sync python -m ruff format --check \
            src/codex_plugin_scanner/guard/secrets/doctor.py \
            src/codex_plugin_scanner/guard/secrets/cli.py \
            scripts/ci/guard_secrets_cross_platform_e2e.py \
            scripts/ci/guard_secrets_installed_wheel_smoke.py \
            tests/test_guard_secret_doctor.py
          uv run --no-sync basedpyright --level error \
            src/codex_plugin_scanner/guard/secrets/doctor.py \
            src/codex_plugin_scanner/guard/secrets/cli.py \
            scripts/ci/guard_secrets_cross_platform_e2e.py \
            scripts/ci/guard_secrets_installed_wheel_smoke.py
          uv run --no-sync pytest -q \
            tests/test_guard_secret_doctor.py \
            tests/test_guard_secret_detection.py \
            tests/test_guard_secret_assignment_precision.py \
            tests/test_guard_secret_fixture_precision.py \
            --tb=short
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory /tmp/guard-secrets-test-inventory.json
          uv run --no-sync python scripts/ci/guard_secrets_cross_platform_e2e.py \
            --output /tmp/guard-secrets-linux-e2e.json
          uv build --wheel --out-dir /tmp/guard-secrets-dist
          wheel="$(python -c "from pathlib import Path; print(next(Path('/tmp/guard-secrets-dist').glob('*.whl')))" )"
          uv run --no-sync python scripts/ci/guard_secrets_installed_wheel_smoke.py \
            "$wheel" \
            --output /tmp/guard-secrets-wheel-smoke.json
          git diff --check

      - name: Commit the reviewed permanent change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/guard-secrets-platform-e2e.yml \
            ci/test-suite-ratchet-baseline.json \
            docs/guard/secrets-setup.md \
            scripts/ci/guard_secrets_cross_platform_e2e.py \
            scripts/ci/guard_secrets_installed_wheel_smoke.py \
            src/codex_plugin_scanner/guard/secrets/doctor.py \
            src/codex_plugin_scanner/guard/secrets/cli.py \
            tests/test_guard_secret_doctor.py
          git commit -m 'test(secrets): harden setup and cross-platform protection'
          git push origin HEAD:fix/secrets-e2e-platform-hardening
