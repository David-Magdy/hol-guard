name: Protection Center Batch 3 stack sync
on:
  push:
    branches: [feat/protection-center-03-module-detail]
permissions:
  contents: write
concurrency:
  group: protection-center-batch3-stack-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Stack Batch 3 on final Batch 2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/protection-center-02-landing
          set +e
          git merge --no-ff --no-commit origin/feat/protection-center-02-landing
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            for path in "${conflicts[@]}"; do
              case "$path" in
                dashboard/package.json|dashboard/src/protection-center/protection-center-workspace.tsx|dashboard/e2e/installed-extension-control-center.spec.ts|.github/workflows/extension-control-center-installed-ci.yml|src/codex_plugin_scanner/guard/daemon/static/*)
                  git checkout --theirs -- "$path"; git add "$path" ;;
                *) echo "Unexpected Batch 3 conflict: $path" >&2; exit 1 ;;
              esac
            done
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          git add .
          git commit -m "chore(protection-center): stack module detail on landing" || true
      - name: Reapply plain-language module detail on combined source
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import json

          path = Path("dashboard/src/protection-center/protection-center-workspace.tsx")
          text = path.read_text(encoding="utf-8")
          old_import = 'import { ExtensionControlCenterDetail } from "../extension-control-center-detail";\n'
          if old_import in text:
              text = text.replace(old_import, '', 1)
          landing_import = 'import { ProtectionLandingExperience } from "./protection-landing-experience";\n'
          detail_import = 'import { ProtectionModuleDetail } from "./protection-module-detail";\n'
          if detail_import not in text:
              if landing_import not in text:
                  raise SystemExit("Protection landing import marker changed unexpectedly")
              text = text.replace(landing_import, landing_import + detail_import, 1)

          old_detail = '''  if (routeState.route.kind === "detail" && selectedExtension) {\n    return <><ExtensionControlCenterDetail\n      extension={selectedExtension}\n      effective={state.effective}\n      catalogDigest={state.catalog.catalog_digest}\n      urlState={routeState.detail}\n      onUrlState={updateDetailState}\n      onBack={closeExtension}\n      onBroadControl={() => requestChange({ extension: selectedExtension, enabled: !isExtensionEnabled(state.effective, selectedExtension) })}\n    />{pending ? <ReviewModal change={pending} busy={busy} error={mutationError} approvalGate={resolvedApprovalGate} onCancel={() => { if (!busy) setPending(null); }} onConfirm={confirm} /> : null}{recoveryModal}</>;\n  }'''
          new_detail = '''  if (routeState.route.kind === "detail" && selectedExtension) {\n    return <><ProtectionModuleDetail\n      extension={selectedExtension}\n      effective={state.effective}\n      catalogDigest={state.catalog.catalog_digest}\n      onBack={closeExtension}\n      onChange={() => requestChange({ extension: selectedExtension, enabled: !isExtensionEnabled(state.effective, selectedExtension) })}\n    />{pending ? <ReviewModal change={pending} busy={busy} error={mutationError} approvalGate={resolvedApprovalGate} onCancel={() => { if (!busy) setPending(null); }} onConfirm={confirm} /> : null}{recoveryModal}</>;\n  }'''
          if old_detail in text:
              text = text.replace(old_detail, new_detail, 1)
          elif '<ProtectionModuleDetail' not in text:
              raise SystemExit("Protection detail render marker changed unexpectedly")

          update_start = '  const updateDetailState = useCallback((next: ExtensionDetailUrlState) => {'
          update_end = '  }, [canonicalSelected]);\n\n'
          start = text.find(update_start)
          if start != -1:
              end = text.find(update_end, start)
              if end == -1:
                  raise SystemExit("detail URL callback terminator not found")
              text = text[:start] + text[end + len(update_end):]
          text = text.replace('  type ExtensionDetailUrlState,\n', '')
          path.write_text("\n".join(line.rstrip() for line in text.splitlines()) + "\n", encoding="utf-8")

          package_path = Path("dashboard/package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          test = "tsx src/protection-center/protection-module-detail.test.tsx"
          parts = [part.strip() for part in package["scripts"]["test"].split("&&")]
          if test not in parts:
              parts.insert(2 if len(parts) >= 2 else len(parts), test)
          package["scripts"]["test"] = " && ".join(parts)
          package_path.write_text(json.dumps(package, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Verify combined dashboard and rebuild deterministic assets
        shell: bash
        run: |
          set -euo pipefail
          cd dashboard
          bun install --frozen-lockfile --ignore-scripts
          bun run test
          bun run build
      - name: Commit verified stack and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm .github/workflows/protection-center-batch3-stack.yml
          git add dashboard/package.json dashboard/src/protection-center/protection-center-workspace.tsx src/codex_plugin_scanner/guard/daemon/static .github/workflows/protection-center-batch3-stack.yml
          git diff --cached --check
          git commit -m "feat(protection-center): stack plain-language module detail"
          git push origin HEAD:feat/protection-center-03-module-detail
