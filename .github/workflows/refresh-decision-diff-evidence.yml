name: Refresh decision-diff evidence

on:
  push:
    branches:
      - fix/release-3.0-decision-diff-evidence

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Regenerate deterministic decision evidence
        run: uv run --no-sync python tests/guard_command_decision_diff.py --write

      - name: Commit refreshed fixture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/guard-command-corpus/decision-diff-report.json
          if git diff --cached --quiet; then
            echo "No fixture change was required."
            exit 0
          fi
          git commit -m "chore(ci): refresh decision evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
