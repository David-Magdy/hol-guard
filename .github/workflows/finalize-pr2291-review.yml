name: Finalize PR 2291 review fixes

on:
  push:
    branches: [feat/rust-runtime-resilience-v2]
    paths:
      - ".github/workflows/finalize-pr2291-review.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: feat/rust-runtime-resilience-v2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Install project
        run: uv sync --frozen --extra dev --python 3.12
      - name: Apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          native = Path("src/codex_plugin_scanner/guard/native_runtime.py")
          text = native.read_text(encoding="utf-8")
          old = '''        "native_manifest_build_mismatch",\n        "native_protocol_mismatch",\n        "native_version_mismatch",\n'''
          new = '''        "native_manifest_build_mismatch",\n'''
          if text.count(old) != 1:
              raise RuntimeError("native compatibility quarantine anchor changed")
          native.write_text(text.replace(old, new, 1), encoding="utf-8")

          resilience = Path("src/codex_plugin_scanner/guard/native_runtime_resilience.py")
          text = resilience.read_text(encoding="utf-8")
          old = '''_REASON_MAX_LENGTH = 96\n'''
          new = '''_REASON_MAX_LENGTH = 96\n_REASON_CHARACTERS = frozenset("_-." )\n'''
          if text.count(old) != 1:
              raise RuntimeError("reason constant anchor changed")
          text = text.replace(old, new, 1)
          old = '''    if candidate and all(character.isalnum() or character in {"_", "-", "."} for character in candidate):\n'''
          new = '''    if candidate and all(character.isalnum() or character in _REASON_CHARACTERS for character in candidate):\n'''
          if text.count(old) != 1:
              raise RuntimeError("reason validation anchor changed")
          resilience.write_text(text.replace(old, new, 1), encoding="utf-8")

          command = Path("src/codex_plugin_scanner/guard/native_command_model.py")
          text = command.read_text(encoding="utf-8")
          old = '''from .native_runtime import _isolated_environment, native_runtime_status\n'''
          new = '''from .native_runtime import _isolated_environment, _native_error, native_runtime_status\n'''
          if text.count(old) != 1:
              raise RuntimeError("native command import anchor changed")
          text = text.replace(old, new, 1)
          old = '''            if resident_payload == {"error": "native_overloaded", "retryable": True}:\n'''
          new = '''            if _native_error(resident_payload) == "native_overloaded":\n'''
          if text.count(old) != 1:
              raise RuntimeError("native overload anchor changed")
          command.write_text(text.replace(old, new, 1), encoding="utf-8")

          for filename in (
              "ci/native_runtime/test_guard_native_runtime_mutation_differential.py",
              "ci/native_runtime/test_native_runtime_recovery.py",
          ):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              old = 'dir="/tmp"'
              if old not in text:
                  raise RuntimeError(f"temporary directory anchor changed: {filename}")
              path.write_text(text.replace(old, "dir=tempfile.gettempdir()"), encoding="utf-8")

          contracts = Path("tests/test_native_runtime_resilience.py")
          text = contracts.read_text(encoding="utf-8")
          marker = "def test_compatibility_mismatches_are_recoverable"
          if marker not in text:
              text += '''\n\ndef test_compatibility_mismatches_are_recoverable() -> None:\n    from codex_plugin_scanner.guard.native_runtime import _INTEGRITY_FAILURE_REASONS\n\n    assert "native_protocol_mismatch" not in _INTEGRITY_FAILURE_REASONS\n    assert "native_version_mismatch" not in _INTEGRITY_FAILURE_REASONS\n    assert "native_manifest_protocol_mismatch" in _INTEGRITY_FAILURE_REASONS\n    assert "native_manifest_version_mismatch" in _INTEGRITY_FAILURE_REASONS\n'''
          contracts.write_text(text, encoding="utf-8")
          PY
      - name: Format and validate review fixes
        shell: bash
        run: |
          set -euo pipefail
          python_files=(
            src/codex_plugin_scanner/guard/native_runtime.py
            src/codex_plugin_scanner/guard/native_runtime_resilience.py
            src/codex_plugin_scanner/guard/native_command_model.py
            ci/native_runtime/test_guard_native_runtime_mutation_differential.py
            ci/native_runtime/test_native_runtime_recovery.py
            tests/test_native_runtime_resilience.py
          )
          uv run --no-sync python -m ruff format "${python_files[@]}"
          uv run --no-sync python -m ruff check "${python_files[@]}"
          uv run --no-sync pytest -q \
            tests/test_native_runtime_resilience.py \
            ci/native_runtime/test_native_runtime_recovery.py \
            ci/native_runtime/test_guard_native_runtime_mutation_differential.py \
            --tb=short
          uv run --no-sync python - <<'PY'
          from codex_plugin_scanner.guard.native_runtime import _native_error

          assert _native_error({"error": "native_overloaded", "retryable": True}) == "native_overloaded"
          assert _native_error({"error": "native_overloaded", "retryable": True, "extra": 1}) is None
          PY
          git diff --check
      - name: Commit review fixes
        shell: bash
        run: |
          set -euo pipefail
          branch=feat/rust-runtime-resilience-v2
          remote_sha=$(git ls-remote --exit-code origin "refs/heads/${branch}" | awk '{print $1}')
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "Branch moved while review fixes ran" >&2
            exit 1
          fi
          rm -f .github/workflows/finalize-pr2291-review.yml
          git add -A
          git diff --cached --check
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git commit --signoff -m "fix(guard): resolve native resilience review findings"
          git push origin "HEAD:refs/heads/${branch}"
