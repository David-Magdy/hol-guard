name: Repair PR 2148 generated evidence

on:
  push:
    branches:
      - fix/package-shim-store-lock-main
    paths:
      - .github/workflows/repair-pr2148.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require exact repair branch and owner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "hashgraph-online/hol-guard"
          test "$GITHUB_REF" = "refs/heads/fix/package-shim-store-lock-main"
          test "$GITHUB_ACTOR" = "kantorcodes"

      - name: Check out repair branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/package-shim-store-lock-main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Repair stale source-order assertion and regenerate bound evidence
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_guard_package_shims.py')
          text = path.read_text(encoding='utf-8')
          old = '    guard_index = shim_source.index("guard_process = subprocess.run")\n'
          new = '    guard_index = shim_source.index("guard_process = _run_guard_with_store_lock_retry(")\n'
          if old not in text:
              raise SystemExit('expected stale package-shim assertion not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          uv run --no-sync python tests/guard_command_decision_diff.py --write
          uv run --no-sync pytest \
            tests/test_guard_package_shims.py::test_package_shim_tries_owned_containment_before_guard_review \
            tests/test_guard_package_shims.py::test_package_manager_shim_waits_out_transient_store_writer_lock \
            tests/test_guard_command_decision_diff.py::test_report_is_exactly_reproducible_and_source_bound \
            --tb=short
          git diff --check

      - name: Commit deterministic repair and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/repair-pr2148.yml
          git add -A
          git diff --cached --check
          git commit -m "test(guard): refresh shim retry evidence"
          git push origin HEAD:fix/package-shim-store-lock-main
