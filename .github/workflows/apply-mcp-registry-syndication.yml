name: Apply MCP Registry ownership marker

on:
  push:
    branches:
      - feat/mcp-registry-syndication

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch without third-party actions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch --depth=1 origin "${BRANCH}"
          git checkout -B "${BRANCH}" FETCH_HEAD

      - name: Add PyPI ownership marker
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          marker = "<!-- mcp-name: io.github.hashgraph-online/hol-guard -->"
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          if marker not in text:
              first_newline = text.find("\n")
              if first_newline < 0:
                  raise SystemExit("README heading boundary not found")
              text = text[: first_newline + 1] + f"\n{marker}\n" + text[first_newline + 1 :]
              path.write_text(text, encoding="utf-8")
          PY
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "kantorcodes"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git add README.md
          git commit -m "feat(mcp): add Registry ownership marker"
          git push origin HEAD:feat/mcp-registry-syndication
