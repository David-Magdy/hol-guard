name: Apply credential platform hardening

on:
  push:
    branches:
      - fix/credential-platform-hardening-v3

permissions:
  contents: write

concurrency:
  group: apply-credential-platform-hardening-v3
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/credential-platform-hardening-v3
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'

      - name: Reconstruct and verify reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/guard-secrets-hardening/chunk-0? \
            | tr -d '\r\n\t ' \
            > /tmp/credential-platform-hardening.patch.gz.b64
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/credential-platform-hardening.patch.gz.b64')
          payload = path.read_text(encoding='ascii')
          staged = 'CtU1FwzZx7'
          reviewed = 'CtU1FwzRx7'
          if payload.count(staged) != 1 or reviewed in payload:
              raise SystemExit('unexpected staged patch corruption shape')
          path.write_text(payload.replace(staged, reviewed, 1), encoding='ascii')
          PY
          echo '7550f02b9479788079e74ca761b2bf748ee49b150c82946d0c9cdc5b71967ffd  /tmp/credential-platform-hardening.patch.gz.b64' \
            | sha256sum --check --strict
          base64 --decode /tmp/credential-platform-hardening.patch.gz.b64 \
            | gzip --decompress \
            > /tmp/credential-platform-hardening.patch
          echo 'c4c159fe0aa8a8681259a106b68f0708f958cdee4d752efa5145ac62b7668be8  /tmp/credential-platform-hardening.patch' \
            | sha256sum --check --strict
          git apply --check /tmp/credential-platform-hardening.patch
          git apply /tmp/credential-platform-hardening.patch
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_guard_secrets_native_cli.py')
          source = path.read_text(encoding='utf-8')
          old = 'match="custom core.hooksPath"'
          new = 'match=r"custom core\\.hooksPath"'
          if source.count(old) != 1 or new in source:
              raise SystemExit('unexpected custom hooks path assertion shape')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install locked development environment
        shell: bash
        run: uv sync --frozen --extra dev --python 3.12

      - name: Format, lint, and type-check
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/guard/secrets \
            tests/test_guard_secrets_native_cli.py \
            tests/test_guard_secrets_edge_cases.py \
            tests/test_guard_secrets_doctor.py \
            tests/test_guard_secrets_platform_e2e.py \
            tests/test_guard_secrets_setup_docs.py
          uv run --no-sync python -m ruff check --fix \
            src/codex_plugin_scanner/guard/secrets \
            tests/test_guard_secrets_native_cli.py \
            tests/test_guard_secrets_edge_cases.py \
            tests/test_guard_secrets_doctor.py \
            tests/test_guard_secrets_platform_e2e.py \
            tests/test_guard_secrets_setup_docs.py
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/secrets \
            tests/test_guard_secrets_native_cli.py \
            tests/test_guard_secrets_edge_cases.py \
            tests/test_guard_secrets_doctor.py \
            tests/test_guard_secrets_platform_e2e.py \
            tests/test_guard_secrets_setup_docs.py
          uv run --no-sync basedpyright --level error \
            src/codex_plugin_scanner/guard/secrets

      - name: Run focused credential protection suite
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync pytest -q \
            tests/test_guard_secret_detection.py \
            tests/test_guard_secret_assignment_precision.py \
            tests/test_guard_secret_fixture_precision.py \
            tests/test_guard_secret_redaction.py \
            tests/test_guard_secrets_native_cli.py \
            tests/test_guard_secrets_edge_cases.py \
            tests/test_guard_secrets_doctor.py \
            tests/test_guard_secrets_platform_e2e.py \
            tests/test_guard_secrets_setup_docs.py \
            --tb=short

      - name: Reconcile and verify test-suite ratchet
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/ci/generate_test_inventory.py \
            --output /tmp/credential-platform-test-inventory.json
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(
              Path('/tmp/credential-platform-test-inventory.json').read_text(encoding='utf-8')
          )
          baseline_path = Path('ci/test-suite-ratchet-baseline.json')
          baseline = json.loads(baseline_path.read_text(encoding='utf-8'))
          baseline['maximum_collected_cases'] = inventory['inventory']['collected_cases']
          baseline['maximum_test_source_lines'] = inventory['test_source_lines']
          baseline_path.write_text(
              json.dumps(baseline, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory /tmp/credential-platform-test-inventory.json
          git diff --check

      - name: Commit validated source and remove bootstrap payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            .github/workflows/apply-secrets-e2e-hardening.yml \
            .github/workflows/apply-credential-platform-hardening.yml
          git rm -r .github/guard-secrets-hardening
          git add \
            .github/workflows/ci.yml \
            README.md \
            ci/test-suite-ratchet-baseline.json \
            docs/guard/get-started.md \
            docs/guard/secrets.md \
            src/codex_plugin_scanner/guard/secrets \
            tests/test_guard_secrets_native_cli.py \
            tests/test_guard_secrets_edge_cases.py \
            tests/test_guard_secrets_doctor.py \
            tests/test_guard_secrets_platform_e2e.py \
            tests/test_guard_secrets_setup_docs.py
          git commit -m 'fix(secrets): harden local scanning and setup'
          git push origin HEAD:fix/credential-platform-hardening-v3
