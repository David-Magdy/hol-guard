name: Protection Center Test Lab contract diagnostic
on:
  push:
    branches: [feat/protection-center-06-cloud-boundary-hardening]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Build redacted backend fixture
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync python - <<'PY'
          import json
          from codex_plugin_scanner.guard.daemon.extension_control_test_api import evaluate_extension_control_test
          from codex_plugin_scanner.guard.runtime.command_extensions import BUILT_IN_COMMAND_EXTENSION_REGISTRY
          from codex_plugin_scanner.guard.runtime.extension_control_authority import AuthorityHealth, ExtensionControlAuthorityView
          from codex_plugin_scanner.guard.runtime.extension_control_runtime import ExtensionControlRuntime

          runtime = ExtensionControlRuntime(
              ExtensionControlAuthorityView(
                  AuthorityHealth.PROTECTED,
                  7,
                  BUILT_IN_COMMAND_EXTENSION_REGISTRY.catalog_digest,
                  (),
              )
          )
          payload = evaluate_extension_control_test(
              registry=BUILT_IN_COMMAND_EXTENSION_REGISTRY,
              runtime=runtime,
              payload={"command": "git reset --hard HEAD~1", "extension_id": "command.git"},
          )
          assert "command" not in payload
          encoded = json.dumps(payload, sort_keys=True)
          assert "git reset --hard HEAD~1" not in encoded
          open('/tmp/test-lab-redacted.json', 'w', encoding='utf-8').write(encoded)
          print(encoded)
          PY
      - name: Run frontend normalizer on exact fixture
        shell: bash
        run: |
          set -euo pipefail
          cd dashboard
          bun install --frozen-lockfile --ignore-scripts
          TEST_LAB_FIXTURE=/tmp/test-lab-redacted.json bunx tsx -e '
            import { readFileSync } from "node:fs";
            import { normalizeProtectionTestResult } from "./src/protection-center/protection-test-api.ts";
            const payload = JSON.parse(readFileSync(process.env.TEST_LAB_FIXTURE!, "utf8"));
            try {
              const result = normalizeProtectionTestResult(payload);
              console.log(JSON.stringify({ok:true, decision:result.decision, matches:result.matches.length, authority_health:result.authority_health}));
            } catch (error) {
              console.error(error instanceof Error ? error.message : String(error));
              process.exit(1);
            }
          '
      - name: Remove diagnostic workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/protection-center-test-lab-contract-diagnostic.yml
          git add .github/workflows/protection-center-test-lab-contract-diagnostic.yml
          git commit -m "chore(protection-center): remove Test Lab diagnostic"
          git push origin HEAD:feat/protection-center-06-cloud-boundary-hardening
