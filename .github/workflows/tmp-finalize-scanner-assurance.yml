name: Finalize scanner assurance hardening

on:
  push:
    branches:
      - feat/scanner-assurance-rust-hardening-20260816
    paths:
      - .github/workflows/tmp-finalize-scanner-assurance.yml
      - scripts/tmp_finalize_scanner_assurance.py
      - .scanner-assurance-final/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanner-assurance-materialization
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/hol-guard-scanner-engine-target
      HOL_GUARD_SCANNER_ENGINE: ${{ runner.temp }}/hol-guard-scanner-engine-target/release/hol-guard-scanner-engine
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/scanner-assurance-rust-hardening-20260816
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            rust/scanner-engine/Cargo.lock
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.82.0 --profile minimal --no-self-update
          rustup default 1.82.0
          rustc --version
          cargo --version
      - name: Materialize final implementation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tmp_finalize_scanner_assurance.py
          uv lock
          cargo generate-lockfile --manifest-path rust/scanner-engine/Cargo.toml
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync python -m ruff check --fix \
            src/codex_plugin_scanner/assurance \
            src/codex_plugin_scanner/assurance_cli.py \
            src/codex_plugin_scanner/models.py \
            src/codex_plugin_scanner/reporting.py \
            src/codex_plugin_scanner/cli_ui.py \
            src/codex_plugin_scanner/scanner.py \
            src/codex_plugin_scanner/_scanner_commands.py \
            src/codex_plugin_scanner/quality_artifact.py \
            tests/test_assurance_archive.py \
            tests/test_assurance_common_vectors.py \
            tests/test_assurance_dependencies.py \
            tests/test_assurance_drift_detonation.py \
            tests/test_assurance_hardening.py \
            tests/test_assurance_integration.py \
            tests/test_assurance_native.py \
            tests/test_assurance_policy_ingestion.py \
            tests/test_assurance_security_vectors.py \
            tests/test_assurance_server.py
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/assurance \
            src/codex_plugin_scanner/assurance_cli.py \
            src/codex_plugin_scanner/models.py \
            src/codex_plugin_scanner/reporting.py \
            src/codex_plugin_scanner/cli_ui.py \
            src/codex_plugin_scanner/scanner.py \
            src/codex_plugin_scanner/_scanner_commands.py \
            src/codex_plugin_scanner/quality_artifact.py \
            tests/test_assurance_archive.py \
            tests/test_assurance_common_vectors.py \
            tests/test_assurance_dependencies.py \
            tests/test_assurance_drift_detonation.py \
            tests/test_assurance_hardening.py \
            tests/test_assurance_integration.py \
            tests/test_assurance_native.py \
            tests/test_assurance_policy_ingestion.py \
            tests/test_assurance_security_vectors.py \
            tests/test_assurance_server.py
          cargo fmt --manifest-path rust/scanner-engine/Cargo.toml
          set +e
          cargo fix --manifest-path rust/scanner-engine/Cargo.toml --all-targets --allow-dirty --allow-staged
          set -e
      - name: Run validation matrix and capture every result
        id: validation
        shell: bash
        run: |
          set -u
          rm -rf .scanner-assurance-final-diagnostics
          mkdir -p .scanner-assurance-final-diagnostics
          : > .scanner-assurance-final-diagnostics/summary.tsv
          run_check() {
            name="$1"
            shift
            log=".scanner-assurance-final-diagnostics/${name}.log"
            set +e
            "$@" >"$log" 2>&1
            status=$?
            set -e
            printf '%s\t%s\n' "$name" "$status" >> .scanner-assurance-final-diagnostics/summary.tsv
          }

          run_check integration-markers bash -c '
            test -f src/codex_plugin_scanner/assurance/server.py &&
            test -f rust/scanner-engine/Cargo.lock &&
            grep -q "hol-guard-extension-security" pyproject.toml &&
            grep -q "assurance: dict" src/codex_plugin_scanner/models.py &&
            grep -q "Submission blocked by layered assurance" src/codex_plugin_scanner/_scanner_commands.py &&
            grep -q "quarantined" src/codex_plugin_scanner/assurance/ingestion.py
          '
          run_check lock-check uv lock --check
          run_check cargo-fmt cargo fmt --manifest-path rust/scanner-engine/Cargo.toml -- --check
          run_check cargo-clippy cargo clippy --locked --manifest-path rust/scanner-engine/Cargo.toml --all-targets -- -D warnings
          run_check cargo-test cargo test --locked --manifest-path rust/scanner-engine/Cargo.toml
          run_check cargo-build cargo build --release --locked --manifest-path rust/scanner-engine/Cargo.toml
          run_check compile python -m compileall -q src/codex_plugin_scanner/assurance src/codex_plugin_scanner/assurance_cli.py
          run_check ruff uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/assurance \
            src/codex_plugin_scanner/assurance_cli.py \
            src/codex_plugin_scanner/models.py \
            src/codex_plugin_scanner/reporting.py \
            src/codex_plugin_scanner/cli_ui.py \
            src/codex_plugin_scanner/scanner.py \
            src/codex_plugin_scanner/_scanner_commands.py \
            src/codex_plugin_scanner/quality_artifact.py \
            tests/test_assurance_archive.py \
            tests/test_assurance_common_vectors.py \
            tests/test_assurance_dependencies.py \
            tests/test_assurance_drift_detonation.py \
            tests/test_assurance_hardening.py \
            tests/test_assurance_integration.py \
            tests/test_assurance_native.py \
            tests/test_assurance_policy_ingestion.py \
            tests/test_assurance_security_vectors.py \
            tests/test_assurance_server.py
          run_check format uv run --no-sync python -m ruff format --check \
            src/codex_plugin_scanner/assurance \
            src/codex_plugin_scanner/assurance_cli.py \
            src/codex_plugin_scanner/models.py \
            src/codex_plugin_scanner/reporting.py \
            src/codex_plugin_scanner/cli_ui.py \
            src/codex_plugin_scanner/scanner.py \
            src/codex_plugin_scanner/_scanner_commands.py \
            src/codex_plugin_scanner/quality_artifact.py \
            tests/test_assurance_archive.py \
            tests/test_assurance_common_vectors.py \
            tests/test_assurance_dependencies.py \
            tests/test_assurance_drift_detonation.py \
            tests/test_assurance_hardening.py \
            tests/test_assurance_integration.py \
            tests/test_assurance_native.py \
            tests/test_assurance_policy_ingestion.py \
            tests/test_assurance_security_vectors.py \
            tests/test_assurance_server.py
          run_check basedpyright uv run --no-sync basedpyright --level error \
            src/codex_plugin_scanner/assurance \
            src/codex_plugin_scanner/assurance_cli.py
          run_check pytest-assurance uv run --no-sync pytest \
            tests/test_assurance_archive.py \
            tests/test_assurance_common_vectors.py \
            tests/test_assurance_dependencies.py \
            tests/test_assurance_drift_detonation.py \
            tests/test_assurance_hardening.py \
            tests/test_assurance_integration.py \
            tests/test_assurance_native.py \
            tests/test_assurance_policy_ingestion.py \
            tests/test_assurance_security_vectors.py \
            tests/test_assurance_server.py \
            --tb=short
          run_check pytest-regression uv run --no-sync pytest \
            tests/test_policy.py \
            tests/test_reporting.py \
            tests/test_schema_contracts.py \
            tests/test_security_ops.py \
            tests/test_integration.py \
            tests/test_verification.py \
            tests/test_cli.py \
            --tb=short
          run_check test-inventory uv run --no-sync python scripts/ci/test_inventory.py --output .scanner-assurance-final-diagnostics/test-inventory.json
          run_check test-ratchet uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory .scanner-assurance-final-diagnostics/test-inventory.json
          run_check wheel uv build --wheel
          run_check diff-check git diff --check

          run_check rust-engine-smoke bash -c '
            test -x "$HOL_GUARD_SCANNER_ENGINE"
            printf "\\0asm\\1\\0\\0\\0" > /tmp/fixture.wasm
            "$HOL_GUARD_SCANNER_ENGINE" inspect \
              --path /tmp/fixture.wasm \
              --display-path fixture.wasm \
              --max-bytes 1048576 \
              --max-strings 1000 > /tmp/rust-engine.json
            python - <<"PY"
            import json
            value=json.load(open("/tmp/rust-engine.json"))
            assert value["schema_version"] == "hol-guard.scanner-engine.v1"
            assert value["summary"]["format"] == "wasm"
            assert value["summary"]["signature"]["verified"] is False
            PY
          '

          run_check installed-wheel bash -c '
            rm -rf /tmp/hol-guard-wheel-venv /tmp/hol-guard-wheel-fixture
            python -m venv /tmp/hol-guard-wheel-venv
            /tmp/hol-guard-wheel-venv/bin/pip install --disable-pip-version-check dist/*.whl
            mkdir -p /tmp/hol-guard-wheel-fixture
            printf "# reviewed extension\\n" > /tmp/hol-guard-wheel-fixture/README.md
            HOL_GUARD_SCANNER_ENGINE="$HOL_GUARD_SCANNER_ENGINE" \
              /tmp/hol-guard-wheel-venv/bin/hol-guard-extension-security scan \
              /tmp/hol-guard-wheel-fixture \
              --output /tmp/installed-assurance.json
            python - <<"PY"
            import json
            value=json.load(open("/tmp/installed-assurance.json"))
            assert value["schema_version"] == "hol-guard.assurance-report.v1"
            assert len(value["artifact_digest"]) == 64
            assert len(value["evidence_digest"]) == 64
            assert value["coverage"]["limitations"]
            PY
          '

          run_check secret-redaction bash -c '
            rm -rf /tmp/hol-guard-secret-fixture
            mkdir -p /tmp/hol-guard-secret-fixture
            secret=ghp_abcdefghijklmnopqrstuvwxyzABCDEFGHIJ
            printf "token = \\\"%s\\\"\\n" "$secret" > /tmp/hol-guard-secret-fixture/secret.py
            set +e
            uv run --no-sync hol-guard-extension-security scan \
              /tmp/hol-guard-secret-fixture \
              --output /tmp/secret-assurance.json
            status=$?
            set -e
            test "$status" -le 3
            ! grep -F "$secret" /tmp/secret-assurance.json
            grep -q ASSURANCE_HARDCODED_SECRET /tmp/secret-assurance.json
          '

          run_check schema-validation bash -c '
            set +e
            uv run --no-sync hol-guard-extension-security scan . \
              --profile audit \
              --output /tmp/repository-assurance.json
            status=$?
            set -e
            test "$status" -le 3
            uv run --no-sync python - <<"PY"
            import json
            from pathlib import Path
            from jsonschema import Draft202012Validator
            schema=json.loads(Path("schemas/assurance-report.v1.json").read_text())
            value=json.loads(Path("/tmp/repository-assurance.json").read_text())
            Draft202012Validator.check_schema(schema)
            Draft202012Validator(schema).validate(value)
            assert value["coverage"]["limitations"]
            assert "evidence_digest" in value
            PY
          '

          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for line in Path('.scanner-assurance-final-diagnostics/summary.tsv').read_text().splitlines():
              name, status=line.split('\t')
              rows.append({'check': name, 'status': int(status)})
          payload={
              'schema_version': 'hol-guard.scanner-assurance-finalization.v1',
              'success': all(row['status'] == 0 for row in rows),
              'checks': rows,
          }
          Path('.scanner-assurance-final-diagnostics/result.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n'
          )
          PY
          cat .scanner-assurance-final-diagnostics/result.json
          success=$(python -c 'import json; print(str(json.load(open(".scanner-assurance-final-diagnostics/result.json"))["success"]).lower())')
          echo "success=$success" >> "$GITHUB_OUTPUT"
      - name: Commit verified implementation or diagnostics
        shell: bash
        run: |
          set -euo pipefail
          success='${{ steps.validation.outputs.success }}'
          if test "$success" = true; then
            rm -rf .scanner-assurance-final
            rm -rf .scanner-assurance-repair
            rm -rf .scanner-assurance-diagnostics .scanner-assurance-diagnostics-next
            rm -rf .scanner-assurance-final-diagnostics
            rm -f scripts/tmp_apply_scanner_assurance.py
            rm -f scripts/tmp_auto_repair_scanner_assurance.py
            rm -f scripts/tmp_finalize_scanner_assurance.py
            rm -f .github/workflows/tmp-apply-scanner-assurance.yml
            rm -f .github/workflows/tmp-harden-scanner-assurance.yml
            rm -f .github/workflows/tmp-validate-scanner-assurance.yml
            rm -f .github/workflows/tmp-auto-repair-scanner-assurance.yml
            rm -f .github/workflows/tmp-scanner-hardening-source-snapshot.yml
            rm -f .github/workflows/tmp-finalize-scanner-assurance.yml
            message="feat(scanner): complete layered assurance and Rust hardening"
          else
            mkdir -p .scanner-assurance-final-diagnostics
            previous=0
            if test -f .scanner-assurance-final-diagnostics/attempt.txt; then
              previous=$(cat .scanner-assurance-final-diagnostics/attempt.txt)
            fi
            printf '%s\n' "$((previous + 1))" > .scanner-assurance-final-diagnostics/attempt.txt
            message="chore(scanner): record final assurance validation diagnostics"
          fi
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -s -m "$message"
          git pull --rebase origin feat/scanner-assurance-rust-hardening-20260816
          git push origin HEAD:feat/scanner-assurance-rust-hardening-20260816
      - name: Upload finalization evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scanner-assurance-finalization
          path: .scanner-assurance-final-diagnostics
          if-no-files-found: ignore
          retention-days: 14
