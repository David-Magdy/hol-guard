name: Fix Codex daemon test readiness

on:
  push:
    branches: [feat/rust-runtime-native-publish]
    paths:
      - ".github/workflows/fix-codex-daemon-test-readiness.yml"

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: feat/rust-runtime-native-publish
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Patch the real-daemon readiness contract
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          test_path = Path("tests/test_codex_daemon_hook_bridge.py")
          original = test_path.read_text(encoding="utf-8")
          updated = original

          import_anchor = "import io\nimport json\n"
          import_replacement = "import http.client\nimport io\nimport json\n"
          if updated.count(import_anchor) != 1:
              raise RuntimeError("Expected the Codex bridge test import anchor once")
          updated = updated.replace(import_anchor, import_replacement, 1)

          threading_anchor = "import sys\nimport threading\n"
          threading_replacement = "import sys\nimport threading\nimport time\n"
          if updated.count(threading_anchor) != 1:
              raise RuntimeError("Expected the Codex bridge threading import anchor once")
          updated = updated.replace(threading_anchor, threading_replacement, 1)

          helper_anchor = "    _write_authenticated_daemon_files,\n)\n\n\n"
          helper = '''def _wait_for_guard_daemon_ready(
              daemon: GuardDaemonServer,
              *,
              timeout_seconds: float = 15.0,
          ) -> None:
              deadline = time.monotonic() + timeout_seconds
              last_error: BaseException | None = None
              while time.monotonic() < deadline:
                  connection = http.client.HTTPConnection("127.0.0.1", daemon.port, timeout=0.5)
                  try:
                      connection.request("GET", "/healthz", headers={"Connection": "close"})
                      response = connection.getresponse()
                      _ = response.read()
                      if response.status == 200:
                          return
                  except (OSError, http.client.HTTPException) as error:
                      last_error = error
                  finally:
                      connection.close()
                  time.sleep(0.01)
              raise AssertionError("Guard daemon did not become ready") from last_error


'''
          if updated.count(helper_anchor) != 1:
              raise RuntimeError("Expected the Codex bridge fixture import anchor once")
          updated = updated.replace(helper_anchor, helper_anchor + helper, 1)

          function_name = "def test_bridge_real_daemon_allows_static_github_content_read_with_safe_jq_filter("
          function_start = updated.index(function_name)
          next_function = updated.index("\n\n@pytest.mark.parametrize(", function_start + len(function_name))
          section = updated[function_start:next_function]
          start_anchor = "    daemon.start()\n"
          if section.count(start_anchor) != 1:
              raise RuntimeError("Expected exactly one daemon start in the static GitHub read test")
          section = section.replace(
              start_anchor,
              start_anchor + "    _wait_for_guard_daemon_ready(daemon)\n",
              1,
          )
          updated = updated[:function_start] + section + updated[next_function:]

          if updated == original:
              raise RuntimeError("Codex daemon readiness patch made no changes")
          test_path.write_text(updated, encoding="utf-8")

          line_delta = len(updated.splitlines()) - len(original.splitlines())
          if line_delta <= 0:
              raise RuntimeError("Expected the readiness regression coverage to add test lines")
          baseline_path = Path("ci/test-suite-ratchet-baseline.json")
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          baseline["maximum_test_source_lines"] += line_delta
          baseline_path.write_text(json.dumps(baseline, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Install locked test dependencies
        run: uv sync --frozen --extra dev --python 3.12
      - name: Verify focused readiness regressions repeatedly
        shell: bash
        run: |
          uv run --no-sync ruff check tests/test_codex_daemon_hook_bridge.py
          uv run --no-sync ruff format --check tests/test_codex_daemon_hook_bridge.py
          node_one='tests/test_codex_daemon_hook_bridge.py::test_bridge_real_daemon_allows_static_github_content_read_with_safe_jq_filter[gh pr view 1 -tREVIEW]'
          node_two='tests/test_codex_daemon_hook_bridge.py::test_bridge_real_daemon_allows_static_github_content_read_with_safe_jq_filter[gh run list -cREVIEW_SHA]'
          for attempt in 1 2 3; do
            echo "Focused daemon readiness verification attempt ${attempt}"
            uv run --no-sync pytest -q "$node_one" "$node_two" --tb=short
          done
      - name: Commit the verified fix and remove this staging workflow
        shell: bash
        run: |
          git diff --check
          git rm -- .github/workflows/fix-codex-daemon-test-readiness.yml
          git add tests/test_codex_daemon_hook_bridge.py ci/test-suite-ratchet-baseline.json
          actual=$(git diff --cached --name-only | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/fix-codex-daemon-test-readiness.yml' \
            'ci/test-suite-ratchet-baseline.json' \
            'tests/test_codex_daemon_hook_bridge.py' | sort)
          if [[ "$actual" != "$expected" ]]; then
            printf 'Unexpected staged files:\n%s\n' "$actual" >&2
            exit 1
          fi
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git commit --signoff -m "test(daemon): wait for authenticated bridge readiness"
          git push origin HEAD:feat/rust-runtime-native-publish
