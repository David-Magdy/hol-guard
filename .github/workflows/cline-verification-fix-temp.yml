name: Temporary Cline verification fix prep

on:
  push:
    branches:
      - test/cline-live-e2e-final-20260808
    paths:
      - .github/workflows/cline-verification-fix-temp.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/release-3.0-cline-live-policy
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Patch Cline verification and regression
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          python - <<'PY'
          from pathlib import Path

          production = Path('src/codex_plugin_scanner/guard/cli/install_commands.py')
          text = production.read_text(encoding='utf-8')
          needle = '''    if adapter.harness == "grok":\n        verification.update(_grok_protection_checks(context))\n'''
          replacement = needle + '''    if isinstance(adapter, ClineHarnessAdapter):\n        runtime_probe = adapter.runtime_probe(context)\n        verification["runtime"] = runtime_probe or {}\n        verification["warnings"] = adapter.diagnostic_warnings(adapter.detect(context), runtime_probe)\n        active_transport = runtime_probe.get("active_transport") if isinstance(runtime_probe, dict) else None\n        requested_transport = surface if surface in {"hooks", "plugin"} else active_transport\n        state_key = "plugin" if requested_transport == "plugin" else "native_hooks"\n        runtime_state = runtime_probe.get(state_key) if isinstance(runtime_probe, dict) else None\n        verification["active_transport"] = active_transport\n        verification["requested_transport"] = requested_transport\n        verification["ready"] = bool(\n            requested_transport == active_transport\n            and isinstance(runtime_state, dict)\n            and runtime_state.get("ready") is True\n        )\n'''
          if replacement not in text:
              if needle not in text:
                  raise SystemExit('verification insertion point not found')
              text = text.replace(needle, replacement, 1)
              production.write_text(text, encoding='utf-8')

          tests = Path('tests/test_cline_completion_gates.py')
          text = tests.read_text(encoding='utf-8')
          import_needle = 'from codex_plugin_scanner.guard.adapters.base import HarnessContext\n'
          import_replacement = (
              import_needle
              + 'from codex_plugin_scanner.guard.adapters.cline import ClineHarnessAdapter\n'
              + 'from codex_plugin_scanner.guard.cli.install_commands import build_harness_verification\n'
          )
          if 'build_harness_verification' not in text:
              if import_needle not in text:
                  raise SystemExit('test import insertion point not found')
              text = text.replace(import_needle, import_replacement, 1)

          test_body = '''\n\ndef test_cline_safe_verification_reports_live_plugin_readiness(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    context = _context(tmp_path)\n    runtime = {\n        "hosts": ["cli"],\n        "cli_version": "3.0.51",\n        "vscode_versions": [],\n        "jetbrains_detected": False,\n        "active_transport": "plugin",\n        "native_hooks": {"installed": False, "ready": False},\n        "plugin": {\n            "installed": True,\n            "integrity_ok": True,\n            "pretool_blocking_proven": True,\n            "posttool_replacement_proven": True,\n            "ready": True,\n        },\n        "mcp": {"configured": False, "ready": True},\n        "duplicate_managed_transports": False,\n    }\n    monkeypatch.setattr(ClineHarnessAdapter, "runtime_probe", lambda self, _context: runtime)\n\n    payload = build_harness_verification("cline", context, surface="plugin")\n\n    verification = payload["verification"]\n    assert verification["runtime"] == runtime\n    assert verification["active_transport"] == "plugin"\n    assert verification["requested_transport"] == "plugin"\n    assert verification["ready"] is True\n\n\ndef test_cline_safe_verification_does_not_trust_inactive_plugin(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    context = _context(tmp_path)\n    runtime = {\n        "hosts": ["cli"],\n        "cli_version": "3.0.51",\n        "vscode_versions": [],\n        "jetbrains_detected": False,\n        "active_transport": "hooks",\n        "native_hooks": {"installed": True, "ready": True},\n        "plugin": {"installed": True, "integrity_ok": True, "ready": True},\n        "mcp": {"configured": False, "ready": True},\n        "duplicate_managed_transports": True,\n    }\n    monkeypatch.setattr(ClineHarnessAdapter, "runtime_probe", lambda self, _context: runtime)\n\n    payload = build_harness_verification("cline", context, surface="plugin")\n\n    verification = payload["verification"]\n    assert verification["active_transport"] == "hooks"\n    assert verification["requested_transport"] == "plugin"\n    assert verification["ready"] is False\n'''
          if 'test_cline_safe_verification_reports_live_plugin_readiness' not in text:
              text += test_body
          tests.write_text(text, encoding='utf-8')
          PY

          uv sync --frozen --group dev
          uv run ruff format src/codex_plugin_scanner/guard/cli/install_commands.py tests/test_cline_completion_gates.py
          uv run ruff check src/codex_plugin_scanner/guard/cli/install_commands.py tests/test_cline_completion_gates.py
          uv run pytest -q tests/test_cline_completion_gates.py
          git diff --check
          git diff -- src/codex_plugin_scanner/guard/cli/install_commands.py tests/test_cline_completion_gates.py

      - name: Commit tested fix to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/codex_plugin_scanner/guard/cli/install_commands.py tests/test_cline_completion_gates.py
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix(cline): report live verification readiness'
          git push origin HEAD:fix/release-3.0-cline-live-policy
