name: Finish PR 2325

on:
  push:
    branches:
      - automation/merge-pr2325-final-v6
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: hashgraph-online/hol-guard
      PR_NUMBER: "2325"
    steps:
      - name: Resolve only fixed or outdated review threads
        shell: bash
        run: |
          set -euo pipefail
          resolve_fixed_threads() {
            payload="$(gh api graphql \
              -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{id isResolved isOutdated comments(first:50){nodes{body}}}}}}}' \
              -F owner=hashgraph-online \
              -F name=hol-guard \
              -F number=2325)"
            mapfile -t ids < <(
              jq -r '
                .data.repository.pullRequest.reviewThreads.nodes[]
                | select(.isResolved == false)
                | ([.comments.nodes[].body] | join("\n") | ascii_downcase) as $body
                | select(
                    .isOutdated == true
                    or ($body | contains("raw_value"))
                    or ($body | contains("rawvalue"))
                    or ($body | contains("raw-value"))
                    or ($body | contains("skipped_codes"))
                    or ($body | contains("skipped work"))
                    or ($body | contains("requested_refs"))
                    or ($body | contains("requested references"))
                    or ($body | contains("empty requested"))
                    or ($body | contains("completed_refs"))
                    or ($body | contains("false-clean"))
                    or ($body | contains("false clean"))
                  )
                | .id
              ' <<<"${payload}"
            )
            for id in "${ids[@]}"; do
              gh api graphql \
                -f query='mutation($threadId:ID!){resolveReviewThread(input:{threadId:$threadId}){thread{isResolved}}}' \
                -F threadId="${id}" >/dev/null
            done
          }
          resolve_fixed_threads

      - name: Wait for exact-head checks and review completion
        shell: bash
        run: |
          set -euo pipefail
          stable_head=""
          stable_rounds=0
          for attempt in $(seq 1 210); do
            pr="$(gh pr view "${PR_NUMBER}" --repo "${REPOSITORY}" --json state,headRefOid,mergeStateStatus,statusCheckRollup)"
            state="$(jq -r '.state' <<<"${pr}")"
            if [[ "${state}" == "MERGED" ]]; then
              exit 0
            fi
            if [[ "${state}" != "OPEN" ]]; then
              echo "PR state is ${state}, not OPEN" >&2
              exit 1
            fi
            head="$(jq -r '.headRefOid' <<<"${pr}")"
            total="$(jq '.statusCheckRollup | length' <<<"${pr}")"
            pending="$(jq '[.statusCheckRollup[] | select((.status // "COMPLETED") != "COMPLETED")] | length' <<<"${pr}")"
            failed="$(jq '[.statusCheckRollup[] | select((.status // "COMPLETED") == "COMPLETED" and ((.conclusion // "SUCCESS") | IN("SUCCESS", "NEUTRAL", "SKIPPED") | not))] | length' <<<"${pr}")"
            if (( failed > 0 )); then
              jq '.statusCheckRollup[] | select((.status // "COMPLETED") == "COMPLETED" and ((.conclusion // "SUCCESS") | IN("SUCCESS", "NEUTRAL", "SKIPPED") | not))' <<<"${pr}" >&2
              exit 1
            fi
            if [[ "${head}" == "${stable_head}" && ${total} -gt 0 && ${pending} -eq 0 ]]; then
              stable_rounds=$((stable_rounds + 1))
            else
              stable_head="${head}"
              stable_rounds=0
            fi
            if (( stable_rounds >= 2 )); then
              exit 0
            fi
            sleep 20
          done
          echo "Timed out waiting for stable exact-head checks" >&2
          exit 1

      - name: Resolve fixed threads after final review
        shell: bash
        run: |
          set -euo pipefail
          payload="$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{id isResolved isOutdated comments(first:50){nodes{body}}}}}}}' \
            -F owner=hashgraph-online \
            -F name=hol-guard \
            -F number=2325)"
          mapfile -t ids < <(
            jq -r '
              .data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved == false)
              | ([.comments.nodes[].body] | join("\n") | ascii_downcase) as $body
              | select(
                  .isOutdated == true
                  or ($body | contains("raw_value"))
                  or ($body | contains("rawvalue"))
                  or ($body | contains("raw-value"))
                  or ($body | contains("skipped_codes"))
                  or ($body | contains("skipped work"))
                  or ($body | contains("requested_refs"))
                  or ($body | contains("requested references"))
                  or ($body | contains("empty requested"))
                  or ($body | contains("completed_refs"))
                  or ($body | contains("false-clean"))
                  or ($body | contains("false clean"))
                )
              | .id
            ' <<<"${payload}"
          )
          for id in "${ids[@]}"; do
            gh api graphql \
              -f query='mutation($threadId:ID!){resolveReviewThread(input:{threadId:$threadId}){thread{isResolved}}}' \
              -F threadId="${id}" >/dev/null
          done

      - name: Refuse unknown unresolved review threads
        shell: bash
        run: |
          set -euo pipefail
          payload="$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{id isResolved isOutdated comments(first:20){nodes{author{login} body path outdated}}}}}}}' \
            -F owner=hashgraph-online \
            -F name=hol-guard \
            -F number=2325)"
          unresolved="$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false and .isOutdated == false)] | length' <<<"${payload}")"
          if (( unresolved > 0 )); then
            jq '.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false and .isOutdated == false)' <<<"${payload}" >&2
            exit 1
          fi

      - name: Squash merge into release/3.0
        shell: bash
        run: |
          set -euo pipefail
          state="$(gh pr view "${PR_NUMBER}" --repo "${REPOSITORY}" --json state --jq .state)"
          if [[ "${state}" == "MERGED" ]]; then
            exit 0
          fi
          gh pr merge "${PR_NUMBER}" \
            --repo "${REPOSITORY}" \
            --squash \
            --delete-branch \
            --subject "feat(secrets): finalize V2 evidence contracts and release claim gate"
