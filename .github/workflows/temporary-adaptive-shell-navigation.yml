name: Temporary adaptive shell navigation validation

on:
  push:
    branches:
      - fix/adaptive-shell-navigation

permissions:
  contents: write

concurrency:
  group: adaptive-shell-navigation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-build-and-refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/adaptive-shell-navigation
          fetch-depth: 1

      - name: Apply adaptive navigation source
        shell: bash
        run: |
          set -euo pipefail
          cat .github/adaptive-nav-payload.part* | base64 --decode > /tmp/adaptive-shell-navigation.tar.xz
          tar -xJf /tmp/adaptive-shell-navigation.tar.xz -C .
          rm /tmp/adaptive-shell-navigation.tar.xz

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dashboard dependencies
        run: cd dashboard && bun install --frozen-lockfile

      - name: Run dashboard tests
        run: cd dashboard && bun run test

      - name: Build dashboard and generated assets
        run: cd dashboard && bun run build

      - name: Install Chromium
        run: cd dashboard && bunx playwright install --with-deps chromium

      - name: Exercise live responsive resizing
        run: cd dashboard && bun run test:e2e -- shell-navigation-responsive.spec.ts

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary-adaptive-shell-navigation.yml .github/adaptive-nav-payload.part*
          git add dashboard src/codex_plugin_scanner/guard/daemon/static
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(dashboard): replace select navigation with adaptive shell"
          git push origin HEAD:fix/adaptive-shell-navigation
