name: Protection Center Batch 6 API allowlist fix
on:
  push:
    branches: [feat/protection-center-06-cloud-boundary-hardening]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Align dashboard extension-control transport with daemon routes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          api_path = Path('dashboard/src/guard-api.ts')
          api = api_path.read_text(encoding='utf-8')
          old = r'/^\/v1\/extension-controls\/(?:catalog|effective|preview|apply|refresh|recover-authority)$/.test(input);'
          new = r'/^\/v1\/extension-controls\/(?:catalog|effective|history|preview|test|apply|refresh|recover-authority|acknowledge-degraded)$/.test(input);'
          if api.count(old) != 1:
              raise SystemExit(f'expected one extension-control allowlist, found {api.count(old)}')
          api_path.write_text(api.replace(old, new), encoding='utf-8')

          contract_path = Path('dashboard/src/protection-center/protection-final-contract.test.ts')
          contract = contract_path.read_text(encoding='utf-8')
          read_line = 'const guardApi = readFileSync(new URL("../guard-api.ts", import.meta.url), "utf8");\n'
          if read_line not in contract:
              marker = 'const lab = readFileSync(new URL("./protection-test-lab.tsx", import.meta.url), "utf8");\n'
              if contract.count(marker) != 1:
                  raise SystemExit('unexpected Protection Center contract fixture block')
              contract = contract.replace(marker, marker + read_line)
          assertion = 'assert.match(guardApi, /catalog\\|effective\\|history\\|preview\\|test\\|apply\\|refresh\\|recover-authority\\|acknowledge-degraded/);\n'
          if assertion not in contract:
              marker = 'assert.match(lab, /not saved to Activity or sent to Guard Cloud/);\n'
              if contract.count(marker) != 1:
                  raise SystemExit('unexpected Protection Center contract assertions')
              contract = contract.replace(marker, marker + assertion)
          contract_path.write_text(contract, encoding='utf-8')
          PY
          git diff --check
      - name: Verify dashboard contracts and rebuild packaged assets
        shell: bash
        run: |
          set -euo pipefail
          cd dashboard
          bun install --frozen-lockfile --ignore-scripts
          bun run test
          bun run build
          cd ..
          git diff --check
      - name: Commit verified transport fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/protection-center-batch6-api-allowlist-fix.yml
          git add dashboard/src/guard-api.ts \
            dashboard/src/protection-center/protection-final-contract.test.ts \
            src/codex_plugin_scanner/guard/daemon/static \
            .github/workflows/protection-center-batch6-api-allowlist-fix.yml
          git diff --cached --check
          git commit -m "fix(protection-center): allow local Test Lab and history routes"
          git push origin HEAD:feat/protection-center-06-cloud-boundary-hardening
