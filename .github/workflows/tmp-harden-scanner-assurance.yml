name: Harden scanner assurance implementation

on:
  push:
    branches:
      - feat/scanner-assurance-rust-hardening-20260816
    paths:
      - .github/workflows/tmp-harden-scanner-assurance.yml
      - .scanner-assurance-repair/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanner-assurance-materialization
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/scanner-assurance-rust-hardening-20260816
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            rust/scanner-engine/Cargo.lock
      - name: Materialize integration when the earlier applicator has not completed
        shell: bash
        run: |
          set -euo pipefail
          if test -f scripts/tmp_apply_scanner_assurance.py; then
            python scripts/tmp_apply_scanner_assurance.py
          fi
      - name: Install hardened replacements and apply security transforms
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 .scanner-assurance-repair/inventory.py \
            src/codex_plugin_scanner/assurance/inventory.py
          install -m 0644 .scanner-assurance-repair/ingestion.py \
            src/codex_plugin_scanner/assurance/ingestion.py
          python .scanner-assurance-repair/harden.py
      - name: Refresh deterministic dependency locks
        run: |
          uv lock
          cargo generate-lockfile --manifest-path rust/scanner-engine/Cargo.toml
      - name: Install development environment
        run: uv sync --frozen --extra dev --python 3.12
      - name: Format and autofix scoped implementation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/scanner-engine/Cargo.toml
          uv run --no-sync python -m ruff check --fix \
            src/codex_plugin_scanner/assurance \
            src/codex_plugin_scanner/assurance_cli.py \
            src/codex_plugin_scanner/models.py \
            src/codex_plugin_scanner/reporting.py \
            src/codex_plugin_scanner/scanner.py \
            src/codex_plugin_scanner/_scanner_commands.py \
            src/codex_plugin_scanner/quality_artifact.py \
            tests/test_assurance_archive.py \
            tests/test_assurance_dependencies.py \
            tests/test_assurance_drift_detonation.py \
            tests/test_assurance_integration.py \
            tests/test_assurance_native.py \
            tests/test_assurance_policy_ingestion.py \
            tests/test_assurance_security_vectors.py
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/assurance \
            src/codex_plugin_scanner/assurance_cli.py \
            src/codex_plugin_scanner/models.py \
            src/codex_plugin_scanner/reporting.py \
            src/codex_plugin_scanner/scanner.py \
            src/codex_plugin_scanner/_scanner_commands.py \
            src/codex_plugin_scanner/quality_artifact.py \
            tests/test_assurance_archive.py \
            tests/test_assurance_dependencies.py \
            tests/test_assurance_drift_detonation.py \
            tests/test_assurance_integration.py \
            tests/test_assurance_native.py \
            tests/test_assurance_policy_ingestion.py \
            tests/test_assurance_security_vectors.py
      - name: Build, lint, and test Rust native hot path
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/scanner-engine/Cargo.toml -- --check
          cargo clippy --manifest-path rust/scanner-engine/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path rust/scanner-engine/Cargo.toml
          cargo build --release --locked --manifest-path rust/scanner-engine/Cargo.toml
      - name: Validate Python implementation
        env:
          HOL_GUARD_SCANNER_ENGINE: ${{ github.workspace }}/rust/scanner-engine/target/release/hol-guard-scanner-engine
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            src/codex_plugin_scanner/assurance \
            src/codex_plugin_scanner/assurance_cli.py
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/assurance \
            src/codex_plugin_scanner/assurance_cli.py \
            src/codex_plugin_scanner/models.py \
            src/codex_plugin_scanner/reporting.py \
            src/codex_plugin_scanner/scanner.py \
            src/codex_plugin_scanner/_scanner_commands.py \
            src/codex_plugin_scanner/quality_artifact.py \
            tests/test_assurance_archive.py \
            tests/test_assurance_dependencies.py \
            tests/test_assurance_drift_detonation.py \
            tests/test_assurance_integration.py \
            tests/test_assurance_native.py \
            tests/test_assurance_policy_ingestion.py \
            tests/test_assurance_security_vectors.py
          uv run --no-sync python -m ruff format --check \
            src/codex_plugin_scanner/assurance \
            src/codex_plugin_scanner/assurance_cli.py \
            tests/test_assurance_archive.py \
            tests/test_assurance_dependencies.py \
            tests/test_assurance_drift_detonation.py \
            tests/test_assurance_integration.py \
            tests/test_assurance_native.py \
            tests/test_assurance_policy_ingestion.py \
            tests/test_assurance_security_vectors.py
          uv run --no-sync basedpyright --level error \
            src/codex_plugin_scanner/assurance \
            src/codex_plugin_scanner/assurance_cli.py
      - name: Run hostile corpus and legacy scanner regressions
        env:
          HOL_GUARD_SCANNER_ENGINE: ${{ github.workspace }}/rust/scanner-engine/target/release/hol-guard-scanner-engine
        run: >-
          uv run --no-sync pytest
          tests/test_assurance_archive.py
          tests/test_assurance_dependencies.py
          tests/test_assurance_drift_detonation.py
          tests/test_assurance_integration.py
          tests/test_assurance_native.py
          tests/test_assurance_policy_ingestion.py
          tests/test_assurance_security_vectors.py
          tests/test_policy.py
          tests/test_reporting.py
          tests/test_schema_contracts.py
          tests/test_security_ops.py
          tests/test_integration.py
          tests/test_verification.py
          --tb=short
      - name: Build and test installed wheel
        env:
          HOL_GUARD_SCANNER_ENGINE: ${{ github.workspace }}/rust/scanner-engine/target/release/hol-guard-scanner-engine
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel
          python -m venv /tmp/scanner-assurance-wheel
          /tmp/scanner-assurance-wheel/bin/pip install --disable-pip-version-check dist/*.whl
          /tmp/scanner-assurance-wheel/bin/hol-guard-extension-security --help
          mkdir -p /tmp/assurance-benign
          printf '# benign extension\n' > /tmp/assurance-benign/README.md
          /tmp/scanner-assurance-wheel/bin/hol-guard-extension-security \
            scan /tmp/assurance-benign --profile balanced \
            --output /tmp/assurance-installed-report.json
          test -s /tmp/assurance-installed-report.json
      - name: Self-inspect and validate emitted schema
        env:
          HOL_GUARD_SCANNER_ENGINE: ${{ github.workspace }}/rust/scanner-engine/target/release/hol-guard-scanner-engine
        shell: bash
        run: |
          set -euo pipefail
          set +e
          uv run --no-sync hol-guard-extension-security \
            scan src/codex_plugin_scanner --profile audit \
            --output scanner-assurance-self-scan.json
          status=$?
          set -e
          test "$status" -le 3
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          payload = json.loads(Path('scanner-assurance-self-scan.json').read_text())
          schema = json.loads(Path('schemas/assurance-report.v1.json').read_text())
          jsonschema.Draft202012Validator(schema).validate(payload)
          assert payload['coverage']['state'] != 'error'
          assert payload['evidence_digest']
          assert payload['layers']
          PY
      - name: Remove temporary materialization infrastructure
        run: |
          rm -rf .scanner-assurance-repair
          rm -f scripts/tmp_apply_scanner_assurance.py
          rm -f .github/workflows/tmp-apply-scanner-assurance.yml
          rm -f .github/workflows/tmp-harden-scanner-assurance.yml
          rm -f .github/workflows/tmp-scanner-hardening-source-snapshot.yml
      - name: Commit validated hardening
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git status --short)"
          git config user.name "Michael Kantor"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git add -A
          git commit -s -m "feat(scanner): harden layered assurance end to end"
          git push origin HEAD:feat/scanner-assurance-rust-hardening-20260816
