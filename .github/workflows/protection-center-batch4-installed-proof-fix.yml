name: Protection Center Batch 4 installed proof fix
on:
  push:
    branches: [feat/protection-center-04-friendly-settings]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Align proof to friendly module settings UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          p = Path('dashboard/e2e/installed-extension-control-center.spec.ts')
          t = p.read_text(encoding='utf-8')
          pairs = [
              ('await expect(page.getByRole("heading", { name: "Protection settings" })).toBeVisible();', 'await expect(page.locator("#extension-policy-heading")).toHaveText("Protection settings");'),
              ('`Review ${count} permission change${count === 1 ? "" : "s"}`', '`Review ${count} protection setting change${count === 1 ? "" : "s"}`'),
              ('`Apply ${count} extension permission change${count === 1 ? "" : "s"}`', '`Apply ${count} protection setting change${count === 1 ? "" : "s"}`'),
              ('getByRole("button", { name: "Protections" })', 'getByRole("button", { name: "Modules" })'),
              ('row.getByRole("radio", { name: "Block" })', 'row.getByRole("radio", { name: "Block matching actions" })'),
              ('row.getByRole("radio", { name: "Inherit" })', 'row.getByRole("radio", { name: "Use recommended" })'),
              ('page.getByRole("dialog", { name: "Review 1 permission change" })', 'page.getByRole("dialog", { name: "Review 1 protection setting change" })'),
              ('review.getByText("Server semantic preview")', 'review.getByText("Protection review", { exact: true }).first()'),
              ('review.getByText("Affected rule IDs")', 'review.getByText("Developer details", { exact: true })'),
              ('review.getByRole("button", { name: `Apply ${count} reviewed change${count === 1 ? "" : "s"}` }).click();', 'review.getByRole("button", { name: "Continue to approval" }).click();'),
          ]
          for old, new in pairs:
              if old not in t:
                  print(f'already absent: {old}')
              t = t.replace(old, new)
          p.write_text(t, encoding='utf-8')
          PY
          cd dashboard
          bun install --frozen-lockfile --ignore-scripts
          bun run test
          cd ..
          rm .github/workflows/protection-center-batch4-installed-proof-fix.yml
          git add dashboard/e2e/installed-extension-control-center.spec.ts .github/workflows/protection-center-batch4-installed-proof-fix.yml
          git diff --cached --check
          git commit -m "test(protection-center): align installed proof with module settings UX"
          git push origin HEAD:feat/protection-center-04-friendly-settings