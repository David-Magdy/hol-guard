name: Refresh code-quality decision-diff fixture

on:
  push:
    branches:
      - refactor/release-3-code-quality-hardening
    paths:
      - .github/workflows/tmp-refresh-code-quality-decision-diff.yml

permissions:
  contents: write

concurrency:
  group: refresh-code-quality-decision-diff
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.repository == 'hashgraph-online/hol-guard' &&
      github.ref == 'refs/heads/refactor/release-3-code-quality-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: refactor/release-3-code-quality-hardening
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
          save-cache: false
      - name: Install locked development environment
        run: uv sync --frozen --extra dev --python 3.12
      - name: Regenerate and verify source-bound evidence
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python tests/guard_command_decision_diff.py --write
          uv run --no-sync python tests/guard_command_decision_diff.py --check
          git diff --check
          test -s tests/fixtures/guard-command-corpus/decision-diff-report.json
      - name: Commit refreshed fixture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/guard-command-corpus/decision-diff-report.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "test: refresh source-bound decision-diff evidence"
          git push origin HEAD:refactor/release-3-code-quality-hardening
