name: Fix PR 2325 empty-source coverage

on:
  push:
    branches:
      - automation/fix-pr2325-empty-source-final-0814

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/secrets-v2-evidence-contracts-clean
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Apply fail-honest source coverage invariant
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ca28bb658d2c58e9cca7c71d2980a24435f57728"
          python - <<'PY'
          from pathlib import Path

          contracts_path = Path("src/codex_plugin_scanner/guard/secrets/contracts_v2.py")
          lines = contracts_path.read_text(encoding="utf-8").splitlines()

          class_start = lines.index("class SecretScanCoverageV2:")
          class_end = next(
              index
              for index in range(class_start + 1, len(lines))
              if lines[index].startswith("class ") or lines[index].startswith("@dataclass")
          )
          post_init = lines.index("    def __post_init__(self) -> None:", class_start, class_end)
          first_invariant = post_init + 1
          if lines[first_invariant] != "        if self.skipped_codes and not self.partial:":
              raise SystemExit("coverage invariant ordering changed unexpectedly")
          lines[first_invariant:first_invariant] = [
              "        if not self.source_set:",
              '            raise SecretContractError("source_set must not be empty")',
          ]

          clean_def = lines.index("    def clean_eligible(self) -> bool:", class_start, class_end + 2)
          return_index = lines.index("        return (", clean_def, class_end + 2)
          if lines[return_index + 1] != "            bool(self.requested_refs)":
              raise SystemExit("clean eligibility changed unexpectedly")
          lines.insert(return_index + 1, "            bool(self.source_set)")
          lines.insert(return_index + 2, "            and bool(self.requested_refs)")
          del lines[return_index + 3]
          contracts_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          tests_path = Path("tests/test_guard_secret_contracts_v2.py")
          lines = tests_path.read_text(encoding="utf-8").splitlines()
          anchor = lines.index("def test_direct_coverage_rejects_empty_refs_without_partial() -> None:")
          additions = [
              "def test_direct_coverage_rejects_empty_source_set() -> None:",
              '    with pytest.raises(SecretContractError, match="source_set must not be empty"):',
              "        _direct_coverage(source_set=())",
              "",
              "",
              "def test_mapping_coverage_rejects_empty_source_set() -> None:",
              '    with pytest.raises(SecretContractError, match="source_set: must not be empty"):',
              "        _coverage(source_set=[])",
              "",
              "",
          ]
          lines[anchor:anchor] = additions
          tests_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Install locked development dependencies
        shell: bash
        env:
          UV_HTTP_TIMEOUT: "120"
          UV_HTTP_RETRIES: "5"
        run: |
          set -euo pipefail
          if ! uv sync --frozen --extra dev --python 3.12; then
            sleep 10
            uv sync --frozen --extra dev --python 3.12
          fi

      - name: Format, lint, and test the exact changes
        shell: bash
        run: |
          set -euo pipefail
          changed=(
            src/codex_plugin_scanner/guard/secrets/contracts_v2.py
            tests/test_guard_secret_contracts_v2.py
          )
          uv run --no-sync ruff format "${changed[@]}"
          uv run --no-sync ruff check "${changed[@]}"
          uv run --no-sync ruff format --check "${changed[@]}"
          uv run --no-sync pytest \
            tests/test_guard_secret_contracts_v2.py \
            tests/test_guard_secret_release_claim_gate.py \
            tests/test_release_toolchain_sbom.py \
            --tb=short

      - name: Reconcile and verify the exact test inventory
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/ci/test_inventory.py --output /tmp/test-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path("/tmp/test-inventory.json").read_text(encoding="utf-8"))
          baseline = {
              "maximum_collected_cases": inventory["inventory"]["collected_cases"],
              "maximum_test_source_lines": inventory["test_source_lines"],
              "schema_version": 1,
          }
          Path("ci/test-suite-ratchet-baseline.json").write_text(
              json.dumps(baseline, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(baseline, sort_keys=True))
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory /tmp/test-inventory.json
          git diff --check

      - name: Commit the validated fix to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ci/test-suite-ratchet-baseline.json \
            src/codex_plugin_scanner/guard/secrets/contracts_v2.py \
            tests/test_guard_secret_contracts_v2.py
          git commit -m "fix(secrets): reject empty source coverage"
          git push origin HEAD:feat/secrets-v2-evidence-contracts-clean
