name: Ruff format diagnostic

on:
  pull_request:
    branches:
      - release/3.0

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check --no-input ruff==0.15.17
      - name: Print exact formatter diff
        run: python -m ruff format --diff src/codex_plugin_scanner/guard/secrets/contracts_v2.py
