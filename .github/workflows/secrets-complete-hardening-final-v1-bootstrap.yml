name: Secrets complete hardening final integration

on:
  push:
    branches:
      - fix/secrets-complete-hardening-final-v1
    paths:
      - '.github/workflows/secrets-complete-hardening-final-v1-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: secrets-complete-hardening-final-v1-bootstrap
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout V2-derived branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/secrets-complete-hardening-final-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed permanent platform patch
        shell: bash
        run: |
          set -euo pipefail
          source_branch='fix/secrets-e2e-platform-hardening-v2'
          source_base='fa7dd0fdf50eb1427a0b3dba0e40225dfca82a2e'
          source_head='1143f6e3eb355e6de1e434083ff2c974efd78708'
          git fetch --no-tags origin "$source_branch"
          test "$(git rev-parse FETCH_HEAD)" = "$source_head"
          paths=(
            .github/workflows/secrets-platform-e2e.yml
            docs/guard/secrets-platform-hardening.md
            scripts/ci/run_guard_secrets_platform_smoke_v2.py
            src/codex_plugin_scanner/guard/secrets/cli.py
            src/codex_plugin_scanner/guard/secrets/git_subprocess.py
            src/codex_plugin_scanner/guard/secrets/precommit.py
            src/codex_plugin_scanner/guard/secrets/secret_staged_scanner.py
            src/codex_plugin_scanner/guard/secrets/setup_diagnostics.py
            tests/test_guard_secret_doctor.py
            tests/test_guard_secret_git_subprocess_hardening.py
            tests/test_guard_secret_hook_configuration_hardening.py
            tests/test_guard_secret_input_coverage_hardening.py
            tests/test_guard_secret_platform_hardening.py
          )
          git diff --binary --full-index "$source_base" "$source_head" -- "${paths[@]}" > /tmp/secrets-platform.patch
          test -s /tmp/secrets-platform.patch
          git apply --3way --index /tmp/secrets-platform.patch
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Import reviewed Git edge tests and pipx proof
        shell: bash
        run: |
          set -euo pipefail
          git show 5f5befcf2aa847d2813d40e8bf47f4ce4f5a95d2:tests/test_guard_secret_git_process_security.py > tests/test_guard_secret_git_process_security.py
          git show 1de19656af287ced5a8cac17b2986053c125afca:tests/test_guard_secret_git_repository_edges.py > tests/test_guard_secret_git_repository_edges.py
          git show 1de19656af287ced5a8cac17b2986053c125afca:scripts/ci/run_guard_secrets_pipx_smoke.py > scripts/ci/run_guard_secrets_pipx_smoke.py
          git show 8960c9dd8205849f2efbe3e2f5cf752e941e61f9:tests/test_guard_secret_coverage_edges.py > tests/test_guard_secret_coverage_edges.py
          git add tests/test_guard_secret_git_process_security.py tests/test_guard_secret_git_repository_edges.py scripts/ci/run_guard_secrets_pipx_smoke.py tests/test_guard_secret_coverage_edges.py

      - name: Materialize reviewed bounded Git helper and edge patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import textwrap

          source = subprocess.check_output(
              ['git', 'show', '5f5befcf2aa847d2813d40e8bf47f4ce4f5a95d2:.github/workflows/secrets-git-process-bootstrap.yml'],
              text=True,
          )
          match = re.search(
              r"cat > src/codex_plugin_scanner/guard/secrets/git_safe\.py <<'PY'\n(.*?)\n          PY",
              source,
              flags=re.S,
          )
          if match is None:
              raise SystemExit('reviewed git_safe source block not found')
          Path('src/codex_plugin_scanner/guard/secrets/git_safe.py').write_text(
              textwrap.dedent(match.group(1)).rstrip() + '\n',
              encoding='utf-8',
          )

          def execute_block(revision: str, workflow: str, required: tuple[str, ...]) -> None:
              body = subprocess.check_output(['git', 'show', f'{revision}:{workflow}'], text=True)
              for raw in re.findall(r"python - <<'PY'\n(.*?)\n          PY", body, flags=re.S):
                  script = textwrap.dedent(raw)
                  if all(value in script for value in required):
                      exec(compile(script, f'{revision}:{workflow}', 'exec'), {})
                      return
              raise SystemExit(f'reviewed patch block not found: {workflow}')

          execute_block(
              '1de19656af287ced5a8cac17b2986053c125afca',
              '.github/workflows/secrets-git-object-integration.yml',
              ('git_lfs_pointer_content_unavailable', 'secret_repository_scanner.py'),
          )
          execute_block(
              '8efba21c24afc54677899d3e8b5619d1c252598f',
              '.github/workflows/secrets-hook-worktree-integration.yml',
              ('git_sparse_checkout_partial', 'bare_repository_working_tree_unavailable'),
          )
          PY

      - name: Set up Python and uv
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false

      - name: Format lint type-check and test Secrets surfaces
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync python -m ruff format src/codex_plugin_scanner/guard/secrets scripts/ci/run_guard_secrets_platform_smoke_v2.py scripts/ci/run_guard_secrets_pipx_smoke.py tests/test_guard_secret_*.py
          uv run --no-sync python -m ruff check --fix src/codex_plugin_scanner/guard/secrets scripts/ci/run_guard_secrets_platform_smoke_v2.py scripts/ci/run_guard_secrets_pipx_smoke.py tests/test_guard_secret_*.py
          uv run --no-sync python -m ruff format src/codex_plugin_scanner/guard/secrets scripts/ci/run_guard_secrets_platform_smoke_v2.py scripts/ci/run_guard_secrets_pipx_smoke.py tests/test_guard_secret_*.py
          uv run --no-sync python -m ruff check src/codex_plugin_scanner/guard/secrets scripts/ci/run_guard_secrets_platform_smoke_v2.py scripts/ci/run_guard_secrets_pipx_smoke.py tests/test_guard_secret_*.py
          uv run --no-sync basedpyright --level error src/codex_plugin_scanner/guard/secrets scripts/ci/run_guard_secrets_platform_smoke_v2.py scripts/ci/run_guard_secrets_pipx_smoke.py
          mapfile -d '' tests < <(find tests -maxdepth 1 -type f \( -name '*secret*.py' -o -name '*secrets*.py' \) -print0 | sort -z)
          test "${#tests[@]}" -gt 0
          uv run --no-sync pytest -q "${tests[@]}" --tb=short

      - name: Build exact wheel and run isolated lifecycles
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          uv build --wheel --out-dir dist
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv run --no-sync python scripts/ci/run_guard_secrets_platform_smoke_v2.py --wheel "$wheel"
          uv run --no-sync python scripts/ci/run_guard_secrets_pipx_smoke.py --wheel "$wheel"

      - name: Advance reviewed test-suite ratchet
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/ci/test_inventory.py --output /tmp/test-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path
          inventory = json.loads(Path('/tmp/test-inventory.json').read_text(encoding='utf-8'))
          path = Path('ci/test-suite-ratchet-baseline.json')
          baseline = json.loads(path.read_text(encoding='utf-8'))
          baseline['maximum_collected_cases'] = inventory['inventory']['collected_cases']
          baseline['maximum_test_source_lines'] = inventory['test_source_lines']
          path.write_text(json.dumps(baseline, indent=2) + '\n', encoding='utf-8')
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py --baseline ci/test-suite-ratchet-baseline.json --inventory /tmp/test-inventory.json
          git diff --check

      - name: Commit permanent tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/secrets-complete-hardening-final-v1-bootstrap.yml
          git add .github/workflows/secrets-platform-e2e.yml ci/test-suite-ratchet-baseline.json docs/guard/secrets-platform-hardening.md scripts/ci/run_guard_secrets_platform_smoke_v2.py scripts/ci/run_guard_secrets_pipx_smoke.py src/codex_plugin_scanner/guard/secrets tests/test_guard_secret_*.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(secrets): complete platform and Git security hardening'
          git push origin HEAD:fix/secrets-complete-hardening-final-v1
