name: Secrets complete hardening final integration

on:
  push:
    branches:
      - fix/secrets-complete-hardening-final-v1
    paths:
      - '.github/workflows/secrets-complete-hardening-final-v1-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: secrets-complete-hardening-final-v1-bootstrap
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout V2-derived hardening branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/secrets-complete-hardening-final-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed platform hardening patch
        shell: bash
        run: |
          set -euo pipefail
          source_branch='fix/secrets-e2e-platform-hardening-v2'
          source_base='fa7dd0fdf50eb1427a0b3dba0e40225dfca82a2e'
          source_head='1143f6e3eb355e6de1e434083ff2c974efd78708'
          git fetch --no-tags origin "$source_branch"
          test "$(git rev-parse FETCH_HEAD)" = "$source_head"
          paths=(
            .github/workflows/secrets-platform-e2e.yml
            docs/guard/secrets-platform-hardening.md
            scripts/ci/run_guard_secrets_platform_smoke_v2.py
            src/codex_plugin_scanner/guard/secrets/cli.py
            src/codex_plugin_scanner/guard/secrets/git_subprocess.py
            src/codex_plugin_scanner/guard/secrets/precommit.py
            src/codex_plugin_scanner/guard/secrets/secret_staged_scanner.py
            src/codex_plugin_scanner/guard/secrets/setup_diagnostics.py
            tests/test_guard_secret_doctor.py
            tests/test_guard_secret_git_subprocess_hardening.py
            tests/test_guard_secret_hook_configuration_hardening.py
            tests/test_guard_secret_input_coverage_hardening.py
            tests/test_guard_secret_platform_hardening.py
          )
          git diff --binary --full-index "$source_base" "$source_head" -- "${paths[@]}" > /tmp/secrets-platform.patch
          test -s /tmp/secrets-platform.patch
          git apply --3way --index /tmp/secrets-platform.patch
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Import reviewed edge-case tests and pipx proof
        shell: bash
        run: |
          set -euo pipefail
          declare -A files=(
            [tests/test_guard_secret_git_process_security.py]='5f5befcf2aa847d2813d40e8bf47f4ce4f5a95d2'
            [tests/test_guard_secret_git_repository_edges.py]='1de19656af287ced5a8cac17b2986053c125afca'
            [scripts/ci/run_guard_secrets_pipx_smoke.py]='1de19656af287ced5a8cac17b2986053c125afca'
            [tests/test_guard_secret_coverage_edges.py]='8960c9dd8205849f2efbe3e2f5cf752e941e61f9'
            [tests/test_guard_secret_hook_identity_worktree.py]='8efba21c24afc54677899d3e8b5619d1c252598f'
            [tests/test_guard_secret_sparse_bare_repository.py]='8efba21c24afc54677899d3e8b5619d1c252598f'
          )
          for path in "${!files[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "${files[$path]}:$path" > "$path"
            git add "$path"
          done

      - name: Materialize bounded trusted Git process helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import textwrap

          source = subprocess.check_output(
              [
                  'git',
                  'show',
                  '5f5befcf2aa847d2813d40e8bf47f4ce4f5a95d2:.github/workflows/secrets-git-process-bootstrap.yml',
              ],
              text=True,
          )
          match = re.search(
              r"cat > src/codex_plugin_scanner/guard/secrets/git_safe\.py <<'PY'\n(.*?)\n          PY",
              source,
              flags=re.S,
          )
          if match is None:
              raise SystemExit('reviewed git_safe source block not found')
          body = textwrap.dedent(match.group(1))
          path = Path('src/codex_plugin_scanner/guard/secrets/git_safe.py')
          path.write_text(body + ('\n' if not body.endswith('\n') else ''), encoding='utf-8')
          PY
          git add src/codex_plugin_scanner/guard/secrets/git_safe.py

      - name: Apply fail-honest Git object and repository-layout patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import subprocess
          import textwrap

          def execute_reviewed_block(revision: str, path: str, required: tuple[str, ...]) -> None:
              source = subprocess.check_output(['git', 'show', f'{revision}:{path}'], text=True)
              blocks = re.findall(r"python - <<'PY'\n(.*?)\n          PY", source, flags=re.S)
              for raw in blocks:
                  body = textwrap.dedent(raw)
                  if all(value in body for value in required):
                      exec(compile(body, f'{revision}:{path}', 'exec'), {})
                      return
              raise SystemExit(f'reviewed patch block not found in {path}')

          execute_reviewed_block(
              '1de19656af287ced5a8cac17b2986053c125afca',
              '.github/workflows/secrets-git-object-integration.yml',
              ('git_lfs_pointer_content_unavailable', 'secret_repository_scanner.py'),
          )
          execute_reviewed_block(
              '8efba21c24afc54677899d3e8b5619d1c252598f',
              '.github/workflows/secrets-hook-worktree-integration.yml',
              ('git_sparse_checkout_partial', 'bare_repository_working_tree_unavailable'),
          )
          PY

      - name: Pin managed hook identity and repair stale hooks
        shell: bash
        run: |
          set -euo pipefail
          cat > src/codex_plugin_scanner/guard/secrets/precommit.py <<'PY'
          """Non-destructive Git pre-commit integration for HOL Guard Secrets."""

          from __future__ import annotations

          import os
          import shlex
          import shutil
          import subprocess
          import sys
          from dataclasses import dataclass
          from pathlib import Path

          from .git_subprocess import run_git

          _MANAGED_MARKER = "# HOL_GUARD_SECRETS_PRE_COMMIT_V1"
          _BACKUP_NAME = "pre-commit.hol-guard-user"


          def _portable_executable(path: Path) -> str:
              return str(path.expanduser().resolve()).replace("\\", "/")


          def _guard_invocation() -> tuple[str, tuple[str, ...]]:
              discovered = shutil.which("hol-guard")
              if discovered:
                  return _portable_executable(Path(discovered)), (
                      "secrets",
                      "scan",
                      "--staged",
                      "--fail-on-findings",
                  )
              return _portable_executable(Path(sys.executable)), (
                  "-m",
                  "codex_plugin_scanner.guard.secrets.cli",
                  "scan",
                  "--staged",
                  "--fail-on-findings",
              )


          def _managed_hook_source() -> str:
              executable, arguments = _guard_invocation()
              invocation = " ".join(shlex.quote(value) for value in arguments)
              return f"""#!/bin/sh
          {_MANAGED_MARKER}
          # Managed by `hol-guard secrets install-hook`. Do not place secrets in this file.
          hook_dir=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          legacy="$hook_dir/{_BACKUP_NAME}"
          if [ -x "$legacy" ]; then
            "$legacy" "$@"
            status=$?
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
          fi
          guard_executable={shlex.quote(executable)}
          if [ ! -x "$guard_executable" ]; then
            echo "HOL Guard Secrets pinned Guard executable is unavailable. Reinstall HOL Guard and run install-hook again." >&2
            exit 2
          fi
          exec "$guard_executable" {invocation}
          """


          _MANAGED_HOOK = _managed_hook_source()


          @dataclass(frozen=True, slots=True)
          class SecretsHookResult:
              status: str
              hook: str
              chained_existing: bool

              def to_public_dict(self) -> dict[str, object]:
                  return {
                      "schema": "guard-secrets-hook.v1",
                      "status": self.status,
                      "hook": self.hook,
                      "chained_existing": self.chained_existing,
                  }


          def _resolved_git_path(root: Path, raw: bytes) -> Path:
              value = Path(os.fsdecode(raw).strip())
              return (value if value.is_absolute() else root / value).resolve()


          def _git_common_dir(root: Path) -> Path:
              resolved = root.expanduser().resolve()
              if not resolved.exists() or not resolved.is_dir():
                  raise ValueError("hook target must be an existing Git worktree directory")
              try:
                  custom_hooks = run_git(resolved, ["config", "--get", "core.hooksPath"])
                  bare = run_git(resolved, ["rev-parse", "--is-bare-repository"])
                  git_dir = run_git(resolved, ["rev-parse", "--git-dir"])
                  common = run_git(resolved, ["rev-parse", "--git-common-dir"])
              except (OSError, subprocess.SubprocessError) as error:
                  raise ValueError("hook target is not a usable Git worktree") from error
              if custom_hooks.returncode == 0 and custom_hooks.stdout.strip():
                  raise ValueError(
                      "custom core.hooksPath is configured; HOL Guard will not modify a shared or custom hook directory automatically"
                  )
              if bare.returncode == 0 and bare.stdout.strip() == b"true":
                  raise ValueError("bare repository has no managed pre-commit hook surface")
              if git_dir.returncode != 0 or common.returncode != 0:
                  raise ValueError("hook target is not a usable Git worktree")
              git_dir_path = _resolved_git_path(resolved, git_dir.stdout)
              common_path = _resolved_git_path(resolved, common.stdout)
              if git_dir_path != common_path:
                  raise ValueError("linked worktree uses a shared Git hooks directory")
              if not common_path.exists() or not common_path.is_dir():
                  raise ValueError("Git common directory could not be verified")
              return common_path


          def _hook_paths(root: Path) -> tuple[Path, Path, str]:
              hooks_dir = _git_common_dir(root) / "hooks"
              if hooks_dir.is_symlink():
                  raise ValueError("refusing to modify a symlinked Git hooks directory")
              return hooks_dir / "pre-commit", hooks_dir / _BACKUP_NAME, "git-hooks/pre-commit"


          def _is_managed_hook(path: Path) -> bool:
              if not path.is_file() or path.is_symlink():
                  return False
              try:
                  prefix = path.read_text(encoding="utf-8", errors="replace")[:512]
              except OSError:
                  return False
              return _MANAGED_MARKER in prefix


          def _replace_hook_atomically(hook: Path, source: str) -> None:
              temp = hook.with_name(f".{hook.name}.hol-guard-{os.getpid()}.tmp")
              try:
                  temp.write_text(source, encoding="utf-8", newline="\n")
                  temp.chmod(0o755)
                  os.replace(temp, hook)
              except OSError as error:
                  try:
                      temp.unlink(missing_ok=True)
                  except OSError:
                      pass
                  raise ValueError("could not install HOL Guard Secrets pre-commit hook") from error


          def install_precommit_hook(root: Path) -> SecretsHookResult:
              """Install or repair the managed hook while preserving any user hook."""

              hook, backup, display = _hook_paths(root)
              desired = _managed_hook_source()
              if _is_managed_hook(hook):
                  try:
                      current = hook.read_text(encoding="utf-8", errors="replace")
                  except OSError as error:
                      raise ValueError("could not read the managed pre-commit hook") from error
                  if current == desired:
                      return SecretsHookResult("already_installed", display, backup.exists())
                  _replace_hook_atomically(hook, desired)
                  return SecretsHookResult("updated", display, backup.exists())
              if hook.exists() and backup.exists():
                  raise ValueError("refusing to replace pre-commit hook because the HOL Guard backup path already exists")

              hook.parent.mkdir(parents=True, exist_ok=True)
              moved_existing = False
              try:
                  if hook.exists() or hook.is_symlink():
                      os.replace(hook, backup)
                      moved_existing = True
                  _replace_hook_atomically(hook, desired)
              except ValueError:
                  try:
                      if moved_existing and backup.exists() and not hook.exists():
                          os.replace(backup, hook)
                  except OSError:
                      pass
                  raise
              return SecretsHookResult("installed", display, backup.exists())


          def uninstall_precommit_hook(root: Path) -> SecretsHookResult:
              """Remove only the managed hook and restore a chained user hook exactly."""

              hook, backup, display = _hook_paths(root)
              if not hook.exists():
                  if backup.exists():
                      try:
                          os.replace(backup, hook)
                      except OSError as error:
                          raise ValueError("could not restore the preserved pre-commit hook") from error
                      return SecretsHookResult("restored", display, True)
                  return SecretsHookResult("not_installed", display, False)
              if not _is_managed_hook(hook):
                  if backup.exists():
                      raise ValueError("refusing to overwrite a non-HOL-Guard pre-commit hook while a preserved backup exists")
                  return SecretsHookResult("not_installed", display, False)
              if not backup.exists():
                  try:
                      hook.unlink()
                  except OSError as error:
                      raise ValueError("could not uninstall HOL Guard Secrets pre-commit hook") from error
                  return SecretsHookResult("uninstalled", display, False)

              retired = hook.with_name(f".{hook.name}.hol-guard-retired-{os.getpid()}.tmp")
              try:
                  os.replace(hook, retired)
                  os.replace(backup, hook)
                  retired.unlink(missing_ok=True)
              except OSError as error:
                  try:
                      if retired.exists() and not hook.exists():
                          os.replace(retired, hook)
                  except OSError:
                      pass
                  raise ValueError("could not restore the preserved pre-commit hook") from error
              return SecretsHookResult("restored", display, True)


          __all__ = ["SecretsHookResult", "install_precommit_hook", "uninstall_precommit_hook"]
          PY

      - name: Add bare and linked-worktree setup diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/codex_plugin_scanner/guard/secrets/setup_diagnostics.py')
          text = path.read_text(encoding='utf-8')
          old = '''            inside = repository is not None and repository.returncode == 0 and repository.stdout.strip() == b"true"
            checks.append(
                SetupCheck(
                    code="git_repository",
                    status="pass" if inside else "warn",
                    summary=(
                        "The requested directory is a Git worktree."
                        if inside
                        else "The requested directory is not a Git worktree; working-tree scans still work, but staged and history scans do not."
                    ),
                    action=None if inside else "Run inside a Git worktree to use staged, history, and pre-commit protection.",
                )
            )
            if inside:
'''
          new = '''            inside = repository is not None and repository.returncode == 0 and repository.stdout.strip() == b"true"
            try:
                bare_result = run_secure_git(git, root, ["rev-parse", "--is-bare-repository"])
            except (OSError, subprocess.SubprocessError):
                bare_result = None
            bare = bare_result is not None and bare_result.returncode == 0 and bare_result.stdout.strip() == b"true"
            checks.append(
                SetupCheck(
                    code="git_repository",
                    status="pass" if inside else "warn",
                    summary=(
                        "The requested directory is a Git worktree."
                        if inside
                        else "The requested directory is not a Git worktree; working-tree scans still work, but staged and pre-commit protection do not."
                    ),
                    action=None if inside else "Use bounded history scanning for a bare repository, or run inside a worktree for staged and hook protection.",
                )
            )
            if bare:
                checks.append(
                    SetupCheck(
                        code="git_bare_repository",
                        status="warn",
                        summary="The requested repository is bare and has no working-tree or managed-hook surface.",
                        action="Use bounded history scanning, or use a non-bare checkout for working-tree and pre-commit protection.",
                    )
                )
            if inside:
                try:
                    git_dir_result = run_secure_git(git, root, ["rev-parse", "--git-dir"])
                    common_dir_result = run_secure_git(git, root, ["rev-parse", "--git-common-dir"])
                except (OSError, subprocess.SubprocessError):
                    git_dir_result = common_dir_result = None
                linked = False
                if (
                    git_dir_result is not None
                    and common_dir_result is not None
                    and git_dir_result.returncode == 0
                    and common_dir_result.returncode == 0
                ):
                    raw_git = Path(os.fsdecode(git_dir_result.stdout).strip())
                    raw_common = Path(os.fsdecode(common_dir_result.stdout).strip())
                    git_dir_path = (raw_git if raw_git.is_absolute() else root / raw_git).resolve()
                    common_dir_path = (raw_common if raw_common.is_absolute() else root / raw_common).resolve()
                    linked = git_dir_path != common_dir_path
                checks.append(
                    SetupCheck(
                        code="linked_worktree_shared_hooks",
                        status="warn" if linked else "pass",
                        summary=(
                            "This linked worktree shares hooks with another worktree; HOL Guard will not modify them automatically."
                            if linked
                            else "This worktree has its own standard Git metadata surface."
                        ),
                        action=(
                            "Install the managed hook from the main worktree, or keep the shared hook manager authoritative."
                            if linked
                            else None
                        ),
                    )
                )
'''
          if old not in text:
              raise SystemExit('setup diagnostics repository block changed unexpectedly')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Expand permanent platform gate to all hardening surfaces
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/secrets-platform-e2e.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "      - 'tests/test_guard_secret_platform_hardening.py'\n",
              "      - 'tests/test_guard_secret_*.py'\n      - 'scripts/ci/run_guard_secrets_pipx_smoke.py'\n",
          )
          text = text.replace(
              "          tests/test_guard_secret_platform_hardening.py\n          tests/test_guard_secret_detection.py",
              "          tests/test_guard_secret_platform_hardening.py\n          tests/test_guard_secret_git_subprocess_hardening.py\n          tests/test_guard_secret_git_process_security.py\n          tests/test_guard_secret_git_repository_edges.py\n          tests/test_guard_secret_hook_configuration_hardening.py\n          tests/test_guard_secret_hook_identity_worktree.py\n          tests/test_guard_secret_input_coverage_hardening.py\n          tests/test_guard_secret_sparse_bare_repository.py\n          tests/test_guard_secret_coverage_edges.py\n          tests/test_guard_secret_doctor.py\n          tests/test_guard_secret_detection.py",
          )
          text = text.replace(
              "            scripts/ci/run_guard_secrets_platform_smoke_v2.py \\\n            tests/test_guard_secret_platform_hardening.py",
              "            scripts/ci/run_guard_secrets_platform_smoke_v2.py \\\n            scripts/ci/run_guard_secrets_pipx_smoke.py \\\n            tests/test_guard_secret_*.py",
          )
          text = text.replace(
              "          uv run --no-sync python scripts/ci/run_guard_secrets_platform_smoke_v2.py --wheel \"$wheel\"\n",
              "          uv run --no-sync python scripts/ci/run_guard_secrets_platform_smoke_v2.py --wheel \"$wheel\"\n          uv run --no-sync python scripts/ci/run_guard_secrets_pipx_smoke.py --wheel \"$wheel\"\n",
          )
          old_privacy = '''          pattern = re.compile(rb"ghp_[A-Za-z0-9_]{20,255}")
          roots = (Path("src"), Path("tests"), Path("scripts"), Path("docs"))
          for root in roots:
              for path in root.rglob("*"):
                  if path.is_file() and not path.is_symlink():
                      data = path.read_bytes()
                      if pattern.search(data):
                          raise SystemExit(f"complete provider-shaped fixture committed: {path}")
'''
          new_privacy = '''          patterns = (
              re.compile(rb"gh[pousr]_[A-Za-z0-9_]{20,255}"),
              re.compile(rb"sk-(?:(?:proj|svcacct)-)?[A-Za-z0-9_-]{20,255}"),
              re.compile(rb"AKIA[0-9A-Z]{16}"),
          )
          paths = [
              *Path("src/codex_plugin_scanner/guard/secrets").rglob("*.py"),
              *Path("tests").glob("test_guard_secret_*.py"),
              *Path("scripts/ci").glob("*guard_secrets*.py"),
              *Path("docs/guard").glob("secrets*.md"),
          ]
          for path in paths:
              if path.is_file() and not path.is_symlink():
                  data = path.read_bytes()
                  if any(pattern.search(data) for pattern in patterns):
                      raise SystemExit(f"complete provider-shaped fixture committed: {path}")
'''
          if old_privacy in text:
              text = text.replace(old_privacy, new_privacy, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Python and uv
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false

      - name: Format, lint, type-check, and test all Secrets hardening
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/guard/secrets \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            scripts/ci/run_guard_secrets_pipx_smoke.py \
            tests/test_guard_secret_*.py
          uv run --no-sync python -m ruff check --fix \
            src/codex_plugin_scanner/guard/secrets \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            scripts/ci/run_guard_secrets_pipx_smoke.py \
            tests/test_guard_secret_*.py
          uv run --no-sync python -m ruff format \
            src/codex_plugin_scanner/guard/secrets \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            scripts/ci/run_guard_secrets_pipx_smoke.py \
            tests/test_guard_secret_*.py
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/secrets \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            scripts/ci/run_guard_secrets_pipx_smoke.py \
            tests/test_guard_secret_*.py
          uv run --no-sync basedpyright --level error \
            src/codex_plugin_scanner/guard/secrets \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            scripts/ci/run_guard_secrets_pipx_smoke.py
          mapfile -d '' tests < <(find tests -maxdepth 1 -type f \( -name '*secret*.py' -o -name '*secrets*.py' \) -print0 | sort -z)
          test "${#tests[@]}" -gt 0
          uv run --no-sync pytest -q "${tests[@]}" --tb=short
          git diff --check

      - name: Build exact wheel and run virtualenv plus pipx lifecycle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          uv build --wheel --out-dir dist
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv run --no-sync python scripts/ci/run_guard_secrets_platform_smoke_v2.py --wheel "$wheel"
          uv run --no-sync python scripts/ci/run_guard_secrets_pipx_smoke.py --wheel "$wheel"

      - name: Commit permanent hardening tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/secrets-complete-hardening-final-v1-bootstrap.yml
          git add \
            .github/workflows/secrets-platform-e2e.yml \
            docs/guard/secrets-platform-hardening.md \
            scripts/ci/run_guard_secrets_platform_smoke_v2.py \
            scripts/ci/run_guard_secrets_pipx_smoke.py \
            src/codex_plugin_scanner/guard/secrets \
            tests/test_guard_secret_*.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(secrets): complete platform, Git, and hook security hardening'
          git push origin HEAD:fix/secrets-complete-hardening-final-v1
