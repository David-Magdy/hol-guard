name: Protection Center Batch 6 preflight
on:
  push:
    branches: [feat/protection-center-06-cloud-boundary-hardening]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Verify final Protection Center frontend contracts
        shell: bash
        run: |
          set -euo pipefail
          cd dashboard
          bun install --frozen-lockfile --ignore-scripts
          bunx tsx src/protection-center/protection-cloud-value.test.tsx
          bunx tsx src/protection-center/protection-telemetry.test.ts
          bunx tsx src/protection-center/protection-terminology.test.tsx
          bunx tsx src/protection-center/protection-final-a11y.test.tsx
          bunx tsx src/protection-center/model/protection-author-metadata.test.ts
          bunx tsx src/protection-center/model/protection-performance-budgets.test.ts
          bunx tsx src/protection-center/protection-final-contract.test.ts
          bun run test
          bun run build
          cd ..
          git diff --check
      - name: Commit rebuilt packaged dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/protection-center-batch6-preflight.yml
          git add src/codex_plugin_scanner/guard/daemon/static .github/workflows/protection-center-batch6-preflight.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(protection-center): rebuild final dashboard assets"
          git push origin HEAD:feat/protection-center-06-cloud-boundary-hardening
