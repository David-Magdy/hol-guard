name: Secrets Git object edge integration

on:
  push:
    branches:
      - fix/secrets-git-object-edge-hardening

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: secrets-git-object-edge-integration
  cancel-in-progress: true

jobs:
  integrate-validate-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      FINAL_BRANCH: fix/secrets-git-object-edge-hardening
      TARGET_BRANCH: release/3.0
    steps:
      - name: Checkout edge-hardening branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/secrets-git-object-edge-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current release target and resolve owned conflicts
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          set +e
          git merge --no-ff --no-commit "origin/$TARGET_BRANCH"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            test "${#conflicts[@]}" -gt 0
            for path in "${conflicts[@]}"; do
              case "$path" in
                .github/workflows/secrets-platform-e2e.yml|\
                docs/guard/secrets-platform-hardening.md|\
                scripts/ci/run_guard_secrets_pipx_smoke.py|\
                src/codex_plugin_scanner/guard/secrets/git_subprocess.py|\
                tests/test_guard_secret_git_repository_edges.py)
                  git checkout --ours -- "$path"
                  ;;
                *)
                  git checkout --theirs -- "$path"
                  ;;
              esac
              git add -- "$path"
            done
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          test -f src/codex_plugin_scanner/guard/secrets/setup_diagnostics.py
          test -f scripts/ci/run_guard_secrets_platform_smoke_v2.py

      - name: Remove temporary workflow and apply fail-honest Git edge patch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/secrets-git-object-integration.yml
          python - <<'PY'
          from pathlib import Path

          path = Path('src/codex_plugin_scanner/guard/secrets/secret_repository_scanner.py')
          text = path.read_text(encoding='utf-8')
          if '\nimport re\n' not in text:
              text = text.replace('\nimport os\n', '\nimport os\nimport re\n', 1)

          old_reason = '''def _decode_failure_reason(path: str, data: bytes) -> str | None:
    if _known_binary_path(path) or b"\\0" in data[:8192]:
        return None
    return "unsupported_text_encoding" if _decode_text(path, data) is None else None
