          insertion = '''def _git_common_dir_path(root: Path) -> Path | None:
    try:
        result = _run_git(root, ["rev-parse", "--git-common-dir"])
    except (OSError, subprocess.SubprocessError):
        return None
    if result.returncode != 0:
        return None
    raw = os.fsdecode(result.stdout).strip()
    if not raw:
        return None
    path = Path(raw)
    resolved = (path if path.is_absolute() else root / path).resolve()
    return resolved if resolved.exists() and resolved.is_dir() else None


def _git_gitlinks(root: Path) -> set[str] | None:
    try:
        result = _run_git(root, ["ls-files", "--stage", "-z"])
    except (OSError, subprocess.SubprocessError):
        return None
    if result.returncode != 0:
        return None
    paths: set[str] = set()
    for entry in result.stdout.split(b"\\0"):
        if not entry or b"\\t" not in entry:
            continue
        metadata, raw_path = entry.split(b"\\t", 1)
        if metadata.split(b" ", 1)[0] == b"160000":
            paths.add(os.fsdecode(raw_path))
    return paths


def _history_repository_limitations(root: Path) -> tuple[str, ...]:
    reasons: list[str] = []
    try:
        shallow = _run_git(root, ["rev-parse", "--is-shallow-repository"])
    except (OSError, subprocess.SubprocessError):
        shallow = None
    if shallow is None or shallow.returncode != 0:
        reasons.append("git_history_metadata_unavailable")
    elif shallow.stdout.strip() == b"true":
        reasons.append("git_history_shallow_repository")

    partial = False
    for args in (
        ["config", "--local", "--get", "extensions.partialClone"],
        ["config", "--local", "--get-regexp", r"^remote\\..*\\.promisor$"],
    ):
        try:
            result = _run_git(root, args)
        except (OSError, subprocess.SubprocessError):
            reasons.append("git_history_metadata_unavailable")
            continue
        if result.returncode == 0 and result.stdout.strip():
            partial = True
        elif result.returncode not in {0, 1, 5}:
            reasons.append("git_history_metadata_unavailable")
    if partial:
        reasons.append("git_history_partial_clone")

    try:
        replacements = _run_git(root, ["for-each-ref", "--format=%(refname)", "refs/replace"])
    except (OSError, subprocess.SubprocessError):
        replacements = None
    if replacements is None or replacements.returncode != 0:
        reasons.append("git_history_metadata_unavailable")
    elif replacements.stdout.strip():
        reasons.append("git_replace_refs_ignored")

    common = _git_common_dir_path(root)
    if common is None:
        reasons.append("git_history_metadata_unavailable")
    else:
        if (common / "info" / "grafts").is_file():
            reasons.append("git_history_grafts_present")
        alternates = common / "objects" / "info" / "alternates"
        try:
            has_alternates = alternates.is_file() and bool(alternates.read_text(encoding="utf-8", errors="replace").strip())
        except OSError:
            reasons.append("git_history_metadata_unavailable")
        else:
            if has_alternates:
                reasons.append("git_alternate_objects_present")
    return tuple(dict.fromkeys(reasons))


'''
