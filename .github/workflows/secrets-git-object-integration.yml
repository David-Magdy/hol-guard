      - name: Set up Python and uv
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Set up uv runtime
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false

      - name: Install locked environment
        run: uv sync --frozen --extra dev --python 3.12

      - name: Format lint type-check test and ratchet
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/codex_plugin_scanner/guard/secrets/git_subprocess.py
            src/codex_plugin_scanner/guard/secrets/secret_repository_scanner.py
            src/codex_plugin_scanner/guard/secrets/secret_staged_scanner.py
            scripts/ci/run_guard_secrets_pipx_smoke.py
            tests/test_guard_secret_git_repository_edges.py
          )
          uv run --no-sync python -m ruff format "${files[@]}"
          uv run --no-sync python -m ruff check --fix "${files[@]}"
          uv run --no-sync python -m ruff format "${files[@]}"
          uv run --no-sync python -m ruff check "${files[@]}"
          uv run --no-sync basedpyright --level error "${files[@]}"
          mapfile -d '' tests < <(find tests -maxdepth 1 -type f \( -name '*secret*.py' -o -name '*secrets*.py' \) -print0 | sort -z)
          uv run --no-sync pytest -q "${tests[@]}" --tb=short
          uv run --no-sync python scripts/ci/generate_test_inventory.py --output /tmp/test-inventory.json
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path
          inventory=json.loads(Path('/tmp/test-inventory.json').read_text())
          path=Path('ci/test-suite-ratchet-baseline.json')
          baseline=json.loads(path.read_text())
          baseline['maximum_collected_cases']=inventory['inventory']['collected_cases']
          baseline['maximum_test_source_lines']=inventory['test_source_lines']
          path.write_text(json.dumps(baseline,indent=2)+'\n')
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py --baseline ci/test-suite-ratchet-baseline.json --inventory /tmp/test-inventory.json

      - name: Build exact wheel and run venv plus pipx lifecycle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          uv build --wheel --out-dir dist
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv run --no-sync python scripts/ci/run_guard_secrets_platform_smoke_v2.py --wheel "$wheel"
          uv run --no-sync python scripts/ci/run_guard_secrets_pipx_smoke.py --wheel "$wheel"
          git diff --check

      - name: Commit permanent tree and create or update PR
        id: final
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m 'Merge current release/3.0 into Git object edge hardening'
          elif ! git diff --cached --quiet; then
            git commit -m 'fix(secrets): harden Git object coverage edges'
          fi
          git push --force-with-lease origin HEAD:"$FINAL_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json,os,urllib.parse,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; owner=repo.split('/')[0]; branch=os.environ['FINAL_BRANCH']; base=os.environ['TARGET_BRANCH']
          headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'User-Agent':'guard-secrets-git-edge','X-GitHub-Api-Version':'2022-11-28'}
          def call(url,method='GET',payload=None):
              data=None if payload is None else json.dumps(payload).encode(); req=urllib.request.Request(url,method=method,data=data,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: raw=r.read(); return json.loads(raw) if raw else None
          pulls=call(f'https://api.github.com/repos/{repo}/pulls?state=open&head={urllib.parse.quote(owner+":"+branch)}&per_page=10')
          body='''## Summary\n\nCloses remaining fail-honest Git object and installation edge cases for HOL Guard Secrets.\n\n- LFS pointers never produce clean evidence for missing object contents\n- submodules are identified as separately unscanned repositories\n- shallow clones, promisor partial clones, grafts, replace refs, and alternate object stores make history evidence partial\n- replace refs and alternate-ref commands cannot alter or execute during scanning\n- unknown NUL-bearing and unsupported text inputs are partial rather than silently binary\n- exact wheels are installed, exercised, and removed through pipx on the permanent OS matrix\n\nNo raw candidate, object path, alternate path, LFS digest, or repository identity is emitted. Base remains `release/3.0`.''' 
          payload={'title':'fix(secrets): close Git object and pipx edge cases','head':branch,'base':base,'body':body,'maintainer_can_modify':True}
          if pulls: call(f'https://api.github.com/repos/{repo}/pulls/{pulls[0]["number"]}',method='PATCH',payload={'title':payload['title'],'body':body,'base':base})
          else: call(f'https://api.github.com/repos/{repo}/pulls',method='POST',payload=payload)
          PY

      - name: Wait for connector exact-head trigger
        shell: bash
        env:
          PRIOR_SHA: ${{ steps.final.outputs.sha }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; branch=os.environ['FINAL_BRANCH']; prior=os.environ['PRIOR_SHA']
          headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'User-Agent':'guard-secrets-git-edge','X-GitHub-Api-Version':'2022-11-28'}
          for _ in range(180):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/ref/heads/{branch.replace("/","%2F")}',headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r: current=json.load(r)['object']['sha']
              if current!=prior: open('/tmp/head','w').write(current); raise SystemExit(0)
              time.sleep(20)
          raise SystemExit('exact-head trigger timeout')
          PY

      - name: Require checks review merge and post-merge proof
        shell: bash
        run: |
          python - <<'PY'
          import json,os,time,urllib.error,urllib.parse,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; owner,name=repo.split('/',1); branch=os.environ['FINAL_BRANCH']; base=os.environ['TARGET_BRANCH']; sha=open('/tmp/head').read().strip()
          headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'User-Agent':'guard-secrets-git-edge','X-GitHub-Api-Version':'2022-11-28'}
          def call(url,method='GET',payload=None):
              data=None if payload is None else json.dumps(payload).encode(); req=urllib.request.Request(url,method=method,data=data,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: raw=r.read(); return json.loads(raw) if raw else None
          pulls=call(f'https://api.github.com/repos/{repo}/pulls?state=open&head={urllib.parse.quote(owner+":"+branch)}&per_page=10')
          if len(pulls)!=1 or pulls[0]['head']['sha']!=sha or pulls[0]['base']['ref']!=base: raise SystemExit('PR identity mismatch')
          pr=pulls[0]; number=pr['number']; rerun=set(); deadline=time.time()+9000; required={'ubuntu-24.04','macos-14','windows-2022'}
          while time.time()<deadline:
              runs=call(f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100').get('workflow_runs',[]); checks=call(f'https://api.github.com/repos/{repo}/commits/{sha}/check-runs?per_page=100').get('check_runs',[])
              failed=[r for r in runs if r['status']=='completed' and r.get('conclusion') not in {'success','neutral','skipped'}]
              if failed:
                  for run in failed:
                      if run['id'] in rerun: raise SystemExit(f"workflow remained failed: {run['name']}")
                      rerun.add(run['id']); endpoint='rerun-failed-jobs' if run.get('conclusion')=='failure' else 'rerun'
                      try: call(f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}/{endpoint}',method='POST')
                      except urllib.error.HTTPError as e:
                          if e.code not in {409,422}: raise
                  time.sleep(30); continue
              if any(c['status']=='completed' and c.get('conclusion') not in {'success','neutral','skipped'} for c in checks): raise SystemExit('check failure')
              active=any(r['status']!='completed' for r in runs) or any(c['status']!='completed' for c in checks); platforms={c['name'].split(' / ',1)[0] for c in checks if ' / Python ' in c['name']}
              if runs and not active and required<=platforms and 'Secrets platform end-to-end' in {r['name'] for r in runs}: break
              time.sleep(30)
          else: raise SystemExit('check timeout')
          query='''query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewDecision reviewThreads(first:100){nodes{isResolved}}}}}'''; gh=dict(headers); gh['Content-Type']='application/json'
          req=urllib.request.Request('https://api.github.com/graphql',method='POST',headers=gh,data=json.dumps({'query':query,'variables':{'owner':owner,'name':name,'number':number}}).encode())
          with urllib.request.urlopen(req,timeout=30) as r: review=json.load(r)['data']['repository']['pullRequest']
          if review.get('reviewDecision')=='CHANGES_REQUESTED' or any(not t['isResolved'] for t in review['reviewThreads']['nodes']): raise SystemExit('review unresolved')
          payload={'commit_title':f'fix(secrets): close Git object and pipx edge cases (#{number})','commit_message':'Make LFS, submodule, shallow, partial-clone, graft, replace-ref, alternate-object, unknown encoding, and isolated pipx behavior fail honest and permanently tested.','sha':sha,'merge_method':'squash'}
          for _ in range(60):
              try: merged=call(f'https://api.github.com/repos/{repo}/pulls/{number}/merge',method='PUT',payload=payload)
              except urllib.error.HTTPError as e:
                  if e.code in {405,409}: time.sleep(30); continue
                  raise
              if merged.get('merged'): merge_sha=merged['sha']; break
              time.sleep(30)
          else: raise SystemExit('merge timeout')
          deadline=time.time()+9000
          while time.time()<deadline:
              runs=call(f'https://api.github.com/repos/{repo}/actions/runs?head_sha={merge_sha}&per_page=100').get('workflow_runs',[])
              if not runs or any(r['status']!='completed' for r in runs): time.sleep(30); continue
              bad=[r['name'] for r in runs if r.get('conclusion') not in {'success','neutral','skipped'}]
              if bad: raise SystemExit('post-merge failure: '+', '.join(bad))
              if 'Secrets platform end-to-end' in {r['name'] for r in runs}: raise SystemExit(0)
              time.sleep(20)
          raise SystemExit('post-merge timeout')
          PY
