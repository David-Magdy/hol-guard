name: R0 autofix artifact

on:
  pull_request:
    branches: [release/3.0]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  generate:
    if: github.event.pull_request.number == 2299
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Generate exact formatted files and decision evidence
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync ruff format \
            src/codex_plugin_scanner/guard/runtime/network_status.py \
            src/codex_plugin_scanner/guard/runtime/network_capability_reachability.py \
            tests/test_guard_network_capability_reachability.py
          uv run --no-sync python tests/guard_command_decision_diff.py --write
          output="$RUNNER_TEMP/r0-autofix"
          mkdir -p \
            "$output/src/codex_plugin_scanner/guard/runtime" \
            "$output/tests/fixtures/guard-command-corpus" \
            "$output/tests"
          cp src/codex_plugin_scanner/guard/runtime/network_status.py \
            "$output/src/codex_plugin_scanner/guard/runtime/network_status.py"
          cp src/codex_plugin_scanner/guard/runtime/network_capability_reachability.py \
            "$output/src/codex_plugin_scanner/guard/runtime/network_capability_reachability.py"
          cp tests/test_guard_network_capability_reachability.py \
            "$output/tests/test_guard_network_capability_reachability.py"
          cp tests/fixtures/guard-command-corpus/decision-diff-report.json \
            "$output/tests/fixtures/guard-command-corpus/decision-diff-report.json"
          uv run --no-sync ruff format --check \
            src/codex_plugin_scanner/guard/runtime/network_status.py \
            src/codex_plugin_scanner/guard/runtime/network_capability_reachability.py \
            tests/test_guard_network_capability_reachability.py
          uv run --no-sync python tests/guard_command_decision_diff.py --check
      - name: Upload generated files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r0-autofix-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/r0-autofix
          if-no-files-found: error
          retention-days: 1
