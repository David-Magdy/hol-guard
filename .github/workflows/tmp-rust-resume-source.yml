name: Temporary Rust resume source snapshot

on:
  push:
    branches:
      - tmp/rust-resume-source-20260813
    paths:
      - .github/workflows/tmp-rust-resume-source.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: tmp/rust-resume-source-20260813
          fetch-depth: 1
          persist-credentials: false
      - name: Archive exact source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.venv --exclude=.uv-cache -czf "$RUNNER_TEMP/rust-resume-source.tgz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-resume-source-${{ github.sha }}
          path: ${{ runner.temp }}/rust-resume-source.tgz
          if-no-files-found: error
          retention-days: 1
