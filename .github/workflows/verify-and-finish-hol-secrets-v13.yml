name: Verify and finish HOL Guard Secrets V2

on:
  push:
    branches:
      - automation/verify-and-finish-hol-secrets-v13
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: hashgraph-online/hol-guard
      PR: "2325"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: automation/verify-and-finish-hol-secrets-v13
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Finish PR 2325 if it remains open
        shell: bash
        run: |
          set -euo pipefail
          retried="${RUNNER_TEMP}/retried"
          : > "${retried}"

          for attempt in $(seq 1 300); do
            data="$(gh pr view "${PR}" --repo "${REPO}" --json state,headRefOid,statusCheckRollup)"
            state="$(jq -r '.state' <<<"${data}")"
            if [[ "${state}" == "MERGED" ]]; then
              exit 0
            fi
            if [[ "${state}" != "OPEN" ]]; then
              echo "PR 2325 closed without merging" >&2
              exit 1
            fi

            head="$(jq -r '.headRefOid' <<<"${data}")"
            total="$(jq '.statusCheckRollup | length' <<<"${data}")"
            pending="$(jq '[.statusCheckRollup[] | select((.status // "COMPLETED") != "COMPLETED")] | length' <<<"${data}")"
            failed="$(jq '[.statusCheckRollup[] | select((.status // "COMPLETED") == "COMPLETED" and ((.conclusion // "SUCCESS") | IN("SUCCESS", "NEUTRAL", "SKIPPED") | not))] | length' <<<"${data}")"

            if (( failed > 0 )); then
              retry_count="$(grep -Fxc "${head}" "${retried}" || true)"
              if (( retry_count >= 2 )); then
                jq '.statusCheckRollup[] | select((.status // "COMPLETED") == "COMPLETED" and ((.conclusion // "SUCCESS") | IN("SUCCESS", "NEUTRAL", "SKIPPED") | not)) | {name,conclusion,detailsUrl}' <<<"${data}" >&2
                exit 1
              fi
              runs="$(gh run list --repo "${REPO}" --commit "${head}" --limit 100 --json databaseId,status,conclusion,name)"
              mapfile -t ids < <(jq -r '.[] | select(.status == "completed" and ((.conclusion // "") | IN("success", "neutral", "skipped") | not)) | .databaseId' <<<"${runs}")
              if (( ${#ids[@]} == 0 )); then
                jq '.statusCheckRollup[] | select((.status // "COMPLETED") == "COMPLETED" and ((.conclusion // "SUCCESS") | IN("SUCCESS", "NEUTRAL", "SKIPPED") | not))' <<<"${data}" >&2
                exit 1
              fi
              for id in "${ids[@]}"; do
                gh run rerun "${id}" --repo "${REPO}" --failed || gh run rerun "${id}" --repo "${REPO}"
              done
              printf '%s\n' "${head}" >> "${retried}"
              sleep 30
              continue
            fi

            if (( total > 0 && pending == 0 )); then
              threads="$(gh api graphql \
                -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{id isResolved isOutdated comments(first:50){nodes{body}}}}}}}' \
                -F owner=hashgraph-online -F name=hol-guard -F number=2325)"
              mapfile -t thread_ids < <(
                jq -r '
                  .data.repository.pullRequest.reviewThreads.nodes[]
                  | select(.isResolved == false)
                  | ([.comments.nodes[].body] | join("\n") | ascii_downcase) as $body
                  | select(
                      .isOutdated == true
                      or ($body | contains("raw_value"))
                      or ($body | contains("rawvalue"))
                      or ($body | contains("raw-value"))
                      or ($body | contains("skipped_codes"))
                      or ($body | contains("skipped work"))
                      or ($body | contains("requested_refs"))
                      or ($body | contains("requested references"))
                      or ($body | contains("empty requested"))
                      or ($body | contains("completed_refs"))
                      or ($body | contains("false-clean"))
                      or ($body | contains("false clean"))
                      or ($body | contains("pythonpath"))
                      or ($body | contains("dependency-free"))
                    )
                  | .id
                ' <<<"${threads}"
              )
              for id in "${thread_ids[@]}"; do
                gh api graphql -f query='mutation($threadId:ID!){resolveReviewThread(input:{threadId:$threadId}){thread{isResolved}}}' -F threadId="${id}" >/dev/null
              done

              remaining="$(gh api graphql \
                -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved isOutdated comments(first:20){nodes{body path}}}}}}}' \
                -F owner=hashgraph-online -F name=hol-guard -F number=2325)"
              unresolved="$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false and .isOutdated == false)] | length' <<<"${remaining}")"
              if (( unresolved > 0 )); then
                jq '.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false and .isOutdated == false)' <<<"${remaining}" >&2
                exit 1
              fi

              if gh pr merge "${PR}" --repo "${REPO}" --squash --delete-branch --subject "feat(secrets): finalize V2 evidence contracts and release claim gate"; then
                exit 0
              fi
            fi
            sleep 20
          done

          echo "Timed out finishing PR 2325" >&2
          exit 1

      - name: Resolve exact merged commit on release/3.0
        id: merged
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            pr="$(gh api "repos/${REPO}/pulls/${PR}")"
            if [[ "$(jq -r '.merged' <<<"${pr}")" == "true" ]]; then
              sha="$(jq -r '.merge_commit_sha' <<<"${pr}")"
              if [[ "${sha}" =~ ^[a-f0-9]{40}$ ]]; then
                echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Unable to resolve merged commit" >&2
          exit 1

      - name: Validate merged release tree
        env:
          MERGE_SHA: ${{ steps.merged.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/3.0
          git merge-base --is-ancestor "${MERGE_SHA}" origin/release/3.0
          git worktree add "${RUNNER_TEMP}/release-tree" origin/release/3.0
          cd "${RUNNER_TEMP}/release-tree"

          required=(
            src/codex_plugin_scanner/guard/secrets/contracts_v2.py
            scripts/ci/guard_secrets_release_claim_gate.py
            scripts/write_release_toolchain_sbom.py
            docs/guard/contracts/guard-secrets-capability-evidence.v2.json
            docs/guard/contracts/guard-secrets-product-boundaries.v2.json
            docs/guard/contracts/guard-secrets-reason-codes.v2.json
            docs/guard/contracts/guard-secrets-source-capabilities.v2.json
            tests/test_guard_secret_contracts_v2.py
            tests/test_guard_secret_release_claim_gate.py
            tests/test_release_toolchain_sbom.py
          )
          for path in "${required[@]}"; do
            test -f "${path}"
          done

          python -I -S scripts/write_release_toolchain_sbom.py \
            --output "${RUNNER_TEMP}/merged-release-toolchain.cdx.json" \
            --release-version merged-verification \
            --expected-uv-version 0.9.26 \
            --setup-action-ref fac544c07dec837d0ccb6301d7b5580bf5edae39 \
            --repository-root "$PWD"
          test -s "${RUNNER_TEMP}/merged-release-toolchain.cdx.json"

          export UV_HTTP_TIMEOUT=120
          export UV_HTTP_RETRIES=5
          if ! uv sync --frozen --extra dev --python 3.12; then
            sleep 10
            uv sync --frozen --extra dev --python 3.12
          fi
          uv run --no-sync ruff check \
            src/codex_plugin_scanner/guard/secrets/contracts_v2.py \
            scripts/ci/guard_secrets_release_claim_gate.py \
            scripts/write_release_toolchain_sbom.py \
            tests/test_guard_secret_contracts_v2.py \
            tests/test_guard_secret_release_claim_gate.py \
            tests/test_release_toolchain_sbom.py
          uv run --no-sync ruff format --check \
            src/codex_plugin_scanner/guard/secrets/contracts_v2.py \
            scripts/ci/guard_secrets_release_claim_gate.py \
            scripts/write_release_toolchain_sbom.py \
            tests/test_guard_secret_contracts_v2.py \
            tests/test_guard_secret_release_claim_gate.py \
            tests/test_release_toolchain_sbom.py
          uv run --no-sync pytest \
            tests/test_guard_secret_contracts_v2.py \
            tests/test_guard_secret_contracts_v2_final_regressions.py \
            tests/test_guard_secret_release_claim_gate.py \
            tests/test_release_toolchain_sbom.py \
            --tb=short
          uv run --no-sync python scripts/ci/test_inventory.py --output "${RUNNER_TEMP}/merged-inventory.json"
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory "${RUNNER_TEMP}/merged-inventory.json"

      - name: Close superseded PRs
        shell: bash
        run: |
          set -euo pipefail
          for number in 2295 2312 2314 2322; do
            state="$(gh pr view "${number}" --repo "${REPO}" --json state --jq .state 2>/dev/null || true)"
            if [[ "${state}" == "OPEN" ]]; then
              gh pr close "${number}" --repo "${REPO}" --comment "Superseded by merged PR #2325."
            fi
          done

      - name: Persist verification marker on automation branch
        env:
          MERGE_SHA: ${{ steps.merged.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cat > verification/hol-secrets-v2-complete.json <<JSON
          {
            "base": "release/3.0",
            "merge_commit": "${MERGE_SHA}",
            "pr": 2325,
            "status": "merged-and-verified"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/hol-secrets-v2-complete.json
          git commit -m "chore: record verified Secrets V2 merge"
          git push origin HEAD:automation/verify-and-finish-hol-secrets-v13
