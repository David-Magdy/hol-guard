name: Extension static artifact

on:
  push:
    branches:
      - feat/extension-control-center-01-details

permissions:
  contents: read

jobs:
  build-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: cd dashboard && bun install --frozen-lockfile
      - run: cd dashboard && bun run build
      - name: Package generated static bundle
        run: tar -C src/codex_plugin_scanner/guard/daemon -czf extension-static.tar.gz static
      - name: Upload generated static bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: extension-static
          path: extension-static.tar.gz
          if-no-files-found: error
          retention-days: 1
