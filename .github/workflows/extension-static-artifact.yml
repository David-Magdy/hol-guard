name: Extension static artifact

on:
  push:
    branches:
      - feat/extension-control-center-01-details

permissions:
  contents: write

jobs:
  build-static:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/extension-control-center-01-details
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: cd dashboard && bun install --frozen-lockfile
      - run: cd dashboard && bun run build
      - name: Package generated static bundle
        run: tar -C src/codex_plugin_scanner/guard/daemon -czf extension-static.tar.gz static
      - name: Upload generated static bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: extension-static
          path: extension-static.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Commit generated static bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/codex_plugin_scanner/guard/daemon/static
          if git diff --cached --quiet; then
            echo "Static bundle already current."
            exit 0
          fi
          git commit -m "build(dashboard): refresh extension control center bundle"
          git push origin HEAD:feat/extension-control-center-01-details
