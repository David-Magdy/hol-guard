name: Diagnose PR 2077 Pi hook surface failure

on:
  push:
    branches:
      - chore/rebuild-pr-2077-clean
    paths:
      - .github/workflows/diagnose-pr-2077-pi-hook.yml

permissions:
  contents: read

concurrency:
  group: diagnose-pr-2077-pi-hook
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: desktop/3.0-contracts
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Install frozen dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Repeat exact failing test
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Exact test attempt ${attempt}"
            uv run --no-sync pytest \
              tests/test_guard_surface_server.py::TestGuardSurfaceServer::test_guard_daemon_pi_hook_endpoint_returns_blocked_runtime_review_payload \
              --tb=short -vv
          done

      - name: Run complete surface-server file
        run: |
          uv run --no-sync pytest tests/test_guard_surface_server.py --tb=short -vv
