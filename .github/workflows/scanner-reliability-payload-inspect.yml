name: Scanner reliability payload inspection

on:
  push:
    branches:
      - feat/scanner-reliability-foundation-v1
    paths:
      - .github/workflows/scanner-reliability-payload-inspect.yml
      - .scanner-reliability-payload/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Decode and salvage payloads without executing them
        shell: bash
        run: |
          set -u
          mkdir -p decoded

          python3 - <<'PY'
          import base64
          from pathlib import Path

          root = Path('.scanner-reliability-payload')
          parts = sorted(root.glob('xz-*.b64'))
          encoded = [''.join(path.read_text(encoding='ascii').split()) for path in parts]

          diagnostics = []
          diagnostics.append(f'xz_parts={len(parts)}')
          diagnostics.append('xz_part_sizes=' + ','.join(str(path.stat().st_size) for path in parts))
          diagnostics.append('xz_encoded_lengths=' + ','.join(str(len(item)) for item in encoded))

          try:
              joined = base64.b64decode(''.join(encoded), validate=True)
              Path('decoded/xz-joined-encoding.bin').write_bytes(joined)
              diagnostics.append(f'xz_joined_encoding_bytes={len(joined)}')
          except Exception as exc:
              diagnostics.append(f'xz_joined_encoding_error={exc!r}')

          individually = bytearray()
          for index, item in enumerate(encoded):
              try:
                  chunk = base64.b64decode(item, validate=True)
              except Exception as exc:
                  diagnostics.append(f'xz_part_{index}_error={exc!r}')
                  continue
              diagnostics.append(f'xz_part_{index}_decoded_bytes={len(chunk)}')
              individually.extend(chunk)
          Path('decoded/xz-individual-encoding.bin').write_bytes(individually)
          diagnostics.append(f'xz_individual_encoding_bytes={len(individually)}')

          part_text = ''.join((root / 'part-00.b64').read_text(encoding='ascii').split())
          try:
              gzip_bytes = base64.b64decode(part_text, validate=True)
              Path('decoded/part-00.bin').write_bytes(gzip_bytes)
              diagnostics.append(f'part_00_decoded_bytes={len(gzip_bytes)}')
          except Exception as exc:
              diagnostics.append(f'part_00_error={exc!r}')

          Path('decoded/decode-diagnostics.txt').write_text('\n'.join(diagnostics) + '\n', encoding='utf-8')
          PY

          for candidate in decoded/xz-*-encoding.bin; do
            output="${candidate%.bin}.partial.raw"
            set +e
            xz --decompress --stdout "$candidate" > "$output" 2> "${output}.stderr"
            status=$?
            set -e
            printf '%s\n' "$status" > "${output}.exit-code"
          done

          set +e
          gzip --decompress --stdout decoded/part-00.bin \
            > decoded/part-00.partial.raw \
            2> decoded/part-00.partial.raw.stderr
          gzip_status=$?
          set -e
          printf '%s\n' "$gzip_status" > decoded/part-00.partial.raw.exit-code

          {
            echo '## Decode diagnostics'
            cat decoded/decode-diagnostics.txt
            echo
            echo '## Files'
            ls -lah decoded
            echo
            echo '## Types'
            file decoded/*
            echo
            echo '## SHA-256'
            sha256sum decoded/*
            echo
            echo '## First 128 bytes (hex)'
            for path in decoded/*.raw; do
              echo "### $path"
              head -c 128 "$path" | od -An -tx1 -v
            done
            echo
            echo '## First 240 text lines when printable'
            for path in decoded/*.raw; do
              echo "### $path"
              LC_ALL=C sed -n '1,240p' "$path" || true
            done
            echo
            echo '## Archive listings when recognized'
            for path in decoded/*.raw; do
              echo "### $path"
              tar --list --file "$path" 2>&1 | sed -n '1,800p' || true
            done
          } > decoded/inspection.txt

          cat decoded/inspection.txt
      - name: Upload decoded payload inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scanner-reliability-payload-inspection
          path: decoded
          if-no-files-found: error
          retention-days: 7
