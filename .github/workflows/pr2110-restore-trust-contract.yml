name: Restore PR 2110 trust contract

on:
  push:
    branches: [tmp/pr2110-finalize-20260807]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Restore complete trust contract and apply narrow fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main fix/protection-repair-dashboard-regressions
          BASE_HEAD="$(git rev-parse origin/fix/protection-repair-dashboard-regressions)"
          echo "$BASE_HEAD" > /tmp/pr-head
          git reset --hard "$BASE_HEAD"
          test "$(git merge-base origin/main HEAD)" = "$(git rev-parse origin/main)"
          git checkout f3ddae8806ef91463e28a0c30f21247ea5d066d5 -- src/codex_plugin_scanner/guard/local_trust_contract.py
          python - <<'PY'
          import ast
          from pathlib import Path

          contract = Path('src/codex_plugin_scanner/guard/local_trust_contract.py')
          text = contract.read_text(encoding='utf-8')
          old = '''        runtime_override = state.get("runtime_protection")\n        if runtime_override in ("protected", "degraded", "unknown"):\n            runtime_protection = runtime_override\n        cloud_override = state.get("cloud_policies")\n'''
          new = '''        runtime_override = state.get("runtime_protection")\n        if runtime_override in ("protected", "degraded", "unknown"):\n            runtime_protection = runtime_override\n        remembered_rules_override = state.get("remembered_rules")\n        if remembered_rules_override in ("enforced", "disabled_degraded", "unknown"):\n            remembered_rules = remembered_rules_override\n        cloud_override = state.get("cloud_policies")\n'''
          if old not in text:
              raise SystemExit('trust-status override anchor changed')
          contract.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_guard_policy_integrity.py')
          text = test.read_text(encoding='utf-8')
          if 'def test_no_keyring_local_vault_keeps_persistent_local_allow_authoritative(' not in text:
              tree = ast.parse(text)
              target = next((n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == 'test_degraded_mode_persistent_local_allow_is_not_authoritative'), None)
              if target is None or target.end_lineno is None:
                  raise SystemExit('obsolete no-keyring regression test not found')
              replacement = "def test_no_keyring_local_vault_keeps_persistent_local_allow_authoritative(\n    tmp_path: Path,\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    monkeypatch.setattr(SystemKeyringSecretStore, \"_backend_is_available\", classmethod(lambda cls: False))\n    store = _store(tmp_path)\n    store.upsert_policy(\n        _decision(artifact_id=\"codex:project:local-vault\", artifact_hash=\"hash-local-vault\"),\n        \"2026-06-14T00:00:00Z\",\n    )\n\n    resolved = store.resolve_policy(\n        \"codex\",\n        \"codex:project:local-vault\",\n        \"hash-local-vault\",\n        now=\"2026-06-14T00:01:00Z\",\n    )\n    verify = store.verify_policy_integrity()\n\n    assert resolved is not None\n    assert verify[\"mode\"] == \"protected\"\n    assert verify[\"counts\"][\"valid\"] == 1\n"
              lines = text.splitlines(keepends=True)
              lines[target.lineno - 1:target.end_lineno] = [replacement]
              test.write_text(''.join(lines), encoding='utf-8')
          PY
          git diff --check
      - name: Validate focused trust and authorization wall
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet uv
          uv sync --frozen --extra dev --python 3.12
          uv run --no-sync ruff check src/codex_plugin_scanner/guard/local_trust_contract.py src/codex_plugin_scanner/guard/store_policy_integrity_backend.py tests/test_guard_policy_integrity.py tests/test_guard_policy_integrity_local_vault.py
          uv run --no-sync ruff format --check src/codex_plugin_scanner/guard/local_trust_contract.py src/codex_plugin_scanner/guard/store_policy_integrity_backend.py tests/test_guard_policy_integrity.py tests/test_guard_policy_integrity_local_vault.py
          uv run --no-sync pytest -q tests/test_guard_policy_integrity.py tests/test_guard_policy_integrity_local_vault.py tests/test_guard_approval_reuse.py tests/test_guard_github_workflow_authorization.py tests/test_guard_manifest_install_firewall.py tests/test_guard_mcp_package_proxy_phase14.py tests/test_guard_workflow_capabilities.py tests/test_guard_workflow_capability_authority_tamper.py tests/test_guard_workflow_capability_hardening.py --tb=short
          git diff --check
      - name: Push validated restoration if PR head stayed stable
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin fix/protection-repair-dashboard-regressions
          test "$(git rev-parse origin/fix/protection-repair-dashboard-regressions)" = "$(cat /tmp/pr-head)" || { echo 'PR moved during validation; refusing stale push'; exit 1; }
          git add src/codex_plugin_scanner/guard/local_trust_contract.py tests/test_guard_policy_integrity.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(guard): preserve repaired Linux trust state'
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" push origin HEAD:fix/protection-repair-dashboard-regressions
