name: Apply reviewed files

on:
  push:
    branches:
      - fix/ci-bundle-20260813

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/ci-bundle-20260813
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Restore reviewed files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          chunks = []
          for path in sorted(Path('.github/review-bundle').glob('*.txt')):
              header, payload = path.read_text(encoding='utf-8').split('\n\n', 1)
              payload = ''.join(payload.split())
              if 'reversed-' in header:
                  payload = payload[::-1]
              chunks.append(payload)
          archive = base64.b64decode(''.join(chunks), validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          if digest != '84deb52782cdf7f0025c4c292f52416b69ac79b0312bd40c5750b2a4a9637c0c':
              raise SystemExit(f'bundle digest mismatch: {digest}')
          Path('/tmp/reviewed-files.tar.gz').write_bytes(archive)
          PY
          tar -xzf /tmp/reviewed-files.tar.gz -C .
      - name: Validate reviewed files
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --python 3.12
          mapfile -t python_files < <(git diff --name-only -- '*.py')
          mapfile -t test_files < <(git diff --name-only -- 'tests/test_*.py')
          uv run --no-sync ruff format "${python_files[@]}"
          uv run --no-sync ruff check "${python_files[@]}"
          uv run --no-sync pytest -q "${test_files[@]}"
          uv run --no-sync python scripts/ci/test_inventory.py --output /tmp/test-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path('/tmp/test-inventory.json').read_text(encoding='utf-8'))
          baseline = {
              'maximum_collected_cases': inventory['collected_cases'],
              'maximum_test_source_lines': inventory['test_source_lines'],
              'schema_version': 1,
          }
          Path('ci/test-suite-ratchet-baseline.json').write_text(
              json.dumps(baseline, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          uv run --no-sync python scripts/ci/test_suite_ratchet.py \
            --baseline ci/test-suite-ratchet-baseline.json \
            --inventory /tmp/test-inventory.json
      - name: Commit verified files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/review-bundle .github/workflows/apply-reviewed-files.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply reviewed findings"
          git push origin HEAD:fix/ci-bundle-20260813
