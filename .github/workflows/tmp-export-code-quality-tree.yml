name: Export release 3 code-quality worktree

on:
  push:
    branches:
      - refactor/release-3-code-quality-hardening
    paths:
      - .github/workflows/tmp-export-code-quality-tree.yml

permissions:
  contents: read

concurrency:
  group: export-release-3-code-quality-worktree
  cancel-in-progress: true

jobs:
  export:
    if: >-
      github.repository == 'hashgraph-online/hol-guard' &&
      github.ref == 'refs/heads/refactor/release-3-code-quality-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: refactor/release-3-code-quality-hardening
          fetch-depth: 10000
          show-progress: false
          persist-credentials: false
      - name: Reconcile with the current release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet --no-tags --depth=10000 \
            origin release/3.0:refs/remotes/origin/release/3.0

          set +e
          git merge --no-commit --no-ff origin/release/3.0
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            printf 'Merge conflicts detected:\n'
            printf '%s\n' "${conflicts[@]}"
            for path in "${conflicts[@]}"; do
              case "$path" in
                ci/test-suite-ratchet-baseline.json)
                  python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = "ci/test-suite-ratchet-baseline.json"
          payloads = []
          for stage in (2, 3):
              raw = subprocess.check_output(["git", "show", f":{stage}:{path}"], text=True)
              payloads.append(json.loads(raw))
          merged = {
              "maximum_collected_cases": max(item["maximum_collected_cases"] for item in payloads),
              "maximum_test_source_lines": max(item["maximum_test_source_lines"] for item in payloads),
              "schema_version": 1,
          }
          Path(path).write_text(json.dumps(merged, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
                  git add "$path"
                  ;;
                tests/fixtures/guard-command-corpus/decision-diff-report.json)
                  git checkout --ours -- "$path"
                  git add "$path"
                  ;;
                tests/test_release_train_workflow.py)
                  git checkout --theirs -- "$path"
                  git add "$path"
                  ;;
                *)
                  echo "Unresolved conflict requires review: $path" >&2
                  exit 1
                  ;;
              esac
            done
            test -z "$(git diff --name-only --diff-filter=U)"
          fi

          printf '%s\n' "$(git rev-parse HEAD)" > "${RUNNER_TEMP}/worktree-head.txt"
          printf '%s\n' "$(git rev-parse origin/release/3.0)" > "${RUNNER_TEMP}/release-head.txt"
          tar \
            --exclude=.git \
            --exclude=.venv \
            --exclude=node_modules \
            --exclude=dashboard/node_modules \
            -czf "${RUNNER_TEMP}/release-3-code-quality-worktree.tar.gz" .
      - name: Upload reconciled worktree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-3-code-quality-worktree
          path: |
            ${{ runner.temp }}/release-3-code-quality-worktree.tar.gz
            ${{ runner.temp }}/worktree-head.txt
            ${{ runner.temp }}/release-head.txt
          if-no-files-found: error
          retention-days: 1
