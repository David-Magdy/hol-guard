name: Protection Center Batch 3 installed fix
on:
  push:
    branches:
      - feat/protection-center-03-module-detail-final
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Adapt detail surface
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/protection-center-04-policy-editor
          git show origin/feat/protection-center-04-policy-editor:dashboard/src/protection-center/protection-module-detail.tsx > dashboard/src/protection-center/protection-module-detail.tsx
          git show origin/feat/protection-center-04-policy-editor:dashboard/src/protection-center/protection-module-detail.test.tsx > dashboard/src/protection-center/protection-module-detail.test.tsx
          python scripts/ci/protection_center_batch3_installed_migrate.py
          cd dashboard
          bun install --frozen-lockfile --ignore-scripts
          bun run test
          bun run build
          cd ..
          rm .github/workflows/protection-center-batch3-installed-fix.yml
          rm scripts/ci/protection_center_batch3_installed_migrate.py
          git add dashboard src/codex_plugin_scanner/guard/daemon/static .github/workflows/protection-center-batch3-installed-fix.yml scripts/ci/protection_center_batch3_installed_migrate.py
          git diff --cached --check
          git commit -m "test(protection-center): preserve installed policy proof on module detail"
          git push origin HEAD:feat/protection-center-03-module-detail-final